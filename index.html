,depth=0)=>{const pad='  '.repeat(depth),attributes=[...el.attributes].map(a=>' '+a.name+'=\"'+a.value+'\"').join('');return el.children.length?pad+'\u003c'+el.localName+attributes+'>\\n'+[...el.children].map(child=>format(child,depth+1)).join('\\n')+'\\n'+pad+'\u003c/'+el.localName+'>':pad+'\u003c'+el.localName+attributes+'>'+el.textContent+'\u003c/'+el.localName+'>'};\n    $('#attrCode').textContent=formattedHTML(clone.innerHTML,true,'订单发货示例');\n  };\n  const showPath=el=>{$('#actualPath').innerHTML='\u003cspan>当前点击元素的完整路径\u003c/span>\u003ccode>'+esc(fullPath(el))+'\u003c/code>';cleanHighlights();el.classList.add('picked')};\n  const paint=()=>{\n    root.innerHTML=`\u003cdiv class=\"order-area\">\u003cdiv class=\"order-actions\">${layout?'\u003cdiv class=\"new-wrapper\">':''}\u003cspan id=\"${dynamicId}\" class=\"ship-btn\">确认发货\u003c/span>${editorDuplicate?'\u003cspan id=\"btn_similar\" class=\"ship-btn\">确认发货\u003c/span>':''}${layout?'\u003c/div>':''}\u003c/div>\u003c/div>`;source();$('#actualPath').innerHTML='\u003cspan>当前目标的完整路径\u003c/span>\u003ccode>'+esc(fullPath(target()))+'\u003c/code>';root.querySelectorAll('div,span').forEach(el=>el.onclick=e=>{e.stopPropagation();showPath(el)});\n  };\n  const validate=()=>{\n    pending('');let matches;try{if($('input[name=\"editorMode\"]:checked').value==='xpath'){\n      const raw=$('#editorXPath').value.trim();if(!raw)throw Error('请输入 XPath');const query=document.evaluate(raw.startsWith('//')?'.'+raw:raw,root,null,XPathResult.ORDERED_NODE_SNAPSHOT_TYPE,null);matches=[];for(let i=0;i\u003cquery.snapshotLength;i++){const el=query.snapshotItem(i);if(el.nodeType===1&&el!==root&&root.contains(el))matches.push(el)}\n    }else matches=defaultMatches();}catch{result.classList.add('error');result.textContent='XPath 无效，请输入能返回示例区域内元素的表达式。';return false}\n    matches.forEach(el=>el.classList.add('picked'));result.classList.toggle('error',matches.length!==1);result.textContent=matches.length===1?'✓ 匹配到 1 个元素，已用红框标记。':matches.length?'匹配到 '+matches.length+' 个元素，已用红框标记。请增加稳定的条件来区分目标。':'未找到元素（0 个匹配）。请检查已勾选节点的层级关系及属性值；条件需要同时满足。';updateRule();recordAttributeEvidence(matches.length);return matches.length===1;\n  };\n  paint();capture();drawTree();drawProperties();updateRule();if(coursePasses.has('attributes-stable'))$('#attributeCourseStatus').textContent='✓ 稳定性练习已通过，可以复习或继续下一章。';\n  $('#validate').onclick=validate;\n  $('#refreshDemo').onclick=()=>{dynamicId='btn_'+(Number(dynamicId.slice(4))+1);layout=1;paint();pending('模拟页面已增加一层 div，并更换 id。已捕获的节点与属性保持不变，请重新校验。')};\n  $('#recapture').onclick=()=>{capture();drawTree();drawProperties();updateRule();pending('已按当前页面重新捕获完整节点链和属性，页面保持原样。')};\n  $('#similarDemo').onclick=()=>{editorDuplicate=!editorDuplicate;paint();pending(editorDuplicate?'已添加一个相似按钮。可尝试仅勾选 span 节点与 class 属性，观察多个匹配。':'已移除相似按钮，请重新校验。');$('#similarDemo').textContent=editorDuplicate?'▣ 移除相似元素':'▣ 添加相似元素'};\n  $('#resetEditor').onclick=()=>{layout=0;dynamicId='btn_4832';editorDuplicate=false;paint();capture();drawTree();drawProperties();updateRule();if(coursePasses.has('attributes-stable'))$('#attributeCourseStatus').textContent='✓ 稳定性练习已通过，可以复习或继续下一章。';$('#similarDemo').textContent='▣ 添加相似元素';pending('已还原页面，并按初始元素重新捕获。')};\n  $('#editorPreview').onclick=()=>{showPath(target());toast('已预览当前捕获目标，红框仅表示预览，不代表规则校验成功')};\n  $('#aiExplain').onclick=()=>toast('本页模拟手动元素编辑；AI 辅助定位需要在影刀实际软件中使用');\n  $('#anchorDemo').onclick=()=>{editorNodes.forEach((n,i)=>n.checked=i===0||i===editorNodes.length-1);editorNodes[0].props.forEach(p=>p.checked=p.name==='class');editorNodes.at(-1).props.forEach(p=>p.checked=p.name==='class');editorActive=0;drawTree();drawProperties();pending('已使用订单区域的 class 缩小范围，跳过中间容器。这里演示父区域定位思路。');updateRule()};\n  $$('input[name=\"editorMode\"]').forEach(el=>el.onchange=()=>{$('#editorXPathWrap').hidden=el.value!=='xpath';if(el.value==='xpath')$('#editorXPath').value=generateXPath();pending(el.value==='xpath'&&!$('#editorXPath').value?'通配符条件需要手动编写对应 XPath，请输入表达式后校验。':'定位方式已切换，请重新校验。');updateRule()});\n  $('#editorXPath').oninput=()=>{pending();updateRule()};\n  $('#editorHelp').onclick=()=>toast('点节点查看属性；勾节点决定层级，勾属性决定条件；修改后点击校验。» 表示跨层查找。');\n  $('#editorDone').onclick=()=>{if(validate())toast('当前规则校验通过，可以继续下一课')};\n  $('#editorSave').onclick=()=>{if(validate()){try{localStorage.setItem('element-lab-saved-rule',JSON.stringify({name:$('#elementName').value,nodes:editorNodes,mode:$('input[name=\"editorMode\"]:checked').value,xpath:$('#editorXPath').value}))}catch{}toast('规则已保存到本机，可继续修改并校验')}};\n}\n\nconst orders=[['XD1001','短袖 T 恤','待发货'],['XD1002','帆布包','已完成'],['XD1003','短袖 T 恤','待发货']];\nfunction orderTable(prefix='XD'){return `\u003ctable class=\"orders\" id=\"orders\">\u003cthead>\u003ctr>\u003cth>订单号\u003c/th>\u003cth>商品\u003c/th>\u003cth>状态\u003c/th>\u003cth>操作\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>${orders.map((r,i)=>`\u003ctr>\u003ctd>${prefix==='XD'?r[0]:prefix+(i+1)}\u003c/td>\u003ctd>${r[1]}\u003c/td>\u003ctd>\u003cspan class=\"status\">${r[2]}\u003c/span>\u003c/td>\u003ctd>\u003cbutton class=\"secondary detail\" data-order=\"${prefix==='XD'?r[0]:prefix+(i+1)}\">详情\u003c/button>\u003c/td>\u003c/tr>`).join('')}\u003c/tbody>\u003c/table>`}\nfunction bindDetails(){$$('.detail').forEach(b=>b.onclick=()=>toast(`订单 ${b.dataset.order} · 教学示例详情`))}\nconst xpathExamples=[\n  {group:'基础选择',title:'找到所有数据单元格',expr:'//td',count:12,meaning:'选择表格里的所有 td，不包括表头 th。',parts:[['//','从当前示例文档的任意层级查找。'],['td','标签名，只选择数据单元格。']]},\n  {group:'基础选择',title:'找到所有详情按钮',expr:'//button',count:3,meaning:'选择三个订单行中的详情按钮。',parts:[['//button','不限制按钮位于哪一层，按标签查找。']]},\n  {group:'基础选择',title:'只选表格数据行',expr:'//tbody/tr',count:3,meaning:'找到 tbody，再选择它直接包含的 tr，避免把表头行算进去。',parts:[['//tbody','找到表格的数据区。'],['/tr','只找它的直接子元素 tr；单斜杠不跨层级。']]},\n  {group:'基础选择',title:'读取所有状态标签',expr:'//td/span',count:3,meaning:'选中单元格里直接包含的状态 span。',parts:[['//td','查找所有单元格。'],['/span','在每个单元格中选择直接子元素 span。']]},\n  {group:'文本匹配',title:'商品文字完全相同',expr:\"//td[text()='短袖 T 恤']\",count:2,meaning:'找到商品名正好是“短袖 T 恤”的两个单元格。',parts:[['[ … ]','方括号是筛选条件。'],['text()','取得元素的直接文本子节点。'],[\"='短袖 T 恤'\",'等于匹配，文字、空格都需要一致。']]},\n  {group:'文本匹配',title:'订单号包含某段文字',expr:\"//td[contains(text(),'XD')]\",count:3,meaning:'选择直接文本中包含 XD 的单元格。',parts:[['contains(A,B)','判断 A 是否包含 B。'],['text()','此处订单号是 td 的直接文本。'],[\"'XD'\",'需要包含的片段，不是完整订单号。']]},\n  {group:'文本匹配',title:'订单号以指定前缀开头',expr:\"//td[starts-with(text(),'XD10')]\",count:3,meaning:'选择以 XD10 开头的三个订单号。',parts:[['starts-with(A,B)','判断 A 是否以 B 开头。'],[\"'XD10'\",'固定前缀，后面可以接不同数字。']]},\n  {group:'文本匹配',title:'跨内层标签匹配状态',expr:\"//td[normalize-space(.)='待发货']\",count:2,meaning:'状态文字位于 span 内，使用整个 td 的文本值来匹配。',parts:[['.','当前元素的字符串值，包括后代元素的文字。'],['normalize-space(.)','去除首尾空白，并将连续空白合并为一个空格。'],[\"='待发货'\",'对处理后的完整文本进行等于匹配。']]},\n  {group:'文本匹配',title:'对照：text() 为什么找不到',expr:\"//td[text()='待发货']\",count:0,meaning:'这里匹配不到是预期结果：td 的直接文本不是“待发货”，文字在它里面的 span 中。',parts:[['text()','只检查直接文本节点，不会替你进入 span。'],['解决方式',\"改用 //td[normalize-space(.)='待发货']，或直接找 //span[text()='待发货']。\"]]},\n  {group:'属性筛选',title:'按订单属性精确找按钮',expr:\"//button[@data-order='XD1002']\",count:1,meaning:'按按钮的 data-order 属性，唯一定位订单 XD1002 的详情按钮。',parts:[['@','读取属性，属性名前加 @。'],['data-order','示例页面实际存在的按钮属性名。'],[\"='XD1002'\",'要求属性值完全一致。']]},\n  {group:'属性筛选',title:'不限定标签，按属性查找',expr:\"//*[@data-order='XD1002']\",count:1,meaning:'只要元素的 data-order 属性等于 XD1002 就选中，不限定标签。',parts:[['*','通配任意元素标签；这里不是文本通配符。'],[\"[@data-order='XD1002']\",'仍然需要满足属性条件。']]},\n  {group:'属性筛选',title:'精确匹配一个 class 类名',expr:\"//button[contains(concat(' ',normalize-space(@class),' '),' detail ')]\",count:3,meaning:'找到 class 列表中含有 detail 这个独立类名的按钮。',parts:[['normalize-space(@class)','将 class 中多余空白归一化。'],[\"concat(' ', … ,' ')\",'在 class 前后补空格，方便按独立词匹配。'],[\"' detail '\",'两侧空格防止把 detail-extra 误当作 detail。']]},\n  {group:'位置筛选',title:'表格里的第一条订单',expr:'//tbody/tr[1]',count:1,meaning:'选择 tbody 的第一个 tr。XPath 位置从 1 开始。',parts:[['tr[1]','在当前父节点的 tr 子节点中取第一个。']]},\n  {group:'位置筛选',title:'表格里的最后一条订单',expr:'//tbody/tr[last()]',count:1,meaning:'选择 tbody 中最后一行，此例为 XD1003。',parts:[['last()','返回当前上下文节点集合的大小。'],['tr[last()]','位置等于集合大小，也就是最后一个 tr。']]},\n  {group:'位置筛选',title:'每一行的第二列',expr:'//tbody/tr/td[2]',count:3,meaning:'每个订单行分别取第二个 td，所以会匹配三个商品单元格。',parts:[['//tbody/tr','先得到三条订单行。'],['/td[2]','在每个 tr 下分别取第二个 td。']]},\n  {group:'位置筛选',title:'对照：每行的第一格',expr:'//td[1]',count:3,meaning:'选择每个父元素下的第一个 td，结果是三条订单号。',parts:[['//td[1]','位置筛选作用于各父节点下的 td，并非整个页面只取一个。'],['易混点','与 (//td)[1] 的筛选范围不同。']]},\n  {group:'位置筛选',title:'对照：全部单元格中第一个',expr:'(//td)[1]',count:1,meaning:'先将所有 td 合并成一个结果集，再从整体中取第一个。',parts:[['(//td)','括号先收集所有 td。'],['[1]','对括号里的整体结果集取第一项。']]},\n  {group:'关系定位',title:'按订单号找到所在行',expr:\"//tr[td[text()='XD1002']]\",count:1,meaning:'选择包含指定订单号单元格的 tr，也就是 XD1002 这一行。',parts:[['//tr','先以行作为候选目标。'],[\"[td[text()='XD1002']]\",'要求这一行存在一个直接子 td，其文本等于订单号。']]},\n  {group:'关系定位',title:'找到指定订单行内的详情',expr:\"//tr[td[text()='XD1002']]//button\",count:1,meaning:'先锁定订单所在行，再在这一行内部找按钮。',parts:[[\"//tr[td[text()='XD1002']]\",'用订单号找到对应的行。'],['//button','从已找到的行继续往内查找按钮，查找范围被缩小。']]},\n  {group:'关系定位',title:'从单元格回到父行',expr:\"//td[text()='XD1002']/parent::tr\",count:1,meaning:'先找订单号单元格，再回到它的直接父元素 tr。',parts:[[\"//td[text()='XD1002']\",'定位订单号所在 td。'],['parent::tr','父轴，要求直接父元素是 tr。']]},\n  {group:'关系定位',title:'找订单号后面的商品格',expr:\"//td[text()='XD1002']/following-sibling::td[1]\",count:1,meaning:'从订单号单元格向后找同级 td，取最近一个，也就是帆布包。',parts:[['following-sibling::td','只看同一个父元素内，位于当前元素之后的 td。'],['[1]','取正向轴中的第一项，也就是最近的后一个 td。']]},\n  {group:'关系定位',title:'从状态格找到前一个商品格',expr:\"//td[span[text()='已完成']]/preceding-sibling::td[1]\",count:1,meaning:'先定位“已完成”的状态格，再找它前面最近的 td。',parts:[[\"//td[span[text()='已完成']]\",'定位含有“已完成”状态 span 的单元格。'],['preceding-sibling::td[1]','这是反向轴；[1] 表示前面最近的同级 td。']]},\n  {group:'关系定位',title:'从内层状态回到行再找按钮',expr:\"//span[text()='已完成']/ancestor::tr[1]//button\",count:1,meaning:'即使状态文字包在内层，也能向上找最近的 tr，再向下找详情按钮。',parts:[[\"//span[text()='已完成']\",'从状态文字开始。'],['ancestor::tr[1]','向上寻找最近的 tr 祖先。'],['//button','在这一行内查找按钮。']]},\n  {group:'组合与统计',title:'两个条件同时满足',expr:\"//tr[td[text()='短袖 T 恤'] and td[span[text()='待发货']]]\",count:2,meaning:'订单行必须同时满足商品为短袖 T 恤、状态为待发货。',parts:[['and','左右两个条件都为真才保留。'],['两组 td 条件','分别检查同一行里的商品和状态。']]},\n  {group:'组合与统计',title:'两种商品任选一种',expr:\"//td[text()='短袖 T 恤' or text()='帆布包']\",count:3,meaning:'商品文字满足两个条件中的任意一个即可。',parts:[['or','左右任意一个条件为真就保留。']]},\n  {group:'组合与统计',title:'排除已完成订单',expr:\"//tbody/tr[not(td/span[text()='已完成'])]\",count:2,meaning:'保留不包含“已完成”状态标签的数据行。',parts:[['not( … )','将条件结果取反。'],[\"td/span[text()='已完成']\",'检查这行是否有已完成状态。']]},\n  {group:'组合与统计',title:'统计订单行数',expr:'count(//tbody/tr)',scalar:3,meaning:'返回订单行的数量 3。这是数值结果，因此不会给元素画红框。',parts:[['count(节点集合)','统计节点数量，返回数值。'],['与元素定位的区别','点击或高亮操作需要元素节点；统计表达式直接返回数字。']]}\n];\nconst xpathReference={url:'https://www.yuque.com/pengzhiqiang999/xiaokenai/qu92bv?singleDoc#',title:'影刀RPA| xpath怎么学？保姆级教程',author:'13133870607'};\nconst xpathStages={\n basic:[\n  {title:'标签与层级',examples:[0,1,2,3],teach:'先不加复杂条件。//标签 可以跨层查找；/标签 只向下一层。先在源码里找到 table → tbody → tr → td → span，再用路径逐层描述。',task:'写 XPath，只选中订单表格中 3 个状态 span。',hint:'状态文字放在 td 内的 span 中。可以从 span 标签入手，也可以写 td 到 span 的路径。',answer:'//td/span'},\n  {title:'按属性找目标',examples:[9,10],teach:'属性写在开始标签里。@ 后面是属性名，[条件] 用来筛选。先确认 data-order 在 button 身上，再用它区分三个“详情”按钮。',task:'按订单属性定位 XD1003 的详情按钮。只返回 1 个 button。',hint:'例子查的是 XD1002；现在把业务目标换成 XD1003。',answer:\"//button[@data-order='XD1003']\"},\n  {title:'按固定文本找目标',examples:[4],teach:'标签之间的文字是文本。text() 读取直接文本子节点；[text()=\"文字\"] 要求完全相同。本步先处理没有内层标签的商品名，嵌套文本留到进阶。',task:'写 XPath，只选择商品名为“帆布包”的单元格。',hint:'目标是 td，帆布包是它的直接文字。注意引号与完整文字。',answer:\"//td[text()='帆布包']\"},\n  {title:'位置与查找范围',examples:[12,13,14,15,16],teach:'XPath 的位置从 1 开始。/td[2] 是每个父行内的第二格；(//td)[1] 是先收集所有格子再取第一个。先明确筛选作用于哪一组，再加位置条件。',task:'写 XPath，选择数据区第 2 行、第 3 列的状态单元格（不是里面的 span）。',hint:'先找到 tbody 下的 tr[2]，再取这一行的 td[3]。',answer:'//tbody/tr[2]/td[3]'}\n ],\n advanced:[\n  {title:'变化文本与内层文字',examples:[5,6,7,8],teach:'contains() 判断包含，starts-with() 判断前缀。文字包在 span 内时，td 的 text() 找不到它；normalize-space(.) 可使用整个元素的文本值并整理空白。',task:'选择所有状态为“待发货”的 td，共 2 个。返回单元格，不返回 span。',hint:'状态文字在 span 里面。可以用 td[span[…]]，或对 td 使用 normalize-space(.)。',answer:\"//td[normalize-space(.)='待发货']\"},\n  {title:'按业务信息定位，再沿层级找',examples:[17,18,19,22],teach:'先找到唯一的订单信息，再确定所在行。parent:: 是直接父节点，ancestor:: 是向上找祖先。找到 tr 后再往里找 button，比依赖固定第几行更能适应排序变化。',task:'找到 XD1003 的详情按钮；规则还要通过一次排序变化测试。',hint:'用订单号或稳定业务属性锁定目标。不要只写第 3 行或第 3 个按钮。',answer:\"//tr[td[text()='XD1003']]//button\"},\n  {title:'同一行里的兄弟节点',examples:[20,21],teach:'只有共享父元素的元素才是兄弟。following-sibling:: 向后找同级节点，preceding-sibling:: 向前找。反向轴后直接加 [1]，表示前面最近的那个节点。',task:'从 XD1001 的订单号格出发，使用 following-sibling:: 找到它后面的商品格。',hint:'订单号 td 和商品 td 的父元素都是同一个 tr。向后取最近的 td，也就是 [1]。',answer:\"//td[text()='XD1001']/following-sibling::td[1]\"},\n  {title:'类名与多个条件',examples:[11,23,24,25],teach:'and 表示同时满足，or 表示任意满足，not() 排除满足内部条件的节点。class 可能包含多个类名，按独立词匹配能避免误把 detail-extra 当作 detail。',task:'返回所有“短袖 T 恤”且“待发货”的数据行 tr，共 2 行。',hint:'最终目标是 tr；在同一行内分别判断商品 td 和状态 span，然后用 and 连接。',answer:\"//tr[td[text()='短袖 T 恤'] and td[span[text()='待发货']]]\"},\n  {title:'元素定位与统计结果',examples:[26],teach:'选择元素会得到节点集合；count(节点集合) 会得到数字。数字可以用于条件或统计，但不能直接拿来点击，也不会产生元素红框。',task:'统计“待发货”订单行的数量。表达式需要返回数值 2。',hint:'先写出待发货行的选择规则，再用 count(…) 包起来。',answer:\"count(//tbody/tr[td/span[text()='待发货']])\"}\n ]\n};\nconst xpathStageIndex={basic:0,advanced:0};\nfunction xpath(level='basic'){\n const stages=xpathStages[level],index=xpathStageIndex[level],stage=stages[index],key='xpath-'+level+'-'+index;\n return note('\u003cstrong>本章按知识点逐步学习。\u003c/strong> 每一步先读层级，再运行示例，最后独立完成一个任务。你可以自由复习，但完成全部任务后才会标记本章完成。')+`\n \u003cdiv class=\"guided-xpath-steps\">${stages.map((s,i)=>`\u003cbutton data-xpath-stage=\"${i}\" class=\"${i===index?'active-stage':''}\">\u003cb>${coursePasses.has('xpath-'+level+'-'+i)?'✓':i+1}\u003c/b>${s.title}\u003c/button>`).join('')}\u003c/div>\n \u003csection class=\"guided-concept\">\u003cspan>知识点 ${index+1} / ${stages.length}\u003c/span>\u003ch2>${stage.title}\u003c/h2>\u003cp>${stage.teach}\u003c/p>\u003col>\u003cli>先在右侧标准 HTML 中找到目标所在层级。\u003c/li>\u003cli>运行本步示例，对比源码与红框。\u003c/li>\u003cli>在下方任务框中自己写规则并提交。\u003c/li>\u003c/ol>\u003c/section>\n \u003cdiv class=\"split xpath-lab\">\u003csection class=\"panel\">\u003cdiv class=\"panel-head\">本步示例 · 先看再试\u003csmall>${stage.examples.length} 个，从简单情况开始\u003c/small>\u003c/div>\u003cdiv class=\"panel-body\">\u003cdiv id=\"xpExamples\" class=\"xpath-example-list guided-example-list\">${stage.examples.map(i=>{const x=xpathExamples[i];return `\u003cbutton class=\"xp-example\" data-example=\"${i}\">\u003cspan>\u003cb>${x.title}\u003c/b>\u003csmall>${x.scalar!==undefined?'数值 '+x.scalar:x.count+' 个匹配'}\u003c/small>\u003c/span>\u003ccode>${esc(x.expr)}\u003c/code>\u003c/button>`}).join('')}\u003c/div>\u003cdiv class=\"field\">\u003clabel for=\"xp\">运行示例，也可以自己修改\u003c/label>\u003cinput class=\"wide\" id=\"xp\" type=\"text\" value=\"${esc(xpathExamples[stage.examples[0]].expr)}\" spellcheck=\"false\" style=\"font-family:var(--mono)\">\u003c/div>\u003cbutton class=\"primary\" id=\"runXPath\">运行并高亮 →\u003c/button>\u003cdiv id=\"xpResult\" class=\"result\" role=\"status\">\u003c/div>\u003cdiv class=\"xpath-explanation\" id=\"xpExplanation\">\u003c/div>\n \u003csection class=\"guided-challenge\">\u003cspan>现在自己做\u003c/span>\u003ch3>${stage.task}\u003c/h3>\u003clabel for=\"xpChallenge\">你的 XPath\u003c/label>\u003ctextarea id=\"xpChallenge\" rows=\"3\" spellcheck=\"false\" placeholder=\"先观察右侧 HTML，再输入自己的规则\">\u003c/textarea>\u003cdiv class=\"row\">\u003cbutton class=\"primary\" id=\"submitXPathChallenge\">提交本步练习\u003c/button>\u003cbutton class=\"secondary\" id=\"nextXPathStage\" ${index===stages.length-1||!coursePasses.has(key)?'disabled':''}>下一个知识点 →\u003c/button>\u003c/div>\u003cdiv id=\"xpChallengeFeedback\" class=\"result\" role=\"status\">${coursePasses.has(key)?'本步已通过，可以复习或继续。':'尚未提交。上面的运行按钮只供试验，不计为练习通过。'}\u003c/div>\u003cdetails class=\"training-help\">\u003csummary>给我一点提示\u003c/summary>\u003cp>${stage.hint}\u003c/p>\u003c/details>\u003cdetails class=\"training-help\">\u003csummary>参考答案\u003c/summary>\u003cpre>${esc(stage.answer)}\u003c/pre>\u003cp>需要亲自提交并通过检查，查看答案不会自动完成任务。\u003c/p>\u003c/details>\u003c/section>\n \u003c/div>\u003c/section>\u003csection class=\"panel xpath-preview\">\u003cdiv class=\"panel-head\">页面效果与标准 HTML\u003csmall>红框保持元素原色\u003c/small>\u003c/div>\u003cdiv class=\"panel-body\">\u003cdiv id=\"xpathSandbox\">${orderTable()}\u003c/div>\u003cdiv class=\"task\" id=\"xpExpected\">\u003c/div>\u003cdiv class=\"source-toolbar\">\u003clabel for=\"xpSourceMode\">源码范围\u003c/label>\u003cselect id=\"xpSourceMode\">\u003coption value=\"full\">完整 HTML 文档\u003c/option>\u003coption value=\"fragment\">仅表格片段\u003c/option>\u003c/select>\u003c/div>\u003cdetails class=\"xpath-source\" open>\u003csummary>HTML 源码 · 每层缩进两个空格\u003c/summary>\u003cpre class=\"code html-source\" id=\"xpSource\">\u003c/pre>\u003c/details>\u003cp class=\"hint\">DOCTYPE 声明文档类型。html 是根元素；head 包含编码与标题；页面可见内容放在 body 内。缩进更深表示进入子节点，同级开始标签对齐。\u003c/p>\u003cdiv class=\"xpath-cheatsheet\">\u003ch3>本步语法提示\u003c/h3>${xpathExamples[stage.examples[0]].parts.map(([k,v])=>`\u003cdiv>\u003ccode>${esc(k)}\u003c/code>\u003cspan>${v}\u003c/span>\u003c/div>`).join('')}\u003c/div>\u003ca class=\"xpath-resource\" href=\"${xpathReference.url}\" target=\"_blank\" rel=\"noopener noreferrer\">\u003cspan>延伸学习 · 语雀教程 ↗\u003c/span>\u003cstrong>《${xpathReference.title}》\u003c/strong>\u003csmall>作者 ${xpathReference.author} · 在新标签页打开\u003c/small>\u003c/a>\u003c/div>\u003c/section>\u003c/div>`;\n}\nfunction bindXPath(level='basic'){\n const stages=xpathStages[level],index=xpathStageIndex[level],stage=stages[index],root=$('#xpathSandbox'),out=$('#xpResult'),key='xpath-'+level+'-'+index;\n const fixture=(raw,rotate=false)=>{const doc=document.implementation.createHTMLDocument('XPath练习');doc.body.innerHTML=orderTable();if(rotate){const tbody=doc.querySelector('tbody');tbody.appendChild(tbody.firstElementChild)}let r;try{r=doc.evaluate(raw,doc.body,null,XPathResult.ANY_TYPE,null)}catch{throw Error('表达式无效，请检查标签、引号与括号。')}if(r.resultType===XPathResult.NUMBER_TYPE)return {doc,scalar:r.numberValue,type:'number'};if(r.resultType===XPathResult.STRING_TYPE)return {doc,scalar:r.stringValue,type:'string'};if(r.resultType===XPathResult.BOOLEAN_TYPE)return {doc,scalar:r.booleanValue,type:'boolean'};const nodes=[];let n;while(n=r.iterateNext())if(n.nodeType===1&&n!==doc.body&&doc.body.contains(n))nodes.push(n);return {doc,nodes,type:'nodes'};};\n const clear=()=>root.querySelectorAll('.matched').forEach(el=>el.classList.remove('matched'));\n const highlighter=r=>{clear();if(r.nodes){const copied=[...r.doc.body.querySelectorAll('*')],actual=[...root.querySelectorAll('*')];r.nodes.forEach(node=>{const i=copied.indexOf(node);if(i>=0)actual[i].classList.add('matched')})}};\n const source=()=>$('#xpSource').textContent=formattedHTML(orderTable(),$('#xpSourceMode').value==='full');source();$('#xpSourceMode').onchange=source;\n const explain=raw=>{const x=xpathExamples.find(x=>x.expr===raw);$('#xpExplanation').innerHTML=x?`\u003ch3>${x.title}\u003c/h3>\u003cp>${x.meaning}\u003c/p>\u003cdiv class=\"xpath-parts\">${x.parts.map(([part,text])=>`\u003cdiv>\u003ccode>${esc(part)}\u003c/code>\u003cspan>${esc(text)}\u003c/span>\u003c/div>`).join('')}\u003c/div>`:'\u003ch3>自定义表达式\u003c/h3>\u003cp>先明确目标标签、父子关系与筛选条件，再核对右侧结果。自定义规则可以有不同写法。\u003c/p>';$('#xpExpected').textContent=x?x.scalar!==undefined?'预期数值：'+x.scalar+'。统计结果不画元素红框。':'预期匹配：'+x.count+' 个元素。':'自定义规则没有预设数量，请核对目标。';$$('.xp-example').forEach(b=>b.classList.toggle('selected-example',xpathExamples[+b.dataset.example].expr===raw));};\n const run=()=>{const raw=$('#xp').value.trim();explain(raw);try{if(!raw)throw Error('请先输入表达式。');const r=fixture(raw);highlighter(r);out.classList.remove('error');if(r.type!=='nodes'){out.textContent='返回'+({number:'数值',string:'文本',boolean:'布尔值'}[r.type])+'：'+r.scalar+'。此结果不是元素节点。';return}const expected=xpathExamples.find(x=>x.expr===raw);out.classList.toggle('error',!r.nodes.length&&expected?.count!==0);out.textContent='匹配到 '+r.nodes.length+' 个元素。'+(r.nodes.length?'已用红框标记，请核对目标。':expected?.count===0?'符合本例的零匹配预期，阅读解释了解原因。':'请检查层级与条件。')}catch(e){clear();out.classList.add('error');out.textContent=e.message}};\n $('#runXPath').onclick=run;$('#xp').onkeydown=e=>{if(e.key==='Enter')run()};$('#xp').oninput=()=>{clear();out.textContent='表达式已修改，请重新运行。';explain($('#xp').value.trim())};$$('.xp-example').forEach(b=>b.onclick=()=>{$('#xp').value=xpathExamples[+b.dataset.example].expr;run()});\n $$('[data-xpath-stage]').forEach(b=>b.onclick=()=>{xpathStageIndex[level]=+b.dataset.xpathStage;render()});$('#nextXPathStage').onclick=()=>{if(coursePasses.has(key)&&index\u003cstages.length-1){xpathStageIndex[level]++;render()}};\n const isCell=(el,order,column)=>el.localName==='td'&&el.parentElement.cells[0].textContent===order&&el.cellIndex===column-1;\n const correct=r=>{\n  if(level==='basic'){\n   if(index===0)return r.type==='nodes'&&r.nodes.length===3&&r.nodes.every(n=>n.localName==='span'&&n.parentElement.localName==='td');\n   if(index===1)return r.type==='nodes'&&r.nodes.length===1&&r.nodes[0].localName==='button'&&r.nodes[0].getAttribute('data-order')==='XD1003';\n   if(index===2)return r.type==='nodes'&&r.nodes.length===1&&isCell(r.nodes[0],'XD1002',2);\n   return r.type==='nodes'&&r.nodes.length===1&&isCell(r.nodes[0],'XD1002',3);\n  }\n  if(index===0)return r.type==='nodes'&&r.nodes.length===2&&r.nodes.every(n=>n.localName==='td'&&n.textContent.trim()==='待发货');\n  if(index===1)return r.type==='nodes'&&r.nodes.length===1&&r.nodes[0].localName==='button'&&r.nodes[0].getAttribute('data-order')==='XD1003';\n  if(index===2)return r.type==='nodes'&&r.nodes.length===1&&isCell(r.nodes[0],'XD1001',2);\n  if(index===3)return r.type==='nodes'&&r.nodes.length===2&&r.nodes.every(n=>n.localName==='tr'&&['XD1001','XD1003'].includes(n.cells[0].textContent));\n  return r.type==='number'&&r.scalar===2;\n };\n $('#submitXPathChallenge').onclick=()=>{const feedback=$('#xpChallengeFeedback'),raw=$('#xpChallenge').value.trim();try{if(!raw)throw Error('先自己填写 XPath，再提交。');if(level==='advanced'&&index===2&&!raw.includes('following-sibling::'))throw Error('本步练习兄弟节点轴，请从订单号格出发，使用 following-sibling::。');const r=fixture(raw);highlighter(r);if(!correct(r))throw Error('未通过：'+(r.type==='nodes'?'匹配到 '+r.nodes.length+' 个元素，但数量、节点类型或业务目标不符合任务。':'返回 '+r.type+' 结果 '+r.scalar+'，与任务目标不符。')+' 请对照题目与 HTML 层级检查。');if(level==='advanced'&&index===1&&!correct(fixture(raw,true)))throw Error('原始顺序通过，但订单排序变化后失败。请改用订单身份定位，避免固定行号。');passCourseCheck(key);feedback.classList.remove('error');feedback.textContent='✓ 本步练习通过。'+(level==='advanced'&&index===1?'也通过了排序变化检查。':'目标类型、数量与业务内容均正确。');$(`[data-xpath-stage=\"${index}\"] b`).textContent='✓';if(index\u003cstages.length-1)$('#nextXPathStage').disabled=false;else toast(stages.every((_,i)=>coursePasses.has('xpath-'+level+'-'+i))?'本章全部知识点已练完，可进入下一章':'本步已通过，请继续完成本章其他知识点练习')}catch(e){feedback.classList.add('error');feedback.textContent=e.message}};\n bindDetails();run();\n}\n\nfunction wildcard(){return note('\u003cstrong>保留固定文本，放开变化的部分。\u003c/strong> “酒店点评(302)”里的数量会变化；把规则改成“酒店点评(*)”，并选择“通配符”匹配。')+`\u003cdiv class=\"split\">\u003csection class=\"panel\">\u003cdiv class=\"panel-head\">文本匹配规则 \u003csmall>* 匹配任意长度的字符\u003c/small>\u003c/div>\u003cdiv class=\"panel-body\">\u003cdiv class=\"field\">\u003clabel for=\"pattern\">保存的 innertext 规则\u003c/label>\u003cinput id=\"pattern\" type=\"text\" value=\"酒店点评(302)\">\u003c/div>\u003cdiv class=\"field\">\u003clabel for=\"matchMode\">匹配方式\u003c/label>\u003cselect id=\"matchMode\">\u003coption value=\"exact\">等于匹配\u003c/option>\u003coption value=\"wild\">通配符匹配\u003c/option>\u003c/select>\u003c/div>\u003cdiv class=\"row\">\u003cbutton class=\"primary\" id=\"matchHotel\">校验匹配\u003c/button>\u003cbutton class=\"secondary\" id=\"changeHotel\">切换酒店 ↻\u003c/button>\u003cbutton class=\"text-button\" id=\"wildPreset\">填入通配符示例\u003c/button>\u003c/div>\u003cdiv id=\"wildResult\" class=\"result\" role=\"status\">先校验，再切换酒店观察结果。\u003c/div>\u003c/div>\u003c/section>\u003csection class=\"panel\">\u003cdiv class=\"panel-head\">酒店页面 \u003csmall>教学示例 · 数量会变化\u003c/small>\u003c/div>\u003cdiv class=\"panel-body\">\u003cspan class=\"chip\">HOTEL DEMO\u003c/span>\u003ch2 style=\"font-size:25px;margin-top:30px\" id=\"hotelName\">青山城市酒店\u003c/h2>\u003cp class=\"hint\">城市里的安静一角 · 标准双人间\u003c/p>\u003cdiv style=\"border-bottom:1px solid var(--line);padding:25px 0\">\u003cspan class=\"primary review-tab\" id=\"hotelText\">酒店点评(302)\u003c/span>\u003c/div>\u003cpre class=\"code html-source\" id=\"hotelCode\" style=\"margin-top:22px\">\u003c/pre>\u003cp class=\"hint\">通配符与 XPath 是两套语法。XPath 中的 * 表示任意元素名；匹配部分文本通常用 contains() 或 starts-with()。\u003c/p>\u003c/div>\u003c/section>\u003c/div>\u003cdiv class=\"section-title\">\u003ch2>规则别放得太宽\u003c/h2>\u003c/div>\u003cdiv class=\"task\">酒店点评(*) 比 *点评* 更能保留目标特征。若页面中有多个相同入口，还要结合父区域或其他稳定属性缩小范围。\u003c/div>`}\nfunction bindWildcard(){hotel=302;const update=()=>{$('#hotelText').textContent=`酒店点评(${hotel})`;$('#hotelCode').textContent=formattedHTML($('#hotelText').parentElement.outerHTML,true,'酒店点评示例')};const check=()=>{const pattern=$('#pattern').value,target=$('#hotelText').textContent;const rx='^'+pattern.split('*').map(s=>s.replace(/[.*+?^${}()|[\\]\\\\]/g,'\\\\$&')).join('.*')+'$';const ok=$('#matchMode').value==='exact'?target===pattern:new RegExp(rx,'u').test(target);$('#hotelText').classList.toggle('picked',ok);$('#wildResult').classList.toggle('error',!ok);$('#wildResult').textContent=ok?'✓ 成功匹配当前点评入口。切换酒店，再验证通用性。':'未匹配。当前文字已变化，请调整规则与匹配方式。'};$('#matchHotel').onclick=check;$('#changeHotel').onclick=()=>{hotel=hotel===302?584:302;$('#hotelName').textContent=hotel===302?'青山城市酒店':'湖畔花园酒店';update();check()};$('#wildPreset').onclick=()=>{$('#pattern').value='酒店点评(*)';$('#matchMode').value='wild';check()};update()}\nconst tableTraining={step:0,passed:new Set(),answers:{},selected:null,pickMode:'cell',visitedLast:false};\ntry{const saved=JSON.parse(localStorage.getItem('element-lab-table-training-v2')||'null');if(saved){tableTraining.passed=new Set((saved.passed||[]).filter(x=>Number.isInteger(x)&&x>=0&&x\u003c6));tableTraining.step=Math.max(0,Math.min(5,saved.step||0));tableTraining.answers=saved.answers||{}}}catch{}\nfunction saveTableTraining(){try{localStorage.setItem('element-lab-table-training-v2',JSON.stringify({passed:[...tableTraining.passed],step:tableTraining.step,answers:tableTraining.answers}))}catch{}}\nconst tableLessons=[\n {title:'认识行与格',goal:'区分 table、tr 和 td，亲手选中一整行。',teach:'table 是整张表；tbody 放数据行；每个 tr 是一行，每个 td 是行内的一格。选中订单号的 td，只会得到一个格子；选中它所在的 tr，才能得到整行。',code:'\u003ctable>\\n  \u003ctbody>\\n    \u003ctr>\\n      \u003ctd>XD1002\u003c/td>\\n      \u003ctd>帆布包\u003c/td>\\n      \u003ctd>\u003cspan>已完成\u003c/span>\u003c/td>\\n      \u003ctd>\u003cbutton>详情\u003c/button>\u003c/td>\\n    \u003c/tr>\\n  \u003c/tbody>\\n\u003c/table>',task:'在左侧选中订单 XD1002 的整行，然后提交。',hint:'先将选择方式切换为“整行 tr”，再点击 XD1002 所在行。只点选 td 不能代表整行。',answer:'选择“整行 tr” → 点击 XD1002 所在行 → 提交当前选择。'},\n {title:'定位商品格',goal:'先用订单号找到行，再向内定位商品列。',teach:'先写 //tr[td[text()=\"订单号\"]]，表示“包含这个订单号的行”。商品是每行的第二个 td，因此在后面接 /td[2]。这里的 [2] 是这一行内的第二列，不是整张表的第二格。',code:'//tr[td[text()=\"订单号\"]]/td[列号]',task:'自己写一条 XPath，只选中订单 XD1003 的商品单元格。',hint:'目标订单号是 XD1003，商品在第 2 列。完整表达式需要返回 td，不能只返回 tr 或文字。',answer:\"//tr[td[text()='XD1003']]/td[2]\",field:'商品单元格 XPath',placeholder:'请输入你自己的 XPath'},\n {title:'锁定行内按钮',goal:'在多个“详情”中找到正确按钮，且不依赖行号。',teach:'多个按钮都叫“详情”，仅按按钮文字会得到多个结果。先用订单号缩小到一个 tr，再在该行内用 //button 查找。运行时订单排序可能变化，所以本题还会用打乱顺序后的表格检查一次。',code:\"//tr[td[text()='目标订单号']]//button\",task:'写 XPath，选中订单 XD1002 的详情按钮。你的规则还必须通过排序变化验证。',hint:'不要依赖 tr[2] 或 (//button)[2]。排序改变后，第二个位置可能属于另一个订单。',answer:\"//tr[td[text()='XD1002']]//button\",field:'指定订单详情 XPath',placeholder:'按订单号锁定所在行，再找 button'},\n {title:'观察翻页状态',goal:'亲自比较普通页和末页的按钮源码。',teach:'按钮文字“下一页”在普通页与末页通常相同，状态属性会变化。本例普通页 aria-disabled=\"false\"；末页变成 \"true\"，并带有 ant-pagination-disabled 类名和 disabled 属性。',code:'普通页：aria-disabled=\"false\"\\n末　页：aria-disabled=\"true\" disabled',task:'切换到第 5 页，观察实际源码，再选择末页 aria-disabled 的值。',hint:'使用左侧页码切到第 5 页。先观察，再回答；只选答案但没有到过末页，不算完成。',answer:'末页 aria-disabled=\"true\"。源码同时出现 disabled 属性和禁用类名。'},\n {title:'写可用翻页规则',goal:'规则在有下一页时匹配一个，在末页时匹配零个。',teach:'先用 @data-action=\"next\" 指向下一页按钮，再排除 @aria-disabled=\"true\" 的情况。not(条件) 表示条件不成立时才保留；and 要求两个条件同时满足。',code:\"//button[@data-action='next'\\n  and not(@aria-disabled='true')]\",task:'自己写一条只匹配“可用下一页”的 XPath。提交会分别验证第 1 页和第 5 页。',hint:'只写 //button[@data-action=\"next\"] 不够：末页这个按钮还存在，只是不能用。',answer:\"//button[@data-action='next' and not(@aria-disabled='true')]\",field:'可用下一页 XPath',placeholder:'写出能排除末页禁用按钮的规则'},\n {title:'跑通遍历流程',goal:'用自己的翻页规则逐页采集，在最后一页自动停止。',teach:'每一轮先读取当前页数据，再检查可用下一页。找到一个才翻页，找到零个就停止，找到多个说明规则不唯一。你需要选对执行顺序，并用上一题的规则跑完 5 页。',code:'读取当前页 → 查找可用下一页\\n→ 1 个：点击并继续\\n→ 0 个：停止\\n→ 多个：修正规则',task:'选择正确流程，再运行你的规则。成功条件为读取 5 页、收集 15 条订单、在末页停止。',hint:'如果先翻页再读取，会漏掉第 1 页；如果不判断禁用状态，可能一直尝试点击末页。',answer:'先读当前页，再查找可用下一页；没有可用下一页时停止。'}\n];\nfunction tableLesson(){const s=tableTraining.step,l=tableLessons[s];return note('\u003cstrong>本课包含 6 个动手任务。\u003c/strong> 先读每步讲解，再在左侧页面操作或填写 XPath；系统会判断目标元素、排序变化和末页状态。看演示与看答案不会自动算完成。')+`\n\u003cdiv class=\"training-overview\">\u003cdiv>\u003cb id=\"trainingCount\">已完成 ${tableTraining.passed.size} / 6 个任务\u003c/b>\u003cspan>点击步骤可自由复习，全部通过后才能完成本课。\u003c/span>\u003c/div>\u003cbutton class=\"secondary\" id=\"resetTableTraining\">重做本课\u003c/button>\u003c/div>\n\u003cdiv class=\"training-steps\">${tableLessons.map((x,i)=>`\u003cbutton data-training-step=\"${i}\" class=\"${s===i?'training-current':''} ${tableTraining.passed.has(i)?'training-passed':''}\">\u003cspan>${tableTraining.passed.has(i)?'✓':i+1}\u003c/span>${x.title}\u003c/button>`).join('')}\u003c/div>\n\u003cdiv class=\"split table-training-layout\">\u003csection class=\"panel training-sandbox\">\u003cdiv class=\"panel-head\">练习用订单页面 \u003csmall>共 5 页 · 模拟数据\u003c/small>\u003c/div>\u003cdiv class=\"panel-body\">\u003cdiv class=\"row training-pick-mode\">\u003cspan>选择方式\u003c/span>\u003cselect id=\"trainingPickMode\" aria-label=\"选择元素类型\">\u003coption value=\"cell\">单元格 td\u003c/option>\u003coption value=\"row\">整行 tr\u003c/option>\u003coption value=\"button\">详情按钮 button\u003c/option>\u003c/select>\u003c/div>\u003cdiv id=\"trainingFixture\">\u003cdiv id=\"tableWrap\">\u003c/div>\u003cdiv class=\"pagination\" id=\"pagination\">\u003c/div>\u003c/div>\u003cdiv id=\"tableSelection\" class=\"full-path\">\u003cspan>尚未选择元素，点击表格试试。\u003c/span>\u003c/div>\u003cdiv id=\"tableStatus\" class=\"result\" role=\"status\">\u003c/div>\u003cdetails class=\"training-source\" ${s===3?'open':''}>\u003csummary>观察当前“下一页”的 HTML 片段\u003c/summary>\u003cpre id=\"pageCode\" class=\"code\">\u003c/pre>\u003c/details>\u003cdetails class=\"training-source\">\u003csummary>查看刚选中元素的源码\u003c/summary>\u003cpre id=\"selectedTableCode\" class=\"code\">点击表格后显示\u003c/pre>\u003c/details>\u003cdiv id=\"tableRunLog\" class=\"training-run-log\" hidden>\u003c/div>\u003c/div>\u003c/section>\n\u003csection class=\"panel training-instructions\">\u003cdiv class=\"panel-head\">第 ${s+1} 步 · ${l.title}\u003csmall>${tableTraining.passed.has(s)?'本任务已通过':'先学再练'}\u003c/small>\u003c/div>\u003cdiv class=\"panel-body\">\u003cdiv class=\"training-goal\">\u003cspan>这一步学什么\u003c/span>\u003cstrong>${l.goal}\u003c/strong>\u003c/div>\u003ch3>讲解\u003c/h3>\u003cp class=\"training-text\">${l.teach}\u003c/p>\u003cpre class=\"code\">${esc(l.code)}\u003c/pre>\u003cbutton class=\"secondary\" id=\"showTableDemo\">看一次演示（不计成绩）\u003c/button>\u003cdiv class=\"training-task\">\u003cspan>轮到你了\u003c/span>\u003cp>${l.task}\u003c/p>\u003c/div>\n${l.field?`\u003cdiv class=\"field\">\u003clabel for=\"tableAnswer\">${l.field}\u003c/label>\u003ctextarea id=\"tableAnswer\" rows=\"3\" placeholder=\"${l.placeholder}\" spellcheck=\"false\">${esc(tableTraining.answers[s]||'')}\u003c/textarea>\u003c/div>`:''}\n${s===3?`\u003cfieldset class=\"training-options\">\u003clegend>第 5 页时，aria-disabled 等于？\u003c/legend>\u003clabel>\u003cinput type=\"radio\" name=\"lastPageAnswer\" value=\"false\"> false，按钮仍可用\u003c/label>\u003clabel>\u003cinput type=\"radio\" name=\"lastPageAnswer\" value=\"true\"> true，按钮已禁用\u003c/label>\u003c/fieldset>`:''}\n${s===5?`\u003cfieldset class=\"training-options\">\u003clegend>选择执行顺序\u003c/legend>\u003clabel>\u003cinput type=\"radio\" name=\"loopAnswer\" value=\"skip\">先翻页，再读取当前页\u003c/label>\u003clabel>\u003cinput type=\"radio\" name=\"loopAnswer\" value=\"correct\">先读取当前页，再判断是否存在可用下一页\u003c/label>\u003clabel>\u003cinput type=\"radio\" name=\"loopAnswer\" value=\"forever\">读取当前页后，一直点击下一页\u003c/label>\u003c/fieldset>\u003cdiv class=\"field\">\u003clabel for=\"loopXPath\">你要使用的翻页 XPath（可修改）\u003c/label>\u003ctextarea id=\"loopXPath\" rows=\"3\" placeholder=\"先完成第 5 步的规则\">${esc(tableTraining.answers[4]||'')}\u003c/textarea>\u003c/div>`:''}\n\u003cdiv class=\"row\">\u003cbutton class=\"primary\" id=\"submitTableTask\">${s===0?'提交当前选择':s===5?'运行我的遍历流程':'提交并检查'}\u003c/button>\u003cbutton class=\"secondary\" id=\"trainingNext\" ${s===5||!tableTraining.passed.has(s)?'disabled':''}>下一步 →\u003c/button>\u003c/div>\u003cdiv id=\"tableTaskFeedback\" class=\"result\" role=\"status\">${tableTraining.passed.has(s)?'本任务已通过，可以复习或继续下一步。':'尚未提交。按上面的任务要求完成操作。'}\u003c/div>\n\u003cdetails class=\"training-help\">\u003csummary>需要一点提示\u003c/summary>\u003cp>${l.hint}\u003c/p>\u003c/details>\u003cdetails class=\"training-help\">\u003csummary>查看参考答案与解释\u003c/summary>\u003cp class=\"hint\">查看答案后，仍需自己操作并提交。\u003c/p>\u003cpre>${esc(l.answer)}\u003c/pre>\u003c/details>\u003c/div>\u003c/section>\u003c/div>`}\nfunction bindTable(){\n  const state=tableTraining,step=state.step;page=step===3?4:1;state.selected=null;\n  if(state.passed.size!==6&&completed.has(5)){completed.delete(5);persist();nav()}\n  const wrap=$('#tableWrap'),fixture=$('#trainingFixture'),feedback=$('#tableTaskFeedback');\n  const feedbackMessage=(text,ok=false)=>{feedback.textContent=text;feedback.classList.toggle('error',!ok)};\n  const clearSelection=()=>{fixture.querySelectorAll('.matched,.picked').forEach(el=>el.classList.remove('matched','picked'));state.selected=null};\n  const nextMarkup=p=>`\u003cbutton id=\"pageNext\" data-action=\"next\" class=\"ant-pagination-next${p===5?' ant-pagination-disabled':''}\" aria-disabled=\"${p===5}\" ${p===5?'disabled':''}>下一页 ›\u003c/button>`;\n  const fixtureHTML=p=>orderTable(p===1?'XD':`XD${p}00`)+nextMarkup(p);\n  const evaluate=(html,expression)=>{if(!expression.trim())throw Error('请先填写 XPath。');const doc=document.implementation.createHTMLDocument('表格练习');doc.body.innerHTML=html;let result;try{result=doc.evaluate(expression.trim(),doc.body,null,XPathResult.ORDERED_NODE_SNAPSHOT_TYPE,null)}catch{throw Error('XPath 无效，或返回了数字、文本。请填写能选择元素的表达式。')}const nodes=[];for(let i=0;i\u003cresult.snapshotLength;i++){const node=result.snapshotItem(i);if(node.nodeType===1&&doc.body.contains(node)&&node!==doc.body)nodes.push(node)}return {doc,nodes}};\n  const paint=()=>{\n    clearSelection();wrap.innerHTML=orderTable(page===1?'XD':`XD${page}00`);$('#pagination').innerHTML=`\u003cbutton id=\"pagePrev\" ${page===1?'disabled':''}>‹\u003c/button>${[1,2,3,4,5].map(p=>`\u003cbutton data-table-page=\"${p}\" class=\"${page===p?'current':''}\" aria-label=\"练习第 ${p} 页\">${p}\u003c/button>`).join('')}${nextMarkup(page)}`;\n    $('#tableStatus').textContent=`当前第 ${page} / 5 页。${page===5?'已到最后一页，下一页按钮禁用。':'可以继续翻页。'}`;\n    $('#pageCode').textContent=$('#pageNext').outerHTML;$('#tableSelection').innerHTML='\u003cspan>尚未选择元素，点击表格试试。\u003c/span>';$('#selectedTableCode').textContent='点击表格后显示';\n    if(page===5)state.visitedLast=true;\n    $$('[data-table-page]').forEach(b=>b.onclick=()=>{page=+b.dataset.tablePage;paint()});$('#pagePrev').onclick=()=>{if(page>1){page--;paint()}};$('#pageNext').onclick=()=>{if(page\u003c5){page++;paint()}};\n    wrap.querySelector('tbody').onclick=e=>{\n      const cell=e.target.closest('td');if(!cell)return;clearSelection();const tr=cell.parentElement;const el=state.pickMode==='row'?tr:state.pickMode==='button'?cell.querySelector('button')||e.target.closest('button'):cell;\n      if(!el){$('#tableSelection').innerHTML='\u003cspan>这里没有详情按钮，请点击操作列中的按钮。\u003c/span>';return}\n      el.classList.add('matched');state.selected={el,tag:el.localName,order:tr.cells[0].textContent,column:[...tr.cells].indexOf(cell)+1};$('#tableSelection').innerHTML='\u003cspan>你选择的元素\u003c/span>\u003ccode>'+esc(`table > tbody > tr（订单 ${state.selected.order}）`+(el.localName==='tr'?'':` > td[${state.selected.column}]`+(el.localName==='button'?' > button':'')))+'\u003c/code>';const original=el.cloneNode(true);[original,...original.querySelectorAll('*')].forEach(node=>{node.classList.remove('matched','picked');if(node.getAttribute('class')==='')node.removeAttribute('class')});$('#selectedTableCode').textContent=prettyElement(original);\n      if(step===0)feedbackMessage('已选择 '+el.localName+'。请提交，系统会判断是否为指定订单的整行。',true);\n    };\n  };\n  const markPass=message=>{state.passed.add(step);saveTableTraining();if(state.passed.size===6){completed.add(5);persist();nav()}$('#trainingCount').textContent=`已完成 ${state.passed.size} / 6 个任务`;const button=$(`[data-training-step=\"${step}\"]`);button.classList.add('training-passed');button.querySelector('span').textContent='✓';if(step\u003c5)$('#trainingNext').disabled=false;feedbackMessage('✓ '+message,true)};\n  const highlightQuery=expression=>{clearSelection();const r=evaluate(fixture.innerHTML,expression),copies=[...r.doc.body.querySelectorAll('*')],actual=[...fixture.querySelectorAll('*')];r.nodes.forEach(node=>{const index=copies.indexOf(node);if(index>=0)actual[index].classList.add('matched')});return r};\n  $('#trainingPickMode').value=state.pickMode;$('#trainingPickMode').onchange=e=>{state.pickMode=e.target.value;clearSelection(); 1915b}.recovery-feedback.error{color:#ac683d}.recovery-target{outline:2px solid #ee5761;outline-offset:-2px}.badge.skipped{background:#f0eaf8;color:#8966a5}\n@media(max-width:800px){.login-shell{grid-template-columns:1fr;gap:22px;padding:25px;min-height:100vh}.login-story{padding:0}.login-story-main{padding:30px 0 10px}.login-story h1{font-size:31px;margin-bottom:15px}.login-story-main>p{max-width:none}.login-context{margin-top:18px}.login-story-foot{display:none}.login-card{padding:25px}.login-eyebrow{margin-bottom:12px}.recovery-head{display:block}.recovery-head small{display:block;margin-top:10px}.recovery-meta{gap:18px}.recovery-panel{padding:17px}.recovery-panel input{min-width:0;width:100%}}\n\u003c/style>\u003c/head>\n\u003cbody>\u003cheader class=\"app-header\">\u003ca class=\"brand\" href=\"#\">\u003cspan>⌘\u003c/span>\u003cdiv>订单故障练习场\u003csmall>ELEMENT LAB / RPA TRAINING\u003c/small>\u003c/div>\u003c/a>\u003cdiv class=\"header-actions\">\u003cspan class=\"local-tag\">● 本地模拟环境\u003c/span>\u003cspan id=\"sessionStatus\">\u003c/span>\u003cbutton id=\"loginButton\">账号登录\u003c/button>\u003cbutton id=\"toggleTeacher\" aria-expanded=\"true\">隐藏老师控制台\u003c/button>\u003c/div>\u003c/header>\n\u003cmain>\u003csection class=\"intro\">\u003cdiv>\u003cdiv class=\"eyebrow\">EXCEPTION HANDLING · PRACTICE LAB\u003c/div>\u003ch1>让故障发生，\u003cem>再让流程继续。\u003c/em>\u003c/h1>\u003cp>在这里捕获元素、查询订单、提交结果。老师控制故障，学员用影刀编写等待、判断与恢复流程。\u003c/p>\u003c/div>\u003cbutton class=\"outline\" id=\"showGuide\">怎么用这个网页 ↗\u003c/button>\u003c/section>\n\u003cdiv class=\"scenario-banner\">\u003cdiv>\u003cspan class=\"scenario-mark\">本轮任务\u003c/span>\u003cstrong id=\"scenarioTitle\">\u003c/strong>\u003cp id=\"scenarioSummary\">\u003c/p>\u003c/div>\u003cbutton id=\"resetRound\">重置本轮进度 ↺\u003c/button>\u003c/div>\n\u003csection id=\"recoveryPanel\" class=\"recovery-panel\" hidden>\u003c/section>\n\u003cdiv class=\"work-layout\">\u003cdiv class=\"business-column\">\u003csection class=\"stats\" id=\"stats\">\u003c/section>\n\u003csection class=\"panel order-panel\">\u003cdiv class=\"panel-head\">\u003cdiv>\u003ch2>订单管理\u003c/h2>\u003csmall>学员与机器人操作区域 · 10 条虚拟订单\u003c/small>\u003c/div>\u003cdiv class=\"row\">\u003cbutton id=\"refreshList\" data-action=\"refresh-list\">刷新列表\u003c/button>\u003cbutton class=\"primary\" id=\"exportResults\" data-action=\"export-results\">导出结果 CSV\u003c/button>\u003c/div>\u003c/div>\u003cdiv class=\"filter-bar\">\u003clabel>订单号\u003cinput type=\"search\" id=\"orderSearch\" placeholder=\"例如 XD1005\" autocomplete=\"off\">\u003c/label>\u003clabel>处理状态\u003cselect id=\"statusFilter\">\u003coption value=\"all\">全部状态\u003c/option>\u003coption value=\"pending\">待处理\u003c/option>\u003coption value=\"uncertain\">待核实\u003c/option>\u003coption value=\"done\">已提交\u003c/option>\u003coption value=\"invalid\">数据异常\u003c/option>\u003coption value=\"failed\">处理失败\u003c/option>\u003coption value=\"skipped\">已跳过\u003c/option>\u003c/select>\u003c/label>\u003cbutton id=\"clearFilters\">清空筛选\u003c/button>\u003c/div>\n\u003cdiv class=\"table-scroll\">\u003ctable id=\"ordersTable\">\u003cthead>\u003ctr>\u003cth>订单号\u003c/th>\u003cth>商品\u003c/th>\u003cth>金额\u003c/th>\u003cth>状态\u003c/th>\u003cth>操作\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody id=\"ordersBody\">\u003c/tbody>\u003c/table>\u003c/div>\u003cdiv id=\"businessNotice\" class=\"notice\" role=\"status\" aria-live=\"polite\">先查询 XD1005，尝试提交，再观察页面反馈。\u003c/div>\u003cdiv class=\"table-foot\">\u003cspan id=\"visibleCount\">\u003c/span>\u003cspan>提示：点击完成 ≠ 业务处理成功，请检查页面结果。\u003c/span>\u003c/div>\u003c/section>\n\u003csection class=\"panel evidence-panel\">\u003cdiv class=\"evidence-tabs\" role=\"tablist\">\u003cbutton role=\"tab\" id=\"eventsTab\" aria-selected=\"true\">运行日志\u003c/button>\u003cbutton role=\"tab\" id=\"assessmentTab\" aria-selected=\"false\">本轮验收\u003c/button>\u003cbutton role=\"tab\" id=\"instructionsTab\" aria-selected=\"false\">练习任务书\u003c/button>\u003c/div>\u003cdiv id=\"evidenceContent\">\u003c/div>\u003c/section>\n\u003c/div>\u003caside class=\"teacher-panel\" id=\"teacherPanel\">\u003cdiv class=\"teacher-title\">\u003cspan>☷\u003c/span>\u003cdiv>\u003ch2>老师控制台\u003c/h2>\u003csmall>设置可复现的故障，查看学员处理结果\u003c/small>\u003c/div>\u003c/div>\u003csection>\u003clabel for=\"presetSelect\">选择教学场景\u003c/label>\u003cselect id=\"presetSelect\">\u003coption value=\"normal\">01 正常流程 · 先跑通操作\u003c/option>\u003coption value=\"retry\" selected>02 初体验 · 提交先失败一次\u003c/option>\u003coption value=\"exam\">03 综合考核 · 10 条混合故障\u003c/option>\u003coption value=\"login\">04 登录恢复 · 跳过当前继续下一条\u003c/option>\u003c/select>\u003cbutton class=\"primary wide\" id=\"applyPreset\">应用场景并重新开始\u003c/button>\u003cp class=\"hint\">应用场景会重置全部虚拟订单、计数与日志。\u003c/p>\u003c/section>\u003csection>\u003ch3>给一条订单设置故障\u003c/h3>\u003clabel for=\"faultOrder\">目标订单\u003c/label>\u003cselect id=\"faultOrder\">\u003c/select>\u003clabel for=\"faultMode\">故障类型\u003c/label>\u003cselect id=\"faultMode\">\u003c/select>\u003cdiv class=\"two-fields\">\u003clabel>加载延迟 / 秒\u003cinput id=\"faultDelay\" type=\"number\" min=\"1\" max=\"15\" value=\"4\">\u003c/label>\u003clabel>前几次失败\u003cinput id=\"faultCount\" type=\"number\" min=\"1\" max=\"5\" value=\"1\">\u003c/label>\u003c/div>\u003cbutton class=\"wide\" id=\"applyFault\">仅应用到这条订单\u003c/button>\u003cp class=\"hint\" id=\"faultDescription\">\u003c/p>\u003c/section>\u003csection>\u003clabel class=\"check-label\">\u003cinput type=\"checkbox\" id=\"blockExport\">模拟导出阻塞\u003c/label>\u003cp class=\"hint\">这是页面内的导出失败模拟，不会锁定电脑上的真实文件。\u003c/p>\u003cdiv class=\"row\">\u003cbutton id=\"expireSession\">立即使登录失效\u003c/button>\u003cbutton id=\"exportLog\">下载日志 JSON\u003c/button>\u003c/div>\u003c/section>\u003csection class=\"teacher-tips\">\u003ch3>从这里开始教学\u003c/h3>\u003col>\u003cli>先在正常场景中跑通单条订单。\u003c/li>\u003cli>开启一种故障，运行原来的流程。\u003c/li>\u003cli>读取反馈，加入等待或恢复分支。\u003c/li>\u003cli>重置本轮，验证同样故障能被处理。\u003c/li>\u003cli>切换综合考核，用结果表和日志验收。\u003c/li>\u003c/ol>\u003c/section>\u003c/aside>\u003c/div>\n\u003cfooter>\u003cspan>只使用虚拟订单 · 数据保存在当前浏览器\u003c/span>\u003cspan>异常处理练习 / 可重复复位\u003c/span>\u003c/footer>\u003c/main>\n\u003cdiv class=\"modal-backdrop\" id=\"detailBackdrop\" hidden>\u003csection class=\"detail-modal\" role=\"dialog\" aria-modal=\"true\" aria-labelledby=\"detailTitle\">\u003cdiv class=\"modal-head\">\u003cdiv>\u003csmall>订单详情\u003c/small>\u003ch2 id=\"detailTitle\">查询订单\u003c/h2>\u003c/div>\u003cbutton id=\"closeDetail\" aria-label=\"关闭订单详情\">✕\u003c/button>\u003c/div>\u003cdiv id=\"detailContent\">\u003c/div>\u003c/section>\u003c/div>\n\u003cdiv class=\"popup-backdrop\" id=\"popupBackdrop\" hidden>\u003csection role=\"dialog\" aria-modal=\"true\" aria-labelledby=\"popupTitle\">\u003cdiv class=\"popup-icon\">!\u003c/div>\u003ch2 id=\"popupTitle\">练习公告\u003c/h2>\u003cp>这是一层会遮挡订单按钮的模拟弹窗。关闭后才能继续操作订单。\u003c/p>\u003cbutton class=\"primary\" id=\"dismissPopup\" data-action=\"dismiss-popup\">我知道了，关闭弹窗\u003c/button>\u003c/section>\u003c/div>\n\u003cdiv class=\"modal-backdrop\" id=\"guideBackdrop\" hidden>\u003csection class=\"guide-modal\" role=\"dialog\" aria-modal=\"true\" aria-labelledby=\"guideTitle\">\u003cdiv class=\"modal-head\">\u003ch2 id=\"guideTitle\">这个网页有什么用？\u003c/h2>\u003cbutton id=\"closeGuide\" aria-label=\"关闭使用说明\">✕\u003c/button>\u003c/div>\u003cdiv class=\"guide-body\">\u003cp class=\"lead\">它是影刀流程的练习对象，也是老师控制故障的工具。\u003c/p>\u003cdiv class=\"guide-grid\">\u003cdiv>\u003cb>① 学员操作\u003c/b>\u003cp>在影刀里捕获查询、提交、结果提示和订单状态，搭建自己的流程。\u003c/p>\u003c/div>\u003cdiv>\u003cb>② 老师制造故障\u003c/b>\u003cp>让指定订单查询失败、加载变慢、提交失败或丢失回执，每次都能复现。\u003c/p>\u003c/div>\u003cdiv>\u003cb>③ 修改并验证\u003c/b>\u003cp>学员加入状态判断、有限重试、单条跳过、登录恢复和防重复提交。\u003c/p>\u003c/div>\u003cdiv>\u003cb>④ 用结果验收\u003c/b>\u003cp>检查实际写入次数、失败原因、尝试次数及是否还有遗漏的订单。\u003c/p>\u003c/div>\u003c/div>\u003cdiv class=\"guide-note\">\u003cstrong>页面报错与指令异常要区分。\u003c/strong>\u003cp>页面显示“提交失败”时，点击指令可能已经执行成功。应读取业务反馈并判断；等待某个目标出现并超时、操作被遮挡等情况，则可能使自动化指令失败。网页不会直接替影刀抛出异常。\u003c/p>\u003c/div>\u003ch3>登录失效专项练习\u003c/h3>\u003cp>选择“04 登录恢复”场景，先处理 XD1001、XD1002，再查询 XD1003。页面会跳转到登录页；练习账号 rpa_student，密码 Rpa@2026。登录后进入订单页，记录 XD1003 跳过原因，再查找 XD1004。也可选择重试当前条，两个分支不会混记。\u003c/p>\u003ch3>建议先体验一次\u003c/h3>\u003cp>使用默认场景，查询 XD1005 → 第一次提交失败 → 第二次提交成功 → 在运行日志中核对两次尝试、一次实际写入。随后用影刀实现同样的判断。\u003c/p>\u003ch3>本地文件与影刀实操\u003c/h3>\u003cp>可直接用浏览器打开此单文件。若浏览器扩展无法捕获 file 页面，使用同文件夹中的“启动本地练习场.cmd”，再访问本机 HTTP 地址。只在本机提供虚拟练习数据。\u003c/p>\u003c/div>\u003c/section>\u003c/div>\n\u003cscript>(function(root,factory){if(typeof module==='object'&&module.exports)module.exports=factory();else root.FaultLabEngine=factory()})(typeof globalThis!=='undefined'?globalThis:this,function(){\n  'use strict';\n  const modes={normal:'正常',slow:'详情加载慢',queryOnce:'查询前几次失败',missing:'金额缺失',submitOnce:'提交前几次失败',submitAlways:'提交持续失败',receiptLost:'提交成功但回执丢失',session:'登录失效一次',popup:'弹窗遮挡一次'};\n  const items=['商务笔记本','无线鼠标','桌面收纳盒','便携充电器','办公键盘','文件收纳袋','显示器支架','保温杯','台灯','数据线'];\n  const config=mode=>({mode,delay:4,failCount:1});\n  const practiceAccount={username:'rpa_student',password:'Rpa@2026'};\n  function blankStats(){return {queries:0,submits:0,commits:0,checks:0,sessionTriggered:false,popupTriggered:false,popupClosed:false,lost:false,verified:false}}\n  function createState(preset='retry'){\n    const orders=items.map((product,i)=>({id:'XD'+(1001+i),product,amount:[129,89,45,159,199,39,269,79,139,29][i],status:'pending',note:'',fault:config('normal'),stats:blankStats()}));\n    if(preset==='retry')orders[4].fault=config('submitOnce');\n    if(preset==='login')orders[2].fault=config('session');\n    if(preset==='exam'){\n      ['normal','slow','queryOnce','missing','submitOnce','submitAlways','receiptLost','session','popup','normal'].forEach((mode,i)=>orders[i].fault=config(mode));\n    }\n    return {version:1,preset,orders,loggedIn:true,exportBlocked:false,events:[],seq:0,exportRequests:0,recovery:null,session:{attempts:0,successes:0},activeOrderId:null};\n  }\n  function ensureState(state){if(!state.session)state.session={attempts:0,successes:0};if(!('recovery' in state))state.recovery=null;if(!('activeOrderId' in state))state.activeOrderId=null;return state}\n  function find(state,id){const order=state.orders.find(o=>o.id===id);if(!order)throw Error('订单不存在');return order}\n  function log(state,id,action,result,message){state.events.unshift({seq:++state.seq,time:new Date().toISOString(),order:id||'系统',action,result,message});state.events=state.events.slice(0,300)}\n  function amountOf(order){return order.fault.mode==='missing'?null:order.amount}\n  function publicStatus(order){return order.stats.lost&&!order.stats.verified&&order.status==='done'?'uncertain':order.status}\n  function nextPending(state,afterId){const index=state.orders.findIndex(o=>o.id===afterId);return state.orders.slice(index+1).find(o=>o.status==='pending')?.id||null}\n  function expireSession(state,id,reason='登录已失效'){\n    ensureState(state);state.loggedIn=false;\n    if(!state.recovery||['complete','skipped','retry-current'].includes(state.recovery.stage)){\n      const current=id||state.activeOrderId||null;\n      state.recovery={orderId:current,nextOrderId:nextPending(state,current),stage:'login-required',reason,skipped:false};\n    }\n    log(state,id,'会话失效','跳转登录页',reason+'；当前订单与已处理结果已保留');\n    return {kind:'login',message:reason+'，请输入练习账号和密码重新登录。'};\n  }\n  function openOrder(state,id){\n    ensureState(state);const o=find(state,id);if(!state.loggedIn)return expireSession(state,id,'登录已失效，本次查询未完成');state.activeOrderId=id;\n    o.stats.queries++;\n    if(o.fault.mode==='session'&&!o.stats.sessionTriggered){o.stats.sessionTriggered=true;return expireSession(state,id,'查询 '+id+' 时会话已过期，本次查询未完成');}\n    if(o.fault.mode==='queryOnce'&&o.stats.queries\u003c=o.fault.failCount){log(state,id,'查询详情','失败','临时查询错误，第 '+o.stats.queries+' 次');return {kind:'error',message:'查询服务暂时不可用，请稍后重新查询。',code:'QUERY_TEMPORARY'}}\n    let popup=false;if(o.fault.mode==='popup'&&!o.stats.popupTriggered){o.stats.popupTriggered=true;popup=true}\n    const delay=o.fault.mode==='slow'?o.fault.delay:0;\n    log(state,id,'查询详情',delay?'等待加载':'成功',delay?'详情将在 '+delay+' 秒后出现':'详情已返回');return {kind:'ready',delay,popup};\n  }\n  function submit(state,id){\n    const o=find(state,id);if(!state.loggedIn){log(state,id,'提交','需登录','本次未提交');return {kind:'login',message:'登录已失效，请先重新登录。'}}\n    if(['invalid','failed','skipped'].includes(o.status))return {kind:'error',message:'该订单已归档，请处理下一条订单或重置本轮。'};\n    o.stats.submits++;\n    if(amountOf(o)===null){log(state,id,'提交','数据校验失败','订单金额为空，没有写入业务结果');return {kind:'error',message:'订单金额为空。请记录数据异常并跳过本订单。',code:'AMOUNT_REQUIRED'}}\n    if(o.fault.mode==='submitAlways'||(o.fault.mode==='submitOnce'&&o.stats.submits\u003c=o.fault.failCount)){log(state,id,'提交','失败','第 '+o.stats.submits+' 次尝试失败，没有写入业务结果');return {kind:'error',message:'本次提交失败，业务状态未改变。',code:'SUBMIT_FAILED'}}\n    o.stats.commits++;o.status='done';\n    if(o.fault.mode==='receiptLost'&&o.stats.commits===1){o.stats.lost=true;o.stats.verified=false;log(state,id,'提交','已写入但回执丢失','业务已成功，页面未收到成功回执；重试前应核对状态');return {kind:'uncertain',message:'请求已发出，但未收到成功回执。请先查询处理结果，再决定是否重试。',code:'RECEIPT_LOST'}}\n    o.stats.verified=true;log(state,id,'提交',o.stats.commits>1?'重复写入':'成功','实际业务写入共 '+o.stats.commits+' 次');return {kind:'success',message:o.stats.commits>1?'重复提交已发生，本订单实际写入 '+o.stats.commits+' 次。':'订单提交成功。'};\n  }\n  function check(state,id){const o=find(state,id);if(!state.loggedIn)return {kind:'login',message:'登录已失效，暂时无法查询业务结果。'};o.stats.checks++;o.stats.verified=true;log(state,id,'查询处理结果','成功','业务状态 '+o.status+'，实际写入 '+o.stats.commits+' 次');return {kind:o.status==='done'?'success':'info',message:o.status==='done'?'已核实：订单已提交，实际写入 '+o.stats.commits+' 次。请勿重复提交。':'已核实：订单尚未提交。'};}\n  function mark(state,id,status,note){const o=find(state,id);if(!state.loggedIn)return {kind:'login',message:'请先重新登录。'};if(!['invalid','failed'].includes(status))return {kind:'error',message:'请使用相应的异常记录操作。'};if(!note.trim())return {kind:'error',message:'请填写异常原因，便于后续排查。'};if(o.stats.commits)return {kind:'error',message:'该订单已有成功写入，请先查询处理结果，不要标记为失败。'};if(status==='failed'&&!o.stats.submits)return {kind:'error',message:'该订单还没有提交尝试，请核对是否确实需要记录为处理失败。'};o.status=status;o.note=note.trim();log(state,id,'记录异常并跳过',status==='invalid'?'数据异常':'处理失败',o.note);return {kind:'success',message:'异常记录已保存，可以继续下一条订单。'}}\n  function login(state,username,password){\n    ensureState(state);state.session.attempts++;\n    if(String(username||'').trim()!==practiceAccount.username||password!==practiceAccount.password){log(state,null,'账号密码登录','失败','练习账号或密码不正确；未保存输入内容');return {kind:'error',message:'账号或密码不正确，请使用页面提供的练习账号。'}}\n    state.loggedIn=true;state.session.successes++;if(state.recovery?.stage==='login-required')state.recovery.stage='return-required';log(state,null,'账号密码登录','成功','练习账号验证通过；已有订单结果与异常记录保留');return {kind:'success',message:'登录成功。请返回订单处理页面，处理恢复位置。'};\n  }\n  function arriveOrders(state){ensureState(state);if(state.loggedIn&&state.recovery?.stage==='return-required'){state.recovery.stage='decision-required';log(state,state.recovery.orderId,'返回订单页','成功','等待选择重试当前条或记录跳过后继续下一条')}}\n  function skipRecoveryOrder(state,note){\n    ensureState(state);if(!state.loggedIn)return {kind:'login',message:'请先完成账号密码登录。'};const r=state.recovery;if(!r?.orderId)return {kind:'error',message:'没有需要恢复处理的当前订单。'};const o=find(state,r.orderId);\n    if(o.stats.commits>0||o.status==='done')return {kind:'error',message:'该订单已有业务写入，不能忽略。请先核对结果，避免遗漏或重复。'};\n    if(o.status!=='pending')return {kind:'error',message:'当前订单已经归档，请直接查找下一条待处理订单。'};\n    if(!String(note||'').trim())return {kind:'error',message:'先填写跳过原因，再记录异常。'};\n    o.status='skipped';o.note=String(note).trim();r.skipped=true;r.stage='skipped';r.nextOrderId=nextPending(state,o.id);log(state,o.id,'登录恢复后忽略当前条','已跳过',o.note+'；下一条 '+(r.nextOrderId||'无'));\n    return {kind:'success',message:o.id+' 已记录为跳过。'+(r.nextOrderId?'下一条待处理订单为 '+r.nextOrderId+'。':'后面没有待处理订单。'),nextOrderId:r.nextOrderId};\n  }\n  functio find(state,r.orderId):null;\n      const verify=currentOrder?.status==='done'&&!currentOrder.stats.verified;const next=(r.stage==='retry-current'&&currentOrder?.status==='pending')||verify?r.orderId:E.nextPending(state,r.orderId);\n      if(!next){feedback({kind:'error',message:'后面没有待处理订单。可清空筛选检查此前是否有遗漏。'});return}\n      $('#orderSearch').value=next;$('#statusFilter').value='all';E.log(state,next,'查找恢复目标','已定位','从 '+(r.orderId||'起始位置')+' 继续，目标 '+next);save();renderRows();renderEvidence();const row=$(`[data-order-id=\"${next}\"]`);row?.classList.add('recovery-target');row?.scrollIntoView({behavior:'smooth',block:'center'});notice('已定位 '+next+'。请由学员或影刀点击查询并继续处理。');\n    };\n  }\n  function sync(){save();renderRows();renderRecovery();renderEvidence()}\n  function detailResult(result){if(result.kind==='login'){S.goToLogin(state,activeId,result.message);return}const el=$('#operation-status');if(!el)return;el.textContent=result.message;el.dataset.state=result.kind;el.dataset.errorCode=result.code||'';const o=E.find(state,activeId);const button=$('#submit-order');if(button)button.disabled=busy||(o.status==='done'&&o.stats.verified)||['invalid','failed','skipped'].includes(o.status);}\n  function detailForm(id){\n    const o=E.find(state,id),amount=E.amountOf(o);$('#detailContent').innerHTML=`\u003cdiv class=\"detail-grid\">\u003cdiv>\u003csmall>订单号\u003c/small>\u003cstrong id=\"order-id\">${o.id}\u003c/strong>\u003c/div>\u003cdiv>\u003csmall>商品\u003c/small>\u003cstrong id=\"order-product\">${o.product}\u003c/strong>\u003c/div>\u003cdiv>\u003csmall>订单金额\u003c/small>\u003cstrong class=\"amount ${amount===null?'missing-amount':''}\" id=\"order-amount\" data-value=\"${amount??''}\">${amount===null?'—':amount.toFixed(2)}\u003c/strong>\u003c/div>\u003cdiv>\u003csmall>已核对的页面状态\u003c/small>\u003cstrong id=\"order-business-status\">${labels[E.publicStatus(o)]}\u003c/strong>\u003c/div>\u003c/div>\u003cdiv id=\"operation-status\" class=\"operation-status\" data-state=\"ready\" data- ail(message){S.goToLogin(state,activeId,message)}\n  function openDetail(id){\n    if(busy){notice('还有一笔提交请求处理中，请等待它返回结果。','uncertain');return}\n    lastFocus=document.activeElement;activeId=id;const thisToken=++token;$('#detailTitle').textContent=id;$('#detailBackdrop').hidden=false;$('#closeDetail').focus();\n    const result=E.openOrder(state,id);sync();\n    if(result.kind==='login'){loginDetail(result.message);return}\n    if(result.kind==='error'){$('#detailContent').innerHTML=`\u003cdiv class=\"query-error\" id=\"query-status\" data-state=\"error\" data-error-code=\"${result.code}\" role=\"status\">${esc(result.message)}\u003c/div>\u003cbutton id=\"retry-detail\">重新查询本订单\u003c/button>\u003cp class=\"hint\">本次只返回错误提示，提交按钮尚未出现。请为查询设置恢复策略。\u003c/p>`;$('#retry-detail').onclick=()=>openDetail(id);return}\n    const ready=()=>{if(thisToken!==token||activeId!==id)return;detailForm(id);if(result.delay){E.log(state,id,'详情加载','已就绪','提交按钮现在出现在 DOM 中');sync()}if(result.popup){$('#popupBackdrop').hidden=false;$('#dismissPopup').focus()}};\n    if(result.delay){$('#detailContent').innerHTML=`\u003cdiv class=\"loading-state\" id=\"detail-loading\" role=\"status\">\u003cdiv class=\"spinner\">\u003c/div>详情正在加载，预计 ${result.delay} 秒……\u003cp class=\"hint\">目标提交按钮此时还没有出现在 DOM 中。\u003c/p>\u003c/div>`;setTimeout(ready,result.delay*1000)}else ready();\n  }\n  function closeDetail(){if(!$('#popupBackdrop').hidden)return;$('#detailBackdrop').hidden=true;activeId=null;token++;if(lastFocus?.isConnected)lastFocus.focus()}\n  function dismissPopup(){if(!activeId)return;E.closePopup(state,activeId);$('#popupBackdrop').hidden=true;sync();$('#submit-order')?.focus()}\n  function reset(preset,keepConfig=false){const config=keepConfig?state.orders.map(o=>({...o.fault})):null,blocked=state.exportBlocked;epoch++;token++;busy=false;activeId=null;$('#detailBackdrop').hidden=true;$('#popupBackdrop').hidden=true;state=E.createState(preset);if(config){state.preset=preset;state.orders.forEach((o,i)=> set(state.preset,true);\n  $('#blockExport').checked=state.exportBlocked;$('#blockExport').onchange=e=>{state.exportBlocked=e.target.checked;E.log(state,null,'设置导出故障',state.exportBlocked?'开启':'关闭','只模拟页面导出失败，不占用真实文件');save();renderEvidence()};\n  $('#expireSession').onclick=()=>{E.expireSession(state,state.activeOrderId,'老师主动设置会话过期');save();S.goToLogin(state,state.activeOrderId,'会话已过期')};\n  $('#loginButton').onclick=()=>S.goToLogin(state,state.activeOrderId,'手动进入练习登录页');\n  $('#orderSearch').oninput=renderRows;$('#statusFilter').onchange=renderRows;$('#clearFilters').onclick=()=>{$('#orderSearch').value='';$('#statusFilter').value='all';renderRows()};\n  $('#refreshList').onclick=()=>{if(!state.loggedIn){S.goToLogin(state,state.activeOrderId,'刷新订单时登录失效');return}state.orders.filter(o=>E.publicStatus(o)==='uncertain').forEach(o=>E.check(state,o.id));E.log(state,null,'刷新订单列表','成功','重新核对列表与待核实的业务结果');sync();notice('列表已刷新；已有结果和尝试次数保留。')};\n  $('#exportResults').onclick=()=>{const result=E.exportCSV(state);sync();if(result.kind==='download'){download('订单处理结果.csv',result.data,'text/csv;charset=utf-8');notice('结果文件已生成下载请求，请到浏览器下载目录确认文件。')}else notice(result.message,'error')};\n  $('#exportLog').onclick=()=>download('订单练习日志.json',JSON.stringify({exportedAt:new Date().toISOString(),assessment:E.assess(state),orders:state.orders,events:state.events},null,2),'application/json;charset=utf-8');\n  $('#toggleTeacher').onclick=()=>{document.body.classList.toggle('student-mode');const visible=!document.body.classList.contains('student-mode');$('#toggleTeacher').setAttribute('aria-expanded',String(visible));$('#toggleTeacher').textContent=visible?'隐藏老师控制台':'显示老师控制台'};\n  $('#closeDetail').onclick=closeDetail;$('#dismissPopup').onclick=dismissPopup;$('#showGuide').onclick=()=>{$('#guideBackdrop').hidden=false;$('#closeGuide').focus()};$('#closeGuide').onclick=()=>{$('#guideBackdrop').hidden=true;$('#showGuide').focus()};\n  document.addEventListener('keydown',e=>{if(e.key!=='Escape') ptLost:'提交成功但回执丢失',session:'登录失效一次',popup:'弹窗遮挡一次'};\n  const items=['商务笔记本','无线鼠标','桌面收纳盒','便携充电器','办公键盘','文件收纳袋','显示器支架','保温杯','台灯','数据线'];\n  const config=mode=>({mode,delay:4,failCount:1});\n  const practiceAccount={username:'rpa_student',password:'Rpa@2026'};\n  function blankStats(){return {queries:0,submits:0,commits:0,checks:0,sessionTriggered:false,popupTriggered:false,popupClosed:false,lost:false,verified:false}}\n  function createState(preset='retry'){\n    const orders=items.map((product,i)=>({id:'XD'+(1001+i),product,amount:[129,89,45,159,199,39,269,79,139,29][i],status:'pending',note:'',fault:config('normal'),stats:blankStats()}));\n    if(preset==='retry')orders[4].fault=config('submitOnce');\n    if(preset==='login')orders[2].fault=config('session');\n    if(preset==='exam'){\n      ['normal','slow','queryOnce','missing','submitOnce','submitAlways','receiptLost','session','popup','normal'].forEach((mode,i)=>orders[i].fault=config(mode));\n    }\n    return {version:1,preset,orders,loggedIn:true,exportBlocked:false,events:[],seq:0,exportRequests:0,recovery:null,session:{attempts:0,successes:0},activeOrderId:null};\n  }\n  function ensureState(state){if(!state.session)state.session={attempts:0,successes:0};if(!('recovery' in state))state.recovery=null;if(!('activeOrderId' in state))state.activeOrderId=null;return state}\n  function find(state,id){const order=state.orders.find(o=>o.id===id);if(!order)throw Error('订单不存在');return order}\n  function log(state,id,action,result,message){state.events.unshift({seq:++state.seq,time:new Date().toISOString(),order:id||'系统',action,result,message});state.events=state.events.slice(0,300)}\n  function amountOf(order){return order.fault.mode==='missing'?null:order.amount}\n  function publicStatus(order){return order.stats.lost&&!order.stats.verified&&order.status==='done'?'uncertain':order.status}\n  function nextPending(state,afterId){const index=state.orders.findIndex(o=>o.id===afterId);return state.orders.slice(index+1).find(o=>o.status==='pending')?.id||null}\n  function expireSession(state,id,reason='登录已失效'){\n    ensureState(state);state.loggedIn=false;\n    if(!state.recovery||['complete','skipped','retry-current'].includes(state.recovery.stage)){\n      const current=id||state.activeOrderId||null;\n      state.recovery={orderId:current,nextOrderId:nextPending(state,current),stage:'login-required',reason,skipped:false};\n    }\n    log(state,id,'会话失效','跳转登录页',reason+'；当前订单与已处理结果已保留');\n    return {kind:'login',message:reason+'，请输入练习账号和密码重新登录。'};\n  }\n  function openOrder(state,id){\n    ensureState(state);const o=find(state,id);if(!state.loggedIn)return expireSession(state,id,'登录已失效，本次查询未完成');state.activeOrderId=id;\n    o.stats.queries++;\n    if(o.fault.mode==='session'&&!o.stats.sessionTriggered){o.stats.sessionTriggered=true;return expireSession(state,id,'查询 '+id+' 时会话已过期，本次查询未完成');}\n    if(o.fault.mode==='queryOnce'&&o.stats.queries\u003c=o.fault.failCount){log(state,id,'查询详情','失败','临时查询错误，第 '+o.stats.queries+' 次');return {kind:'error',message:'查询服务暂时不可用，请稍后重新查询。',code:'QUERY_TEMPORARY'}}\n    let popup=false;if(o.fault.mode==='popup'&&!o.stats.popupTriggered){o.stats.popupTriggered=true;popup=true}\n    const delay=o.fault.mode==='slow'?o.fault.delay:0;\n    log(state,id,'查询详情',delay?'等待加载':'成功',delay?'详情将在 '+delay+' 秒后出现':'详情已返回');return {kind:'ready',delay,popup};\n  }\n  function submit(state,id){\n    const o=find(state,id);if(!state.loggedIn){log(state,id,'提交','需登录','本次未提交');return {kind:'login',message:'登录已失效，请先重新登录。'}}\n    if(['invalid','failed','skipped'].includes(o.status))return {kind:'error',message:'该订单已归档，请处理下一条订单或重置本轮。'};\n    o.stats.submits++;\n    if(amountOf(o)===null){log(state,id,'提交','数据校验失败','订单金额为空，没有写入业务结果');return {kind:'error',message:'订单金额为空。请记录数据异常并跳过本订单。',code:'AMOUNT_REQUIRED'}}\n    if(o.fault.mode==='submitAlways'||(o.fault.mode==='submitOnce'&&o.stats.submits\u003c=o.fault.failCount)){log(state,id,'提交','失败','第 '+o.stats.submits+' 次尝试失败，没有写入业务结果');return {kind:'error',message:'本次提交失败，业务状态未改变。',code:'SUBMIT_FAILED'}}\n    o.stats.commits++;o.status='done';\n    if(o.fault.mode==='receiptLost'&&o.stats.commits===1){o.stats.lost=true;o.stats.verified=false;log(state,id,'提交','已写入但回执丢失','业务已成功，页面未收到成功回执；重试前应核对状态');return {kind:'uncertain',message:'请求已发出，但未收到成功回执。请先查询处理结果，再决定是否重试。',code:'RECEIPT_LOST'}}\n    o.stats.verified=true;log(state,id,'提交',o.stats.commits>1?'重复写入':'成功','实际业务写入共 '+o.stats.commits+' 次');return {kind:'success',message:o.stats.commits>1?'重复提交已发生，本订单实际写入 '+o.stats.commits+' 次。':'订单提交成功。'};\n  }\n  function check(state,id){const o=find(state,id);if(!state.loggedIn)return {kind:'login',message:'登录已失效，暂时无法查询业务结果。'};o.stats.checks++;o.stats.verified=true;log(state,id,'查询处理结果','成功','业务状态 '+o.status+'，实际写入 '+o.stats.commits+' 次');return {kind:o.status==='done'?'success':'info',message:o.status==='done'?'已核实：订单已提交，实际写入 '+o.stats.commits+' 次。请勿重复提交。':'已核实：订单尚未提交。'};}\n  function mark(state,id,status,note){const o=find(state,id);if(!state.loggedIn)return {kind:'login',message:'请先重新登录。'};if(!['invalid','failed'].includes(status))return {kind:'error',message:'请使用相应的异常记录操作。'};if(!note.trim())return {kind:'error',message:'请填写异常原因，便于后续排查。'};if(o.stats.commits)return {kind:'error',message:'该订单已有成功写入，请先查询处理结果，不要标记为失败。'};if(status==='failed'&&!o.stats.submits)return {kind:'error',message:'该订单还没有提交尝试，请核对是否确实需要记录为处理失败。'};o.status=status;o.note=note.trim();log(state,id,'记录异常并跳过',status==='invalid'?'数据异常':'处理失败',o.note);return {kind:'success',message:'异常记录已保存，可以继续下一条订单。'}}\n  function login(state,username,password){\n    ensureState(state);state.session.attempts++;\n    if(String(username||'').trim()!==practiceAccount.username||password!==practiceAccount.password){log(state,null,'账号密码登录','失败','练习账号或密码不正确；未保存输入内容');return {kind:'error',message:'账号或密码不正确，请使用页面提供的练习账号。'}}\n    state.loggedIn=true;state.session.successes++;if(state.recovery?.stage==='login-required')state.recovery.stage='return-required .max(1,Math.min(5,Math.floor(Number(fault.failCount)||1)))};o.stats=blankStats();o.status='pending';o.note='';state.preset='custom';log(state,id,'老师修改故障','已应用',modes[o.fault.mode]+'；该订单运行结果已复位')}\n  function counts(state){return {done:state.orders.filter(o=>o.status==='done').length,invalid:state.orders.filter(o=>o.status==='invalid').length,failed:state.orders.filter(o=>o.status==='failed').length,skipped:state.orders.filter(o=>o.status==='skipped').length,pending:state.orders.filter(o=>o.status==='pending').length,duplicates:state.orders.reduce((n,o)=>n+Math.max(0,o.stats.commits-1),0),attempts:state.orders.reduce((n,o)=>n+o.stats.submits,0)}}\n  function assess(state){\n    const c=counts(state),checks=[{name:'没有重复写入',ok:c.duplicates===0,detail:'额外写入 '+c.duplicates+' 次'},{name:'全部订单已有最终结果',ok:c.pending===0,detail:'尚未处理 '+c.pending+' 条'}];\n    if(state.preset==='exam'){\n      const invalid=find(state,'XD1004'),failed=find(state,'XD1006'),lost=find(state,'XD1007');\n      const skippedSession=find(state,'XD1008').status==='skipped'&&!!find(state,'XD1008').note;\n      checks.push({name:skippedSession?'登录异常条已跳过，其余为 7 成功、1 数据异常、1 处理失败':'重试登录异常条，结果为 8 成功、1 数据异常、1 处理失败',ok:c.done===(skippedSession?7:8)&&c.invalid===1&&c.failed===1&&c.skipped===(skippedSession?1:0),detail:`当前 ${c.done} 成功 / ${c.invalid} 数据异常 / ${c.failed} 处理失败 / ${c.skipped} 跳过`},{name:'金额缺失订单被记录并跳过',ok:invalid.status==='invalid'&&!!invalid.note,detail:'XD1004 应有数据异常原因'},{name:'持续失败按本题要求尝试 3 次后记录失败',ok:failed.status==='failed'&&failed.stats.submits===3&&!!failed.note,detail:'XD1006 已尝试 '+failed.stats.submits+' 次，应为首次 1 次＋重试 2 次'},{name:'回执丢失后核对状态，未重复写入',ok:lost.status==='done'&&lost.stats.commits===1&&lost.stats.verified,detail:'XD1007 写入 '+lost.stats.commits+' 次，'+(lost.stats.verified?'已核实':'未核实')},{name:'已通过账号密码恢复登录',ok:state.loggedIn&&(state.session?.successes||0)>0,detail:state.loggedIn?'当前已登录，成功验证 '+(state.session?.successes||0)+' 次':'当前登录失效'},{name:'已处理遮挡弹窗',ok:find(state,'XD1009').stats.popupClosed,detail:'XD1009 的活动弹窗应关闭'});\n    }\n    if(state.preset==='login'){const current=find(state,'XD1003'),next=find(state,'XD1004');checks.push({name:'已使用账号密码重新登录并返回订单页',ok:state.loggedIn&&(state.session?.successes||0)>0&&state.recovery?.stage!=='return-required',detail:'应从登录页返回订单页，保留已有进度'},{name:'当前登录异常订单已记录跳过原因',ok:current.status==='skipped'&&!!current.note,detail:'XD1003 应跳过，实际写入应为 0'},{name:'下一条订单可以继续处理',ok:next.status==='done'&&next.stats.commits===1,detail:'XD1004 应成功且只写入 1 次'})}\n    return {checks,passed:checks.every(x=>x.ok),counts:c,exam:state.preset==='exam'};\n  }\n  function csvCell(value){return '\"'+String(value??'').replace(/\"/g,'\"\"')+'\"'}\n  function exportCSV(state){if(state.exportBlocked){log(state,null,'导出结果','模拟失败','老师开启了导出阻塞，未生成下载');return {kind:'error',message:'模拟导出失败：结果文件被占用。请保留页面进度，解除故障后重新导出。'}}state.exportRequests++;log(state,null,'导出结果','已生成下载','请到浏览器下载目录确认文件');const names={pending:'待处理',done:'已提交',invalid:'数据异常',failed:'处理失败',uncertain:'待核实',skipped:'已跳过'};const rows=[['订单号','商品','金额','业务状态','页面状态','查询次数','提交尝试次数','实际写入次数','异常原因'],...state.orders.map(o=>[o.id,o.product,amountOf(o),names[o.status],names[publicStatus(o)],o.stats.queries,o.stats.submits,o.stats.commits,o.note])];return {kind:'download',data:'\\uFEFF'+rows.map(r=>r.map(csvCell).join(',')).join('\\r\\n')}}\n  return {modes,practiceAccount,createState,ensureState,find,log,amountOf,publicStatus,nextPending,expireSession,openOrder,submit,check,mark,login,arriveOrders,skipRecoveryOrder,retryRecoveryOrder,closePopup,setFault,counts,assess,exportCSV};\n});\n\u003c/script>\n    \u003cscript>(function(root){\n  'use strict';\n  const E=root.FaultLabEngine,key='element-lab-order-fault-v1',esc=s=>String(s??'').replace(/[&\u003c>\"']/g,c=>({'&':'&amp;','\u003c':'&lt;','>':'&gt;','\"':'&quot;',\"'\":'&#39;'}[c]));\n  function read(){try{const state=JSON.parse(localStorage.getItem(key)||'null');if(state?.version===1&&state.orders?.length===10&&state.orders.every((o,i)=>o.id==='XD'+(10 ">\u003cspan class=\"login-eyebrow\">SESSION EXPIRED\u003c/span>\u003ch1>会话已失效，\u003cbr>先登录，再继续。\u003c/h1>\u003cp>当前操作页面已切换到登录页。原订单元素已移除，需要恢复登录后重新定位。\u003c/p>\u003cdiv class=\"login-context\">\u003csmall>中断的订单\u003c/small>\u003cstrong id=\"login-current-order\">${esc(current)}\u003c/strong>\u003cspan>已完成的订单、异常原因和尝试次数均保留。\u003c/span>\u003c/div>\u003c/div>\u003cp class=\"login-story-foot\">本机练习环境 · 不连接真实订单或真实账号\u003c/p>\u003c/section>\u003csection class=\"login-card\">\u003cdiv id=\"loginStage\">\u003cspan class=\"login-eyebrow\">ACCOUNT LOGIN\u003c/span>\u003ch2>登录练习账号\u003c/h2>\u003cp class=\"login-subtitle\">输入账号和密码后，再进入订单处理页面。\u003c/p>\u003cform id=\"loginForm\" autocomplete=\"off\">\u003clabel for=\"login-username\">账号\u003c/label>\u003cinput id=\"login-username\" name=\"username\" type=\"text\" placeholder=\"请输入练习账号\" autocomplete=\"off\" required>\u003clabel for=\"login-password\">密码\u003c/label>\u003cdiv class=\"login-password-wrap\">\u003cinput id=\"login-password\" name=\"password\" type=\"password\" placeholder=\"请输入练习密码\" autocomplete=\"off\" required>\u003cbutton type=\"button\" id=\"showPassword\" aria-label=\"显示密码\">显示\u003c/button>\u003c/div>\u003clabel class=\"login-auto\">\u003cinput id=\"login-auto-return\" type=\"checkbox\">登录成功后自动返回订单页\u003c/label>\u003cbutton class=\"primary login-submit\" type=\"submit\" id=\"login-submit\">登录\u003c/button>\u003cdiv id=\"loginFeedback\" class=\"login-feedback\" data-state=\"waiting\" role=\"status\" aria-live=\"polite\">请使用下方提供的本地练习账号。\u003c/div>\u003c/form>\u003cdetails class=\"practice-account\" open>\u003csummary>本地练习账号\u003c/summary>\u003cdiv>\u003cspan>账号\u003c/span>\u003ccode id=\"practice-username\">${esc(E.practiceAccount.username)}\u003c/code>\u003c/div>\u003cdiv>\u003cspan>密码\u003c/span>\u003ccode id=\"practice-password\">${esc(E.practiceAccount.password)}\u003c/code>\u003c/div>\u003cp>此处是公开的练习凭据。输入内容不会写入订单日志，勿使用个人账号密码。\u003c/p>\u003c/details>\u003c/div>\u003cdiv class=\"login-learning-note\">\u003cb>给
