idth:100%;padding:12px!important}.login-feedback{font-size:11px;line-height:1.9;color:#8d9d80;min-height:24px;margin-top:14px}.login-feedback[data-state=error]{background:#fff0e5;color:#ae663d;padding:10px;border-radius:5px}.login-feedback[data-state=success]{background:#eef5e5;color:#54794a;padding:12px;border-radius:5px}.practice-account{margin-top:22px;padding:14px;border:1px dashed #d4e0c8;background:#fafcf6;border-radius:7px}.practice-account summary{font-size:11px;color:#7a9267;cursor:pointer}.practice-account>div{display:flex;justify-content:space-between;margin-top:13px;gap:15px}.practice-account span{font-size:10px;color:#a1ad95}.practice-account code{font:12px var(--mono);color:#587c4c}.practice-account p{font-size:10px;line-height:1.8;color:#a0ad95;margin-bottom:0}.login-learning-note{border-top:1px solid #e5ecdd;margin-top:24px;padding-top:20px}.login-learning-note b{font-size:11px;font-weight:550;color:#7b9268}.login-learning-note p{font-size:10px;line-height:2;color:#97a789;margin-bottom:0}.login-success-icon{background:#e7f2de;color:#608747;display:grid;place-items:center;width:51px;height:51px;border-radius:50%;font:26px var(--mono);margin-bottom:24px}.return-orders{display:block;text-align:center;text-decoration:none;background:var(--green);color:white;border-radius:6px;font-size:13px;padding:13px 16px;margin-top:23px}.recovery-panel{border:1px solid #d5dfc7;background:#fff;border-radius:8px;padding:20px 22px;margin-bottom:24px}.recovery-head{display:flex;align-items:center;justify-content:space-between;gap:15px}.recovery-head h2{font-size:15px;color:#567744}.recovery-head small{font-size:11px;color:#96a386}.recovery-meta{display:flex;gap:28px;flex-wrap:wrap;margin:17px 0}.recovery-meta div{display:grid;gap:6px}.recovery-meta span{font-size:10px;color:#99a68b}.recovery-meta strong{font:13px var(--mono);color:#57744c}.recovery-panel p{font-size:11px;line-height:1.9;color:#869777}.recovery-panel label{display:block;color:#859776;font-size:11px;margin:13px 0 8px}.recovery-panel input{padding:10px 12px;border:1px solid #d7e2cc;border-radius:5px;min-width:280px;max-width:100%;font-size:11px;color:#547646}.recovery-panel .row{margin-top:14px}.recovery-feedback{font-size:11px;line-height:1.9;margin-top:13px;color:#71915b}.recovery-feedback.error{color:#ac683d}.recovery-target{outline:2px solid #ee5761;outline-offset:-2px}.badge.skipped{background:#f0eaf8;color:#8966a5}\n@media(max-width:800px){.login-shell{grid-template-columns:1fr;gap:22px;padding:25px;min-height:100vh}.login-story{padding:0}.login-story-main{padding:30px 0 10px}.login-story h1{font-size:31px;margin-bottom:15px}.login-story-main>p{max-width:none}.login-context{margin-top:18px}.login-story-foot{display:none}.login-card{padding:25px}.login-eyebrow{margin-bottom:12px}.recovery-head{display:block}.recovery-head small{display:block;margin-top:10px}.recovery-meta{gap:18px}.recovery-panel{padding:17px}.recovery-panel input{min-width:0;width:100%}}\n\u003c/style>\u003c/head>\n\u003cbody>\u003cheader class=\"app-header\">\u003ca class=\"brand\" href=\"#\">\u003cspan>⌘\u003c/span>\u003cdiv>订单故障练习场\u003csmall>ELEMENT LAB / RPA TRAINING\u003c/small>\u003c/div>\u003c/a>\u003cdiv class=\"header-actions\">\u003cspan class=\"local-tag\">● 本地模拟环境\u003c/span>\u003cspan id=\"sessionStatus\">\u003c/span>\u003cbutton id=\"loginButton\">账号登录\u003c/button>\u003cbutton id=\"toggleTeacher\" aria-expanded=\"true\">隐藏老师控制台\u003c/button>\u003c/div>\u003c/header>\n\u003cmain>\u003csection class=\"intro\">\u003cdiv>\u003cdiv class=\"eyebrow\">EXCEPTION HANDLING · PRACTICE LAB\u003c/div>\u003ch1>让故障发生，\u003cem>再让流程继续。\u003c/em>\u003c/h1>\u003cp>在这里捕获元素、查询订单、提交结果。老师控制故障，学员用影刀编写等待、判断与恢复流程。\u003c/p>\u003c/div>\u003cbutton class=\"outline\" id=\"showGuide\">怎么用这个网页 ↗\u003c/button>\u003c/section>\n\u003cdiv class=\"scenario-banner\">\u003cdiv>\u003cspan class=\"scenario-mark\">本轮任务\u003c/span>\u003cstrong id=\"scenarioTitle\">\u003c/strong>\u003cp id=\"scenarioSummary\">\u003c/p>\u003c/div>\u003cbutton id=\"resetRound\">重置本轮进度 ↺\u003c/button>\u003c/div>\n\u003csection id=\"recoveryPanel\" class=\"recovery-panel\" hidden>\u003c/section>\n\u003cdiv class=\"work-layout\">\u003cdiv class=\"business-column\">\u003csection class=\"stats\" id=\"stats\">\u003c/section>\n\u003csection class=\"panel order-panel\">\u003cdiv class=\"panel-head\">\u003cdiv>\u003ch2>订单管理\u003c/h2>\u003csmall>学员与机器人操作区域 · 10 条虚拟订单\u003c/small>\u003c/div>\u003cdiv class=\"row\">\u003cbutton id=\"refreshList\" data-action=\"refresh-list\">刷新列表\u003c/button>\u003cbutton class=\"primary\" id=\"exportResults\" data-action=\"export-results\">导出结果 CSV\u003c/button>\u003c/div>\u003c/div>\u003cdiv class=\"filter-bar\">\u003clabel>订单号\u003cinput type=\"search\" id=\"orderSearch\" placeholder=\"例如 XD1005\" autocomplete=\"off\">\u003c/label>\u003clabel>处理状态\u003cselect id=\"statusFilter\">\u003coption value=\"all\">全部状态\u003c/option>\u003coption value=\"pending\">待处理\u003c/option>\u003coption value=\"uncertain\">待核实\u003c/option>\u003coption value=\"done\">已提交\u003c/option>\u003coption value=\"invalid\">数据异常\u003c/option>\u003coption value=\"failed\">处理失败\u003c/option>\u003coption value=\"skipped\">已跳过\u003c/option>\u003c/select>\u003c/label>\u003cbutton id=\"clearFilters\">清空筛选\u003c/button>\u003c/div>\n\u003cdiv class=\"table-scroll\">\u003ctable id=\"ordersTable\">\u003cthead>\u003ctr>\u003cth>订单号\u003c/th>\u003cth>商品\u003c/th>\u003cth>金额\u003c/th>\u003cth>状态\u003c/th>\u003cth>操作\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody id=\"ordersBody\">\u003c/tbody>\u003c/table>\u003c/div>\u003cdiv id=\"businessNotice\" class=\"notice\" role=\"status\" aria-live=\"polite\">先查询 XD1005，尝试提交，再观察页面反馈。\u003c/div>\u003cdiv class=\"table-foot\">\u003cspan id=\"visibleCount\">\u003c/span>\u003cspan>提示：点击完成 ≠ 业务处理成功，请检查页面结果。\u003c/span>\u003c/div>\u003c/section>\n\u003csection class=\"panel evidence-panel\">\u003cdiv class=\"evidence-tabs\" role=\"tablist\">\u003cbutton role=\"tab\" id=\"eventsTab\" aria-selected=\"true\">运行日志\u003c/button>\u003cbutton role=\"tab\" id=\"assessmentTab\" aria-selected=\"false\">本轮验收\u003c/button>\u003cbutton role=\"tab\" id=\"instructionsTab\" aria-selected=\"false\">练习任务书\u003c/button>\u003c/div>\u003cdiv id=\"evidenceContent\">\u003c/div>\u003c/section>\n\u003c/div>\u003caside class=\"teacher-panel\" id=\"teacherPanel\">\u003cdiv class=\"teacher-title\">\u003cspan>☷\u003c/span>\u003cdiv>\u003ch2>老师控制台\u003c/h2>\u003csmall>设置可复现的故障，查看学员处理结果\u003c/small>\u003c/div>\u003c/div>\u003csection>\u003clabel for=\"presetSelect\">选择教学场景\u003c/label>\u003cselect id=\"presetSelect\">\u003coption value=\"normal\">01 正常流程 · 先跑通操作\u003c/option>\u003coption value=\"retry\" selected>02 初体验 · 提交先失败一次\u003c/option>\u003coption value=\"exam\">03 综合考核 · 10 条混合故障\u003c/option>\u003coption value=\"login\">04 登录恢复 · 跳过当前继续下一条\u003c/option>\u003c/select>\u003cbutton class=\"primary wide\" id=\"applyPreset\">应用场景并重新开始\u003c/button>\u003cp class=\"hint\">应用场景会重置全部虚拟订单、计数与日志。\u003c/p>\u003c/section>\u003csection>\u003ch3>给一条订单设置故障\u003c/h3>\u003clabel for=\"faultOrder\">目标订单\u003c/label>\u003cselect id=\"faultOrder\">\u003c/select>\u003clabel for=\"faultMode\">故障类型\u003c/label>\u003cselect id=\"faultMode\">\u003c/select>\u003cdiv class=\"two-fields\">\u003clabel>加载延迟 / 秒\u003cinput id=\"faultDelay\" type=\"number\" min=\"1\" max=\"15\" value=\"4\">\u003c/label>\u003clabel>前几次失败\u003cinput id=\"faultCount\" type=\"number\" min=\"1\" max=\"5\" value=\"1\">\u003c/label>\u003c/div>\u003cbutton class=\"wide\" id=\"applyFault\">仅应用到这条订单\u003c/button>\u003cp class=\"hint\" id=\"faultDescription\">\u003c/p>\u003c/section>\u003csection>\u003clabel class=\"check-label\">\u003cinput type=\"checkbox\" id=\"blockExport\">模拟导出阻塞\u003c/label>\u003cp class=\"hint\">这是页面内的导出失败模拟，不会锁定电脑上的真实文件。\u003c/p>\u003cdiv class=\"row\">\u003cbutton id=\"expireSession\">立即使登录失效\u003c/button>\u003cbutton id=\"exportLog\">下载日志 JSON\u003c/button>\u003c/div>\u003c/section>\u003csection class=\"teacher-tips\">\u003ch3>从这里开始教学\u003c/h3>\u003col>\u003cli>先在正常场景中跑通单条订单。\u003c/li>\u003cli>开启一种故障，运行原来的流程。\u003c/li>\u003cli>读取反馈，加入等待或恢复分支。\u003c/li>\u003cli>重置本轮，验证同样故障能被处理。\u003c/li>\u003cli>切换综合考核，用结果表和日志验收。\u003c/li>\u003c/ol>\u003c/section>\u003c/aside>\u003c/div>\n\u003cfooter>\u003cspan>只使用虚拟订单 · 数据保存在当前浏览器\u003c/span>\u003cspan>异常处理练习 / 可重复复位\u003c/span>\u003c/footer>\u003c/main>\n\u003cdiv class=\"modal-backdrop\" id=\"detailBackdrop\" hidden>\u003csection class=\"detail-modal\" role=\"dialog\" aria-modal=\"true\" aria-labelledby=\"detailTitle\">\u003cdiv class=\"modal-head\">\u003cdiv>\u003csmall>订单详情\u003c/small>\u003ch2 id=\"detailTitle\">查询订单\u003c/h2>\u003c/div>\u003cbutton id=\"closeDetail\" aria-label=\"关闭订单详情\">✕\u003c/button>\u003c/div>\u003cdiv id=\"detailContent\">\u003c/div>\u003c/section>\u003c/div>\n\u003cdiv class=\"popup-backdrop\" id=\"popupBackdrop\" hidden>\u003csection role=\"dialog\" aria-modal=\"true\" aria-labelledby=\"popupTitle\">\u003cdiv class=\"popup-icon\">!\u003c/div>\u003ch2 id=\"popupTitle\">练习公告\u003c/h2>\u003cp>这是一层会遮挡订单按钮的模拟弹窗。关闭后才能继续操作订单。\u003c/p>\u003cbutton class=\"primary\" id=\"dismissPopup\" data-action=\"dismiss-popup\">我知道了，关闭弹窗\u003c/button>\u003c/section>\u003c/div>\n\u003cdiv class=\"modal-backdrop\" id=\"guideBackdrop\" hidden>\u003csection class=\"guide-modal\" role=\"dialog\" aria-modal=\"true\" aria-labelledby=\"guideTitle\">\u003cdiv class=\"modal-head\">\u003ch2 id=\"guideTitle\">这个网页有什么用？\u003c/h2>\u003cbutton id=\"closeGuide\" aria-label=\"关闭使用说明\">✕\u003c/button>\u003c/div>\u003cdiv class=\"guide-body\">\u003cp class=\"lead\">它是影刀流程的练习对象，也是老师控制故障的工具。\u003c/p>\u003cdiv class=\"guide-grid\">\u003cdiv>\u003cb>① 学员操作\u003c/b>\u003cp>在影刀里捕获查询、提交、结果提示和订单状态，搭建自己的流程。\u003c/p>\u003c/div>\u003cdiv>\u003cb>② 老师制造故障\u003c/b>\u003cp>让指定订单查询失败、加载变慢、提交失败或丢失回执，每次都能复现。\u003c/p>\u003c/div>\u003cdiv>\u003cb>③ 修改并验证\u003c/b>\u003cp>学员加入状态判断、有限重试、单条跳过、登录恢复和防重复提交。\u003c/p>\u003c/div>\u003cdiv>\u003cb>④ 用结果验收\u003c/b>\u003cp>检查实际写入次数、失败原因、尝试次数及是否还有遗漏的订单。\u003c/p>\u003c/div>\u003c/div>\u003cdiv class=\"guide-note\">\u003cstrong>页面报错与指令异常要区分。\u003c/strong>\u003cp>页面显示“提交失败”时，点击指令可能已经执行成功。应读取业务反馈并判断；等待某个目标出现并超时、操作被遮挡等情况，则可能使自动化指令失败。网页不会直接替影刀抛出异常。\u003c/p>\u003c/div>\u003ch3>登录失效专项练习\u003c/h3>\u003cp>选择“04 登录恢复”场景，先处理 XD1001、XD1002，再查询 XD1003。页面会跳转到登录页；练习账号 rpa_student，密码 Rpa@2026。登录后进入订单页，记录 XD1003 跳过原因，再查找 XD1004。也可选择重试当前条，两个分支不会混记。\u003c/p>\u003ch3>建议先体验一次\u003c/h3>\u003cp>使用默认场景，查询 XD1005 → 第一次提交失败 → 第二次提交成功 → 在运行日志中核对两次尝试、一次实际写入。随后用影刀实现同样的判断。\u003c/p>\u003ch3>本地文件与影刀实操\u003c/h3>\u003cp>可直接用浏览器打开此单文件。若浏览器扩展无法捕获 file 页面，使用同文件夹中的“启动本地练习场.cmd”，再访问本机 HTTP 地址。只在本机提供虚拟练习数据。\u003c/p>\u003c/div>\u003c/section>\u003c/div>\n\u003cscript>(function(root,factory){if(typeof module==='object'&&module.exports)module.exports=factory();else root.FaultLabEngine=factory()})(typeof globalThis!=='undefined'?globalThis:this,function(){\n  'use strict';\n  const modes={normal:'正常',slow:'详情加载慢',queryOnce:'查询前几次失败',missing:'金额缺失',submitOnce:'提交前几次失败',submitAlways:'提交持续失败',receiptLost:'提交成功但回执丢失',session:'登录失效一次',popup:'弹窗遮挡一次'};\n  const items=['商务笔记本','无线鼠标','桌面收纳盒','便携充电器','办公键盘','文件收纳袋','显示器支架','保温杯','台灯','数据线'];\n  const config=mode=>({mode,delay:4,failCount:1});\n  const practiceAccount={username:'rpa_student',password:'Rpa@2026'};\n  function blankStats(){return {queries:0,submits:0,commits:0,checks:0,sessionTriggered:false,popupTriggered:false,popupClosed:false,lost:false,verified:false}}\n  function createState(preset='retry'){\n    const orders=items.map((product,i)=>({id:'XD'+(1001+i),product,amount:[129,89,45,159,199,39,269,79,139,29][i],status:'pending',note:'',fault:config('normal'),stats:blankStats()}));\n    if(preset==='retry')orders[4].fault=config('submitOnce');\n    if(preset==='login')orders[2].fault=config('session');\n    if(preset==='exam'){\n      ['normal','slow','queryOnce','missing','submitOnce','submitAlways','receiptLost','session','popup','normal'].forEach((mode,i)=>orders[i].fault=config(mode));\n    }\n    return {version:1,preset,orders,loggedIn:true,exportBlocked:false,events:[],seq:0,exportRequests:0,recovery:null,session:{attempts:0,successes:0},activeOrderId:null};\n  }\n  function ensureState(state){if(!state.session)state.session={attempts:0,successes:0};if(!('recovery' in state))state.recovery=null;if(!('activeOrderId' in state))state.activeOrderId=null;return state}\n  function find(state,id){const order=state.orders.find(o=>o.id===id);if(!order)throw Error('订单不存在');return order}\n  function log(state,id,action,result,message){state.events.unshift({seq:++state.seq,time:new Date().toISOString(),order:id||'系统',action,result,message});state.events=state.events.slice(0,300)}\n  function amountOf(order){return order.fault.mode==='missing'?null:order.amount}\n  function publicStatus(order){return order.stats.lost&&!order.stats.verified&&order.status==='done'?'uncertain':order.status}\n  function nextPending(state,afterId){const index=state.orders.findIndex(o=>o.id===afterId);return state.orders.slice(index+1).find(o=>o.status==='pending')?.id||null}\n  function expireSession(state,id,reason='登录已失效'){\n    ensureState(state);state.loggedIn=false;\n    if(!state.recovery||['complete','skipped','retry-current'].includes(state.recovery.stage)){\n      const current=id||state.activeOrderId||null;\n      state.recovery={orderId:current,nextOrderId:nextPending(state,current),stage:'login-required',reason,skipped:false};\n    }\n    log(state,id,'会话失效','跳转登录页',reason+'；当前订单与已处理结果已保留');\n    return {kind:'login',message:reason+'，请输入练习账号和密码重新登录。'};\n  }\n  function openOrder(state,id){\n    ensureState(state);const o=find(state,id);if(!state.loggedIn)return expireSession(state,id,'登录已失效，本次查询未完成');state.activeOrderId=id;\n    o.stats.queries++;\n    if(o.fault.mode==='session'&&!o.stats.sessionTriggered){o.stats.sessionTriggered=true;return expireSession(state,id,'查询 '+id+' 时会话已过期，本次查询未完成');}\n    if(o.fault.mode==='queryOnce'&&o.stats.queries\u003c=o.fault.failCount){log(state,id,'查询详情','失败','临时查询错误，第 '+o.stats.queries+' 次');return {kind:'error',message:'查询服务暂时不可用，请稍后重新查询。',code:'QUERY_TEMPORARY'}}\n    let popup=false;if(o.fault.mode==='popup'&&!o.stats.popupTriggered){o.stats.popupTriggered=true;popup=true}\n    const delay=o.fault.mode==='slow'?o.fault.delay:0;\n    log(state,id,'查询详情',delay?'等待加载':'成功',delay?'详情将在 '+delay+' 秒后出现':'详情已返回');return {kind:'ready',delay,popup};\n  }\n  function submit(state,id){\n    const o=find(state,id);if(!state.loggedIn){log(state,id,'提交','需登录','本次未提交');return {kind:'login',message:'登录已失效，请先重新登录。'}}\n    if(['invalid','failed','skipped'].includes(o.status))return {kind:'error',message:'该订单已归档，请处理下一条订单或重置本轮。'};\n    o.stats.submits++;\n    if(amountOf(o)===null){log(state,id,'提交','数据校验失败','订单金额为空，没有写入业务结果');return {kind:'error',message:'订单金额为空。请记录数据异常并跳过本订单。',code:'AMOUNT_REQUIRED'}}\n    if(o.fault.mode==='submitAlways'||(o.fault.mode==='submitOnce'&&o.stats.submits\u003c=o.fault.failCount)){log(state,id,'提交','失败','第 '+o.stats.submits+' 次尝试失败，没有写入业务结果');return {kind:'error',message:'本次提交失败，业务状态未改变。',code:'SUBMIT_FAILED'}}\n    o.stats.commits++;o.status='done';\n    if(o.fault.mode==='receiptLost'&&o.stats.commits===1){o.stats.lost=true;o.stats.verified=false;log(state,id,'提交','已写入但回执丢失','业务已成功，页面未收到成功回执；重试前应核对状态');return {kind:'uncertain',message:'请求已发出，但未收到成功回执。请先查询处理结果，再决定是否重试。',code:'RECEIPT_LOST'}}\n    o.stats.verified=true;log(state,id,'提交',o.stats.commits>1?'重复写入':'成功','实际业务写入共 '+o.stats.commits+' 次');return {kind:'success',message:o.stats.commits>1?'重复提交已发生，本订单实际写入 '+o.stats.commits+' 次。':'订单提交成功。'};\n  }\n  function check(state,id){const o=find(state,id);if(!state.loggedIn)return {kind:'login',message:'登录已失效，暂时无法查询业务结果。'};o.stats.checks++;o.stats.verified=true;log(state,id,'查询处理结果','成功','业务状态 '+o.status+'，实际写入 '+o.stats.commits+' 次');return {kind:o.status==='done'?'success':'info',message:o.status==='done'?'已核实：订单已提交，实际写入 '+o.stats.commits+' 次。请勿重复提交。':'已核实：订单尚未提交。'};}\n  function mark(state,id,status,note){const o=find(state,id);if(!state.loggedIn)return {kind:'login',message:'请先重新登录。'};if(!['invalid','failed'].includes(status))return {kind:'error',message:'请使用相应的异常记录操作。'};if(!note.trim())return {kind:'error',message:'请填写异常原因，便于后续排查。'};if(o.stats.commits)return {kind:'error',message:'该订单已有成功写入，请先查询处理结果，不要标记为失败。'};if(status==='failed'&&!o.stats.submits)return {kind:'error',message:'该订单还没有提交尝试，请核对是否确实需要记录为处理失败。'};o.status=status;o.note=note.trim();log(state,id,'记录异常并跳过',status==='invalid'?'数据异常':'处理失败',o.note);return {kind:'success',message:'异常记录已保存，可以继续下一条订单。'}}\n  function login(state,username,password){\n    ensureState(state);state.session.attempts++;\n    if(String(username||'').trim()!==practiceAccount.username||password!==practiceAccount.password){log(state,null,'账号密码登录','失败','练习账号或密码不正确；未保存输入内容');return {kind:'error',message:'账号或密码不正确，请使用页面提供的练习账号。'}}\n    state.loggedIn=true;state.session.successes++;if(state.recovery?.stage==='login-required')state.recovery.stage='return-required';log(state,null,'账号密码登录','成功','练习账号验证通过；已有订单结果与异常记录保留');return {kind:'success',message:'登录成功。请返回订单处理页面，处理恢复位置。'};\n  }\n  function arriveOrders(state){ensureState(state);if(state.loggedIn&&state.recovery?.stage==='return-required'){state.recovery.stage='decision-required';log(state,state.recovery.orderId,'返回订单页','成功','等待选择重试当前条或记录跳过后继续下一条')}}\n  function skipRecoveryOrder(state,note){\n    ensureState(state);if(!state.loggedIn)return {kind:'login',message:'请先完成账号密码登录。'};const r=state.recovery;if(!r?.orderId)return {kind:'error',message:'没有需要恢复处理的当前订单。'};const o=find(state,r.orderId);\n    if(o.stats.commits>0||o.status==='done')return {kind:'error',message:'该订单已有业务写入，不能忽略。请先核对结果，避免遗漏或重复。'};\n    if(o.status!=='pending')return {kind:'error',message:'当前订单已经归档，请直接查找下一条待处理订单。'};\n    if(!String(note||'').trim())return {kind:'error',message:'先填写跳过原因，再记录异常。'};\n    o.status='skipped';o.note=String(note).trim();r.skipped=true;r.stage='skipped';r.nextOrderId=nextPending(state,o.id);log(state,o.id,'登录恢复后忽略当前条','已跳过',o.note+'；下一条 '+(r.nextOrderId||'无'));\n    return {kind:'success',message:o.id+' 已记录为跳过。'+(r.nextOrderId?'下一条待处理订单为 '+r.nextOrderId+'。':'后面没有待处理订单。'),nextOrderId:r.nextOrderId};\n  }\n  function retryRecoveryOrder(state){ensureState(state);if(!state.loggedIn)return {kind:'login',message:'请先登录。'};const r=state.recovery;if(!r?.orderId)return {kind:'error',message:'没有可重试的当前订单。'};const o=find(state,r.orderId);if(o.status!=='pending'||o.stats.commits>0)return {kind:'error',message:'当前订单已有处理结果，请核对后再继续。'};r.stage='retry-current';r.nextOrderId=o.id;log(state,o.id,'登录恢复后重试当前条','待查询','未修改订单结果，请重新查找并处理当前订单');return {kind:'success',message:'保留 '+o.id+' 为待处理，请重新查询这一条。',nextOrderId:o.id}}\n  function closePopup(state,id){find(state,id).stats.popupClosed=true;log(state,id,'关闭遮挡弹窗','成功','详情操作区域已恢复')}\n  function setFault(state,id,fault){const o=find(state,id);o.fault={mode:modes[fault.mode]?fault.mode:'normal',delay:Math.max(1,Math.min(15,Number(fault.delay)||4)),failCount:Math.max(1,Math.min(5,Math.floor(Number(fault.failCount)||1)))};o.stats=blankStats();o.status='pending';o.note='';state.preset='custom';log(state,id,'老师修改故障','已应用',modes[o.fault.mode]+'；该订单运行结果已复位')}\n  function counts(state){return {done:state.orders.filter(o=>o.status==='done').length,invalid:state.orders.filter(o=>o.status==='invalid').length,failed:state.orders.filter(o=>o.status==='failed').length,skipped:state.orders.filter(o=>o.status==='skipped').length,pending:state.orders.filter(o=>o.status==='pending').length,duplicates:state.orders.reduce((n,o)=>n+Math.max(0,o.stats.commits-1),0),attempts:state.orders.reduce((n,o)=>n+o.stats.submits,0)}}\n  function assess(state){\n    const c=counts(state),checks=[{name:'没有重复写入',ok:c.duplicates===0,detail:'额外写入 '+c.duplicates+' 次'},{name:'全部订单已有最终结果',ok:c.pending===0,detail:'尚未处理 '+c.pending+' 条'}];\n    if(state.preset==='exam'){\n      const invalid=find(state,'XD1004'),failed=find(state,'XD1006'),lost=find(state,'XD1007');\n      const skippedSession=find(state,'XD1008').status==='skipped'&&!!find(state,'XD1008').note;\n      checks.push({name:skippedSession?'登录异常条已跳过，其余为 7 成功、1 数据异常、1 处理失败':'重试登录异常条，结果为 8 成功、1 数据异常、1 处理失败',ok:c.done===(skippedSession?7:8)&&c.invalid===1&&c.failed===1&&c.skipped===(skippedSession?1:0),detail:`当前 ${c.done} 成功 / ${c.invalid} 数据异常 / ${c.failed} 处理失败 / ${c.skipped} 跳过`},{name:'金额缺失订单被记录并跳过',ok:invalid.status==='invalid'&&!!invalid.note,detail:'XD1004 应有数据异常原因'},{name:'持续失败按本题要求尝试 3 次后记录失败',ok:failed.status==='failed'&&failed.stats.submits===3&&!!failed.note,detail:'XD1006 已尝试 '+failed.stats.submits+' 次，应为首次 1 次＋重试 2 次'},{name:'回执丢失后核对状态，未重复写入',ok:lost.status==='done'&&lost.stats.commits===1&&lost.stats.verified,detail:'XD1007 写入 '+lost.stats.commits+' 次，'+(lost.stats.verified?'已核实':'未核实')},{name:'已通过账号密码恢复登录',ok:state.loggedIn&&(state.session?.successes||0)>0,detail:state.loggedIn?'当前已登录，成功验证 '+(state.session?.successes||0)+' 次':'当前登录失效'},{name:'已处理遮挡弹窗',ok:find(state,'XD1009').stats.popupClosed,detail:'XD1009 的活动弹窗应关闭'});\n    }\n    if(state.preset==='login'){const current=find(state,'XD1003'),next=find(state,'XD1004');checks.push({name:'已使用账号密码重新登录并返回订单页',ok:state.loggedIn&&(state.session?.successes||0)>0&&state.recovery?.stage!=='return-required',detail:'应从登录页返回订单页，保留已有进度'},{name:'当前登录异常订单已记录跳过原因',ok:current.status==='skipped'&&!!current.note,detail:'XD1003 应跳过，实际写入应为 0'},{name:'下一条订单可以继续处理',ok:next.status==='done'&&next.stats.commits===1,detail:'XD1004 应成功且只写入 1 次'})}\n    return {checks,passed:checks.every(x=>x.ok),counts:c,exam:state.preset==='exam'};\n  }\n  function csvCell(value){return '\"'+String(value??'').replace(/\"/g,'\"\"')+'\"'}\n  function exportCSV(state){if(state.exportBlocked){log(state,null,'导出结果','模拟失败','老师开启了导出阻塞，未生成下载');return {kind:'error',message:'模拟导出失败：结果文件被占用。请保留页面进度，解除故障后重新导出。'}}state.exportRequests++;log(state,null,'导出结果','已生成下载','请到浏览器下载目录确认文件');const names={pending:'待处理',done:'已提交',invalid:'数据异常',failed:'处理失败',uncertain:'待核实',skipped:'已跳过'};const rows=[['订单号','商品','金额','业务状态','页面状态','查询次数','提交尝试次数','实际写入次数','异常原因'],...state.orders.map(o=>[o.id,o.product,amountOf(o),names[o.status],names[publicStatus(o)],o.stats.queries,o.stats.submits,o.stats.commits,o.note])];return {kind:'download',data:'\\uFEFF'+rows.map(r=>r.map(csvCell).join(',')).join('\\r\\n')}}\n  return {modes,practiceAccount,createState,ensureState,find,log,amountOf,publicStatus,nextPending,expireSession,openOrder,submit,check,mark,login,arriveOrders,skipRecoveryOrder,retryRecoveryOrder,closePopup,setFault,counts,assess,exportCSV};\n});\n\u003c/script>\u003cscript>(function(root){\n  'use strict';\n  const E=root.FaultLabEngine,key='element-lab-order-fault-v1',esc=s=>String(s??'').replace(/[&\u003c>\"']/g,c=>({'&':'&amp;','\u003c':'&lt;','>':'&gt;','\"':'&quot;',\"'\":'&#39;'}[c]));\n  function read(){try{const state=JSON.parse(localStorage.getItem(key)||'null');if(state?.version===1&&state.orders?.length===10&&state.orders.every((o,i)=>o.id==='XD'+(1001+i)&&o.stats&&E.modes[o.fault?.mode])&&Array.isArray(state.events))return E.ensureState(state)}catch{}return E.createState('login')}\n  function write(state){try{localStorage.setItem(key,JSON.stringify(state));return true}catch{return false}}\n  function isLoginView(){return document.body.dataset.page==='login'||location.hash==='#login'}\n  function standaloneFile(){return location.protocol==='file:'&&document.body.dataset.page!=='login'}\n  function loginURL(){return 'login.html'}\n  function ordersURL(){return 'orders.html'}\n  function navigationFailure(){const existing=document.getElementById('businessNotice');if(existing){existing.textContent='浏览器不允许保存本地状态，无法安全跳转并保留进度。请使用本地启动器打开 HTTP 页面后重试。';existing.className='notice error'}else document.body.innerHTML='\u003cmain>\u003ch1>无法保存练习进度\u003c/h1>\u003cp>请使用同文件夹中的本地启动器，再进行登录练习。\u003c/p>\u003c/main>'}\n  function goToLogin(state,id,reason){if(state.loggedIn||!state.recovery)E.expireSession(sta canDecide=current?.status==='pending'&&current.stats.commits===0;\n    const requiresDecision=(r.stage==='decision-required'||r.stage==='return-required')&&canDecide;\n    panel.hidden=false;panel.innerHTML=`\u003cdiv class=\"recovery-head\">\u003ch2>登录已恢复 · 请选择异常后的处理位置\u003c/h2>\u003csmall>已完成订单和操作计数保持不变\u003c/small>\u003c/div>\u003cdiv class=\"recovery-meta\">\u003cdiv>\u003cspan>中断订单\u003c/span>\u003cstrong id=\"resume-current-order\">${esc(r.orderId||'无')}\u003c/strong>\u003c/div>\u003cdiv>\u003cspan>当前条状态\u003c/span>\u003cstrong id=\"resume-current-status\">${current?labels[E.publicStatus(current)]:'未指定'}\u003c/strong>\u003c/div>\u003cdiv>\u003cspan>${needsVerification?'需核实的当前订单':retrying?'重新处理目标':'下一条待处理订单'}\u003c/span>\u003cstrong id=\"resume-next-order\" data-order=\"${target||''}\">${target||'后面没有待处理订单'}\u003c/strong>\u003c/div>\u003c/div>\u003cp>忽略当前异常时，请先留下原因并记录为跳过，再定位下一条。页面不会替影刀自动查询或提交下一条订单。\u003c/p>\u003clabel for=\"recovery-note\">跳过当前条的原因\u003c/label>\u003cinput id=\"recovery-note\" type=\"text\" value=\"${esc(current?.note||'')}\" placeholder=\"例如：登录失效，本次忽略该条，恢复后继续下一条\">\u003cdiv class=\"row\">\u003cbutton class=\"primary\" id=\"skip-current-order\" data-action=\"skip-recovery-order\" ${canDecide?'':'disabled'}>记录当前条跳过\u003c/button>\u003cbutton id=\"retry-current-order\" ${canDecide?'':'disabled'}>保留当前条，重新处理\u003c/button>\u003cbutton id=\"find-next-order\" data-action=\"find-next-order\" ${!target||requiresDecision?'disabled':''}>${needsVerification?'查找当前订单并核实':retrying?'重新查找当前订单':'查找下一条待处理订单'}\u003c/button>\u003c/div>\u003cdiv id=\"recoveryFeedback\" class=\"recovery-feedback\" role=\"status\">${current?.status==='skipped'?'当前条已记录为跳过，原因保留在结果表与日志中。':requiresDecision?'先选择记录跳过或重新处理；不自动忽略未完成订单。':retrying?'当前条仍待处理，可以重新查询。':'可查找下一个未完成订单。'}\u003c/div>`;\n    const feedback=result=>{const el=$('#recoveryFeedback');el.textContent=result.message;el.classList.toggle('error',result.kind!=='success')};\n    $('#skip-current-order').onclick=()=>{const result=E.skipRecoveryOrder(state,$('#recovery-note').value);sync();feedback(result)};\n    $('#retry-current-order').onclick=()=>{const result=E.retryRecoveryOrder(state);sync();feedback(result)};\n    $('#find-next-order').onclick=()=>{\n      const currentOrder=r.orderId?E.find(state,r.orderId):null;\n      const verify=currentOrder?.status==='done'&&!currentOrder.stats.verified;const next=(r.stage==='retry-current'&&currentOrder?.status==='pending')||verify?r.orderId:E.nextPending(state,r.orderId);\n      if(!next){feedback({kind:'error',message:'后面没有待处理订单。可清空筛选检查此前是否有遗漏。'});return}\n      $('#orderSearch').value=next;$('#statusFilter').value='all';E.log(state,next,'查找恢复目标','已定位','从 '+(r.orderId||'起始位置')+' 继续，目标 '+next);save();renderRows();renderEvidence();const row=$(`[data-order-id=\"${next}\"]`);row?.classList.add('recovery-target');row?.scrollIntoView({behavior:'smooth',block:'center'});notice('已定位 '+next+'。请由学员或影刀点击查询并继续处理。');\n    };\n  }\n  function sync(){save();renderRows();renderRecovery();renderEvidence()}\n  function detailResult(result){if(result.kind==='login'){S.goToLogin(state,activeId,result.message);return}const el=$('#operation-status');if(!el)return;el.textContent=result.message;el.dataset.state=result.kind;el.dataset.errorCode=result.code||'';const o=E.find(state,activeId);const button=$('#submit-order');if(button)button.disabled=busy||(o.status==='done'&&o.stats.verified)||['invalid','failed','skipped'].includes(o.status);}\n  function detailForm(id){\n    const o=E.find(state,id),amount=E.amountOf(o);$('#detailContent').innerHTML=`\u003cdiv class=\"detail-grid\">\u003cdiv>\u003csmall>订单号\u003c/small>\u003cstrong id=\"order-id\">${o.id}\u003c/strong>\u003c/div>\u003cdiv>\u003csmall>商品\u003c/small>\u003cstrong id=\"order-product\">${o.product}\u003c/strong>\u003c/div>\u003cdiv>\u003csmall>订单金额\u003c/small>\u003cstrong class=\"amount ${amount===null?'missing-amount':''}\" id=\"order-amount\" data-value=\"${amount??''}\">${amount===null?'—':amount.toFixed(2)}\u003c/strong>\u003c/div>\u003cdiv>\u003csmall>已核对的页面状态\u003c/small>\u003cstrong id=\"order-business-status\">${labels[E.publicStatus(o)]}\u003c/strong>\u003c/div>\u003c/div>\u003cdiv id=\"operation-status\" class=\"operation-status\" data-state=\"ready\" data-error-code=\"\" role=\"status\" aria-live=\"polite\">详情已加载。请先校验数据，再提交订单。\u003c/div>\u003cdiv class=\"detail-actions\">\u003cbutton id=\"submit-order\" data-action=\"submit\" data-order=\"${id}\" class=\"primary\">提交订单\u003c/button>\u003cbutton id=\"check-order-result\" data-action=\"check-result\" data-order=\"${id}\">查询处理结果\u003c/button>\u003c/div>\u003cdiv class=\"record-exception\">\u003clabel for=\"exception-note\">需要跳过时，请记录原因\u003c/label>\u003ctextarea id=\"exception-note\" placeholder=\"例如：金额为空 / 已尝试 3 次仍提交失败\">\u003c/textarea>\u003cdiv class=\"row\">\u003cbutton id=\"mark-invalid\" data-action=\"mark-invalid\">记录数据异常并跳过\u003c/button>\u003cbutton id=\"mark-failed\" data-action=\"mark-failed\">记录处理失败并跳过\u003c/button>\u003c/div>\u003c/div>\u003cp class=\"detail-caption\">这是虚拟订单。列表结果与业务实际写入会保留在当前浏览器，刷新页面不会自动重置进度。\u003c/p>`;\n    $('#submit-order').disabled=(o.status==='done'&&o.stats.verified)||['invalid','failed','skipped'].includes(o.status);\n    $('#submit-order').onclick=async()=>{\n      if(busy)return;busy=true;const generation=epoch;const clickToken=token;$('#submit-order').disabled=true;detailResult({kind:'info',message:'提交请求处理中，请等待页面反馈……'});\n      await new Promise(resolve=>setTimeout(resolve,350));if(generation!==epoch)return;const result=E.submit(state,id);busy=false;sync();\n      if(activeId===id&&token===clickToken){detailResult(result);$('#order-business-status').textContent=labels[E.publicStatus(o)]}else notice('上一笔订单 '+id+' 的请求已有结果，请查询列表核实。');\n    };\n    $('#check-order-result').onclick=()=>{if(busy)return;const result=E.check(state,id);sync();detailResult(result);$('#order-business-status').textContent=labels[E.publicStatus(o)]};\n    const mark=status=>{if(busy)return;const result=E.mark(state,id,status,$('#exception-note').value);sync();detailResult(result);$('#order-business-status').textContent=labels[E.publicStatus(o)]};$('#mark-invalid').onclick=()=>mark('invalid');$('#mark-failed').onclick=()=>mark('failed');\n  }\n  function loginDetail(message){S.goToLogin(state,activeId,message)}\n  function openDetail(id){\n    if(busy){notice('还有一笔提交请求处理中，请等待它返回结果。','uncertain');return}\n    lastFocus=document.activeElement;activeId=id;const thisToken=++token;$('#detailTitle').textContent=id;$('#detailBackdrop').hidden=false;$('#closeDetail').focus();\n    const result=E.openOrder(state,id);sync();\n    if(result.kind==='login'){loginDetail(result.message);return}\n    if(result.kind==='error'){$('#detailContent').innerHTML=`\u003cdiv class=\"query-error\" id=\"query-status\" data-state=\"error\" data-error-code=\"${result.code}\" role=\"status\">${esc(result.message)}\u003c/div>\u003cbutton id=\"retry-detail\">重新查询本订单\u003c/button>\u003cp class=\"hint\">本次只返回错误提示，提交按钮尚未出现。请为查询设置恢复策略。\u003c/p>`;$('#retry-detail').onclick=()=>openDetail(id);return}\n    const ready=()=>{if(thisToken!==token||activeId!==id)return;detailForm(id);if(result.delay){E.log(state,id,'详情加载','已就绪','提交按钮现在出现在 DOM 中');sync()}if(result.popup){$('#popupBackdrop').hidden=false;$('#dismissPopup').focus()}};\n    if(result.delay){$('#detailContent').innerHTML=`\u003cdiv class=\"loading-state\" id=\"detail-loading\" role=\"status\">\u003cdiv class=\"spinner\">\u003c/div>详情正在加载，预计 ${result.delay} 秒……\u003cp class=\"hint\">目标提交按钮此时还没有出现在 DOM 中。\u003c/p>\u003c/div>`;setTimeout(ready,result.delay*1000)}else ready();\n  }\n  function closeDetail(){if(!$('#popupBackdrop').hidden)return;$('#detailBackdrop').hidden=true;activeId=null;token++;if(lastFocus?.isConnected)lastFocus.focus()}\n  function dismissPopup(){if(!activeId)return;E.closePopup(state,activeId);$('#popupBackdrop').hidden=true;sync();$('#submit-order')?.focus()}\n  function reset(preset,keepConfig=false){const config=keepConf 1px;border-radius:50%;font:26px var(--mono);margin-bottom:24px}.return-orders{display:block;text-align:center;text-decoration:none;background:var(--green);color:white;border-radius:6px;font-size:13px;padding:13px 16px;margin-top:23px}.recovery-panel{border:1px solid #d5dfc7;background:#fff;border-radius:8px;padding:20px 22px;margin-bottom:24px}.recovery-head{display:flex;align-items:center;justify-content:space-between;gap:15px}.recovery-head h2{font-size:15px;color:#567744}.recovery-head small{font-size:11px;color:#96a386}.recovery-meta{display:flex;gap:28px;flex-wrap:wrap;margin:17px 0}.recovery-meta div{display:grid;gap:6px}.recovery-meta span{font-size:10px;color:#99a68b}.recovery-meta strong{font:13px var(--mono);color:#57744c}.recovery-panel p{font-size:11px;line-height:1.9;color:#869777}.recovery-panel label{display:block;color:#859776;font-size:11px;margin:13px 0 8px}.recovery-panel input{padding:10px 12px;border:1px solid #d7e2cc;border-radius:5px;min-width:280px;max-width:100%;font-size:11px;color:#547646}.recovery-panel .row{margin-top:14px}.recovery-feedback{font-size:11px;line-height:1.9;margin-top:13px;color:#71915b}.recovery-feedback.error{color:#ac683d}.recovery-target{outline:2px solid #ee5761;outline-offset:-2px}.badge.skipped{background:#f0eaf8;color:#8966a5}\n@media(max-width:800px){.login-shell{grid-template-columns:1fr;gap:22px;padding:25px;min-height:100vh}.login-story{padding:0}.login-story-main{padding:30px 0 10px}.login-story h1{font-size:31px;margin-bottom:15px}.login-story-main>p{max-width:none}.login-context{margin-top:18px}.login-story-foot{display:none}.login-card{padding:25px}.login-eyebrow{margin-bottom:12px}.recovery-head{display:block}.recovery-head small{display:block;margin-top:10px}.recovery-meta{gap:18px}.recovery-panel{padding:17px}.recovery-panel input{min-width:0;width:100%}}\n\u003c/style>\u003c/head>\n\u003cbody>\u003cheader class=\"app-header\">\u003ca class=\"brand\" href=\"#\">\u003cspan>⌘\u003c/span>\u003cdiv>订单故障练习场\u003csmall>ELEMENT LAB / RPA TRAINING\u003c/small>\u003c/div>\u003c/a>\u003cdiv class=\"header-actions\">\u003cspan class=\"local-tag\">● 本地模拟环境\u003c/span>\u003cspan id=\"sessionStatus\">\u003c/span>\u003cbutton id=\"loginButton\">账号登录\u003c/button>\u003cbutton id=\"toggleTeacher\" aria-expanded=\"true\">隐藏老师控制台\u003c/button>\u003c/div>\u003c/header>\n\u003cmain>\u003csection class=\"intro\">\u003cdiv>\u003cdiv class=\"eyebrow\">EXCEPTION HANDLING · PRACTICE LAB\u003c/div>\u003ch1>让故障发生，\u003cem>再让流程继续。\u003c/em>\u003c/h1>\u003cp>在这里捕获元素、查询订单、提交结果。老师控制故障，学员用影刀编写等待、判断与恢复流程。\u003c/p>\u003c/div>\u003cbutton class=\"outline\" id=\"showGuide\">怎么用这个网页 ↗\u003c/button>\u003c/section>\n\u003cdiv class=\"scenario-banner\">\u003cdiv>\u003cspan class=\"scenario-mark\">本轮任务\u003c/span>\u003cstrong id=\"scenarioTitle\">\u003c/strong>\u003cp id=\"scenarioSummary\">\u003c/p>\u003c/div>\u003cbutton id=\"resetRound\">重置本轮进度 ↺\u003c/button>\u003c/div>\n\u003csection id=\"recoveryPanel\" class=\"recovery-panel\" hidden>\u003c/section>\n\u003cdiv class=\"work-layout\">\u003cdiv class=\"business-column\">\u003csection class=\"stats\" id=\"stats\">\u003c/section>\n\u003csection class=\"panel order-panel\">\u003cdiv class=\"panel-head\">\u003cdiv>\u003ch2>订单管理\u003c/h2>\u003csmall>学员与机器人操作区域 · 10 条虚拟订单\u003c/small>\u003c/div>\u003cdiv class=\"row\">\u003cbutton id=\"refreshList\" data-action=\"refresh-list\">刷新列表\u003c/button>\u003cbutton class=\"primary\" id=\"exportResults\" data-action=\"export-results\">导出结果 CSV\u003c/button>\u003c/div>\u003c/div>\u003cdiv class=\"filter-bar\">\u003clabel>订单号\u003cinput type=\"search\" id=\"orderSearch\" placeholder=\"例如 XD1005\" autocomplete=\"off\">\u003c/label>\u003clabel>处理状态\u003cselect id=\"statusFilter\">\u003coption value=\"all\">全部状态\u003c/option>\u003coption value=\"pending\">待处理\u003c/option>\u003coption value=\"uncertain\">待核实\u003c/option>\u003coption value=\"done\">已提交\u003c/option>\u003coption value=\"invalid\">数据异常\u003c/option>\u003coption value=\"failed\">处理失败\u003c/option>\u003coption value=\"skipped\">已跳过\u003c/option>\u003c/select>\u003c/label>\u003cbutton id=\"clearFilters\">清空筛选\u003c/button>\u003c/div>\n\u003cdiv class=\"table-scroll\">\u003ctable id=\"ordersTable\">\u003cthead>\u003ctr>\u003cth>订单号\u003c/th>\u003cth>商品\u003c/th>\u003cth>金额\u003c/th>\u003cth>状态\u003c/th>\u003cth>操作\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody id=\"ordersBody\">\u003c/tbody>\u003c/table>\u003c/div>\u003cdiv id=\"businessNotice\" class=\"notice\" role=\"status\" aria-live=\"polite\">先查询 XD1005，尝试提交，再观察页面反馈。\u003c/div>\u003cdiv class=\"table-foot\">\u003cspan id=\"visibleCount\">\u003c/span>\u003cspan>提示：点击完成 ≠ 业务处理成功，请检查页面结果。\u003c/span>\u003c/div>\u003c/section>\n\u003csection class=\"panel evidence-panel\">\u003cdiv class=\"evidence-tabs\" role=\"tablist\">\u003cbutton role=\"tab\" id=\"eventsTab\" aria-selected=\"true\">运行日志\u003c/button>\u003cbutton role=\"tab\" id=\"assessmentTab\" aria-selected=\"false\">本轮验收\u003c/button>\u003cbutton role=\"tab\" id=\"instructionsTab\" aria-selected=\"false\">练习任务书\u003c/button>\u003c/div>\u003cdiv id=\"evidenceContent\">\u003c/div>\u003c/section>\n\u003c/div>\u003caside class=\"teacher-panel\" id=\"teacherPanel\">\u003cdiv class=\"teacher-title\">\u003cspan>☷\u003c/span>\u003cdiv>\u003ch2>老师控制台\u003c/h2>\u003csmall>设置可复现的故障，查看学员处理结果\u003c/small>\u003c/div>\u003c/div>\u003csection>\u003clabel for=\"presetSelect\">选择教学场景\u003c/label>\u003cselect id=\"presetSelect\">\u003coption value=\"normal\">01 正常流程 · 先跑通操作\u003c/option>\u003coption value=\"retry\" selected>02 初体验 · 提交先失败一次\u003c/option>\u003coption value=\"exam\">03 综合考核 · 10 条混合故障\u003c/option>\u003coption value=\"login\">04 登录恢复 · 跳过当前继续下一条\u003c/option>\u003c/select>\u003cbutton class=\"primary wide\" id=\"applyPreset\">应用场景并重新开始\u003c/button>\u003cp class=\"hint\">应用场景会重置全部虚拟订单、计数与日志。\u003c/p>\u003c/section>\u003csection>\u003ch3>给一条订单设置故障\u003c/h3>\u003clabel for=\"faultOrder\">目标订单\u003c/label>\u003cselect id=\"faultOrder\">\u003c/select>\u003clabel for=\"faultMode\">故障类型\u003c/label>\u003cselect id=\"faultMode\">\u003c/select>\u003cdiv class=\"two-fields\">\u003clabel>加载延迟 / 秒\u003cinput id=\"faultDelay\" type=\"number\" min=\"1\" max=\"15\" value=\"4\">\u003c/label>\u003clabel>前几次失败\u003cinput id=\"faultCount\" type=\"number\" min=\"1\" max=\"5\" value=\"1\">\u003c/label>\u003c/div>\u003cbutton class=\"wide\" id=\"applyFault\">仅应用到这条订单\u003c/button>\u003cp class=\"hint\" id=\"faultDescription\">\u003c/p>\u003c/section>\u003csection>\u003clabel class=\"check-label\">\u003cinput type=\"checkbox\" id=\"blockExport\">模拟导出阻塞\u003c/label>\u003cp class=\"hint\">这是页面内的导出失败模拟，不会锁定电脑上的真实文件。\u003c/p>\u003cdiv class=\"row\">\u003cbutton id=\"expireSession\">立即使登录失效\u003c/button>\u003cbutton id=\"exportLog\">下载日志 JSON\u003c/button>\u003c/div>\u003c/section>\u003csection class=\"teacher-tips\">\u003ch3>从这里开始教学\u003c/h3>\u003col>\u003cli>先在正常场景中跑通单条订单。\u003c/li>\u003cli>开启一种故障，运行原来的流程。\u003c/li>\u003cli>读取反馈，加入等待或恢复分支。\u003c/li>\u003cli>重置本轮，验证同样故障能被处理。\u003c/li>\u003cli>切换综合考核，用结果表和日志验收。\u003c/li>\u003c/ol>\u003c/section>\u003c/aside>\u003c/div>\n\u003cfooter>\u003cspan>只使用虚拟订单 · 数据保存在当前浏览器\u003c/span>\u003cspan>异常处理练习 / 可重复复位\u003c/span>\u003c/footer>\u003c/main>\n\u003cdiv class=\"modal-backdrop\" id=\"detailBackdrop\" hidden>\u003csection class=\"detail-modal\" role=\"dialog\" aria-modal=\"true\" aria-labelledby=\"detailTitle\">\u003cdiv class=\"modal-head\">\u003cdiv>\u003csmall>订单详情\u003c/small>\u003ch2 id=\"detailTitle\">查询订单\u003c/h2>\u003c/div>\u003cbutton id=\"closeDetail\" aria-label=\"关闭订单详情\">✕\u003c/button>\u003c/div>\u003cdiv id=\"detailContent\">\u003c/div>\u003c/section>\u003c/div>\n\u003cdiv class=\"popup-backdrop\" id=\"popupBackdrop\" hidden>\u003csection role=\"dialog\" aria-modal=\"true\" aria-labelledby=\"popupTitle\">\u003cdiv class=\"popup-icon\">!\u003c/div>\u003ch2 id=\"popupTitle\">练习公告\u003c/h2>\u003cp>这是一层会遮挡订单按钮的模拟弹窗。关闭后才能继续操作订单。\u003c/p>\u003cbutton class=\"primary\" id=\"dismissPopup\" data-action=\"dismiss-popup\">我知道了，关闭弹窗\u003c/button>\u003c/section>\u003c/div>\n\u003cdiv class=\"modal-backdrop\" id=\"guideBackdrop\" hidden>\u003csection class=\"guide-modal\" role=\"dialog\" aria-modal=\"true\" aria-labelledby=\"guideTitle\">\u003cdiv class=\"modal-head\">\u003ch2 id=\"guideTitle\">这个网页有什么用？\u003c/h2>\u003cbutton id=\"closeGuide\" aria-label=\"关闭使用说明\">✕\u003c/button>\u003c/div>\u003cdiv class=\"guide-body\">\u003cp class=\"lead\">它是影刀流程的练习对象，也是老师控制故障的工具。\u003c/p>\u003cdiv class=\"guide-grid\">\u003cdiv>\u003cb>① 学员操作\u003c/b>\u003cp>在影刀里捕获查询、提交、结果提示和订单状态，搭建自己的流程。\u003c/p>\u003c/div>\u003cdiv>\u003cb>② 老师制造故障\u003c/b>\u003cp>让指定订单查询失败、加载变慢、提交失败或丢失回执，每次都能复现。\u003c/p>\u003c/div>\u003cdiv>\u003cb>③ 修改并验证\u003c/b>\u003cp>学员加入状态判断、有限重试、单条跳过、登录恢复和防重复提交。\u003c/p>\u003c/div>\u003cdiv>\u003cb>④ 用结果验收\u003c/b>\u003cp>检查实际写入次数、失败原因、尝试次数及是否还有遗漏的订单。\u003c/p>\u003c/div>\u003c/div>\u003cdiv class=\"guide-note\">\u003cstrong>页面报错与指令异常要区分。\u003c/strong>\u003cp>页面显示“提交失败”时，点击指令可能已经执行成功。应读取业务反馈并判断；等待某个目标出现并超时、操作被遮挡等情况，则可能使自动化指令失败。网页不会直接替影刀抛出异常。\u003c/p>\u003c/div>\u003ch3>登录失效专项练习\u003c/h3>\u003cp>选择“04 登录恢复”场景，先处理 XD1001、XD1002，再查询 XD1003。页面会跳转到登录页；练习账号 rpa_student，密码 Rpa@2026。登录后进入订单页，记录 XD1003 跳过原因，再查找 XD1004。也可选择重试当前条，两个分支不会混记。\u003c/p>\u003ch3>建议先体验一次\u003c/h3>\u003cp>使用默认场景，查询 XD1005 → 第一次提交失败 → 第二次提交成功 → 在运行日志中核对两次尝试、一次实际写入。随后用影刀实现同样的判断。\u003c/p>\u003ch3>本地文件与影刀实操\u003c/h3>\u003cp>可直接用浏览器打开此单文件。若浏览器扩展无法捕获 file 页面，使用同文件夹中的“启动本地练习场.cmd”，再访问本机 HTTP 地址。只在本机提供虚拟练习数据。\u003c/p>\u003c/div>\u003c/section>\u003c/div>\n\u003cscript>(function(root,factory){if(typeof module==='object'&&module.exports)module.exports=factory();else root.FaultLabEngine=factory()})(typeof globalThis!=='undefined'?globalThis:this,function(){\n  'use strict';\n  const modes={normal:'正常',slow:'详情加载慢',queryOnce:'查询前几次失败',missing:'金额缺失',submitOnce:'提交前几次失败',submitAlways:'提交持续失败',receiptLost:'提交成功但回执丢失',session:'登录失效一次',popup:'弹窗遮挡一次'};\n  const items=['商务笔记本','无线鼠标','桌面收纳盒','便携充电器','办公键盘','文件收纳袋','显示器支架','保温杯','台灯','数据线'];\n  const config=mode=>({mode,delay:4,failCount:1});\n  const practiceAccount={username:'rpa_student',password:'Rpa@2026'};\n  function blankStats(){return {queries:0,submits:0,commits:0,checks:0,sessionTriggered:false,popupTriggered:false,popupClosed:false,lost:false,verified:false}}\n  function createState(preset='retry'){\n    const orders=items.map((product,i)=>({id:'XD'+(1001+i),product,amount:[129,89,45,159,199,39,269,79,139,29][i],status:'pending',note:'',fault:config('normal'),stats:blankStats()}));\n    if(preset==='retry')orders[4].fault=config('submitOnce');\n    if(preset==='login')orders[2].fault=config('session');\n    if(preset==='exam'){\n      ['normal','slow','queryOnce','missing','submitOnce','submitAlways','receiptLost','session','popup','normal'].forEach((mode,i)=>orders[i].fault=config(mode));\n    }\n    return {version:1,preset,orders,loggedIn:true,exportBlocked:false,events:[],seq:0,exportRequests:0,recovery:null,session:{attempts:0,successes:0},activeOrderId:null};\n  }\n  function ensureState(state){if(!state.session)state.session={attempts:0,successes:0};if(!('recovery' in state))state.recovery=null;if(!('activeOrderId' in state))state.activeOrderId=null;return state}\n  function find(state,id){const order=state.orders.find(o=>o.id===id);if(!order)throw Error('订单不存在');return order}\n  function log(state,id,action,result,message){state.events.unshift({seq:++state.seq,time:new Date().toISOString(),order:id||'系统',action,result,message});state.events=state.events.slice(0,300)}\n  function amountOf(order){return order.fault.mode==='missing'?null:order.amount}\n  function publicStatus(order){return order.stats.lost&&!order.stats.verified&&order.status==='done'?'uncertain':order.status}\n  function nextPending(state,afterId){const index=state.orders.findIndex(o=>o.id===afterId);return state.orders.slice(index+1).find(o=>o.status==='pending')?.id||null}\n  function expireSession(state,id,reason='登录已失效'){\n    ensureState(state);state.loggedIn=false;\n    if(!state.recovery||['complete','skipped','retry-current'].includes(state.recovery.stage)){\n      const current=id||state.activeOrderId||null;\n      state.recovery={orderId:current,nextOrderId:nextPending(state,current),stage:'login-required',reason,skipped:false};\n    }\n    log(state,id,'会话失效','跳转登录页',reason+'；当前订单与已处理结果已保留');\n    return {kind:'login',message:reason+'，请输入练习账号和密码重新登录。'};\n  }\n  function openOrder(state,id){\n    ensureState(state);const o=find(state,id);if(!state.loggedIn)return expireSession(state,id,'登录已失效，本次查询未完成');state.activeOrderId=id;\n    o.stats.queries++;\n    if(o.fault.mode==='session'&&!o.stats.sessionTriggered){o.stats.sessionTriggered=true;return expireSession(state,id,'查询 '+id+' 时会话已过期，本次查询未完成');}\n    if(o.fault.mode==='queryOnce'&&o.stats.queries\u003c=o.fault.failCount){log(state,id,'查询详情','失败','临时查询错误，第 '+o.stats.queries+' 次');return {kind:'error',message:'查询服务暂时不可用，请稍后重新查询。',code:'QUERY_TEMPORARY'}}\n    let popup=false;if(o.fault.mode==='popup'&&!o.stats.popupTriggered){o.stats.popupTriggered=true;popup=true}\n    const delay=o.fault.mode==='slow'?o.fault.delay:0;\n    log(state,id,'查询详情',delay?'等待加载':'成功',delay?'详情将在 '+delay+' 秒后出现':'详情已返回');return {kind:'ready',delay,popup};\n  }\n  function submit(state,id){\n    const o=find(state,id);if(!state.loggedIn){log(state,id,'提交','需登录','本次未提交');return {kind:'login',message:'登录已失效，请先重新登录。'}}\n    if(['invalid','failed','skipped'].includes(o.status))return {kind:'error',message:'该订单已归档，请处理下一条订单或重置本轮。'};\n    o.stats.submits++;\n    if(amountOf(o)===null){log(state,id,'提交','数据校验失败','订单金额为空，没有写入业务结果');return {kind:'error',message:'订单金额为空。请记录数据异常并跳过本订单。',code:'AMOUNT_REQUIRED'}}\n    if(o.fault.mode==='submitAlways'||(o.fault.mode==='submitOnce'&&o.stats.submits\u003c=o.fault.failCount)){log(state,id,'提交','失败','第 '+o.stats.submits+' 次尝试失败，没有写入业务结果');return {kind:'error',message:'本次提交失败，业务状态未改变。',code:'SUBMIT_FAILED'}}\n    o.stats.commits++;o.status='done';\n    if(o.fault.mode==='receiptLost'&&o.stats.commits===1){o.stats.lost=true;o.stats.verified=false;log(state,id,'提交','已写入但回执丢失','业务已成功，页面未收到成功回执；重试前应核对状态');return {kind:'uncertain',message:'请求已发出，但未收到成功回执。请先查询处理结果，再决定是否重试。',code:'RECEIPT_LOST'}}\n    o.stats.verified=true;log(state,id,'提交',o.stats.commits>1?'重复写入':'成功','实际业务写入共 '+o.stats.commits+' 次');return {kind:'success',message:o.stats.commits>1?'重复提交已发生，本订单实际写入 '+o.stats.commits+' 次。':'订单提交成功。'};\n  }\n  function check(state,id){const o=find(state,id);if(!state.loggedIn)return {kind:'login',message:'登录已失效，暂时无法查询业务结果。'};o.stats.checks++;o.stats.verified=true;log(state,id,'查询处理结果','成功','业务状态 '+o.status+'，实际写入 '+o.stats.commits+' 次');return {kind:o.status==='done'?'success':'info',message:o.status==='done'?'已核实：订单已提交，实际写入 '+o.stats.commits+' 次。请勿重复提交。':'已核实：订单尚未提交。'};}\n  function mark(state,id,status,note){const o=find(state,id);if(!state.loggedIn)return {kind:'login',message:'请先重新登录。'};if(!['invalid','failed'].includes(status))return {kind:'error',message:'请使用相应的异常记录操作。'};if(!note.trim())return {kind:'error',message:'请填写异常原因，便于后续排查。'};if(o.stats.commits)return {kind:'error',message:'该订单已有成功写入，请先查询处理结果，不要标记为失败。'};if(status==='failed'&&!o.stats.submits)return {kind:'error',message:'该订单还没有提交尝试，请核对是否确实需要记录为处理失败。'};o.status=status;o.note=note.trim();log(state,id,'记录异常并跳过',status==='invalid'?'数据异常':'处理失败',o.note);return {kind:'success',message:'异常记录已保存，可以继续下一条订单。'}}\n  function login(state,username,password){\n    ensureState(state);state.session.attempts++;\n    if(String(username||'').trim()!==practiceAccount.username||password!==practiceAccount.password){log(state,null,'账号密码登录','失败','练习账号或密码不正确；未保存输入内容');return {kind:'error',message:'账号或密码不正确，请使用页面提供的练习账号。'}}\n    state.loggedIn=true;state.session.successes++;if(state.recovery?.stage==='login-required')state.recovery.stage='return-required';log(state,null,'账号密码登录','成功','练习账号验证通过；已有订单结果与异常记录保留');return {kind:'success',message:'登录成功。请返回订单处理页面，处理恢复位置。'};\n  }\n  function arriveOrders(state){ensureState(state);if(state.loggedIn&&state.recovery?.stage==='return-required'){state.recovery.stage='decision-required';log(state,state.recovery.orderId,'返回订单页','成功','等待选择重试当前条或记录跳过后继续下一条')}}\n  function skipRecoveryOrder(state,note){\n    ensureState(state);if(!state.loggedIn)return {kind:'login',message:'请先完成账号密码登录。'};const r=state.recovery;if(!r?.orderId)return {kind:'error',message:'没有需要恢复处理的当前订单。'};const o=find(state,r.orderId);\n    if(o.stats.commits>0||o.status==='done')return {kind:'error',message:'该订单已有业务写入，不能忽略。请先核对结果，避免遗漏或重复。'};\n    if(o.status!=='pending')return {kind:'error',message:'当前订单已经归档，请直接查找下一条待处理订单。'};\n    if(!String(note||'').trim())return {kind:'error',message:'先填写跳过原因，再记录异常。'};\n    o.status='skipped';o.note=String(note).trim();r.skipped=true;r.stage='skipped';r.nextOrderId=nextPending(state,o.id);log(state,o.id,'登录恢复后忽略当前条','已跳过',o.note+'；下一条 '+(r.nextOrderId||'无'));\n    return {kind:'success',message:o.id+' 已记录为跳过。'+(r.nextOrderId?'下一条待处理订单为 '+r.nextOrderId+'。':'后面没有待处理订单。'),nextOrderId:r.nextOrderId};\n  }\n  function retryRecoveryOrder(state){ensureState(state);if(!state.loggedIn)return {kind:'login',message:'请先登录。'};const r=state.recovery;if(!r?.orderId)return {kind:'error',message:'没有可重试的当前订单。'};const o=find(state,r.orderId);if(o.status!=='pending'||o.stats.commits>0)return {kind:'error',message:'当前订单已有处理结果，请核对后再继续。'};r.stage='retry-current';r.nextOrderId=o.id;log(state,o.id,'登录恢复后重试当前条','待查询','未修改订单结果，请重新查找并处理当前订单');return {kind:'success',message:'保留 '+o.id+' 为待处理，请重新查询这一条。',nextOrderId:o.id}}\n  function closePopup(state,id){find(state,id).stats.popupClosed=true;log(state,id,'关闭遮挡弹窗','成功','详情操作区域已恢复')}\n  function setFault(state,id,fault){const o=find(state,id);o.fault={mode:modes[fault.mode]?fault.mode:'normal',delay:Math.max(1,Math.min(15,Number(fault.delay)||4)),failCount:Math.max(1,Math.min(5,Math.floor(Number(fault.failCount)||1)))};o.stats=blankStats();o.status='pending';o.note='';state.preset='custom';log(state,id,'老师修改故障','已应用',modes[o.fault.mode]+'；该订单运行结果已复位')}\n  function counts(state){return {done:state.orders.filter(o=>o.status==='done').length,invalid:state.orders.filter(o=>o.status==='invalid').length,failed:state.orders.filter(o=>o.status==='failed').length,skipped:state.orders.filter(o=>o.status==='skipped').length,pending:state.orders.filter(o=>o.status==='pending').length,duplicates:state.orders.reduce((n,o)=>n+Math.max(0,o.stats.commits-1),0),attempts:state.orders.reduce((n,o)=>n+o.stats.submits,0)}}\n  function assess(state){\n    const c=counts(state),checks=[{name:'没有重复写入',ok:c.duplicates===0,detail:'额外写入 '+c.duplicates+' 次'},{name:'全部订单已有最终结果',ok:c.pending===0,detail:'尚未处理 '+c.pending+' 条'}];\n    if(state.preset==='exam'){\n      const invalid=find(state,'XD1004'),failed=find(state,'XD1006'),lost=find(state,'XD1007');\n      const skippedSession=find(state,'XD1008').status==='skipped'&&!!find(state,'XD1008').note;\n      checks.push({name:skippedSession?'登录异常条已跳过，其余为 7 成功、1 数据异常、1 处理失败':'重试登录异常条，结果为 8 成功、1 数据异常、1 处理失败',ok:c.done===(skippedSession?7:8)&&c.invalid===1&&c.failed===1&&c.skipped===(skippedSession?1:0),detail:`当前 ${c.done} 成功 / ${c.invalid} 数据异常 / ${c.failed} 处理失败 / ${c.skipped} 跳过`},{name:'金额缺失订单被记录并跳过',ok:invalid.status==='invalid'&&!!invalid.note,detail:'XD1004 应有数据异常原因'},{name:'持续失败按本题要求尝试 3 次后记录失败',ok:failed.status==='failed'&&failed.stats.submits===3&&!!failed.note,detail:'XD1006 已尝试 '+failed.stats.submits+' 次，应为首次 1 次＋重试 2 次'},{name:'回执丢失后核对状态，未重复写入',ok:lost.status==='done'&&lost.stats.commits===1&&lost.stats.verified,detail:'XD1007 写入 '+lost.stats.commits+' 次，'+(lost.stats.verified?'已核实':'未核实')},{name:'已通过账号密码恢复登录',ok:state.loggedIn&&(state.session?.successes||0)>0,detail:state.loggedIn?'当前已登录，成功验证 '+(state.session?.successes||0)+' 次':'当前登录失效'},{name:'已处理遮挡弹窗',ok:find(state,'XD1009').stats.popupClosed,detail:'XD1009 的活动弹窗应关闭'});\n    }\n    if(state.preset==='login'){const current=find(state,'XD1003'),next=find(state,'XD1004');checks.push({name:'已使用账号密码重新登录并返回订单页',ok:state.loggedIn&&(state.session?.successes||0)>0&&state.recovery?.stage!=='return-required',detail:'应从登录页返回订单页，保留已有进度'},{name:'当前登录异常订单已记录跳过原因',ok:current.status==='skipped'&&!!current.note,detail:'XD1003 应跳过，实际写入应为 0'},{name:'下一条订单可以继续处理',ok:next.status==='done'&&next.stats.commits===1,detail:'XD1004 应成功且只写入 1 次'})}\n    return {checks,passed:checks.every(x=>x.ok),counts:c,exam:state.preset==='exam'};\n  }\n  function csvCell(value){return '\"'+String(value??'').replace(/\"/g,'\"\"')+'\"'}\n  function exportCSV(state){if(state.exportBlocked){log(state,null,'导出结果','模拟失败','老师开启了导出阻塞，未生成下载');return {kind:'error',message:'模拟导出失败：结果文件被占用。请保留页面进度，解除故障后重新导出。'}}state.exportRequests++;log(state,null,'导出结果','已生成下载','请到浏览器下载目录确认文件');const names={pending:'待处理',done:'已提交',invalid:'数据异常',failed:'处理失败',uncertain:'待核实',skipped:'已跳过'};const rows=[['订单号','商品','金额','业务状态','页面状态','查询次数','提交尝试次数','实际写入次数','异常原因'],...state.orders.map(o=>[o.id,o.product,amountOf(o),names[o.status],names[publicStatus(o)],o.stats.queries,o.stats.submits,o.stats.commits,o.note])];return {kind:'download',data:'\\uFEFF'+rows.map(r=>r.map(csvCell).join(',')).join('\\r\\n')}}\n  return {modes,practiceAccount,createState,ensureState,find,log,amountOf,publicStatus,nextPending,expireSession,openOrder,submit,check,mark,login,arriveOrders,skipRecoveryOrder,retryRecoveryOrder,closePopup,setFault,counts,assess,exportCSV};\n});\n\u003c/script>\u003cscript>(function(root){\n  'use strict';\n  const E=root.FaultLabEngine,key='element-lab-order-fault-v1',esc=s=>String(s??'').replace(/[&\u003c>\"']/g,c=>({'&':'&amp;','\u003c':'&lt;','>':'&gt;','\"':'&quot;',\"'\":'&#39;'}[c]));\n  function read(){try{const state=JSON.parse(localStorage.getItem(key)||'null');if(state?.version===1&&state.orders?.length===10&&state.orders.every((o,i)=>o.id==='XD'+(1001+i)&&o.stats&&E.modes[o.fault?.mode])&&Array.isArray(state.events))return E.ensureState(state)}catch{}return E.createState('login')}\n  function write(state){try{localStorage.setItem(key,JSON.stringify(state));return true}catch{return false}}\n  function isLoginView(){return document.body.dataset.page==='login'||location.hash==='#login'}\n  function standaloneFile(){return location.protocol==='file:'&&document.body.dataset.page!=='login'}\n  function loginURL(){return 'login.html'}\n  function ordersURL(){return 'orders.html'}\n  function navigationFailure(){const existing=document.getElementById('businessNotice');if(existing){existing.textContent='浏览器不允许保存本地状态，无法安全跳转并保留进度。请使用本地启动器打开 HTTP 页面后重试。';existing.className='notice error'}else document.body.innerHTML='\u003cmain>\u003ch1>无法保存练习进度\u003c/h1>\u003cp>请使用同文件夹中的本地启动器，再进行登录练习。\u003c/p>\u003c/main>'}\n  function goToLogin(state,id,reason){if(state.loggedIn||!state.recovery)E.expireSession(state,id,reason||'登录已失效');if(!write(state)){navigationFailure();return}window.__singleNavigate('login.html')}\n  function returnToOrders(){const state=read();if(!state.loggedIn){document.getElementById('loginFeedback').textContent='请先输入练习账号和密码完成登录。';return}E.log(state,state.recovery?.orderId,'登录页跳转订单页','已发起','由学员或机器人明确进入订单处理页面');if(!write(state)){navigationFailure();return}const target=ordersURL();window.__singleNavigate(target)}\n  function renderLogin(){\n    const standalone=location.protocol==='file:'&&location.hash==='#login';\n    document.title='账号登录 · 订单故障练习场';document.body.className='login-page';document.body.dataset.page='login';if(standalone)document.body.dataset.entry='standalone';\n    const state=read(),current=state.recovery?.orderId||'未指定';\n    document.body.innerHTML=`\u003cmain class=\"login-shell\">\u003csection class=\"login-story\">\u003ca class=\"brand\" href=\"#\">\u003cspan>⌘\u003c/span>\u003cdiv>订单作业系统\u003csmall>LOCAL TRAINING / SIGN IN\u003c/small>\u003c/div>\u003c/a>\u003cdiv class=\"login-story-main\">\u003cspan class=\"login-eyebrow\">SESSION EXPIRED\u003c/span>\u003ch1>会话已失效，\u nce-tabs [role=tab]').forEach(b=>b.setAttribute('aria-selected',String(b.id===evidence+'Tab')));\n    if(evidence==='events'){$('#evidenceContent').innerHTML=state.events.length?'\u003cdiv class=\"event-list\">'+state.events.map(e=>`\u003cdiv class=\"event\">\u003ctime>${new Date(e.time).toLocaleTimeString('zh-CN',{hour12:false})}\u003c/time>\u003cb>${esc(e.order)}\u003c/b>\u003cspan>${esc(e.action)}\u003cbr>\u003cspan class=\"event-result\">${esc(e.result)}\u003c/span>\u003c/span>\u003cspan class=\"event-message\">${esc(e.message)}\u003c/span>\u003c/div>`).join('')+'\u003c/div>':'\u003cdiv class=\"empty\">还没有操作记录。先查询一条订单，观察每一步的结果。\u003c/div>';return}\n    if(evidence==='assessment'){\n      const a=E.assess(state);$('#evidenceContent').innerHTML=`\u003cdiv class=\"assessment-summary\">\u003cstrong>${a.passed?'✓ 本轮检查通过':'本轮仍有待完成项目'}\u003c/strong>\u003cspan>${a.exam?'综合考核':state.preset==='login'?'登录恢复专项':'单项练习'} · 检查 ${a.checks.length} 项结果\u003c/span>\u003c/div>${a.checks.map(c=>`\u003cdiv class=\"assessment-item ${c.ok?'':'fail'}\">\u003cspan>${c.ok?'✓':'○'}\u003c/span>\u003cdiv>${c.name}\u003csmall>${esc(c.detail)}\u003c/small>\u003c/div>\u003c/div>`).join('')}\u003cp class=\"hint\">验收依据来自本页的实际业务状态和操作计数。只有在影刀里独立跑过流程，才算完成影刀实操；手动操作通过仅验证页面行为。\u003c/p>`;return;\n    }\n    $('#evidenceContent').innerHTML=`\u003cdiv class=\"taskbook\">\u003ch3>建议练习顺序\u003c/h3>\u003col>\u003cli>正常流程：从列表查询一条订单，读取金额、点击提交、确认状态。\u003c/li>\u003cli>等待：给 XD1002 设置“详情加载慢”，等待提交按钮出现，设置等待超时。\u003c/li>\u003cli>重试：给 XD1005 设置首次提交失败，最多尝试 3 次，即首次 1 次＋重试 2 次。\u003c/li>\u003cli>跳过：识别金额缺失，保存原因后继续；持续失败达到上限也记录后继续。\u003c/li>\u003cli>恢复：登录失效时暂停批量操作；在独立登录页输入账号密码，返回后记录本条跳过原因，再查找下一条待处理订单。\u003c/li>\u003cli>防重复：提交没有回执时，查询处理结果，已经成功就不再提交。\u003c/li>\u003cli>综合考核：逐条处理 10 笔订单，导出结果，核对日志和验收报告。\u003c/li>\u003c/ol>\u003cp class=\"key-note\">不要只包一个 Catch 就认为处理完成。页面显示提交失败时，应读取反馈并走分支；指令真正报错时，再按影响范围捕获、恢复或停止。\u003c/p>\u003ch3>供捕获的稳定元素\u003c/h3>\u003cp>列表行使用 \u003ccode>data-order-id\u003c/code>；查询按钮使用 \u003ccode>data-order\u003c/code>；详情有 \u003ccode>id=\"order-amount\"\u003c/code>、\u003ccode>id=\"submit-order\"\u003c/code>、\u003ccode>id=\"operation-status\"\u003c/code> 和 \u003ccode>id=\"check-order-result\"\u003c/code>。\u003c/p>\u003cp>状态反馈还提供 \u003ccode>data-state\u003c/code>。这些是本练习场的真实 HTML 属性，适合观察与捕获；请使用影刀自己的指令来操作，不要让页面替你自动完成处理。\u003c/p>\u003cp>页面内不会真实发出服务器 500、锁住 Excel 文件或注销现实账号。它提供可控的页面行为，真实文件读写等内容应另配本机影刀练习。\u003c/p>\u003c/div>`;\n  }\n  function renderRecovery(){\n    const panel=$('#recoveryPanel'),r=state.recovery;\n    if(!r||!state.loggedIn){panel.hidden=true;return}\n    const current=r.orderId?E.find(state,r.orderId):null;\n    const retrying=r.stage==='retry-current'&&current?.status==='pending';\n    const needsVerification=current?.status==='done'&&!current.stats.verified;\n    const target=(retrying||needsVerification)?r.orderId:E.nextPending(state,r.orderId);\n    const canDecide=current?.status==='pending'&&current.stats.commits===0;\n    const requiresDecision=(r.stage==='decision-required'||r.stage==='return-required')&&canDecide;\n    panel.hidden=false;panel.innerHTML=`\u003cdiv class=\"recovery-head\">\u003ch2>登录已恢复 · 请选择异常后的处理位置\u003c/h2>\u003csmall>已完成订单和操作计数保持不变\u003c/small>\u003c/div>\u003cdiv class=\"recovery-meta\">\u003cdiv>\u003cspan>中断订单\u003c/span>\u003cstrong id=\"resume-current-order\">${esc(r.orderId||'无')}\u003c/strong>\u003c/div>\u003cdiv>\u003cspan>当前条状态\u003c/span>\u003cstrong id=\"resume-current-status\">${current?labels[E.publicStatus(current)]:'未指定'}\u003c/strong>\u003c/div>\u003cdiv>\u003cspan>${needsVerification?'需核实的当前订单':retrying?'重新处理目标':'下一条待处理订单'}\u003c/span>\u003cstrong id=\"resume-next-order\" data-order=\"${target||''}\">${target||'后面没有待处理订单'}\u003c/strong>\u003c/div>\u003c/div>\u003cp>忽略当前异常时，请先留下原因并记录为跳过，再定位下一条。页面不会替影刀自动查询或提交下一条订单。\u003c/p>\u003clabel for=\"recovery-note\">跳过当前条的原因\u003c/label>\u003cinput id=\"recovery-note\" type=\"text\" value=\"${esc(current?.note||'')}\" placeholder=\"例如：登录失效，本次忽略该条，恢复后继续下一条\">\u003cdiv class=\"row\">\u003cbutton class=\"primary\" id=\"skip-current-order\" data-action=\"skip-recovery-order\" ${canDecide?'':'disabled'}>记录当前条跳过\u003c/button>\u003cbutton id=\"retry-current-order\" ${canDecide?'':'disabled'}>保留当前条，重新处理\u003c/button>\u003cbutton id=\"find-next-order\" data-action=\"find-next-order\" ${!target||requiresDecision?'disabled':''}>${needsVerification?'查找当前订单并核实':retrying?'重新查找当前订单':'查找下一条待处理订单'}\u003c/button>\u003c/div>\u003cdiv id=\"recoveryFeedback\" class=\"recovery-feedback\" role=\"status\">${current?.status==='skipped'?'当前条已记录为跳过，原因保留在结果表与日志中。':requiresDecision?'先选择记录跳过或重新处理；不自动忽略未完成订单。':retrying?'当前条仍待处理，可以重新查询。':'可查找下一个未完成订单。'}\u003c/div>`;\n    const feedback=result=>{const el=$('#recoveryFeedback');el.textContent=result.message;el.classList.toggle('error',result.kind!=='success')};\n    $('#skip-current-order').onclick=()=>{const result=E.skipRecoveryOrder(state,$('#recovery-note').value);sync();feedback(result)};\n    $('#retry-current-order').onclick=()=>{const result=E.retryRecoveryOrder(state);sync();feedback(result)};\n    $('#find-next-order').onclick=()=>{\n      const currentOrder=r.orderId?E.find(state,r.orderId):null;\n      const verify=currentOrder?.status==='done'&&!currentOrder.stats.verified;const next=(r.stage==='retry-current'&&currentOrder?.status==='pending')||verify?r.orderId:E.nextPending(state,r.orderId);\n      if(!next){feedback({kind:'error',message:'后面没有待处理订单。可清空筛选检查此前是否有遗漏。'});return}\n      $('#orderSearch').value=next;$('#statusFilter').value='all';E.log(state,next,'查找恢复目标','已定位','从 '+(r.orderId||'起始位置')+' 继续，目标 '+next);save();renderRows();renderEvidence();const row=$(`[data-order-id=\"${next}\"]`);row?.classList.add('recovery-target');row?.scrollIntoView({behavior:'smooth',block:'center'});notice('已定位 '+next+'。请由学员或影刀点击查询并继续处理。');\n    };\n  }\n  function sync(){save();renderRows();renderRecovery();renderEvidence()}\n  function detailResult(result){if(result.kind==='login'){S.goToLogin(state,activeId,result.message);return}const el=$('#operation-status');if(!el)return;el.textContent=result.message;el.dataset.state=result.kind;el.dataset.errorCode=result.code||'';const o=E.find(state,activeId);const button=$('#submit-order');if(button)button.disabled=busy||(o.status==='done'&&o.stats.verified)||['invalid','failed','skipped'].includes(o.status);}\n  function detailForm(id){\n    const o=E.find(state,id),amount=E.amountOf(o);$('#detailContent').innerHTML=`\u003cdiv class=\"detail-grid\">\u003cdiv>\u003csmall>订单号\u003c/small>\u003cstrong id=\"order-id\">${o.id}\u003c/strong>\u003c/div>\u003cdiv>\u003csmall>商品\u003c/small>\u003cstrong id=\"order-product\">${o.product}\u003c/strong>\u003c/div>\u003cdiv>\u003csmall>订单金额\u003c/small>\u003cstrong class=\"amount ${amount===null?'missing-amount':''}\" id=\"order-amount\" data-value=\"${amount??''}\">${amount===null?'—':amount.toFixed(2)}\u003c/strong>\u003c/div>\u003cdiv>\u003csmall>已核对的页面状态\u003c/small>\u003cstrong id=\"order-business-status\">${labels[E.publicStatus(o)]}\u003c/strong>\u003c/div>\u003c/div>\u003cdiv id=\"operation-status\" class=\"operation-status\" data-state=\"ready\" data-error-code=\"\" role=\"status\" aria-live=\"polite\">详情已加载。请先校验数据，再提交订单。\u003c/div>\u003cdiv class=\"detail-actions\">\u003cbutton id=\"submit-order\" data-action=\"submit\" data-order=\"${id}\" class=\"primary\">提交订单\u003c/button>\u003cbutton id=\"check-order-result\" data-action=\"check-result\" data-order=\"${id}\">查询处理结果\u003c/button>\u003c/div>\u003cdiv class=\"record-exception\">\u003clabel for=\"exception-note\">需要跳过时，请记录原因\u003c/label>\u003ctextarea id=\"exception-note\" placeholder=\"例如：金额为空 / 已尝试 3 次仍提交失败\">\u003c/textarea>\u003cdiv class=\"row\">\u003cbutton id=\"mark-invalid\" data-action=\"mark-invalid\">记录数据异常并跳过\u003c/button>\u003cbutton id=\"mark-failed\" data-action=\"mark-failed\">记录处理失败并跳过\u003c/button>\u003c/div>\u003c/div>\u003cp class=\"detail-caption\">这是虚拟订单。列表结果与业务实际写入会保留在当前浏览器，刷新页面不会自动重置进度。\u003c/p>`;\n    $('#submit-order').disabled=(o.status==='done'&&o.stats.verified)||['invalid','failed','skipped'].includes(o.status);\n    $('#submit-order').onclick=async()=>{\n      if(busy)return;busy=true;const generation=epoch;const clickToken=token;$('#submit-order').disabled=true;detailResult({kind:'info',message:'提交请求处理中，请等待页面反馈……'});\n      await new Promise(resolve=>setTimeout(resolve,350));if(generation!==epoch)return;const result=E.submit(state,id);busy=false;sync();\n      if(activeId===id&&token===clickToken){detailResult(result);$('#order-business-status').textContent=labels[E.publicStatus(o)]}else notice('上一笔订单 '+id+' 的请求已有结果，请查询列表核实。');\n    };\n    $('#check-order-result').onclick=()=>{if(busy)return;const result=E.check(state,id);sync();detailResult(result);$('#order-business-status').textContent=labels[E.publicStatus(o)]};\n    const mark=status=>{if(busy)return;const result=E.mark(state,id,status,$('#exception-note').value);sync();detailResult(result);$('#order-business-status').textContent=labels[E.publicStatus(o)]};$('#mark-invalid').onclick=()=>mark('invalid');$('#mark-failed').onclick=()=>mark('failed');\n  }\n  function loginDetail(message){S.goToLogin(state,activeId,message)}\n  function openDetail(id){\n    if(busy){notice('还有一笔提交请求处理中，请等待它返回结果。','uncertain');return}\n    lastFocus=document.activeElement;activeId=id;const thisToken=++token;$('#detailTitle').textContent=id;$('#detailBackdrop').hidden=false;$('#closeDetail').focus();\n    const result=E.openOrder(state,id);sync();\n    if(result.kind==='login'){loginDetail(result.message);return}\n    if(result.kind==='error'){$('#detailContent').innerHTML=`\u003cdiv class=\"query-error\" id=\"query-status\" data-state=\"error\" data-error-code=\"${result.code}\" role=\"status\">${esc(result.message)}\u003c/div>\u003cbutton id=\"retry-detail\">重新查询本订单\u003c/button>\u003cp class=\"hint\">本次只返回错误提示，提交按钮尚未出现。请为查询设置恢复策略。\u003c/p>`;$('#retry-detail').onclick=()=>openDetail(id);return}\n    const ready=()=>{if(thisToken!==token||activeId!==id)return;detailForm(id);if(result.delay){E.log(state,id,'详情加载','已就绪','提交按钮现在出现在 DOM 中');sync()}if(result.popup){$('#popupBackdrop').hidden=false;$('#dismissPopup').focus()}};\n    if(result.delay){$('#detailContent').innerHTML=`\u003cdiv class=\"loading-state\" id=\"detail-loading\" role=\"status\">\u003cdiv class=\"spinner\">\u003c/div>详情正在加载，预计 ${result.delay} 秒……\u003cp class=\"hint\">目标提交按钮此时还没有出现在 DOM 中。\u003c/p>\u003c/div>`;setTimeout(ready,result.delay*1000)}else ready();\n  }\n  function closeDetail(){if(!$('#popupBackdrop').hidden)return;$('#detailBackdrop').hidden=true;activeId=null;token++;if(lastFocus?.isConnected)lastFocus.focus()}\n  function dismissPopup(){if(!activeId)return;E.closePopup(state,activeId);$('#popupBackdrop').hidden=true;sync();$('#submit-order')?.focus()}\n  function reset(preset,keepConfig=false){const config=keepConfig?state.orders.map(o=>({...o.fault})):null,blocked=state.exportBlocked;epoch++;token++;busy=false;activeId=null;$('#detailBackdrop').hidden=true;$('#popupBackdrop').hidden=true;state=E.createState(preset);if(config){state.preset=preset;state.orders.forEach((o,i)=>o.fault=config[i]);state.exportBlocked=blocked}E.log(state,null,'开始新一轮','就绪',keepConfig?'保留故障配置，重置全部运行结果':'已应用 '+preset+' 场景');$('#orderSearch').value='';$('#statusFilter').value='all';sync();renderScenario();updateFaultForm();$('#blockExport').checked=state.exportBlocked;notice('新一轮已就绪。'+(preset==='retry'?'请查询 XD1005，体验首次提交失败。':'先处理一条订单，再搭建批量流程。'))}\n  function download(name,data,type){const blob=new Blob([data],{type}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}\n  function updateFaultForm(){const o=E.find(state,$('#faultOrder').value||'XD1005');$('#faultMode').value=o.fault.mode;$('#faultDelay').value=o.fault.delay;$('#faultCount').value=o.fault.failCount;$('#faultDescription').textContent=descriptions[o.fault.mode];$('#faultDelay').disabled=o.fault.mode!=='slow';$('#faultCount').disabled=!['queryOnce','submitOnce'].includes(o.fault.mode)}\n  $('#faultOrder').innerHTML=state.orders.map(o=>`\u003coption value=\"${o.id}\">${o.id} · ${o.product}\u003c/option>`).join('');$('#faultOrder').value='XD1005';$('#faultMode').innerHTML=Object.entries(E.modes).map(([k,v])=>`\u003coption value=\"${k}\">${v}\u003c/option>`).join('');updateFaultForm();\n  $('#faultOrder').onchange=updateFaultForm;$('#faultMode').onchange=()=>{const mode=$('#faultMode').value;$('#faultDescription').textContent=descriptions[mode];$('#faultDelay').disabled=mode!=='slow';$('#faultCount').disabled=!['queryOnce','submitOnce'].includes(mode)};\n  $('#applyFault').onclick=()=>{epoch++;token++;busy=false;activeId=null;$('#detailBackdrop').hidden=true;$('#popupBackdrop').hidden=true;E.setFault(state,$('#faultOrder').value,{mode:$('#faultMode').value,delay:$('#faultDelay').value,failCount:$('#faultCount').value});sync();renderScenario();notice('故障已应用，仅该订单结果已复位。其他订单进度保留。')};\n  $('#applyPreset').onclick=()=>reset($('#presetSelect').value);$('#resetRound').onclick=()=>reset(state.preset,true);\n  $('#blockExport').checked=state.exportBlocked;$('#blockExport').onchange=e=>{state.exportBlocked=e.target.checked;E.log(state,null,'设置导出故障',state.exportBlocked?'开启':'关闭','只模拟页面导出失败，不占用真实文件');save();renderEvidence()};\n  $('#expireSession').onclick=()=>{E.expireSession(state,state.activeOrderId,'老师主动设置会话过期');save();S.goToLogin(state,state.activeOrderId,'会话已过期')};\n  $('#loginButton').onclick=()=>S.goToLogin(state,state.activeOrderId,'手动进入练习登录页');\n  $('#orderSearch').oninput=renderRows;$('#statusFilter').onchange=renderRows;$('#clearFilters').onclick=()=>{$('#orderSearch').value='';$('#statusFilter').value='all';renderRows()};\n  $('#refreshList').onclick=()=>{if(!state.loggedIn){S.goToLogin(state,state.activeOrderId,'刷新订单时登录失效');return}state.orders.filter(o=>E.publicStatus(o)==='uncertain').forEach(o=>E.check(state,o.id));E.log(state,null,'刷新订单列表','成功','重新核对列表与待核实的业务结果');sync();notice('列表已刷新；已有结果和尝试次数保留。')};\n  $('#exportResults').onclick=()=>{const result=E.exportCSV(state);sync();if(result.kind==='download'){download('订单处理结果.csv',result.data,'text/csv;charset=utf-8');notice('结果文件已生成下载请求，请到浏览器下载目录确认文件。')}else notice(result.message,'error')};\n  $('#exportLog').onclick=()=>download('订单练习日志.json',JSON.stringify({exportedAt:new Date().toISOString(),assessment:E.assess(state),orders:state.orders,events:state.events},null,2),'application/json;charset=utf-8');\n  $('#toggleTeacher').onclick=()=>{document.body.classList.toggle('student-mode');const visible=!document.body.classList.contains('student-mode');$('#toggleTeacher').setAttribute('aria-expanded',String(visible));$('#toggleTeacher').textContent=visible?'隐藏老师控制台':'显示老师控制台'};\n  $('#closeDetail').onclick=closeDetail;$('#dismissPopup').onclick=dismissPopup;$('#showGuide').onclick=()=>{$('#guideBackdrop').hidden=false;$('#closeGuide').focus()};$('#closeGuide').onclick=()=>{$('#guideBackdrop').hidden=true;$('#showGuide').focus()};\n  document.addEventListener('keydown',e=>{if(e.key!=='Escape')return;if(!$('#guideBackdrop').hidden)$('#closeGuide').click();else if(!$('#popupBackdrop').hidden)dismissPopup();else if(!$('#detailBackdrop').hidden)closeDetail()});\n  $('#eventsTab').onclick=()=>{evidence='events';renderEvidence()};$('#assessmentTab').onclick=()=>{evidence='assessment';renderEvidence()};$('#instructionsTab').onclick=()=>{evidence='instructions';renderEvidence()};\n  window.addEventListener('pageshow',event=>{const latest=S.read();if(!latest.loggedIn){S.goToLogin(latest,latest.activeOrderId,'当前会话已过期');return}if(event.persisted)window.__singleReload()});\n  renderRows();renderScenario();renderRecovery();renderEvidence();if(state.preset==='login')notice('先处理 XD1001、XD1002，再查询 XD1003 触发登录跳转。已有进度保留。');if(!storageOK)notice('当前浏览器不允许保存本地数据。练习可继续，但关闭或刷新后可能丢失进度。','uncertain');\n})();\n\u003c/script>\u003c/body>\u003c/html>\n","refund- 3a\"/>\u003cpath d=\"m36 11 12 15 12-15M48 26v59\" fill=\"none\" stroke=\"#777\" stroke-width=\"2\"/>\u003cpath d=\"M30 58h10m17 0h10\" stroke=\"#999\"/>',bag:'\u003cpath d=\"M32 35q0-35 16-35t16 35\" stroke=\"#ff5361\" fill=\"none\" stroke-width=\"5\"/>\u003cpath d=\"M18 30h60v57H18z\" fill=\"#fff\" stroke=\"#ddd\"/>\u003ccircle cx=\"48\" cy=\"58\" r=\"16\" fill=\"#f6dce0\"/>\u003cpath d=\"m34 66 14-22 14 22z\" fill=\"#d6606a\"/>',shirt:'\u003cpath d=\"m31 14-23 13 13 20 12-6v46h34V41l12 6 13-20-25-13q-18 16-36 0z\" fill=\"white\" stroke=\"#cfd3d8\"/>\u003cpath d=\"M35 46h29v14H35z\" fill=\"#3a566c\"/>\u003ctext x=\"49\" y=\"56\" text-anchor=\"middle\" fill=\"white\" font-size=\"6\">YINGDAO\u003c/text>',phone:'\u003cg transform=\"rotate(16 48 48)\">\u003crect x=\"25\" y=\"6\" width=\"46\" height=\"84\" rx=\"9\" fill=\"#d64d3e\"/>\u003crect x=\"30\" y=\"12\" width=\"17\" height=\"22\" rx=\"5\" fill=\"#292e35\"/>\u003ccircle cx=\"38\" cy=\"19\" r=\"4\" fill=\"#7f919c\"/>\u003ccircle cx=\"49\" cy=\"56\" r=\"14\" fill=\"#e9b653\"/>\u003cpath d=\"m43 51 12 10m-12 0 12-10\" stroke=\"#bf4533\" stroke-width=\"3\"/>\u003c/g>',cup:'\u003crect x=\"30\" y=\"12\" width=\"38\" height=\"76\" rx=\"9\" fill=\"#e4dfd3\"/>\u003crect x=\"29\" y=\"11\" width=\"40\" height=\"13\" rx=\"5\" fill=\"#b6afa0\"/>\u003cpath d=\"M35 38h28\" stroke=\"white\"/>'};return '\u003cdiv class=\"thumb\">\u003csvg viewBox=\"0 0 100 100\" role=\"img\" aria-label=\"商品示意图\">'+shapes[type]+'\u003c/svg>\u003c/div>'}\nfunction filtered(){return orders.filter(o=>o.id.includes(query))}\nfunction list(){document.getElementById('heading').textContent='退款管理';document.getElementById('crumb').textContent='主页 / 工作台 / 退款管理';const data=filtered(),pages=Math.max(1,Math.ceil(data.length/size));page=Math.min(page,pages);app.innerHTML=`\u003cform class=\"filters\" id=\"search\">\u003clabel for=\"orderNo\">订单编号：\u003c/label>\u003cinput id=\"orderNo\" placeholder=\"订单编号\" value=\"${esc(draft)}\" autocomplete=\"off\">\u003cbutton class=\"primary\">查询\u003c/button>${query?'\u003cbutton type=\"button\" id=\"clear\">重置\u003c/button>':''}\u003c/form>\u003cdiv class=\"toolbar\">\u003cspan>共 ${data.length} 条退款记录\u003c/span>\u003cbutton class=\"primary\" id=\"export\">导出\u003c/button>\u003c/div>\u003cdiv class=\"scroll\">\u003cdiv class=\"table\">\u003cdiv class=\"grid head\">\u003cspan>宝贝\u003c/span>\u003cspan>交易金额\u003c/span>\u003cspan>退款金额\u003c/span>\u003cspan>申请时间\u003c/span>\u003cspan>原因\u003c/span>\u003cspan>发货物流\u003c/span>\u003cspan>退货物流\u003c/span>\u003cspan>退款状态\u003c/span>\u003c/div>${data.slice((page-1)*size,page*size).map(o=>`\u003carticle>\u003cdiv class=\"band\">\u003cspan class=\"tag\">仅退款\u003c/span>\u003cspan>退款编号: ${o.refund}\u003c/span>\u003cspan>订单号: \u003ca href=\"#detail/${o.id}\" data-order=\"${o.id}\">${o.id}\u003c/a>\u003c/span>\u003cspan>商品编号: ${o.sku}\u003c/span>\u003c/div>\u003cdiv class=\"grid row\">\u003cdiv class=\"product\">${art(o.item[3])}\u003cdiv>\u003ca class=\"title\" href=\"#detail/${o.id}\">${o.item[0]}\u003c/a>\u003cspan>颜色分类: ${o.item[1]}\u003c/span>\u003c/div>\u003c/div>\u003cspan>${money(o.item[2])}\u003c/span>\u003cspan>${money(o.item[2])}\u003c/span>\u003cspan>${o.date}\u003c/span>\u003cspan>${o.reason}\u003c/span>\u003cspan>${o.shipped?'已发货':'未发货'}\u003c/span>\u003cspan>-\u003c/span>\u003cspan class=\"status\">退款待处理\u003c/span>\u003c/div>\u003c/article>`).join('')||'\u003cdiv class=\"empty\">未找到匹配的订单，请重新输入订单编号\u003c/div>'}\u003c/div>\u003c/div>\u003cdiv class=\"pagination\">\u003cspan class=\"meta\">共 ${data.length} 条\u003c/span>\u003cbutton data-page=\"${page-1}\" ${page===1?'disabled':''}>上一页\u003c/button>${Array.from({length:pages},(_,i)=>`\u003cbutton data-page=\"${i+1}\" class=\"${page===i+1?'active':''}\" ${page===i+1?'aria-current=\"page\"':''}>${i+1}\u003c/button>`).join('')}\u003cbutton data-page=\"${page+1}\" ${page===pages?'disabled':''}>下一页\u003c/button>\u003cspan class=\"meta\">${size} 条/页\u003c/span>\u003cform class=\"page-jump\" id 03cdd>${money(o.item[2])}\u003c/dd>\u003cdt>退款状态\u003c/dt>\u003cdd class=\"status\">退款待处理\u003c/dd>\u003c/dl>\u003c/div>`;document.getElementById('back').onclick=()=>{if(history.state?.detail)history.back();else location.hash=''}}\nfunction route(){const match=location.hash.match(/^#detail\\/(\\d+)$/);if(match){detail(match[1]);history.replaceState({detail:true},'')}else{page=1;list()}window.scrollTo(0,0)}window.addEventListener('hashchange',route);\nfunction exportCSV(){const rows=[['订单号','商品','退款金额','退款状态'],...filtered().map(o=>[o.id,o.item[0],o.item[2],'退款待处理'])];const blob=new Blob(['\\ufeff'+rows.map(r=>r.map(x=>'\"'+String(x).replace(/\"/g,'\"\"')+'\"').join(',')).join('\\r\\n')],{type:'text/csv;charset=utf-8'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='退款记录.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}route();\n\u003c/script>\u003c/body>\u003c/html>\n","sku-lazy-training/dist/index.html":"\u003c!doctype html>\n\u003chtml lang=\"zh-CN\">\u003chead>\u003cmeta charset=\"utf-8\">\u003cmeta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\u003ctitle>SKU 属性填写 · 懒加载实训\u003c/title>\u003cstyle>\n:root{--blue:#2563eb;--ink:#17243c;--muted:#7d899e;--line:#e5eaf2}*{box-sizing:border-box}body{margin:0;background:#f5f7fb;color:var(--ink);font:14px/1.6 'Segoe UI','Microsoft YaHei',sans-serif}button,input,select{font:inherit}button{cursor:pointer;border:1px solid var(--line);background:white;border-radius:7px;padding:8px 15px;color:var(--ink)}button:hover{border-color:#8bacf4;background:#f5f8ff}button:disabled{opacity:.45;cursor:default}.primary{background:var(--blue);color:white;border-color:var(--blue)}.primary:hover{background:#1c52d0;color:white}.shell{display:flex;min-height:100vh}.side{width:208px;background:#101d36;color:#92a3bd;padding:28px 18px;flex-shrink:0}.brand{display:flex;align-items:center;gap:10px;color:white;font-size:18px;font-weight:700;padding:0 10px 34px}.logo{background:#3274ff;
