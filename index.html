er-collapse:collapse;width:100%;font-size:11px;margin-top:13px;text-align:left}th{color:#8a9eaa;font-weight:500}td,th{padding:7px 2px;border-bottom:1px solid #e5ecf0;white-space:nowrap}tbody tr:last-child td{border:0}code{font-family:Consolas,monospace;font-size:11px;color:#4a7280}.practice-accounts p{font-size:11px;line-height:1.8;color:#91a1ac;margin:11px 0 0}footer{text-align:center;color:#9aadb7;font-size:10px;margin-top:22px}.success-mark{display:grid;place-items:center;background:#e5f4ec;color:#398568;border-radius:50%;width:46px;height:46px;font-size:24px;margin-bottom:18px}.account-info{background:#f5f9f8;border:1px solid #e2ece7;border-radius:8px;margin:23px 0}.account-info>div{display:flex;justify-content:space-between;gap:12px;padding:12px 15px;border-bottom:1px solid #e4ece8;font-size:12px}.account-info>div:last-child{border:0}.account-info dt{color:#879c96}.account-info dd{margin:0;color:#365d50;overflow-wrap:anywhere}.active-dot{display:inline-block;width:6px;height:6px;background:#48a27c;border-radius:50%;margin-right:6px;vertical-align:middle}@media(max-width:480px){.login-shell{padding:24px 16px}.login-card{padding:25px 24px 18px}.brand{margin-bottom:20px}.practice-accounts{padding:13px}h1{font-size:25px}}\u003c/style>\u003c/head>\n\u003cbody>\n\u003cmain class=\"login-shell\">\n  \u003ca class=\"brand\" href=\"../课程体系/学习导航.html\" aria-label=\"返回课程首页\">\u003cspan class=\"brand-mark\">E\u003c/span>\u003cspan>企业工作台\u003csmall>ERP WORKSPACE\u003c/small>\u003c/span>\u003c/a>\n  \u003csection class=\"login-card\" aria-labelledby=\"page-title\">\n    \u003cdiv id=\"login-view\">\n      \u003cspan class=\"eyebrow\">WELCOME BACK\u003c/span>\u003ch1 id=\"page-title\">登录工作台\u003c/h1>\u003cp class=\"subtitle\">输入账号和密码，进入你的工作台。\u003c/p>\n      \u003cform id=\"login-form\" autocomplete=\"off\">\n        \u003clabel for=\"login-account\">账号\u003c/label>\u003cinput id=\"login-account\" name=\"account\" type=\"text\" placeholder=\"请输入账号\" autocomplete=\"off\" spellcheck=\"false\" required>\n        \u003clabel for=\"login-password\">密码\u003c/label>\u003cdiv class=\"password-wrap\">\u003cinput id=\"login-password\" name=\"password\" type=\"password\" placeholder=\"请输入密码\" autocomplete=\"off\" required>\u003cbutton id=\"toggle-password\" type=\"button\" aria-label=\"显示密码\" aria-pressed=\"false\">显示\u003c/button>\u003c/div>\n        \u003cbutton id=\"login-submit\" type=\"submit\" class=\"primary\">登录\u003c/button>\n      \u003c/form>\n    \u003c/div>\n    \u003cdiv id=\"account-view\" hidden>\n      \u003cspan class=\"success-mark\" aria-hidden=\"true\">✓\u003c/span>\u003cspan class=\"eyebrow\">SIGNED IN\u003c/span>\u003ch1 id=\"welcome-title\">登录成功\u003c/h1>\u003cp class=\"subtitle\">你已进入企业工作台。\u003c/p>\n      \u003cdl class=\"account-info\">\u003cdiv>\u003cdt>当前账号\u003c/dt>\u003cdd id=\"current-account\">\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>姓名\u003c/dt>\u003cdd id=\"current-name\">\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>账号状态\u003c/dt>\u003cdd>\u003cspan class=\"active-dot\">\u003c/span>正常\u003c/dd>\u003c/div>\u003c/dl>\n      \u003cbutton id=\"logout-button\" type=\"button\" class=\"primary\">退出登录，切换账号\u003c/button>\n    \u003c/div>\n    \u003cp id=\"login-status\" data-state=\"waiting\" role=\"status\" aria-live=\"polite\">请使用下方提供的练习账号。\u003c/p>\n  \u003c/section>\n  \u003cdetails class=\"practice-accounts\" open>\u003csummary>练习账号 \u003cspan>3 组不同账号密码\u003c/span>\u003c/summary>\u003cdiv class=\"table-scroll\">\u003ctable>\u003cthead>\u003ctr>\u003cth>姓名\u003c/th>\u003cth>账号\u003c/th>\u003cth>密码\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>张三\u003c/td>\u003ctd>\u003ccode>student01\u003c/code>\u003c/td>\u003ctd>\u003ccode>Learn@1001\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>李四\u003c/td>\u003ctd>\u003ccode>student02\u003c/code>\u003c/td>\u003ctd>\u003ccode>Learn@1002\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>王五\u003c/td>\u003ctd>\u003ccode>student03\u003c/code>\u003c/td>\u003ctd>\u003ccode>Learn@1003\u003c/code>\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>把账号、密码作为子流程参数，依次登录这三个账号，再读取当前账号核对结果。\u003c/p>\u003c/details>\n  \u003cfooter>RPA 登录练习 · 所有账号均为虚拟练习账号\u003c/footer>\n\u003c/main>\u003cscript>(() => {\n  'use strict';\n  const accounts = [\n    {account:'student01', password:'Learn@1001', name:'张三'},\n    {account:'student02', password:'Learn@1002', name:'李四'},\n    {account:'student03', password:'Learn@1003', name:'王五'}\n  ];\n  const $ = selector => document.querySelector(selector);\n  const form = $('#login-form'), status = $('#login-status');\n  function clearInvalid() {\n    $('#login-account').removeAttribute('aria-invalid');\n    $('#login-password').removeAttribute('aria-invalid');\n  }\n  function hidePassword() {\n    $('#login-password').type = 'password';\n    $('#toggle-password').textContent = '显示';\n    $('#toggle-password').setAttribute('aria-label', '显示密码');\n    $('#toggle-password').setAttribute('aria-pressed', 'false');\n  }\n  form.addEventListener('submit', event => {\n    event.preventDefault();\n    const account = $('#login-account').value.trim();\n    const password = $('#login-password').value;\n    const user = accounts.find(item => item.account === account && item.password === password);\n    clearInvalid();\n    if (!user) {\n      status.dataset.state = 'error';\n      status.textContent = '账号或密码错误，请重试。';\n      $('#login-account').setAttribute('aria-invalid', 'true');\n      $('#login-password').setAttribute('aria-invalid', 'true');\n      $('#login-password').focus();\n      return;\n    }\n    $('#current-account').textContent = user.account;\n    $('#current-name').textContent = user.name;\n    $('#welcome-title').textContent = '欢迎，' + user.name;\n    $('#login-view').hidden = true;\n    $('#account-view').hidden = false;\n    $('#login-password').value = '';\n    hidePassword();\n    status.dataset.state = 'success';\n    status.textContent = '登录成功，当前账号：' + user.account;\n    $('#logout-button').focus();\n  });\n  form.addEventListener('input', () => {\n    clearInvalid();\n    if (status.dataset.state === 'error') {\n      status.dataset.state = 'waiting';\n      status.textContent = '请使用下方提供的练习账号。';\n    }\n  });\n  $('#toggle-password').onclick = () => {\n    const visible = $('#login-password').type === 'password';\n    $('#login-password').type = visible ? 'text' : 'password';\n    $('#toggle-password').textContent = visible ? '隐藏' : '显示';\n    $('#toggle-password').setAttribute('aria-label', visible ? '隐藏密码' : '显示密码');\n    $('#toggle-password').setAttribute('aria-pressed', String(visible));\n  };\n  $('#logout-button').onclick = () => {\n    $('#account-view').hidden = true;\n    $('#login-view').hidden = false;\n    $('#current-account').textContent = '';\n    $('#current-name').textContent = '';\n    $('#welcome-title').textContent = '登录成功';\n    form.reset(); clearInvalid(); hidePassword();\n    status.dataset.state = 'waiting';\n    status.textContent = '已退出登录，请输入下一组账号密码。';\n    $('#login-account').focus();\n  };\n})();\n\u003c/script>\n\u003c/body>\u003c/html>\n","常见错误/常见错误速查.html":"\u003c!doctype html>\n\u003chtml lang=\"zh-CN\">\n\u003chead>\n\u003cmeta charset=\"utf-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\n\u003ctitle>RPA 常见错误速查\u003c/title>\n\u003cstyle>*{box-sizing:border-box}body{margin:0;background:#f3f6fa;color:#253b50;font:14px/1.75 system-ui,-apple-system,\"Microsoft YaHei\",sans-serif}button,input,select{font:inherit}button{cursor:pointer;border:1px solid #d5e0e8;background:white;color:#36536a;border-radius:7px;padding:7px 12px}button:hover{background:#eef6f8;border-color:#76b9ba}button:focus-visible,a:focus-visible,summary:focus-visible{outline:3px solid #58b3ba;outline-offset:3px}input:focus,select:focus{outline:2px solid #58b3ba;outline-offset:2px}a{color:#167f85;text-underline-offset:3px}.wrap{max-width:1140px;margin:auto;padding:0 24px}header{background:#172f45;color:#fff;padding:48px 0 44px}h1{font-size:34px;line-height:1.35;margin:12px 0 16px;letter-spacing:-.5px}header p{color:#bed0de;max-width:780px;margin:0}.eyebrow{font-size:11px;letter-spacing:2px;color:#167f85}header .eyebrow{color:#65e0dc}.header-tags{display:flex;flex-wrap:wrap;gap:10px;margin-top:25px}.header-tags span{font-size:12px;padding:4px 11px;border:1px solid #3d5367;border-radius:5px;color:#d2e3ec}h2{font-size:20px;margin:0 0 14px}h3{line-height:1.5}.first-check{margin:28px 0;background:#e7f3f1;border:1px solid #c9e4de;border-left:4px solid #158984;border-radius:10px;padding:24px}.first-check h2{font-size:17px}.first-check ol{padding:0;margin:0;list-style:none;display:grid;grid-template-columns:repeat(4,1fr);gap:20px;counter-reset:step}.first-check li{counter-increment:step}.first-check li b{display:block;font-size:14px;color:#205b55}.first-check li b:before{content:\"0\" counter(step) \" \";color:#168a84}.first-check li span{display:block;font-size:12px;color:#5a7874;margin-top:6px}.lookup{background:#fff;border:1px solid #dfe6ed;border-radius:12px;padding:26px}.section-heading{display:flex;align-items:center;justify-content:space-between;gap:12px}.section-heading h2{margin:4px 0 20px;font-size:25px}.section-heading>button{font-size:12px}.search-label{display:block;font-size:12px;color:#637f92;margin-bottom:8px}.search-row{display:flex;align-items:stretch;gap:12px}#errorSearch{width:100%;min-width:0;flex:1;padding:13px 16px;border:1px solid #bdcfdc;border-radius:8px;background:#fafcfe;color:#233b51}.policy-label{display:flex;align-items:center;gap:8px;font-size:12px;white-space:nowrap;color:#637f92}select{max-width:100%;border:1px solid #d5e0e8;border-radius:7px;background:white;color:#36536a;padding:12px}.hot-search{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:14px 0 22px}.hot-search span{font-size:12px;color:#8498a8}.hot-search button{font-size:12px;padding:3px 10px;border-color:#e2eaf0;background:#f7f9fc}.categories{display:flex;gap:8px;flex-wrap:wrap;border-bottom:1px solid #e6edf2;padding-bottom:22px}.categories button[aria-pressed=true]{background:#177e81;border-color:#177e81;color:#fff}.results-bar{display:flex;align-items:center;justify-content:space-between;gap:10px}.results-bar p{font-size:12px;color:#6a8193}.results-bar button{font-size:12px;border:0}.results{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.error-card{border:1px solid #dee7ed;border-radius:10px;padding:20px;align-self:start;min-width:0}.card-top{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:11px}.error-id{color:#8a9eaf;font-variant-numeric:tabular-nums}.badge{padding:3px 9px;border-radius:4px;background:#edf6f0;color:#2e7d59}.badge.verify{background:#fff3df;color:#986b20}.badge.fix{background:#edf1fa;color:#4f6f9e}.error-card h3{font-size:17px;margin:10px 0 8px;color:#1e3c52}.symptom{font-size:13px;color:#647f92;margin:0 0 12px}.category{color:#16878a;font-size:11px}details{border-top:1px solid #e6edf2;margin-top:14px;padding-top:10px}summary{cursor:pointer;color:#167e84;font-size:13px;padding:3px 0}.detail-section{margin-top:16px}.detail-section h4{font-size:12px;color:#214f61;margin:0 0 5px}.detail-section p{margin:0;font-size:13px;color:#536c7f}.detail-section ol{margin:0;padding-left:20px;font-size:13px;color:#536c7f}.detail-section li+li{margin-top:5px}.detail-actions{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:18px}.detail-actions a,.detail-actions button{font-size:12px}.detail-actions a{background:#eaf5f3;border:1px solid #cce4de;border-radius:6px;padding:6px 10px;text-decoration:none}.empty{padding:36px 15px;text-align:center;color:#6d8597}.empty h3{color:#355568}.note{padding:24px;border-left:4px solid #5e829a;background:#eaf0f5;border-radius:8px;margin-top:24px}.note h2{font-size:17px}.note p,footer p{font-size:13px;color:#627b8e;margin:0;line-height:1.9}footer{padding:30px 4px 40px}footer h2{font-size:14px}footer p+p{margin-top:10px}#copyStatus:not(:empty){position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#203d4d;color:#fff;border-radius:8px;padding:10px 20px;box-shadow:0 5px 20px #172f4530;max-width:90vw;text-align:center;font-size:13px}@media(max-width:760px){.first-check ol{grid-template-columns:repeat(2,1fr)}.search-row{flex-direction:column}.policy-label{justify-content:space-between}.policy-label select{flex:1}.results{grid-template-columns:1fr}.wrap{padding:0 16px}.lookup{padding:20px}.first-check{padding:20px}h1{font-size:28px}header{padding:32px 0}.error-card{padding:17px}.categories button{font-size:12px;padding:6px 9px}.hot-search{gap:6px}.note{padding:20px}}@media(prefers-reduced-motion:no-preference){html{scroll-behavior:smooth}}\n.ppt-method{background:#fff;border:1px solid #dfe6ed;border-radius:10px;padding:20px 24px;margin-bottom:24px}.ppt-method h2{font-size:16px;margin-bottom:10px}.ppt-method p{font-size:13px;color:#5c778b;margin:0 0 8px}.ppt-method b{color:#27646e;margin-right:4px}.ppt-method small{color:#7b8c9b;font-size:11px}.lookup button:disabled{opacity:.45;cursor:default}\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\u003cheader>\u003cdiv class=\"wrap\">\u003cspan class=\"eyebrow\">RPA FIELD GUIDE / 故障排查\u003c/span>\u003ch1>流程卡住了，从这里查。\u003c/h1>\u003cp>按报错或现象查原因，照着步骤排查，再回到练习中验证。不同工具的报错文字可能不同。\u003c/p>\u003cdiv class=\"header-tags\">\u003cspan>32 类常见问题\u003c/span>\u003cspan>原因 → 排查 → 处理 → 验证\u003c/span>\u003cspan>离线可用\u003c/span>\u003c/div>\u003c/div>\u003c/header>\n\u003cmain class=\"wrap\">\n\u003csection class=\"first-check\" aria-labelledby=\"firstTitle\">\u003ch2 id=\"firstTitle\">先确认这四件事\u003c/h2>\u003col>\u003cli>\u003cb>停在哪一步\u003c/b>\u003cspan>记录指令、完整报错、业务编号和截图。\u003c/span>\u003c/li>\u003cli>\u003cb>当前在哪个页面\u003c/b>\u003cspan>核对窗口、标签页、iframe 和登录状态。\u003c/span>\u003c/li>\u003cli>\u003cb>操作有没有生效\u003c/b>\u003cspan>查询业务结果，确认是否已保存或提交。\u003c/span>\u003c/li>\u003cli>\u003cb>恢复后从哪条继续\u003c/b>\u003cspan>保留完成记录，确定重试、跳过或人工复核。\u003c/span>\u003c/li>\u003c/ol>\u003c/section>\n\u003csection class=\"ppt-method\">\u003ch2>沿用 PPT 中的排查方法\u003c/h2>\u003cp>\u003cb>断点与日志\u003c/b>留住报错现场，查看当前值和类型；\u003cb>样本与拆分\u003c/b>用固定样本单独测试子流程，再核对模块间输入输出；\u003cb>控制变量\u003c/b>每次只改一个条件，对比成功与失败；\u003cb>循环定位\u003c/b>在异常分支记录当前编号、循环位置和错误，保留原因后再决定是否继续。\u003c/p>\u003csmall>参考所提供 PPT 第 22、26、38–39、44 页。异常捕获后仍需记录和处理，避免静默忽略。\u003c/small>\u003c/section>\n\u003csection class=\"lookup\" aria-labelledby=\"lookupTitle\">\u003cdiv class=\"section-heading\">\u003cdiv>\u003cspan class=\"eyebrow\">QUICK LOOKUP\u003c/span>\u003ch2 id=\"lookupTitle\">常见错误速查\u003c/h2>\u003c/div>\u003cbutton id=\"resetFilters\" type=\"button\">清空筛选\u003c/button>\u003c/div>\n\u003clabel class=\"search-label\" for=\"errorSearch\">输入报错、操作或现象\u003c/label>\u003cdiv class=\"search-row\">\u003cinput id=\"errorSearch\" type=\"search\" placeholder=\"例如：找不到元素、timeout、登录失效、Excel\" autocomplete=\"off\">\u003clabel class=\"policy-label\" for=\"policyFilter\">处理方式\u003cselect id=\"policyFilter\">\u003coption value=\"all\">全部处理方式\u003c/option>\u003coption value=\"retry\">可有限重试\u003c/option>\u003coption value=\"verify\">先核验结果\u003c/option>\u003coption value=\"fix\">修正后再运行\u003c/option>\u003c/select>\u003c/label>\u003c/div>\n\u003cdiv class=\"hot-search\" aria-label=\"常用搜索\">\u003cspan>快速查\u003c/span>\u003cbutton type=\"button\" data-search=\"找不到元素\">找不到元素\u003c/button>\u003cbutton type=\"button\" data-search=\"超时\">超时\u003c/button>\u003cbutton type=\"button\" data-search=\"重复提交\">重复提交\u003c/button>\u003cbutton type=\"button\" data-search=\"登录失效\">登录失效\u003c/button>\u003cbutton type=\"button\" data-search=\"Excel\">Excel\u003c/button>\u003c/div>\n\u003cdiv id=\"categories\" class=\"categories\" role=\"group\" aria-label=\"按错误类型筛选\">\u003c/div>\n\u003cdiv class=\"results-bar\">\u003cp id=\"resultCount\" role=\"status\" aria-live=\"polite\">\u003c/p>\u003cbutton id=\"expandAll\" type=\"button\">展开全部结果\u003c/button>\u003c/div>\n\u003cdiv id=\"results\" class=\"results\">\u003c/div>\u003cdiv id=\"empty\" class=\"empty\" hidden>\u003ch3>暂时没有匹配的问题\u003c/h3>\u003cp>试试缩短关键词，或清空类型和处理方式筛选。\u003c/p>\u003cbutton id=\"emptyReset\" type=\"button\">查看全部问题\u003c/button>\u003c/div>\u003c/section>\n\u003csection class=\"note\">\u003ch2>页面提示失败，和指令执行异常怎么区分？\u003c/h2>\u003cp>点击指令执行成功，只说明这次操作完成了。页面仍可能提示“提交失败”“金额不能为空”或“登录已失效”。流程需要读取业务反馈，再判断下一步；对已经提交但结果不明的记录，先查询确认，避免重复写入。\u003c/p>\u003c/section>\n\u003cfooter>\u003ch2>参考与使用方式\u003c/h2>\u003cp>课程参考《开发规范培训-和需求文档收集 - 报错排除-专题培训》共 52 页，相关卡片已标出页码。部分原页为提问或演示，本页的原因、排查步骤与验收条件为补充整理，需结合实际现场判断。\u003c/p>\u003cp>本页是通用排查清单。重试次数、等待时限和验收条件应按业务设置；卡片中的次数仅为练习示例。故障练习场可在老师控制台选择对应场景。\u003c/p>\u003cp>定位与浏览器动作可参考 \u003ca href=\"https://learn.microsoft.com/en-us/power-automate/desktop-flows/actions-reference/webautomation\" target=\"_blank\" rel=\"noopener noreferrer\">Microsoft 浏览器自动化文档\u003c/a>；重试与异常分支可参考 \u003ca href=\"https://learn.microsoft.com/en-us/power-automate/desktop-flows/errors\" target=\"_blank\" rel=\"noopener noreferrer\">Microsoft 错误处理文档\u003c/a>；文件占用可参考 \u003ca href=\"https://support.microsoft.com/en-gb/excel/excel-file-is-locked-for-editing?nochrome=true\" target=\"_blank\" rel=\"noopener noreferrer\">Excel 文件锁定说明\u003c/a>。\u003c/p>\u003c/footer>\n\u003c/main>\u003cdiv id=\"copyStatus\" role=\"status\" aria-live=\"polite\">\u003c/div>\n\u003cscript>(() => {\n  'use strict';\n  const practice = {\n    element:'../element-classroom/元素编辑互动课堂.html',\n    orders:'../order-fault-lab/订单故障练习场.html',\n    refund:'../refund-return-demo/退款管理返回故障演示.html',\n    lazy:'../SKU属性填写实战练习/01-滚动懒加载.html',\n    pages:'../SKU属性填写实战练习/02-分页填写.html',\n    form:'../SKU属性填写实战练习/06-类目联动属性.html',\n    paste:'../SKU属性填写实战练习/07-表格粘贴导入.html'\n  };\n  const entries = [];\n  function add(category,title,symptom,cause,checks,action,verify,policy,exercise='',slides='') {\n    entries.push({id:'RPA-'+String(entries.length+1).padStart(2,'0'),category,title,symptom,cause,checks,action,verify,policy,exercise,slides});\n  }\n  add('元素定位','找不到元素 / Element not found','页面上看得到按钮，运行时提示未找到、无法定位。','页面状态不同，或定位条件包含变化的文本、ID、层级。',\n    ['在报错时暂停，核对网址、业务编号和目标是否已经出现。','检查定位规则中哪些属性会随刷新、账号或数据变化。','刷新和切换两条数据，检查是否都只匹配一个目标。'],\n    '保留稳定属性和业务标识；调整易变条件后重新验证。定位不到时先查页面状态。','在不同数据和刷新后均能唯一定位同一个业务目标。','fix','element','36');\n  add('元素定位','定位到多个元素，或点错同名按钮','“查询”“保存”重复出现，流程操作了另一行。','定位范围太大，未限定弹窗、表格行或业务编号。',\n    ['查看定位结果数量。','确认同名按钮是否同时出现在列表、详情和隐藏区域。'],\n    '先按订单号或 SKU 定位行，再定位行内按钮；为弹窗设置明确范围。','只操作指定编号，其他记录和弹窗不受影响。','fix','element');\n  add('元素定位','iframe 内元素捕获不到','能看到输入框，但主页面定位不到，或切换框架后才找到。','目标在内嵌框架内，流程使用了错误的页面或框架上下文。',\n    ['确认目标是否属于 iframe；本网站练习内容也在内嵌框架中。','核对工具捕获的框架路径，留意嵌套框架和刷新后的变化。'],\n    '获取正确页面后定位对应框架，再操作框架内元素；页面重载后重新确认上下文。','能连续定位框架内多个目标，回到外层页面后也能正常操作。','fix','element');\n  add('元素定位','循环时元素失效 / Stale element','第一条正常，翻页、删除或刷新后提示元素 ID 失效。','页面重绘使之前保存的元素对象失效。',\n    ['记录失败前是否翻页、删除、排序或刷新列表。','确认循环使用的是旧元素对象，还是每次重新定位。'],\n    '用业务编号保存处理目标，每轮在当前页面重新获取元素。选择合适的索引或条件循环；仅更换循环名称不能保证修复。','连续翻页或页面重绘后，目标仍可定位且无重复、遗漏。','fix','pages','37');\n  add('等待与交互','等待超时 / Timeout','页面加载慢，等待详情、按钮或结果超过时限。','网络或异步处理变慢，也可能页面已进入异常分支。',\n    ['记录超时对象和已等待时长，查看是否出现错误提示或登录页。','检查等待的是目标可见、可用，还是仅等待固定秒数。'],\n    '等待可观察的完成条件，设置总时限。对只读查询可有限重试，例如最多 3 次；提交结果不明时先核验。','慢加载能继续；持续异常会在时限内退出并记录原因。','retry','orders');\n  add('等待与交互','弹窗或遮罩挡住了按钮','元素找到了，但点击被拦截、落到遮罩或一直没有反应。','公告、确认框、加载遮罩或文件对话框占据操作区域。',\n    ['查看报错截图，检查弹窗、半透明遮罩和系统对话框。','判断弹窗是网页元素还是独立窗口。'],\n    '识别并处理已知弹窗，等待遮罩消失后再操作；未知弹窗保留截图转人工。','关闭弹窗后原操作生效，不会误点遮罩后的其他按钮。','fix','orders','41');\n  add('等待与交互','滚动了，但后面的数据没加载','只处理首屏，或重复滚动却找不到下一批。','列表是懒加载或虚拟列表，实际滚动容器和数据终止条件不明确。',\n    ['检查滚动的是页面还是列表内部容器。','记录每轮新增业务编号，判断数据是否还在变化。'],\n    '滚动正确容器，等待新增数据再读取；以结束提示和新增数量判断终止，并设置最大轮次。','目标数量齐全且编号唯一，没有靠固定滚动次数提前结束。','retry','lazy');\n  add('等待与交互','点击不报错，但业务没有变化','按钮能定位，点击指令成功，页面却没出现预期结果。','可能存在按钮禁用、遮挡、错误点击方式或业务校验失败。',\n    ['点击前查看按钮可用状态，点击后读取提示和业务状态。','在同一页面对比手动操作，确认真正的可点击区域。'],\n    '先确定实际触发目标，再选择工具支持的点击方式；增加结果检查，对提交操作先核对是否已写入。','从业务状态或记录确认生效，而非只看点击指令是否成功。','verify','orders','31');\n  add('数据填写','必填数据为空 / None / null','金额缺失、空值输入报错，或把空值填成文字。','上游字段缺失、取错列，或没有在使用前校验。',\n    ['打印当前编号、字段名、值和类型，避免记录密码等敏感值。','检查来源数据是否确实为空，是否取到了错误的行或字段。'],\n    '必填值缺失时记录数据异常；有业务约定才使用默认值。修正数据后重跑该条。','异常记录有原因，正常记录继续，缺失金额没有被当作 0 提交。','fix','orders');\n  add('数据填写','数组不能转字符串 / 类型不匹配','Can not convert Array to String，或字符串与数字不能直接计算。','把列表、对话框返回值或对象直接传给只接受文本、数字的指令。',\n    ['在输入前查看变量实际类型与结构。','确认需要列表中的哪个字段或第几项，以及是否可能为空。'],\n    '按指令要求提取具体值，再做明确类型转换。金额先处理单位和分隔符；编号保留为文本以免丢前导零。','文本框内容正确，数值可参与计算，长编号和前导零保持完整。','fix','paste','28、38');\n  add('数据填写','写错 Excel 行列 / 覆盖上一条','流程运行完成，但结果写到了其他行或错误工作表。','行号基准、表头偏移、工作表选择或列映射不一致。',\n    ['打印业务编号、当前行号、工作表和目标列。','用两三条样本核对表头、首条数据和末条数据。'],\n    '显式建立字段与列映射，用业务编号核对写入行；回填完成标记前检查目标值。','源数据与结果按业务编号逐条对应，没有覆盖无关记录。','fix','paste');\n  add('数据填写','输入看似成功，保存仍提示不能为空','界面显示了文字，联动字段或提交校验却没接受。','输入事件未触发、字段随后被重置，或联动选项尚未加载。',\n    ['输入后移出焦点，观察校验和关联字段。','检查上游选项变化后，当前字段是否被重新生成。'],\n    '按控件交互方式填写，等待联动字段出现并回读值，再执行保存。','提交后重新打开记录，实际保存值与输入一致。','fix','form','29');\n  add('页面流程','登录失效 / 会话过期 / Session expired','突然返回登录页，原来的订单元素全部消失。','会话过期、账号被退出，或操作触发了重新认证。',\n    ['识别登录页或会话提示，记录中断业务编号。','检查已完成结果、当前条是否已提交，以及恢复点。'],\n    '保存进度后恢复登录，再明确选择重新处理或记录跳过。登录成功后重新获取页面和元素。','已完成结果保留，当前条状态清楚，下一条目标正确。','fix','orders');\n  add('页面流程','操作了错误的标签页或窗口','新页面已打开，后续指令仍在旧页面执行，或遗留很多 tab。','使用了旧网页对象，未获取新页面，或重试不断创建窗口。',\n    ['列出当前页面标题、URL 与目标业务编号。','检查每次打开页面后的对象输出，以及关闭页面的时机。'],\n    '明确获取并传递目标页面对象；仅关闭流程确认无用的标签页，限制重复创建。','每步均在预期窗口执行，重复运行后没有持续增加的遗留页面。','fix','element','15');\n  add('页面流程','详情返回后页码丢失','从第 3 页看详情，返回后变成第 1 页，后续采集漏条。','页面返回时重建列表，没有自动恢复页码和查询状态。',\n    ['进入详情前记录筛选条件、页码和业务编号。','返回后检查实际页码与当前已处理集合。'],\n    '根据页面实际状态恢复筛选和页码；用业务编号去重后继续。','跨页采集无重无漏，返回后不会跳过待处理记录。','fix','refund');\n  add('页面流程','循环重复、漏处理或停不下来','同一条不断被处理，翻页后遗漏记录，或空列表仍继续。','循环范围、退出条件、游标更新或去重逻辑不完整。',\n    ['记录每轮的业务编号、页码、数量和退出条件。','检查列表是否在处理后重新排序，末页按钮是否不可用。'],\n    '建立已处理编号集合，明确空列表和末页出口；设置最大轮次并对照总数。','输入与输出数量可核对，每条有结果，末页能停止。','fix','pages','38');\n  add('文件与环境','文件或路径不存在 / File not found','读取、上传、保存失败；换电脑后才报错。','路径写死、目录未创建、文件名变更或运行账户不同。',\n    ['打印实际解析后的完整路径，确认文件存在。','核对运行账户、文件扩展名、日期命名与访问权限。'],\n    '把基础目录做成配置，拼接并验证路径；输出前创建允许写入的目录。','换目录或运行账户后能明确找到文件，失败时记录具体路径。','fix','','35');\n  add('文件与环境','Excel 文件被占用 / 无法写入','提示锁定、只读，或保存时失败。','文件正被其他进程或用户使用，或当前打开方式为只读。',\n    ['检查只读状态、文件锁定提示及打开文件的进程。','确认流程是否关闭了自己创建的 Excel 实例。'],\n    '协调释放占用后再写入；必要时保存为新副本。操作完成后释放本流程创建的资源。','目标文件可重新打开，回读结果正确，未覆盖其他人正在编辑的内容。','fix');\n  add('文件与环境','下载按钮点了，但文件没找到','等待下载超时，或后续读取了旧文件。','下载目录或文件名不符、下载未完成，也可能出现“另存为”对话框。',\n    ['检查浏览器实际下载记录、保存目录和本次文件名。','确认是否弹出系统对话框，或仍有临时下载文件。'],\n    '统一本次下载的路径和命名；根据工具设置处理对话框；等待完成后检查文件是否可读。','读到的是本次完整文件，文件名、大小与内容符合预期。','retry','','34');\n  add('文件与环境','浏览器连接失败 / 无法捕获元素','无法接管网页，或所有网页元素都无法捕获。','浏览器实例、扩展连接、权限或运行账户不一致。',\n    ['先用空白测试页检查浏览器连接，再测试业务页面。','核对自动化工具支持的浏览器配置、当前扩展连接和运行账户。'],\n    '按工具官方文档修复连接配置，再获取网页对象；保留完整错误信息以便定位。','可以捕获并操作一个简单输入框，再恢复业务流程。','fix','','33');\n  add('提交与恢复','偶发查询或提交失败','第一次失败，稍后重试可以成功。','临时网络或服务异常；是否已经写入需要单独确认。',\n    ['区分只读查询和会产生写入的提交。','读取明确失败提示；超时或回执丢失时先查业务结果。'],\n    '对确认可安全重做的操作有限重试，例如最多 3 次并逐次等待；用编号记录次数和最终状态。','临时失败能恢复，尝试有上限，实际只写入一次。','retry','orders');\n  add('提交与恢复','持续失败导致无限重试','同一记录反复报错，后面的正常记录一直不处理。','输入或业务规则不满足，却把所有失败都当作临时异常。',\n    ['查看每次失败原因是否相同、参数是否真的发生变化。','确认最大重试次数和耗时上限是否生效。'],\n    '数据或规则错误先修正；达到重试上限后记录失败并进入约定分支。','失败条有完整原因和次数，其余记录按约定继续处理。','fix','orders');\n  add('提交与恢复','结果不明又提交，产生重复数据','按钮点过或提示超时，重试后出现重复订单、重复写入。','将“没收到成功提示”误判成“没提交成功”。',\n    ['按唯一业务编号查询服务器或页面中的已有结果。','对照实际写入次数与提交次数，确认是否只是回执丢失。'],\n    '先核验结果；已成功就补记完成状态，确认未写入才重做。系统支持时使用业务去重键。','重复运行不会重复写入，日志能说明结果如何确认。','verify','orders');\n  add('提交与恢复','中断后从头跑 / 断点续跑重复','流程关闭后不知道处理到哪条，重启又操作已完成记录。','进度只在内存里，或提交与完成标记的顺序不可靠。',\n    ['核对业务编号、最后确认结果和本地进度。','区分已完成、待处理、失败与结果不明的记录。'],\n    '持久保存逐条结果，重启时先核对结果不明条，再处理剩余记录。','中途停止后继续运行，已完成记录不再重复提交。','verify','orders');\n  add('流程与变量','结束符缺失、错位或嵌套不匹配','End IF、循环结束标记或异常处理结构报错。','开始和结束节点配对错误，或拖动后嵌套关系变化。',\n    ['从最内层向外核对 IF、循环与异常处理的开始和结束节点。','用最小数据走一遍条件成立和不成立两种分支。'],\n    '恢复正确的配对和缩进范围，再逐层恢复复杂逻辑。','每条分支进入和退出都符合预期，没有执行到错误的循环范围。','fix','','23');\n  add('流程与变量','指令参数配置不符合要求','参数值看似存在，但指令报类型、格式或范围错误。','参数引用了错误变量，或把 Excel 对象本身作为单元格内容等。',\n    ['逐项核对输入参数要求与实际类型；查看输出对象是否被误用。','使用一条明确的样本数据单独验证该指令。'],\n    '按参数用途区分实例对象、文本、数字、列表与路径，重新绑定正确变量。','样本可正常执行，恢复整段流程后输入类型仍符合要求。','fix','','24');\n  add('流程与变量','网页对象被覆盖 / 对象类型错误','前面浏览器操作正常，后面却无法使用网页对象。','原网页变量被元素、文本或另一种对象赋值覆盖。',\n    ['在失败指令前查看网页变量类型和最后一次赋值位置。','排查循环输出变量、子流程输出与网页对象是否同名。'],\n    '分别命名 webpage、element、row_data 等变量；重新获取正确页面并修正传递关系。','整个流程中网页对象始终指向有效页面，循环后也能继续使用。','fix','','25');\n  add('流程与变量','模块 A、B 单独正常，合起来异常','各子流程测试都通过，组合后登录失败或数据不符合预期。','输入输出契约不一致、共享变量被修改，或缺少前置状态。',\n    ['在 A 的出口和 B 的入口记录字段、类型与业务编号。','准备固定样本数据，拆分运行；每次只调整一个条件。'],\n    '明确子流程参数、输出、前置页面与资源归属；为缺失输入增加校验。','固定样本在独立和组合运行下结果一致，异常输入有明确出口。','fix','','22、26、44');\n  add('数据填写','Excel 删除行后漏删、错行','删除流程没有报错，但相邻的目标行没有全部删除。','删除当前行后下面的行上移，原行号或正向循环下标失效。',\n    ['用两条相邻待删记录测试，观察第一次删除后行号变化。','确认行号来自原始快照，还是实时表格。'],\n    '先收集待删除的行号，再按行号从大到小删除；或按业务标识重新定位并校验。','相邻目标全部删除，非目标记录保留，剩余数量与预期一致。','fix','','27');\n  add('流程与变量','单步调试正常，完整运行却失败','单独执行指令或手动校验正常，整段运行时仍报错。','单步时的变量、文件对象和页面状态与实际运行时不同，也可能存在时序变化。',\n    ['在真正失败的位置设断点，查看当前变量、页面、Excel 实例与资源状态。','打印失败前后关键值，保留本轮编号，不用成功后的页面代替现场。'],\n    '补齐前置条件和状态等待，避免其他步骤提前关闭、重置或覆盖资源。','从头连续运行也能通过，日志可以还原失败时的状态。','fix','','22、30、32、44');\n  add('文件与环境','换电脑、锁屏或定时运行失败','手动运行正常，调度运行、远程会话或另一台机器上失败。','运行会话、屏幕渲染、缩放、权限和文件路径与调试环境不同。',\n    ['核对运行账户、锁屏、休眠、会话连接、分辨率和缩放。','区分依赖图像或桌面的指令与网页元素指令，检查实际失败的那一步。'],\n    '按当前工具要求配置运行会话；统一必要的显示设置和路径配置。涉及云桌面时按对应官方部署文档配置。','在计划使用的账户、会话与调度方式下完成整轮验证。','fix','','35');\n  add('流程与变量','自定义指令突然报错','原来能用的自定义指令在更新或环境变化后失败。','指令版本、依赖或接口行为发生变化，也可能输入已不同。',\n    ['先核对输入与上次成功时是否一致，再检查自定义指令版本和更新记录。','用最小样本复现，记录完整错误和依赖版本。'],\n    '阅读该指令的发布说明，在测试副本中验证兼容版本；通过后再用于原流程。','最小样本和实际业务样本都通过，版本与使用条件有记录。','fix','','40');\n\n  const $ = s => document.querySelector(s);\n  const esc = value => String(value).replace(/[&\u003c>\"']/g,c=>({'&':'&amp;','\u003c':'&lt;','>':'&gt;','\"':'&quot;',\"'\":'&#39;'}[c]));\n  const labels = {retry:'可有限重试',verify:'先核验结果',fix:'修正后再运行'};\n  const categories = ['全部',...new Set(entries.map(x=>x.category))];\n  let category='全部',expanded=false,toastTimer;\n  document.querySelector('.header-tags span').textContent=entries.length+' 类常见问题';\n  $('#categories').innerHTML=categories.map(x=>'\u003cbutton type=\"button\" data-category=\"'+esc(x)+'\" aria-pressed=\"'+(x===category)+'\">'+esc(x)+'\u003c/button>').join('');\n  function render() {\n    const terms=$('#errorSearch').value.trim().toLocaleLowerCase().split(/\\s+/).filter(Boolean);\n    const policy=$('#policyFilter').value;\n    const filtered=entries.filter(e=>(category==='全部'||e.category===category)&&(policy==='all'||e.policy===policy)&&terms.every(term=>(Object.values(e).flat().join(' ')+' '+labels[e.policy]).toLocaleLowerCase().includes(term)));\n    $('#resultCount').textContent='找到 '+filtered.length+' / '+entries.length+' 类问题'+(category==='全部'?'':' · '+category);\n    $('#empty').hidden=filtered.length>0;\n    $('#expandAll').disabled=filtered.length===0;\n    $('#expandAll').textContent=expanded?'收起全部结果':'展开全部结果';\n    $('#results').innerHTML=filtered.map(e=>`\u003carticle class=\"error-card\" data-error-id=\"${e.id}\">\u003cdiv class=\"card-top\">\u003cspan class=\"error-id\">${e.id}\u003c/span>\u003cspan class=\"badge ${e.policy}\">${labels[e.policy]}\u003c/span>\u003c/div>\u003ch3>${esc(e.title)}\u003c/h3>\u003cp class=\"symptom\">${esc(e.symptom)}\u003c/p>\u003cspan class=\"category\">${esc(e.category)}\u003c/span>\u003cdetails${expanded?' open':''}>\u003csummary>查看原因与排查步骤\u003c/summary>\u003cdiv class=\"detail-section\">\u003ch4>常见原因\u003c/h4>\u003cp>${esc(e.cause)}\u003c/p>\u003c/div>\u003cdiv class=\"detail-section\">\u003ch4>按顺序排查\u003c/h4>\u003col>${e.checks.map(x=>'\u003cli>'+esc(x)+'\u003c/li>').join('')}\u003c/ol>\u003c/div>\u003cdiv class=\"detail-section\">\u003ch4>处理办法\u003c/h4>\u003cp>${esc(e.action)}\u003c/p>\u003c/div>\u003cdiv class=\"detail-section\">\u003ch4>处理后怎么验证\u003c/h4>\u003cp>${esc(e.verify)}\u003c/p>\u003c/div>${e.slides?'\u003cdiv class=\"detail-section\">\u003ch4>PPT 参考\u003c/h4>\u003cp>《报错排除专题培训》第 '+esc(e.slides)+' 页；排查与验证步骤为结合课程补充整理。\u003c/p>\u003c/div>':''}\u003cdiv class=\"detail-actions\">${e.exercise?'\u003ca href=\"'+practice[e.exercise]+'\">前往相关练习 ↗\u003c/a>':''}\u003cbutton type=\"button\" data-copy=\"${e.id}\">复制排查清单\u003c/button>\u003c/div>\u003c/details>\u003c/article>`).join('');\n    $('#categories').querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.category===category)));\n  }\n  function reset(){category='全部';expanded=false;$('#errorSearch').value='';$('#policyFilter').value='all';render();}\n  $('#errorSearch').addEventListener('input',render);\n  $('#policyFilter').addEventListener('change',render);\n  $('#resetFilters').onclick=reset;$('#emptyReset').onclick=reset;\n  $('#categories').onclick=event=>{const b=event.target.closest('[data-category]');if(b){category=b.dataset.category;render();}};\n  document.querySelector('.hot-search').onclick=event=>{const b=event.target.closest('[data-search]');if(b){reset();$('#errorSearch').value=b.dataset.search;render();$('#errorSearch').focus();}};\n  $('#expandAll').onclick=()=>{expanded=!expanded;$('#results').querySelectorAll('details').forEach(x=>x.open=expanded);$('#expandAll').textContent=expanded?'收起全部结果':'展开全部结果';};\n  $('#results').addEventListener('click',async event=>{\n    const b=event.target.closest('[data-copy]');if(!b)return;\n    const e=entries.find(x=>x.id===b.dataset.copy);\n    const text=[e.id+' '+e.title,'现象：'+e.symptom,'常见原因：'+e.cause,'排查步骤：',...e.checks.map((x,i)=>(i+1)+'. '+x),'处理办法：'+e.action,'验证：'+e.verify,e.slides?'PPT 参考：第 '+e.slides+' 页':''].filter(Boolean).join('\\n');\n    let ok=false;\n    try{await navigator.clipboard.writeText(text);ok=true;}catch{\n      const field=document.createElement('textarea');field.value=text;field.style.cssText='position:fixed;left:-9999px';document.body.append(field);field.select();try{ok=document.execCommand('copy');}catch{}field.remove();b.focus();\n    }\n    clearTimeout(toastTimer);$('#copyStatus').textContent=ok?'排查清单已复制':'复制未成功，可展开卡片选中文字复制';toastTimer=setTimeout(()=>$('#copyStatus').textContent='',3000);\n  });\n  render();\n})();\n\u003c/script>\n\u003c/body>\n\u003c/html>\n","课程体系/学习导航.html":"\u003c!doctype html>\u003chtml lang=\"zh-CN\">\u003chead>\u003cmeta charset=\"utf-8\">\u003cmeta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\u003ctitle>RPA 学员练习路径\u003c/title>\u003cstyle>\n*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:#f3f5f8;color:#20334b;font:15px/1.75 'Microsoft YaHei',sans-serif}a{color:#1759bc;text-decoration:none}a:hover{text-decoration:underline}header{background:#152d46;color:white;padding:48px max(6%,calc((100% - 1100px)/2))}header p{color:#c4d5e4;max-width:760px}h1{font-size:34px;line-height:1.4;margin:10px 0}h2{margin:0;font-size:23px}h3{margin:7px 0;font-size:18px}.tag{font-size:12px;letter-spacing:3px;color:#80dbcb}main{max-width:1140px;margin:30px auto;padding:0 20px}nav{display:flex;flex-wrap:wrap;gap:10px;margin:24px 0}nav a,button,.doc{padding:8px 14px;background:white;border:1px solid #cad6e2;border-radius:7px;font:inherit}button{cursor:pointer;color:#1c4d7d}section{margin:28px 0;padding:24px;background:white;border:1px solid #e1e7ed;border-radius:12px}.stage{display:flex;gap:20px;align-items:center;margin-bottom:18px}.stage b{font-size:34px;color:#167e75}.stage p{margin:3px 0;color:#637488}.lesson{display:flex;gap:24px;padding:18px 0;border-top:1px solid #e8edf2}.lesson label{width:90px;flex-shrink:0;color:#687b8c;font-size:13px}.lesson input{width:18px;height:18px;vertical-align:middle;margin-right:6px}.lesson a{font-size:17px;font-weight:600}.lesson p{margin:8px 0 0;color:#5d6f82}.notice{border-left:4px solid #14857a;background:#e7f3f0;padding:18px 22px;border-radius:6px}.plans{display:grid;grid-template-columns:1fr 1fr;gap:16px}.plan{border:1px solid #e0e6ec;border-radius:9px;padding:18px}.plan small{color:#92631e}.plan p{color:#64758a;font-size:14px}.links{display:flex;gap:12px;flex-wrap:wrap}footer{padding:25px 0;color:#65768a}#progress{font-weight:bold;color:#126d65}@media(max-width:650px){h1{font-size:27px}.plans{grid-template-columns:1fr}section{padding:18px}.lesson{gap:10px}.lesson label{width:76px}.lesson label span{font-size:12px}}\n\u003c/style>\u003c/head>\u003cbody>\u003cheader>\u003cspan class=\"tag\">RPA PRACTICE / LEARNING PATH\u003c/span>\u003ch1>从找到元素，到独立完成业务流程\u003c/h1>\u003cp>6 个阶段 · 16 项现有练习任务 · 12 个后续网页方向。按先修顺序练习，每关都有明确的验收要求。\u003c/p>\u003c/header>\u003cmain>\u003cdiv class=\"notice\">先手动完成一条，再用影刀等 RPA 工具复现，最后换数据复跑。下方“已自测”是学习记录，练习是否通过以页面结果与流程运行记录为准。\u003c/div>\u003cnav>\u003ca href=\"#s01\">01 认识网页与稳定定位\u003c/a>\u003ca href=\"#s02\">02 单条填写与页面交互\u003c/a>\u003ca href=\"#s03\">03 批量数据与循环\u003c/a>\u003ca href=\"#s04\">04 返回恢复与去重\u003c/a>\u003ca href=\"#s05\">05 异常判断与恢复\u003c/a>\u003ca href=\"#s06\">06 综合项目与独立交付\u003c/a>\u003c/nav>\u003cdiv class=\"notice\">\u003ca href=\"../子流程练习/ERP登录子流程练习.html\">子流程练习 · 多账号登录 →\u003c/a>\u003cp style=\"margin:6px 0 0\">同一个登录页，三组不同账号密码。用账号、密码参数调用登录子流程，再核对当前登录账号。\u003c/p>\u003c/div>\u003cdiv class=\"notice\">\u003ca href=\"../常见错误/常见错误速查.html\">遇到报错？打开 RPA 常见错误速查 →\u003c/a>\u003cp style=\"margin:6px 0 0\">按关键词与错误类型查询原因、排查步骤、处理办法和相关练习，含专题培训 PPT 案例。\u003c/p>\u003c/div>\u003cp id=\"progress\" role=\"status\">\u003c/p>\u003csection id=\"s01\">\u003cdiv class=\"stage\">\u003cb>01\u003c/b>\u003cdiv>\u003ch2>认识网页与稳定定位\u003c/h2>\u003cp>先会找一个元素，再学习批量操作。建议 2 课时。\u003c/p>\u003c/div>\u003c/div>\u003carticle class=\"lesson\">\u003clabel>\u003cinput type=\"checkbox\" data-key=\"01-1\">\u003cspan>已自测\u003c/span>\u003c/label>\u003cdiv>\u003ca href=\"../element-classroom/元素编辑互动课堂.html\">01-01　网页结构、属性与 XPath ↗\u003c/a>\u003cp>按课堂内顺序完成结构、属性、XPath 入门、动态文本、XPath 进阶；同一规则在两次变化后仍能唯一定位。\u003c/p>\u003c/div>\u003c/article>\u003carticle class=\"lesson\">\u003clabel>\u003cinput type=\"checkbox\" data-key=\"01-2\">\u003cspan>已自测\u003c/span>\u003c/label>\u003cdiv>\u003ca href=\"../element-classroom/元素编辑互动课堂.html\">01-02　表格定位与自动翻页 ↗\u003c/a>\u003cp>在课堂中进入表格章节，完成 6 项任务，读取 5 页 15 条订单，末页正确停止。\u003c/p>\u003c/div>\u003c/article>\u003c/section>\u003csection id=\"s02\">\u003cdiv class=\"stage\">\u003cb>02\u003c/b>\u003cdiv>\u003ch2>单条填写与页面交互\u003c/h2>\u003cp>先做一条正确数据，再处理一批。建议 2 课时。\u003c/p>\u003c/div>\u003c/div>\u003carticle class=\"lesson\">\u003clabel>\u003cinput type=\"checkbox\" data-key=\"02-1\">\u003cspan>已自测\u003c/span>\u003c/label>\u003cdiv>\u003ca href=\"../SKU属性填写实战练习/04-分步填写.html\">02-01　分步属性填写 ↗\u003c/a>\u003cp>完成一条 SKU 的全部步骤；故意漏填一次，修正后通过校验。\u003c/p>\u003c/div>\u003c/article>\u003carticle class=\"lesson\">\u003clabel>\u003cinput type=\"checkbox\" data-key=\"02-2\">\u003cspan>已自测\u003c/span>\u003c/label>\u003cdiv>\u003ca href=\"../SKU属性填写实战练习/05-抽屉编辑属性.html\">02-02　抽屉编辑与保存 ↗\u003c/a>\u003cp>按商品标识打开正确抽屉，修改并应用，回列表核对。\u003c/p>\u003c/div>\u003c/article>\u003carticle class=\"lesson\">\u003clabel>\u003cinput type=\"checkbox\" data-key=\"02-3\">\u003cspan>已自测\u003c/span>\u003c/label>\u003cdiv>\u003ca href=\"../SKU属性填写实战练习/06-类目联动属性.html\">02-03　类目联动与等待 ↗\u003c/a>\u003cp>切换类目后等待实际字段出现，按新字段填写并保存。\u003c/p>\u003c/div>\u003c/article>\u003c/section>\u003csection id=\"s03\">\u003cdiv class=\"stage\">\u003cb>03\u003c/b>\u003cdiv>\u003ch2>批量数据与循环\u003c/h2>\u003cp>由有限分页过渡到动态加载。建议 3 课时。\u003c/p>\u003c/div>\u003c/div>\u003carticle class=\"lesson\">\u003clabel>\u003cinput type=\"checkbox\" data-key=\"03-1\">\u003cspan>已自测\u003c/span>\u003c/label>\u003cdiv>\u003ca href=\"../SKU属性填写实战练习/02-分页填写.html\">03-01　分页填写 ↗\u003c/a>\u003cp>覆盖所有页，回查前页数据，证明没有遗漏或覆盖。\u003c/p>\u003c/div>\u003c/article>\u003carticle class=\"lesson\">\u003clabel>\u003cinput type=\"checkbox\" data-key=\"03-2\">\u003cspan>已自测\u003c/span>\u003c/label>\u003cdiv>\u003ca href=\"../SKU属性填写实战练习/03-展开分组填写.html\">03-02　展开分组填写 ↗\u003c/a>\u003cp>展开每组再处理组内行，按业务标识核对数量。\u003c/p>\u003c/div>\u003c/article>\u003carticle class=\"lesson\">\u003clabel>\u003cinput type=\"checkbox\" data-key=\"03-3\">\u003cspan>已自测\u003c/span>\u003c/label>\u003cdiv>\u003ca href=\"../SKU属性填写实战练习/01-滚动懒加载.html\">03-03　滚动与懒加载 ↗\u003c/a>\u003cp>处理 120 条 SKU，以加载和实际数据状态判断结束，不能只依赖固定滚动次数。\u003c/p>\u003c/div>\u003c/article>\u003carticle class=\"lesson\">\u003clabel>\u003cinput type=\"checkbox\" data-key=\"03-4\">\u003cspan>已自测\u003c/span>\u003c/label>\u003cdiv>\u003ca href=\"../SKU属性填写实战练习/08-生成规格组合.html\">03-04　颜色尺码组合 ↗\u003c/a>\u003cp>组合数等于颜色数 × 尺码数，逐行字段正确且无重复组合。\u003c/p>\u003c/div>\u003c/article>\u003carticle class=\"lesson\">\u003clabel>\u003cinput type=\"checkbox\" data-key=\"03-5\">\u003cspan>已自测\u003c/span>\u003c/label>\u003cdiv>\u003ca href=\"../SKU属性填写实战练习/07-表格粘贴导入.html\">03-05　表格粘贴导入 ↗\u003c/a>\u003cp>先用少量数据验证，再加入错误行；修正、预览、导入并核对行数。\u003c/p>\u003c/div>\u003c/article>\u003c/section>\u003csection id=\"s04\">\u003cdiv class=\"stage\">\u003cb>04\u003c/b>\u003cdiv>\u003ch2>返回恢复与去重\u003c/h2>\u003cp>理解页面状态与业务状态。建议 1 课时。\u003c/p>\u003c/div>\u003c/div>\u003carticle class=\"lesson\">\u003clabel>\u003cinput type=\"checkbox\" data-key=\"04-1\">\u003cspan>已自测\u003c/span>\u003c/label>\u003cdiv>\u003ca href=\"../refund-return-demo/退款管理返回故障演示.html\">04-01　退款详情返回丢页码 ↗\u003c/a>\u003cp>从第 3 页进入详情，返回后恢复搜索条件和页码，再继续下一条；最终采集结果无重无漏。\u003c/p>\u003c/div>\u003c/article>\u003c/section>\u003csection id=\"s05\">\u003cdiv class=\"stage\">\u003cb>05\u003c/b>\u003cdiv>\u003ch2>异常判断与恢复\u003c/h2>\u003cp>按正常 → 单故障 → 综合故障练习。建议 3 课时。\u003c/p>\u003c/div>\u003c/div>\u003carticle class=\"lesson\">\u003clabel>\u003cinput type=\"checkbox\" data-key=\"05-1\">\u003cspan>已自测\u003c/span>\u003c/label>\u003cdiv>\u003ca href=\"../order-fault-lab/订单故障练习场.html\">05-01　正常订单与有限重试 ↗\u003c/a>\u003cp>先处理正常订单，再处理 XD1005 首次提交失败；读取业务反馈，确认只写入一次。\u003c/p>\u003c/div>\u003c/article>\u003carticle class=\"lesson\">\u003clabel>\u003cinput type=\"checkbox\" data-key=\"05-2\">\u003cspan>已自测\u003c/span>\u003c/label>\u003cdiv>\u003ca href=\"../order-fault-lab/订单故障练习场.html\">05-02　超时、缺字段、弹窗与持续失败 ↗\u003c/a>\u003cp>老师每次只启用一种故障；持续提交失败最多尝试 3 次，记录原因并继续下一条。\u003c/p>\u003c/div>\u003c/article>\u003carticle class=\"lesson\">\u003clabel>\u003cinput type=\"checkbox\" data-key=\"05-3\">\u003cspan>已自测\u003c/span>\u003c/label>\u003cdiv>\u003ca href=\"../order-fault-lab/登录恢复练习说明.txt\">05-03　登录失效与断点恢复 ↗\u003c/a>\u003cp>在单文件内练习登录与订单视图切换；登录专项跳过 XD1003 后，得到 9 成功、1 跳过，已有结果保留。\u003c/p>\u003c/div>\u003c/article>\u003c/section>\u003csection id=\"s06\">\u003cdiv class=\"stage\">\u003cb>06\u003c/b>\u003cdiv>\u003ch2>综合项目与独立交付\u003c/h2>\u003cp>撤掉操作步骤，只给输入与验收要求。建议 3 课时。\u003c/p>\u003c/div>\u003c/div>\u003carticle class=\"lesson\">\u003clabel>\u003cinput type=\"checkbox\" data-key=\"06-1\">\u003cspan>已自测\u003c/span>\u003c/label>\u003cdiv>\u003ca href=\"../SKU属性填写实战练习/09-商品上架综合实战.html\">06-01　商品上架综合项目 ↗\u003c/a>\u003cp>完成基本信息、类目、规格、SKU 编辑和发布预览；核对全部必填字段和组合数量。\u003c/p>\u003c/div>\u003c/article>\u003carticle class=\"lesson\">\u003clabel>\u003cinput type=\"checkbox\" data-key=\"06-2\">\u003cspan>已自测\u003c/span>\u003c/label>\u003cdiv>\u003ca href=\"../order-fault-lab/订单故障练习场.html\">06-02　订单故障综合考核 ↗\u003c/a>\u003cp>启用综合考核；重做登录异常条时为 8 成功、1 数据异常、1 失败；跳过时为 7 成功、1 数据异常、1 失败、1 跳过。XD1007 只写入一次。\u003c/p>\u003c/div>\u003c/article>\u003c/section>\u003csection>\u003ch2>启动与教学资料\u003c/h2>\u003cp>所有练习和下方资料均已内置，可直接打开或部署到 GitHub Pages。订单登录恢复在本文件内切换登录与订单视图。练习进度保存在当前浏览器。\u003c/p>\u003cdiv class=\"links\">\u003ca class=\"doc\" href=\"../order-fault-lab/使用与教学说明.txt\">订单教学说明\u003c/a>\u003ca class=\"doc\" href=\"../element-classroom/元素编辑培训讲师稿.txt\">元素编辑讲师稿\u003c/a>\u003ca class=\"doc\" href=\"../培训文档/影刀异常处理培训手册.docx\">异常处理手册\u003c/a>\u003ca class=\"doc\" href=\"01-循序渐进课程大纲.md\">完整课程大纲\u003c/a>\u003ca class=\"doc\" href=\"02-文件夹内容索引.md\">文件内容索引\u003c/a>\u003c/div>\u003c/section>\u003csection>\u003ch2>下一步可以新增哪些网页\u003c/h2>\u003cp>以下均为规划，尚未开发。先做 P0，再做 P1，最后用 P2 扩展业务项目。\u003c/p>\u003cdiv class=\"plans\">\u003carticle class=\"plan\">\u003csmall>P0 · 待开发 · 放在阶段 01 之后\u003c/small>\u003ch3>基础表单练习站\u003c/h3>\u003cp>文本、单选、多选、下拉、日期、必填校验\u003c/p>\u003cp>验收：输入 10 条固定客户数据，回读字段，提交结果与输入逐项一致。\u003c/p>\u003c/article>\u003carticle class=\"plan\">\u003csmall>P0 · 待开发 · 阶段 02\u003c/small>\u003ch3>查询筛选与结果采集\u003c/h3>\u003cp>组合筛选、空结果、排序、金额与日期读取\u003c/p>\u003cp>验收：给定条件对应固定结果集；订单号、数量与汇总金额全部一致。\u003c/p>\u003c/article>\u003carticle class=\"plan\">\u003csmall>P0 · 待开发 · 阶段 03\u003c/small>\u003ch3>文件上传下载中心\u003c/h3>\u003cp>文件选择、扩展名校验、下载命名、CSV 导入导出\u003c/p>\u003cp>验收：上传样本后核对条数；由 RPA 在本机检查下载存在、文件名和内容。\u003c/p>\u003c/article>\u003carticle class=\"plan\">\u003csmall>P1 · 待开发 · 阶段 04\u003c/small>\u003ch3>多标签页与 iframe 工作台\u003c/h3>\u003cp>新标签打开、切换、关闭、返回原页、嵌套框架\u003c/p>\u003cp>验收：处理 5 个详情后回到原列表，页码保留，记录不串行；iframe 使用本地 HTTP 服务。\u003c/p>\u003c/article>\u003carticle class=\"plan\">\u003csmall>P1 · 待开发 · 阶段 02\u003c/small>\u003ch3>日期与复杂下拉组件\u003c/h3>\u003cp>跨月日期、可搜索下拉、多级地区、选项异步加载\u003c/p>\u003cp>验收：同一流程处理 3 组不同日期与地区，不能用固定坐标。\u003c/p>\u003c/article>\u003carticle class=\"plan\">\u003csmall>P1 · 待开发 · 阶段 05\u003c/small>\u003ch3>异步任务与状态轮询\u003c/h3>\u003cp>任务排队、处理中、完成、失败、超时\u003c/p>\u003cp>验收：根据终态决定下载或记录失败，超时有上限，不重复创建任务。\u003c/p>\u003c/article>\u003carticle class=\"plan\">\u003csmall>P1 · 待开发 · 阶段 03\u003c/small>\u003ch3>动态列表定位挑战\u003c/h3>\u003cp>动态 id、重复按钮、排序变化、行内定位\u003c/p>\u003cp>验收：刷新和排序后按业务编号定位，操作目标保持正确。\u003c/p>\u003c/article>\u003carticle class=\"plan\">\u003csmall>P2 · 待开发 · 阶段 06\u003c/small>\u003ch3>客户资料与重复检查\u003c/h3>\u003cp>查询后新增、重复提示、数据清洗、更新现有客户\u003c/p>\u003cp>验收：第二次运行不新增重复客户，保留每条处理结果。\u003c/p>\u003c/article>\u003carticle class=\"plan\">\u003csmall>P2 · 待开发 · 阶段 06\u003c/small>\u003ch3>审批与报销工作台\u003c/h3>\u003cp>金额分支、附件核对、审批意见、驳回原因\u003c/p>\u003cp>验收：按规则分别通过或驳回，汇总金额与状态匹配。\u003c/p>\u003c/article>\u003carticle class=\"plan\">\u003csmall>P2 · 待开发 · 阶段 06\u003c/small>\u003ch3>库存与订单对账\u003c/h3>\u003cp>两表关联、差异筛选、库存更新、结果导出\u003c/p>\u003cp>验收：差异清单与标准答案一致，重复执行不重复扣减。\u003c/p>\u003c/article>\u003carticle class=\"plan\">\u003csmall>P2 · 待开发 · 阶段 06\u003c/small>\u003ch3>售后工单流转\u003c/h3>\u003cp>按类型分派、条件处理、备注、业务状态迁移\u003c/p>\u003cp>验收：每种工单走正确分支，未知类型进入人工复核清单。\u003c/p>\u003c/article>\u003carticle class=\"plan\">\u003csmall>P2 · 待开发 · 阶段 06 结业\u003c/small>\u003ch3>跨系统搬运综合项目\u003c/h3>\u003cp>A 系统采集、B 系统录入、映射、断点续跑\u003c/p>\u003cp>验收：中断后续跑，最终目标记录完整、无重复，有逐条结果和失败原因。\u003c/p>\u003c/article>\u003c/div>\u003c/section>\u003cfooter>建议 14 课时，每课时 45–60 分钟。交付 RPA 流程、输入样本、逐条结果与运行记录。学习进度保存在当前浏览器；不与原练习成绩同步。\u003c/footer>\u003c/main>\u003cscript>\nconst inputs=[...document.querySelectorAll('[data-key]')],key='rpa-course-selfcheck-v1';let saved={};try{saved=JSON.parse(localStorage.getItem(key)||'{}')||{}}catch{}function update(){document.getElementById('progress').textContent='自测进度：'+inputs.filter(x=>x.checked).length+' / '+inputs.length+' 项（自主勾选）'}inputs.forEach(x=>{x.checked=saved[x.dataset.key]===true;x.addEventListener('change',()=>{saved[x.dataset.key]=x.checked;try{localStorage.setItem(key,JSON.stringify(saved))}catch{}update()})});update();\n\u003c/script>\u003c/body>\u003c/html>","order-fault-lab/登录恢复练习说明.txt":"\u003c!doctype html>\u003chtml lang=\"zh-CN\">\u003chead>\u003cmeta charset=\"utf-8\">\u003cmeta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\u003ctitle>登录恢复练习说明\u003c/title>\u003cstyle>body{max-width:960px;margin:40px auto;padding:0 24px;font:16px/1.9 system-ui;color:#253e34}pre{white-space:pre-wrap;overflow-wrap:anywhere;font:inherit}\u003c/style>\u003c/head>\u003cbody>\u003ch1>登录恢复练习说明\u003c/h1>\u003cpre>【单文件版说明】本资料保留原版教学步骤。当前版本已内置登录页与订单页，无需本地启动器；独立 URL 跳转验收请使用原多文件版本。\n\n登录失效、重新登录与忽略当前条\n\n建议用“启动本地练习场.cmd”打开本机网页，进行完整页面跳转练习。\n\n订单页面为 orders.html。\n登录页面为 login.html。\n访问已失效的订单页会重新跳转登录页，不能靠刷新或返回按钮直接恢复登录。\n\n本地公开练习凭据\n账号 rpa_student\n密码 Rpa@2026\n不要填写个人账号或真实系统密码。练习凭据只在页面内验证，输入的密码不会保存到订单状态或运行日志。\n\n一、最短体验\n\n1. 老师控制台选择“04 登录恢复 · 跳过当前继续下一条”，应用场景。\n2. 查询 XD1001，提交成功；同样处理 XD1002。\n3. 查询 XD1003，页面跳转到独立登录页面，原来的订单表格和提交按钮不再存在。\n4. 输入错误密码试一次，应停留登录页并提示错误。\n5. 输入正确练习账号和密码，页面显示登录成功。\n6. 点击“进入订单处理页面”，或者让影刀跳转到同目录的 orders.html。\n7. 在恢复区确认中断订单是 XD1003，已完成的 XD1001、XD1002 仍为成功。\n8. 填写跳过原因，例如“登录失效，本次忽略当前条，恢复后处理下一条”。\n9. 点击“记录当前条跳过”。XD1003 变为“已跳过”，结果表和日志保留原因。\n10. 点击“查找下一条待处理订单”。列表定位 XD1004。\n11. 由学员或影刀继续查询、提交 XD1004。页面不会自动替学员处理下一条。\n\n二、影刀流程建议\n\n循环订单列表。\nTry 内查询、等待详情、校验、提交、确认结果。\nCatch 内先识别当前是否是登录页，避免把所有失败都当成登录失效。\n如果是登录页，填写练习账号密码，等待登录成功，再跳转订单处理页。\n记录当前订单异常，设置本条为跳过，再使用继续循环或相应逻辑处理下一条。\n如果当前订单可能已经写入成功，先核实业务结果，不直接跳过或重复提交。\n\n“忽略本条异常”应保留订单号与原因，不应把当前条标为成功。不要在 Catch 后无条件继续执行原来的提交步骤。\n\n三、两种恢复方式\n\n本课重点是记录跳过当前条，继续下一条。\n页面同时保留“保留当前条，重新处理”的分支。选择它不会把本条标记为跳过，会要求重新查找并处理原订单。\n两种分支在日志中分开记录。已成功写入的订单不能被恢复区标记为跳过。\n\n四、验收结果\n\n登录专项场景全部处理完，应为 9 条成功、1 条已跳过，跳过的是 XD1003。还应检查 XD1004 已继续执行，且没有重复写入。\n综合考核选择跳过登录异常条时，预期为 7 条成功、1 条数据异常、1 条处理失败、1 条已跳过。跳过的是 XD1008。\n综合考核选择重新处理登录异常条时，仍可得到 8 条成功、1 条数据异常、1 条处理失败。\n\n五、单文件版与 HTTP 版\n\n双击“订单故障练习场.html”仍然可以练习，登录时切换到完整登录界面，地址变为 #login，返回后变为 #orders。这样能在同一个本地文件中保留进度。\n要练习真实路径从 orders.html 跳转到 login.html，再由影刀跳回 orders.html，请用本机启动器打开 HTTP 版本。\nHTTP 页面共享同一来源下的本地存储，刷新、页面跳转、登录失败不会清空订单结果。单文件与 HTTP 方式各自保存进度。\n\u003c/pre>\u003c/body>\u003c/html>","order-fault-lab/使用与教学说明.txt":"\u003c!doctype html>\u003chtml lang=\"zh-CN\">\u003chead>\u003cmeta charset=\"utf-8\">\u003cmeta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\u003ctitle>使用与教学说明\u003c/title>\u003cstyle>body{max-width:960px;margin:40px auto;padding:0 24px;font:16px/1.9 system-ui;color:#253e34}pre{white-space:pre-wrap;overflow-wrap:anywhere;font:inherit}\u003c/style>\u003c/head>\u003cbody>\u003ch1>使用与教学说明\u003c/h1>\u003cpre>【单文件版说明】本资料保留原版教学步骤。当前版本已内置登录页与订单页，无需本地启动器；独立 URL 跳转验收请使用原多文件版本。\n\n订单故障练习场\n\n一、这个网页用来做什么\n\n它是影刀自动化流程的操作对象。学员需要在影刀里捕获页面元素，自己搭建查询、校验、提交、判断、重试和记录异常的流程。老师可以指定哪条订单、在哪一步失败。网页不会自动替学员完成批量处理。\n\n二、打开方式\n\n直接用浏览器打开“订单故障练习场.html”，即可手动体验，无需联网。登录失效后需要输入公开的本地练习账号密码；单文件使用 #login 与 #orders 切换，真实 login.html / orders.html 跳转请用启动器。\n\n使用影刀捕获元素时，建议双击“启动本地练习场.cmd”。它会使用本机 Python，打开本机 HTTP 网页；若 8877 端口被占用，会从 8878 至 8886 中选择空闲端口。服务仅监听 127.0.0.1，无访问一小时后退出。请保留同文件夹中的 serve.py、launch.py、index.html、orders.html、login.html、style.css、engine.js、session.js 和 app.js。\n\n单文件方式与 HTTP 方式是不同的浏览器来源，各自保存练习进度。影刀若需要访问 file 页面，浏览器扩展可能还需要相应权限；使用本机 HTTP 方式通常更方便。\n\n三、第一次体验\n\n默认故障只影响 XD1005。\n1. 查询 XD1005。\n2. 第一次提交，页面显示失败，业务没有写入。\n3. 第二次提交，显示成功。\n4. 关闭详情，在“运行日志”中核对两次尝试和一次实际写入。\n5. 用影刀实现读取失败提示后重试，而不是无条件点两次。\n\n四、老师如何设置\n\n老师控制台可切换正常流程、首次失败练习和综合考核。应用场景会重置全部订单。\n新增“04 登录恢复”专项。查询 XD1003 会进入独立登录页，练习账号 rpa_student，密码 Rpa@2026。登录后返回 orders.html，记录当前条跳过原因，再查找 XD1004。完整步骤见“登录恢复练习说明.txt”。\n也可以选择某条订单，设置一种故障，只复位该订单。加载延迟可设置为 1 至 15 秒，前几次失败可设置为 1 至 5 次。\n“重置本轮进度”保留当前故障配置，清除处理结果和计数，方便重复验证。\n隐藏老师控制台后，只保留订单操作区，方便学员捕获和跑流程；这是展示模式，不是权限隔离。\n\n五、推荐教学顺序\n\n先正常处理一条订单，再一次只加入一种故障。\n1. 详情加载慢。查询后提交按钮暂时不存在，练等待目标出现与超时处理。\n2. 查询临时失败。页面返回错误且没有详情表单，练重新查询或等待恢复。\n3. 金额缺失。练读取数据、操作前校验、记录异常并跳过。\n4. 提交前几次失败。练业务结果判断与有限重试。\n5. 提交持续失败。最多尝试 3 次，保存原因，再处理下一条。\n6. 回执丢失。首次请求已经写入，先查询结果；盲目再点会产生重复写入。\n7. 登录失效。暂停整批操作，进入登录页输入练习账号密码，再返回订单页，保留已有结果。\n8. 弹窗遮挡。关闭覆盖层后再操作下方目标。\n\n页面“提交失败”是业务反馈，点击指令可能仍执行成功。需要读取反馈或等待业务状态，而不能假设点击必定触发影刀 Catch。\n页面加载期间目标不存在、等待超时、遮挡等行为可用于练习自动化指令失败后的处理。具体异常表现取决于影刀指令和等待设置。\n\n六、综合考核固定配置\n\nXD1001 正常。\nXD1002 详情加载慢。\nXD1003 首次查询失败。\nXD1004 金额缺失。\nXD1005 首次提交失败。\nXD1006 提交持续失败。\nXD1007 提交成功但回执丢失。\nXD1008 首次查询触发整个页面登录失效。\nXD1009 首次详情显示遮挡弹窗。\nXD1010 正常。\n\n综合考核若重新处理登录异常条，预期为 8 条成功、1 条数据异常、1 条处理失败。若记录忽略 XD1008 后继续下一条，预期为 7 条成功、1 条数据异常、1 条处理失败、1 条已跳过。两个分支分别验收。\nXD1006 应尝试 3 次，即首次 1 次与重试 2 次，再记录失败原因。\nXD1007 应只写入 1 次，并通过“查询处理结果”或“刷新列表”核对成功状态。\n没有遗漏、没有重复写入、模拟登录恢复、遮挡弹窗已处理。\n在“本轮验收”中检查结果，并导出 CSV 和日志供讲师核对。\n\n七、适合影刀捕获的属性\n\n登录账号 id=&quot;login-username&quot;，密码 id=&quot;login-password&quot;，登录按钮 id=&quot;login-submit&quot;。\n登录成功后进入订单页 id=&quot;return-orders&quot;。\n恢复区当前订单 id=&quot;resume-current-order&quot;，下一条 id=&quot;resume-next-order&quot;。\n记录跳过 id=&quot;skip-current-order&quot;，查找下一条 id=&quot;find-next-order&quot;。\n订单行 data-order-id。\n查询按钮 data-order 与 data-action=&quot;detail&quot;。\n金额 id=&quot;order-amount&quot;。\n提交按钮 id=&quot;submit-order&quot;。\n结果提示 id=&quot;operation-status&quot;，data-state 表示反馈类型，data-error-code 表示错误代码。\n查询处理结果按钮 id=&quot;check-order-result&quot;。\n数据异常与处理失败按钮 id=&quot;mark-invalid&quot;、id=&quot;mark-failed&quot;。\n\n八、边界\n\n所有订单、登录与业务写入都在浏览器内模拟。浏览器刷新后会保留进度；开启新场景或重置本轮才会清除。\n导出阻塞只是页面失败模拟，不会锁住真实 Excel 文件；真实文件占用、文件保存等练习还需要安排影刀操作本机文件。\n本页不真实发送 HTTP 500，也不连接企业系统。手动操作通过验收，只能说明模拟处理结果正确，影刀流程仍需独立运行验证。\n\u003c/pre>\u003c/body>\u003c/html>","element-classroom/元素编辑培训讲师稿.txt":"\u003c!doctype html>\u003chtml lang=\"zh-CN\">\u003chead>\u003cmeta charset=\"utf-8\">\u003cmeta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\u003ctitle>元素编辑培训讲师稿\u003c/title>\u003cstyle>body{max-width:960px;margin:40px auto;padding:0 24px;font:16px/1.9 system-ui;color:#253e34}pre{white-space:pre-wrap;overflow-wrap:anywhere;font:inherit}\u003c/style>\u003c/head>\u003cbody>\u003ch1>元素编辑培训讲师稿\u003c/h1>\u003cpre>网页元素与 XPath 入门培训讲师稿\n\n配套本地版「元素实验室」七章课程\n适合零基础学员，按约 90 分钟安排，包含讲解、互动和上机练习。实际时间可以随学员操作进度调整。\n\n使用方式\n\n普通段落可以直接照着讲。〔〕里面是讲师操作、停顿和参考答案，不需要读出来。代码展示给学员看，重点带着他们理解组成，不用把每个符号都念一遍。\n\n课前准备\n\n提前用浏览器打开本地教学网页。投屏时调到合适字号，确认学员能看清 HTML 的缩进和按钮文字。需要重新演示时，用页面里的重置功能。学员跟练时，提醒大家使用自己的页面，保留各自的练习进度。\n\n开场，把今天要解决的问题说清楚\n建议用时 3 分钟\n\n大家先打开教学网页，跟我停在第一章。\n\n我们今天就围绕一件事练。页面上有一个按钮，你想让机器人点它，怎么告诉机器人，你要的究竟是哪一个？\n\n我先问一下，用过元素捕获的同学，有没有遇到过这种情况。刚抓完，校验成功，过一会儿再运行，就找不到了。或者页面上明明有这个按钮，它偏偏点到了另一行。\n\n〔停 10 秒。可以让学员举手，或在聊天区回复“找不到”“点错了”。没有人用过元素捕获，就直接往下讲，不预设大家有相关经历。〕\n\n我们等会儿就在这个网页里，亲手做出一次定位失败，再把它改好。这样以后碰到报错，你就有地方开始查了。\n\n今天按页面左侧的顺序学。先看网页长什么结构，再看元素身上的属性，然后写基础 XPath。后面再处理文字变化、节点关系和表格翻页。\n\n练习的时候，先自己试。页面里有提示和参考答案，卡住了可以展开。提交以后，再看系统为什么判你对、为什么判你错。\n\n\n第一章，先看懂网页结构\n建议用时 10 分钟\n\n〔打开「HTML 与网页结构」，指向右侧完整 HTML 文档。〕\n\n先看右边这段源码。现在不用从第一行背到最后一行，我们先找三个名字。\n\n第一个是 html，整个文档的根元素。\n\nhtml 里面有 head 和 body。head 放编码、页面标题这些文档信息。body 放页面上的内容，搜索区域、输入框、按钮都在这里。\n\n你看缩进。body 比 html 往里面缩了一层，搜索区域的 div 又往里面缩一层。往里缩，表示进入子节点。同一层的开始标签，左边是对齐的。\n\n〔从 html 指到 body，再指到两层 div，最后指到 input。〕\n\n我们沿着这条路径往里走，最后就能走到搜索按钮。\n\n大家现在点击左边的搜索按钮，看右边哪里出现红框，再看看完整路径里经过了哪些节点。\n\n〔留 30 秒操作。提醒大家，点左边的元素或右边的源码节点，都可以观察对应关系。〕\n\n我问大家一个问题。搜索按钮的直接父元素，是 body，还是里面这层 class 叫 search-box 的 div？\n\n〔等回答。参考答案是 div.search-box。〕\n\n对，直接父元素只往外找一层。body 在更外面，也包着它，但中间还隔着两层 div。\n\n这几个关系后面会反复用到。父元素是直接包住它的那一层。再往外找，可以找到祖先元素。被同一个父元素直接包含的元素，是兄弟元素。\n\n再看这两行。\n\n```html\n&lt;div class=&quot;search-box&quot;&gt;\n  &lt;input type=&quot;text&quot; name=&quot;order&quot;&gt;\n  &lt;input id=&quot;su&quot; class=&quot;btn big-btn&quot; type=&quot;submit&quot; value=&quot;搜索&quot;&gt;\n&lt;/div&gt;\n```\n\ndiv 和 input 是标签名。id、class、type 这些是属性名，引号里面是属性值。\n\n这里第一个 input 用来输入文字，第二个 input 用来提交。它们都是 input，用途可以通过 type 来区分。\n\n顺便看一下标签怎么结束。div 有开始标签和结束标签。input 属于空元素，这里不需要再写一个结束标签。大家看到 input 后面没有一对闭合标签，不用给它补上。\n\n现在来猜一下。一个东西在页面上看起来像按钮，它的标签就一定是 input 吗？\n\n〔停一下。参考答案是否定的，也可能是 button、a、span 等。〕\n\n所以，我们要看源码里的标签。单靠外观，没法确定它是什么元素。\n\n接下来请大家完成第一章下面三个判断。根元素是什么，搜索按钮的直接父元素是哪一层，id 属于标签还是属性。\n\n〔留 1 分钟。提交后，邀请一位学员用自己的话解释第二题。有人答错时，让他沿着缩进往外找一层。〕\n\n这三题通过了，我们再往下一章走。后面编辑定位规则，需要用到刚才这几个关系。\n\n\n第二章，属性怎么选，规则才容易复用\n建议用时 12 分钟\n\n〔进入「属性与元素编辑」。先指向上方的三段讲解，再指向编辑器。〕\n\n这一章是参照影刀编辑元素布局做的教学模拟。左边是节点，右边是当前节点的属性。大家先认清这两块各管什么。\n\n点一个节点，是查看它的属性。勾选一个节点，是让这层节点参与定位。右边勾选的属性，也会参与筛选。\n\n我们先点最后面的 span，看一下它的 id 和 class。\n\n这里有个特别容易漏掉的地方。勾选了几个条件，校验时就要同时满足这几个条件。你保留一个正确的 class，也救不了另外一个已经变化的 id。\n\n〔用鼠标依次指向勾选框，避免一边讲一边快速取消，给学员时间看清。〕\n\n先别改，直接点一次校验。初始页面里，这套条件可以找到一个元素。\n\n接下来大家先猜一下。我们保留这些条件，点“模拟刷新 / 改版”，原来的规则还能找到吗？\n\n〔让大家先回答“能”或“不能”，再操作。〕\n\n现在点改版，再校验。\n\n看右侧源码。id 已经换了，按钮外面还多了一层 div。左边保存的规则仍然是旧的。所以这次找不到，有两个检查方向。一个看属性值，一个看层级关系。\n\n别急着重新捕获，我们这次练自己修。\n\n请大家把前面两层父节点取消勾选，保留最后的 span。然后点 span，在右边取消 id，保留 class。\n\n〔给学员时间。有人找不到 id 时，提醒他先点最后的 span，再看右侧属性表。〕\n\n再校验一次，看看能不能找到。\n\n找到以后，先别换规则。我们再刷新一次，再校验。\n\n连续换过两个 id，同一套规则都能通过，这才看到了它适应变化的效果。\n\n这里要把范围说清楚。我们的示例里只有一个这样的发货按钮，所以 class 条件可以得到一个目标。换到一个有很多订单按钮的页面，同样的 class 可能会找到一整组。\n\n〔互动演示，点击“添加相似元素”，保留只按 span 与 class 查找，再校验。演示结束后点“移除相似元素”，恢复一个目标，再继续带学员练习。〕\n\n现在出现两个了。大家想一下，刚才这条规则坏了吗？\n\n它仍然按条件找到了元素，只是符合条件的目标变多了。接下来就需要加上订单信息，或者限定它所在的区域。\n\n这两种报错，大家要分开看。零个匹配，先查条件是不是变了。多个匹配，先查规则是不是太宽了。\n\n〔练习检查，让学员完成本章的稳定性任务。旧规则失败后，修正条件，再让同一规则在两次不同 id 的页面上通过。〕\n\n\n第三章，XPath 入门，一次学一个写法\n建议用时 15 分钟\n\n〔进入「XPath 入门」，从第一个知识点开始。〕\n\n前面我们靠勾选告诉机器人怎么找。现在换一种表达方式，把查找要求写成一条 XPath。\n\n先看右侧源码，确认结构。table 里面有 tbody，tbody 里面有 tr，tr 里面有 td。状态文字又放在 td 里面的 span 里。\n\n这几个标签如果一时记不住，直接看缩进。跟着缩进走，能看清谁包着谁。\n\n我们先运行最短的一条。\n\n```xpath\n//button\n```\n\n在这份示例文档中，跨层查找 button。现在有三个详情按钮，所以会找到三个。\n\n再看这一条。\n\n```xpath\n//tbody/tr\n```\n\n先找到 tbody，再找它直接包含的 tr。中间这个单斜杠，只往下一层走。\n\n前面的双斜杠允许跨层查找。单斜杠与双斜杠表达的范围不同，后面写路径时，要知道自己需不需要跨过中间层。\n\n第一个小任务，请大家自己写规则，把三个状态 span 找出来。先想目标标签是什么，再想它在什么父元素下面。\n\n〔留 1 分钟。提交后应匹配三个 span。把 tr 或 td 当作目标的学员，提醒他再核对题目要求的元素类型。〕\n\n接着学属性。我们刚才已经见过 id、class，现在看按钮上的 data-order。\n\n```xpath\n//button[@data-order=&#x27;XD1002&#x27;]\n```\n\nbutton 说明要找什么标签。方括号是筛选条件。@ 后面写属性名。这里要求 data-order 等于 XD1002。\n\n我把最后的订单号改成 XD1003，大家猜一下，红框会去哪一行？\n\n〔先让学员预测，再运行。第二个小任务要求定位 XD1003 的详情按钮。〕\n\n第三个知识点，按文字找。\n\n```xpath\n//td[text()=&#x27;帆布包&#x27;]\n```\n\n这条找的是文字正好为“帆布包”的 td。text() 在这里检查的是 td 的直接文本。\n\n今天先把这种简单情况写顺。文字如果放在里面的 span 中，我们在进阶章再处理。\n\n〔完成固定文本练习。〕\n\n最后看位置。XPath 的位置从 1 开始计数，第一个节点写 [1]，第二个节点写 [2]。前面元素编辑器里的 index 从 0 开始，这两套计数别混在一起。\n\n这里给大家两条表达式，先不运行。\n\n```xpath\n//td[1]\n```\n\n```xpath\n(//td)[1]\n```\n\n你觉得它们在这张三行订单表里，各会找到几个？\n\n〔让大家报两个数字。参考答案分别是三个和一个。〕\n\n第一条，在各自的父元素下面取第一个 td。每一行都有第一个 td，所以得到三个订单号。\n\n第二条先用括号把所有 td 收集到一起，再从整个结果里取第一个。所以只有一个。\n\n大家写位置条件时，先问自己，这个“第几个”是在谁里面数的？\n\n〔完成本章最后一题，选择数据区第二行、第三列的 td。提醒要返回 td，别继续写到 span。〕\n\n\n第四章，文字变了，规则怎么写\n建议用时 8 分钟\n\n〔进入「动态文本匹配」。先使用等于匹配，再切换酒店。〕\n\n现在换个场景。我们要找酒店点评入口，文字是“酒店点评(302)”。\n\n如果规则把这整段文字记死了，换一家酒店，点评数变成 584，就对不上了。\n\n大家观察一下，什么在变，什么没变？\n\n〔让学员回答。预期能指出数量变化，“酒店点评”和括号结构保持不变。〕\n\n我们可以保留固定文字，把数量部分放开。\n\n```text\n酒店点评(*)\n```\n\n注意，还需要把匹配方式选成通配符。只在文字里输入星号，匹配方式仍然选“等于”，它就会把星号当成要匹配的字符。\n\n这里的星号和 XPath 里的星号，也要区分开。\n\n在这个文本规则里，星号用来匹配变化的字符。XPath 里面写 //*，星号表示任意元素标签。两个地方用了同一个符号，含义不一样。\n\n现在做下面的独立练习。让规则匹配两个酒店点评入口，同时排除“餐厅点评(302)”。\n\n〔留 1 分钟。可以先现场提交一个只有 * 的规则，展示餐厅入口也被匹配的反馈。〕\n\n为什么练习要多放一个餐厅入口？因为能找到酒店还不够，还要看会不会把别的东西一起找进来。\n\n〔请一位学员解释自己的规则保留了哪段固定特征，再进入进阶章。〕\n\n\n第五章，XPath 进阶，沿着节点关系去找\n建议用时 15 分钟\n\n〔进入「XPath 进阶」。按五个知识点讲，不要求学员一次记住全部函数。〕\n\n先解决刚才留下的文本问题。\n\n```html\n&lt;td&gt;\n  &lt;span class=&quot;status&quot;&gt;待发货&lt;/span&gt;\n&lt;/td&gt;\n```\n\n“待发货”放在 span 里面。你对外层 td 使用 text()，不能直接得到这段内层文字。\n\n我们运行这条，先看它为什么得到零个。\n\n```xpath\n//td[text()=&#x27;待发货&#x27;]\n```\n\n再换一条。\n\n```xpath\n//td[normalize-space(.)=&#x27;待发货&#x27;]\n```\n\n这里的点代表当前上下文。放在这个文本比较里，可以使用整个 td 的文本值，包含后代元素的文字。normalize-space 再把首尾空白和多余空白整理一下。\n\n大家不用急着背函数名，先看清两个问题。文字究竟在哪一层，我们最后要选的是外层 td 还是内层 span。\n\n〔完成第一个进阶任务，选中两个待发货的 td。〕\n\n接下来找指定订单的按钮。\n\n页面上三个按钮都叫“详情”。如果只按“详情”这两个字找，三个都符合。我们需要先把范围缩到一个订单行。\n\n```xpath\n//tr[td[text()=&#x27;XD1003&#x27;]]//button\n```\n\n前面这段先找包含订单号 XD1003 的行。后面继续在这一行里找 button。\n\n我先问大家，如果直接找第三行的按钮，今天能不能点对？\n\n〔等回答。参考答案是在当前顺序下可以，但排序变化后可能失败。〕\n\n这就是这一题多检查一次排序的原因。请大家先用固定第三行试一下，再用订单号写一遍，对比反馈。\n\n〔留 2 分钟。系统应指出固定行号在排序变化后失败。〕\n\n从子节点往上找，还有两种写法。\n\n```xpath\n//td[text()=&#x27;XD1002&#x27;]/parent::tr\n```\n\nparent 是找直接父节点。ancestor 可以继续向上找祖先。比如状态 span 包得比较深，就可以向上找最近的 tr，然后在这个 tr 里面找按钮。\n\n再看兄弟节点。订单号格和商品格，共同的父元素都是这一行 tr，所以它们是兄弟。\n\n```xpath\n//td[text()=&#x27;XD1001&#x27;]/following-sibling::td[1]\n```\n\n先找到订单号格，再往后找同级 td，取最近一个。这里就走到了商品格。\n\n如果换成 preceding-sibling，就往前找。同学们做前向、后向查找时，可以先拿鼠标在表格里指一下方向，确认自己到底要往哪边走。\n\n〔完成兄弟节点任务。〕\n\n第四个知识点，把条件组合起来。商品是短袖 T 恤，同时状态是待发货，用 and。只要满足其中一种条件，用 or。要排除某种情况，可以用 not()。\n\n大家现在做“短袖 T 恤且待发货”这一题。目标是整行 tr，所以最后返回的也应该是行。\n\n〔留 1 分钟。匹配到两个 tr 后，请学员说明两个条件分别检查了什么。class 独立类名的复杂示例可以留到课后复习，不要求当场默写。〕\n\n最后看统计。\n\n```xpath\ncount(//tbody/tr[td/span[text()=&#x27;待发货&#x27;]])\n```\n\n前面几次，我们找到了元素。这里 count 返回的是数量。这个示例里，待发货订单有两行，所以结果是数字 2。\n\n这次没有红框，大家先别当作报错。它返回的是数字，数字没有可以在页面上框出来的位置。\n\n〔完成第五个进阶任务，再进入表格综合实战。〕\n\n\n第六章，把前面学过的内容用在表格和翻页里\n建议用时 20 分钟\n\n〔打开「表格与翻页综合实战」。带大家从第一步开始，避免停留在之前做过的某一步。〕\n\n这一章我们少讲一点，大家多动手。前面拆开学的东西，现在放到同一个订单场景里用。\n\n第一步，选中订单 XD1002 的整行。\n\n请先看“选择方式”。如果选的是单元格，点击订单号得到的是 td。题目要整行，需要切到“整行 tr”，再去选。\n\n〔给学员 30 秒。请一个选错的同学读出系统反馈，再重新选择。〕\n\n第二步，找 XD1003 的商品格。\n\n你先确定订单所在的行，再取这一行的第二个 td。不要一上来就数整张表里的第几个格子。\n\n〔留 1 分钟独立填写。有人只返回 tr 时，追问“你已经到哪一层了，目标还在里面第几列”。〕\n\n第三步，找 XD1002 的详情按钮。\n\n这一题我们在进阶章练过类似思路。请大家这次独立写。提交后会检查排序变化，只在当前顺序下碰巧点对，还不能通过。\n\n〔留 2 分钟。让学员先看自己的结果，再决定是否展开提示。〕\n\n第四步，看下一页按钮。\n\n先停在第四页，展开它的 HTML 片段。看 aria-disabled 的值，再切到第五页，对比刚才哪里变了。\n\n〔让学员亲自切页。〕\n\n大家现在判断一下。第五页上，“下一页”这几个字还在不在？按钮元素还在不在？它还能不能用？\n\n〔预期回答是文字和元素仍在，但按钮禁用了。〕\n\n所以，检查“按钮有没有”和检查“按钮能不能用”，需要看不同条件。这个示例到末页时，aria-disabled 变成 true，同时出现禁用类名和 disabled 属性。\n\n第五步，自己写一个只找可用下一页的规则。\n\n```xpath\n//button[@data-action=&#x27;next&#x27; and not(@aria-disabled=&#x27;true&#x27;)]\n```\n\n这段我们一起读一下。先限定下一页按钮，再排除 aria-disabled 为 true 的情况。\n\n这个属性名来自当前教学页面。以后做别的网站，先看目标网站自己的源码，找到它用来区分状态的属性。\n\n提交后系统会检查两次。第一页应该找到一个，最后一页应该找到零个。如果两种状态都找到一个，说明还没有排除禁用按钮。\n\n〔留 2 分钟。请学员核对两种状态的检查结果。〕\n\n第六步，用自己的规则跑完整个流程。\n\n这里我给大家两个顺序，先猜一下哪个会漏数据。\n\n一个是先翻页，再读当前页。另一个是先读当前页，再看能不能继续翻页。\n\n〔让学员先说理由。参考答案是先翻页可能漏掉第一页，应先读取当前页。〕\n\n我们用第二个顺序。读取当前页，查找可用下一页。找到一个就继续，找到零个就停。如果找到多个，先检查规则，不能随便挑一个点。\n\n请大家运行自己的流程，看左侧的逐页记录。\n\n这里一共五页，每页三条订单。完成后应该读取到十五条，并在第五页停下来。\n\n核对时别只看“成功”两个字。往下看实际读取的订单号，第一页的 XD1001 有没有，第五页的 XD5003 有没有。再看最后一页的下一页匹配数量，是不是零。\n\n〔留 3 分钟。提前完成的学员，可以把排除禁用状态的条件删掉，重新运行，观察末页错误。还没完成的学员，按反馈逐步修正。〕\n\n\n第七章，自测和现场讲解\n建议用时 7 分钟\n\n〔打开「综合复习与自测」。〕\n\n最后这几道题，请大家先自己做，不用抢着和旁边的人对答案。\n\n〔留 2 分钟作答。提交后，挑现场出错较多的一题讲解。〕\n\n我们再做个小互动。请一位同学指着这条规则，用自己的话说一遍，它从哪里开始找，最后找到了什么。\n\n```xpath\n//tr[td[text()=&#x27;XD1002&#x27;]]//button\n```\n\n〔学员如果只读符号，继续追问“为什么先找 tr”“如果只写 //button 会得到几个”。预期能说清，先按订单号找行，再在行内找详情按钮。〕\n\n再请一位同学说说，遇到零个匹配和多个匹配，各准备先看哪里。\n\n〔参考方向，零个匹配先查属性、文字和层级是否变化；多个匹配先查目标条件是否足够具体，再考虑父区域或业务信息。允许学员用自己的表述。〕\n\n今天先练到这里。课后大家可以找一个自己经常操作的网页，选一个目标元素。先画出它到外层的几级关系，再写一条定位规则，最后刷新页面检查一次。\n\n如果页面上有几个同名按钮，再多做一步。给自己指定一条订单或一条记录，看看能不能只找到它里面的那个按钮。\n\n页面里保留了语雀教程入口，题目是《影刀RPA| xpath怎么学？保姆级教程》，作者标注为 13133870607。课后需要继续看写法时，可以从那里跳转。\n\n\n讲师备用接话\n\n学员说“我完全看不懂这条规则”时\n\n先别看整条。你告诉我，最后要得到的是一行、一个格子，还是一个按钮？我们先把目标标签定下来，再补它所在的位置和条件。\n\n学员说“运行成功了，怎么题目还不通过”时\n\n我们看一下红框实际框住了谁。能找到一个元素，只说明规则有结果，还要核对它是不是指定订单、是不是题目要求的节点类型。\n\n学员说“我把所有属性都勾上，应该更准吧”时\n\n我们逐个看看这些属性会不会变化。你多加一个条件，就多要求页面满足一件事。如果里面有一个随机 id，刷新后就可能对不上。\n\n学员说“我直接重新捕获就好了”时\n\n当前页面确实可以重新捕获。我们今天再往后试一步，下一次刷新时，它还能不能找到？如果又失败，就需要检查规则里保留了哪些会变化的条件。\n\n学员说“有没有一条到处都能用的 XPath”时\n\n先看网页给了什么信息。同名按钮多，就按订单或区域缩小范围。文字会变化，就找固定部分。结构会变化，就少依赖没有业务含义的中间层。具体规则要跟着目标页面来写。\n\n现场暂时没人回答时\n\n没关系，大家先选一个答案。我们等会儿运行一下，拿页面结果验证。猜错也能帮我们看清楚，究竟是哪一层、哪个条件理解岔了。\n\u003c/pre>\u003c/body>\u003c/html>","课程体系/01-循序渐进课程大纲.md":"\u003c!doctype html>\u003chtml lang=\"zh-CN\">\u003chead>\u003cmeta charset=\"utf-8\">\u003cmeta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\u003ctitle>01-循序渐进课程大纲\u003c/title>\u003cstyle>body{max-width:960px;margin:40px auto;padding:0 24px;font:16px/1.9 system-ui;color:#253e34}pre{white-space:pre-wrap;overflow-wrap:anywhere;font:inherit}\u003c/style>\u003c/head>\u003cbody>\u003ch1>01-循序渐进课程大纲\u003c/h1>\u003cpre># RPA 网页练习课程体系\n\n本次整理采用统一入口与课程索引，原文件位置保持不变。新增练习均为规划，尚未实现。\n\n建议共 14 课时，每课时 45–60 分钟，可按基础调整。每课先手动走一条，再搭建 RPA，最后用变化的数据复跑。学习勾选仅为自评，不能替代业务验收。\n\n## 阶段 01　认识网页与稳定定位\n\n先会找一个元素，再学习批量操作。建议 2 课时。\n\n### 01-01 网页结构、属性与 XPath\n\n入口：[网页结构、属性与 XPath](../element-classroom/元素编辑互动课堂.html)\n\n验收：按课堂内顺序完成结构、属性、XPath 入门、动态文本、XPath 进阶；同一规则在两次变化后仍能唯一定位。\n\n### 01-02 表格定位与自动翻页\n\n入口：[表格定位与自动翻页](../element-classroom/元素编辑互动课堂.html)\n\n验收：在课堂中进入表格章节，完成 6 项任务，读取 5 页 15 条订单，末页正确停止。\n\n## 阶段 02　单条填写与页面交互\n\n先做一条正确数据，再处理一批。建议 2 课时。\n\n### 02-01 分步属性填写\n\n入口：[分步属性填写](../SKU属性填写实战练习/04-分步填写.html)\n\n验收：完成一条 SKU 的全部步骤；故意漏填一次，修正后通过校验。\n\n### 02-02 抽屉编辑与保存\n\n入口：[抽屉编辑与保存](../SKU属性填写实战练习/05-抽屉编辑属性.html)\n\n验收：按商品标识打开正确抽屉，修改并应用，回列表核对。\n\n### 02-03 类目联动与等待\n\n入口：[类目联动与等待](../SKU属性填写实战练习/06-类目联动属性.html)\n\n验收：切换类目后等待实际字段出现，按新字段填写并保存。\n\n## 阶段 03　批量数据与循环\n\n由有限分页过渡到动态加载。建议 3 课时。\n\n### 03-01 分页填写\n\n入口：[分页填写](../SKU属性填写实战练习/02-分页填写.html)\n\n验收：覆盖所有页，回查前页数据，证明没有遗漏或覆盖。\n\n### 03-02 展开分组填写\n\n入口：[展开分组填写](../SKU属性填写实战练习/03-展开分组填写.html)\n\n验收：展开每组再处理组内行，按业务标识核对数量。\n\n### 03-03 滚动与懒加载\n\n入口：[滚动与懒加载](../SKU属性填写实战练习/01-滚动懒加载.html)\n\n验收：处理 120 条 SKU，以加载和实际数据状态判断结束，不能只依赖固定滚动次数。\n\n### 03-04 颜色尺码组合\n\n入口：[颜色尺码组合](../SKU属性填写实战练习/08-生成规格组合.html)\n\n验收：组合数等于颜色数 × 尺码数，逐行字段正确且无重复组合。\n\n### 03-05 表格粘贴导入\n\n入口：[表格粘贴导入](../SKU属性填写实战练习/07-表格粘贴导入.html)\n\n验收：先用少量数据验证，再加入错误行；修正、预览、导入并核对行数。\n\n## 阶段 04　返回恢复与去重\n\n理解页面状态与业务状态。建议 1 课时。\n\n### 04-01 退款详情返回丢页码\n\n入口：[退款详情返回丢页码](../refund-return-demo/退款管理返回故障演示.html)\n\n验收：从第 3 页进入详情，返回后恢复搜索条件和页码，再继续下一条；最终采集结果无重无漏。\n\n## 阶段 05　异常判断与恢复\n\n按正常 → 单故障 → 综合故障练习。建议 3 课时。\n\n### 05-01 正常订单与有限重试\n\n入口：[正常订单与有限重试](../order-fault-lab/订单故障练习场.html)\n\n验收：先处理正常订单，再处理 XD1005 首次提交失败；读取业务反馈，确认只写入一次。\n\n### 05-02 超时、缺字段、弹窗与持续失败\n\n入口：[超时、缺字段、弹窗与持续失败](../order-fault-lab/订单故障练习场.html)\n\n验收：老师每次只启用一种故障；持续提交失败最多尝试 3 次，记录原因并继续下一条。\n\n### 05-03 登录失效与断点恢复\n\n入口：[登录失效与断点恢复](../order-fault-lab/登录恢复练习说明.txt)\n\n验收：用本地启动器练真实页面跳转；登录专项跳过 XD1003 后，得到 9 成功、1 跳过，已有结果保留。\n\n## 阶段 06　综合项目与独立交付\n\n撤掉操作步骤，只给输入与验收要求。建议 3 课时。\n\n### 06-01 商品上架综合项目\n\n入口：[商品上架综合项目](../SKU属性填写实战练习/09-商品上架综合实战.html)\n\n验收：完成基本信息、类目、规格、SKU 编辑和发布预览；核对全部必填字段和组合数量。\n\n### 06-02 订单故障综合考核\n\n入口：[订单故障综合考核](../order-fault-lab/订单故障练习场.html)\n\n验收：启用综合考核；重做登录异常条时为 8 成功、1 数据异常、1 失败；跳过时为 7 成功、1 数据异常、1 失败、1 跳过。XD1007 只写入一次。\n\n## 统一作业与评分\n\n每课提交 RPA 流程、输入样本、逐条结果表及一次完整运行记录。结果表建议字段为业务编号、预期结果、实际结果、状态、尝试次数、失败原因。\n\n建议评分：业务结果正确 40 分，定位与等待稳定 20 分，异常分支和重试上限 20 分，日志与可复现性 20 分。80 分以上且无漏处理、重复写入，进入下一阶段。初级课未涉及的异常项由讲师换算，不强行考察未学内容。\n\n结业复跑三次：正常输入、部分异常、处理中断后继续。每次使用独立重置的场景，核对条数与业务状态；不要把三次结果混为一次。\n\n## 后续适合新增的网页\n\nP0 先补基础缺口，P1 再补跨页与稳定性，P2 做业务综合项目。\n\n### P0 基础表单练习站（待开发）\n\n安排：放在阶段 01 之后。训练：文本、单选、多选、下拉、日期、必填校验。\n\n验收：输入 10 条固定客户数据，回读字段，提交结果与输入逐项一致。\n\n### P0 查询筛选与结果采集（待开发）\n\n安排：阶段 02。训练：组合筛选、空结果、排序、金额与日期读取。\n\n验收：给定条件对应固定结果集；订单号、数量与汇总金额全部一致。\n\n### P0 文件上传下载中心（待开发）\n\n安排：阶段 03。训练：文件选择、扩展名校验、下载命名、CSV 导入导出。\n\n验收：上传样本后核对条数；由 RPA 在本机检查下载存在、文件名和内容。\n\n### P1 多标签页与 iframe 工作台（待开发）\n\n安排：阶段 04。训练：新标签打开、切换、关闭、返回原页、嵌套框架。\n\n验收：处理 5 个详情后回到原列表，页码保留，记录不串行；iframe 使用本地 HTTP 服务。\n\n### P1 日期与复杂下拉组件（待开发）\n\n安排：阶段 02。训练：跨月日期、可搜索下拉、多级地区、选项异步加载。\n\n验收：同一流程处理 3 组不同日期与地区，不能用固定坐标。\n\n### P1 异步任务与状态轮询（待开发）\n\n安排：阶段 05。训练：任务排队、处理中、完成、失败、超时。\n\n验收：根据终态决定下载或记录失败，超时有上限，不重复创建任务。\n\n### P1 动态列表定位挑战（待开发）\n\n安排：阶段 03。训练：动态 id、重复按钮、排序变化、行内定位。\n\n验收：刷新和排序后按业务编号定位，操作目标保持正确。\n\n### P2 客户资料与重复检查（待开发）\n\n安排：阶段 06。训练：查询后新增、重复提示、数据清洗、更新现有客户。\n\n验收：第二次运行不新增重复客户，保留每条处理结果。\n\n### P2 审批与报销工作台（待开发）\n\n安排：阶段 06。训练：金额分支、附件核对、审批意见、驳回原因。\n\n验收：按规则分别通过或驳回，汇总金额与状态匹配。\n\n### P2 库存与订单对账（待开发）\n\n安排：阶段 06。训练：两表关联、差异筛选、库存更新、结果导出。\n\n验收：差异清单与标准答案一致，重复执行不重复扣减。\n\n### P2 售后工单流转（待开发）\n\n安排：阶段 06。训练：按类型分派、条件处理、备注、业务状态迁移。\n\n验收：每种工单走正确分支，未知类型进入人工复核清单。\n\n### P2 跨系统搬运综合项目（待开发）\n\n安排：阶段 06 结业。训练：A 系统采集、B 系统录入、映射、断点续跑。\n\n验收：中断后续跑，最终目标记录完整、无重复，有逐条结果和失败原因。\n\u003c/pre>\u003c/body>\u003c/html>","课程体系/02-文件夹内容索引.md":"\u003c!doctype html>\u003chtml lang=\"zh-CN\">\u003chead>\u003cmeta charset=\"utf-8\">\u003cmeta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\u003ctitle>02-文件夹内容索引\u003c/title>\u003cstyle>body{max-width:960px;margin:40px auto;padding:0 24px;font:16px/1.9 system-ui;color:#253e34}pre{white-space:pre-wrap;overflow-wrap:anywhere;font:inherit}\u003c/style>\u003c/head>\u003cbody>\u003ch1>02-文件夹内容索引\u003c/h1>\u003cpre># 文件夹内容与使用索引\n\n| 位置 | 内容 | 使用方式 |\n|---|---|---|\n| element-classroom | 元素定位课堂，含 CSS/JS 和讲师稿 | 学员从 HTML 入口进入；课程脚本不要单独打开。 |\n| SKU属性填写实战练习 | 8 个专项 + 1 个综合后台 + 原入口 | 本体系按单条 → 批量 → 综合重排教学顺序。 |\n| refund-return-demo | 退款返回故障演示与验证脚本 | 先理解正常分页，再学习返回后的状态恢复。 |\n| order-fault-lab | 异常处理、登录页、服务器、验证脚本和教学说明 | HTTP 模式双击原目录的启动本地练习场.cmd，依赖本机 Python。 |\n| 培训文档 | 异常培训手册、讲稿、生成脚本和版面检查文件 | 学员阅读手册；讲师维护脚本与版面检查资料。 |\n| sku-lazy-training/dist | 懒加载原始网页资源 | 原始开发资源；日常练习优先用 SKU 文件夹中的单文件版。 |\n| build_local_practice.py / build_extra_practice.py / build_listing_lab.py | 现有网页生成脚本 | 维护用；可能覆盖原练习文件，学员无需运行。 |\n| SKU属性填写实战练习.zip | 已有分发压缩包 | 保留原包；它不包含本次新增课程导航。 |\n\n## 使用约定\n\n双击根目录“00-RPA练习总入口.html”开始。目录名与原始资源不变，避免破坏 JS/CSS 相对路径、生成脚本以及分发包。\n\n订单登录恢复推荐原启动器 HTTP 模式；单文件版只模拟 #login / #orders，不能用于验收独立页面路径跳转。不同来源、端口和浏览器的进度可能不同。\n\n课程导航只记录本浏览器的自评勾选，不读取练习页面成绩，不同步其他电脑。浏览器禁用本地存储时仍可浏览课程，但勾选无法持久保存。\n\n课程体系目录保存教学安排与资料索引；本次不修改原有练习、讲师稿、Word 手册或旧压缩包。\u003c/pre>\u003c/body>\u003c/html>"},"assets":{"培训文档/影刀异常处理培训手册.docx":{"data":"UEsDBBQAAAAIAIxdXF0uF+EAqAEAAMoHAAATAAAAW0NvbnRlbnRfVHlwZXNdLnhtbLWVTW/TQBCG7/wKyxcfkL0pB4RQnB6gHKESQXDd7I7jbfdLO5O2+ffMOo2FSopT0lwiOTPv+zz+kueXD84Wd5DQBN9WF82sKsCroI1ft9WP5Zf6Q1UgSa+lDR7aagtYXS7ezJfbCFhw2GNb9kTxoxCoenASmxDB86QLyUniw7QWUapbuQbxbjZ7L1TwBJ5qyh3lYv4ZOrmxVFw98N+DSHkTYV0Wn3aLmdWWxuWCYSAOZhJY <script>
(() => {
  'use strict';
  const bundle = JSON.parse(document.getElementById('bundle-data').textContent);
  const frame = document.getElementById('pageFrame');
  const select = document.getElementById('pageSelect');
  let current = '', pending = false;
  const titles = {};
  const groups = new Map();
  for (const [path, source] of Object.entries(bundle.pages)) {
    const doc = new DOMParser().parseFromString(source, 'text/html');
    titles[path] = doc.title || path.split('/').pop();
    const groupName = path.split('/')[0];
    if (!groups.has(groupName)) {
      const group = document.createElement('optgroup');
      group.label = groupName;
      groups.set(groupName, group);
      select.append(group);
    }
    const option = document.createElement('option');
    option.value = path;
    option.textContent = path.endsWith('.html') ? titles[path] : path.split('/').pop();
    if (path.includes('/dist/') || /order-fault-lab\/(index|orders)\.html$/.test(path)) option.textContent += '（原始入口）';
    groups.get(groupName).append(option);
  }
  function resolve(href, base) {
    if (bundle.pages[href] || bundle.assets[href]) return {path:href, hash:''};
    const url = new URL(href, 'https://bundle.invalid/' + base);
    if (url.origin !== 'https://bundle.invalid') return null;
    let path;
    try { path = decodeURIComponent(url.pathname).slice(1); } catch { return null; }
    if (path === '00-RPA练习总入口.html') path = bundle.home;
    return {path, hash:url.hash};
  }
  function download(path) {
    const asset = bundle.assets[path];
    const bytes = Uint8Array.from(atob(asset.data), ch => ch.charCodeAt(0));
    const url = URL.createObjectURL(new Blob([bytes], {type:asset.type}));
    const a = document.createElement('a');
    a.href = url; a.download = path.split('/').pop(); a.click();
    setTimeout(() => URL.revokeObjectURL(url), 2000);
  }
  function bridge(path) {
    window.__singleNavigate = href => parent.SingleSite.navigate(href, path);
    window.__singleReload = () => parent.SingleSite.reload();
    document.addEventListener('click', event => {
      const link = event.target.closest && event.target.closest('a[href]');
      if (!link || event.defaultPrevented || link.hasAttribute('download')) return;
      const href = link.getAttribute('href');
      if (!href || href.startsWith('#') || /^(blob:|data:|javascript:|mailto:|tel:)/i.test(href)) return;
      if (parent.SingleSite.canOpen(href, path)) {
        event.preventDefault(); parent.SingleSite.navigate(href, path);
      } else if (/^https?:/i.test(href)) {
        link.target = '_blank'; link.rel = 'noopener noreferrer';
      }
    });
  }
  function render(path, hash = '') {
    if (!bundle.pages[path]) path = bundle.home;
    current = path;
    select.value = path;
    document.title = titles[path] + ' · RPA 练习中心';
    frame.title = titles[path];
    const injection = '<script>(' + bridge.toString() + ')(' + JSON.stringify(path) + ');<\/script>';
    frame.onload = () => {
      if (hash) {
        const id = decodeURIComponent(hash.slice(1));
        frame.contentDocument.getElementById(id)?.scrollIntoView();
      }
    };
    const source = bundle.pages[path];
    frame.srcdoc = /<head\b/i.test(source)
      ? source.replace(/<head\b[^>]*>/i, match => match + injection)
      : source.replace(/<html\b[^>]*>/i, match => match + injection);
  }
  function navigate(href, base = current || bundle.home) {
    const result = resolve(href, base);
    if (!result) return;
    if (bundle.assets[result.path]) return download(result.path);
    if (!bundle.pages[result.path]) return;
    const route = '#page=' + encodeURIComponent(result.path);
    if (location.hash === route) render(result.path, result.hash);
    else { pending = result.hash; location.hash = route; }
  }
  function route() {
    let path = bundle.home;
    try {
      if (location.hash.startsWith('#page=')) path = decodeURIComponent(location.hash.slice(6));
    } catch {}
    render(path, pending || ''); pending = false;
  }
  window.SingleSite = {
    navigate,
    reload: () => render(current),
    canOpen: (href, base) => {const r = resolve(href, base); return !!r && !!(bundle.pages[r.path] || bundle.assets[r.path]);}
  };
  document.getElementById('home').onclick = () => navigate(bundle.home, bundle.home);
  document.getElementById('errorLookup').onclick = () => navigate('常见错误/常见错误速查.html');
  document.getElementById('back').onclick = () => history.back();
  select.onchange = () => navigate(select.value, bundle.home);
  window.addEventListener('hashchange', route);
  route();
})();
</script>
</body>
</html>
