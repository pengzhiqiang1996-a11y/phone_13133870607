<style>
  /* ===== 作者：13133870607 小可耐教你学RPA ===== */
  :root{
    --底色:#0e1320;
    --卡片底:#161d2e;
    --卡片底亮:#1c2540;
    --描边:#2a3550;
    --主色:#5b8cff;
    --主色亮:#7aa2ff;
    --强调:#ffb454;
    --文字:#e8edf7;
    --文字次:#94a2c0;
    --成功:#3ecf8e;
    --圆角:16px;
    --阴影:0 8px 30px rgba(0,0,0,.35);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    font-family:"PingFang SC","Microsoft YaHei",-apple-system,system-ui,sans-serif;
    background:
      radial-gradient(1200px 600px at 80% -10%,rgba(91,140,255,.18),transparent 60%),
      radial-gradient(1000px 500px at 0% 110%,rgba(255,180,84,.12),transparent 55%),
      var(--底色);
    color:var(--文字);
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  .容器{max-width:1080px;margin:0 auto;padding:48px 24px 80px}

  /* 头部 */
  .头部{display:flex;align-items:center;gap:18px;margin-bottom:14px}
  .头像{
    width:64px;height:64px;border-radius:18px;flex-shrink:0;
    background:linear-gradient(135deg,var(--主色),var(--强调));
    display:flex;align-items:center;justify-content:center;
    font-size:30px;font-weight:800;color:#fff;
    box-shadow:var(--阴影);
  }
  .头部 h1{font-size:30px;letter-spacing:.5px}
  .头部 .签名{color:var(--文字次);font-size:14px;margin-top:4px}
  .头部 .签名 b{color:var(--主色亮);font-weight:600}
  .标语{
    margin:22px 0 38px;color:var(--文字次);font-size:15px;line-height:1.7;
    max-width:640px;border-left:3px solid var(--主色);padding-left:14px;
  }

  /* 分组标题 */
  .组标题{
    display:flex;align-items:center;gap:10px;
    margin:38px 0 18px;font-size:14px;letter-spacing:2px;
    color:var(--文字次);text-transform:uppercase;
  }
  .组标题::after{content:"";flex:1;height:1px;background:var(--描边)}

  /* 卡片网格 */
  .网格{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:18px}
  .卡片{
    background:linear-gradient(180deg,var(--卡片底亮),var(--卡片底));
    border:1px solid var(--描边);border-radius:var(--圆角);
    padding:20px;display:flex;flex-direction:column;gap:12px;
    transition:transform .18s ease,border-color .18s ease,box-shadow .18s ease;
  }
  .卡片:hover{transform:translateY(-4px);border-color:var(--主色);box-shadow:var(--阴影)}
  .卡片 .图标{font-size:26px}
  .卡片 .名称{font-size:18px;font-weight:700}
  .卡片 .描述{font-size:13px;color:var(--文字次);line-height:1.6;flex:1}
  .标签{
    display:inline-block;font-size:11px;padding:2px 8px;border-radius:999px;
    background:rgba(62,207,142,.14);color:var(--成功);border:1px solid rgba(62,207,142,.3);
  }
  .标签.离线{background:rgba(255,180,84,.14);color:var(--强调);border-color:rgba(255,180,84,.3)}
  .标签.库{background:rgba(122,162,255,.14);color:var(--主色亮);border-color:rgba(122,162,255,.3)}

  /* 知识库卡片：强调色描边区分于工具 */
  .卡片.知识库{
    background:linear-gradient(180deg,rgba(255,180,84,.06),var(--卡片底));
    border-color:rgba(255,180,84,.3);
  }
  .卡片.知识库:hover{border-color:var(--强调);box-shadow:0 8px 30px rgba(255,180,84,.18)}
  .btn.强调{background:var(--强调);color:#1a1205}
  .btn.强调:hover{opacity:.88}

  /* 按钮 */
  .按钮组{display:flex;gap:10px;margin-top:4px}
  .btn{
    flex:1;text-align:center;text-decoration:none;
    padding:10px 12px;border-radius:10px;font-size:13px;font-weight:600;
    transition:background .15s ease,opacity .15s ease;
  }
  .btn.主{background:var(--主色);color:#fff}
  .btn.主:hover{background:var(--主色亮)}
  .btn.次{background:transparent;color:var(--文字次);border:1px solid var(--描边)}
  .btn.次:hover{color:var(--文字);border-color:var(--主色)}

  /* 页脚 */
  .页脚{
    margin-top:60px;padding-top:24px;border-top:1px solid var(--描边);
    text-align:center;color:var(--文字次);font-size:13px;line-height:1.8;
  }
  .页脚 b{color:var(--主色亮)}
  .页脚 a{color:var(--文字次);text-decoration:none}
  .页脚 a:hover{color:var(--主色亮)}

  @media(max-width:520px){
    .容器{padding:32px 16px 60px}
    .头部 h1{font-size:24px}
  }
</style>
</head>
