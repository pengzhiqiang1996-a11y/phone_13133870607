display:inline-block;width:7px;height:7px;background:#26ae82;border-radius:100%;margin-right:7px}.caption{color:#8994a7;font-size:12px}.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:14px 20px;background:#fcfdff;border-bottom:1px solid var(--line)}select,input{border:1px solid #dce3ed;border-radius:5px;padding:7px 9px;outline:0;background:#fff;color:#354259}input:focus,select:focus{border-color:#4d86f4;box-shadow:0 0 0 3px #2563eb12}.toolbar input{width:108px}.divider{width:1px;height:24px;background:var(--line);margin:0 5px}.toolbar .hint{margin-left:auto;font-size:12px;color:#8994a7}.scroll{height:440px;overflow:auto;scroll-behavior:smooth;position:relative}table{border-collapse:separate;border-spacing:0;min-width:1100px;width:100%;font-size:12px;text-align:left}thead th{position:sticky;top:0;z-index:2;background:#f4f6fa;color:#6c7a90;padding:12px 10px;border-bottom:1px solid var(--line);font-weight:500;white-space:nowrap}td{padding:12px 10px;border-bottom:1px solid #edf0f6;white-space:nowrap}tbody tr:nth-child(even){background:#fbfcfe}tbody tr:hover{background:#f0f5ff}td input:not([type=checkbox]){width:100%;min-width:75px;font-size:12px;padding:6px 7px}td input[type=number]{width:95px}.check{accent-color:var(--blue);cursor:pointer}.num{color:#9ca6b6;font-variant-numeric:tabular-nums}.product{display:flex;align-items:center;gap:10px;min-width:170px}.thumb{width:34px;height:42px;border-radius:5px;background:#edf0f5;display:grid;place-items:center;font-size:24px}.sub{color:#8c98aa;font-size:11px}.required{color:#e66a66}.status{font-size:11px;background:#fff4e6;color:#be8736;padding:3px 7px;border-radius:4px}.status.done{background:#e9f8f1;color:#26966c}.invalid{border-color:#e87575!important;background:#fff8f8!important}#sentinel{text-align:center;color:#8d99ac;font-size:12px;padding:20px;min-width:1100px}#sentinel button{font-size:12px;margin-left:12px}.panel-foot{display:flex;justify-content:space-between;align-items:center;padding:13px 20px;border-top:1px solid var(--line);color:#8b97aa;font-size:12px}.track{height:5px;background:#edf1f8;border-radius:5px;width:130px;display:inline-block;vertical-align:middle;margin-right:12px;overflow:hidden}.fill{height:100%;background:#377cf5;width:0;transition:width .3s}.bottom{display:flex;justify-content:space-between;align-items:center;margin-top:20px;gap:20px}.lesson{font-size:12px;color:#8794a7}.lesson b{color:#53647e}.actions{display:flex;gap:10px}.log{margin-top:22px;border:1px dashed #d6deea;border-radius:8px;padding:12px 18px;color:#8391a7;font-size:12px;background:#f9fbff}.log b{color:#53647e;margin-right:18px}.toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%);background:#152643;color:white;padding:12px 24px;border-radius:8px;z-index:10;box-shadow:0 5px 30px #162c4425}.modal{position:fixed;inset:0;background:#101d3670;display:grid;place-items:center;z-index:20}.modal[hidden]{display:none}.dialog{background:white;border-radius:14px;padding:30px;width:min(520px,90vw);box-shadow:0 20px 80px #0003}.dialog h2{margin-top:0}.dialog ol{padding-left:22px;color:#62718b;line-height:2}.dialog button{float:right}button:focus-visible{outline:3px solid #9dbfff}@media(max-width:1000px){.side{display:none}.content{padding:20px}header{padding:0 20px}.heading{align-items:flex-start}h1{font-size:22px}.stats{gap:8px}.stat{padding:12px}.toolbar .hint{display:none}}@media(max-width:650px){.heading,.bottom{display:block}.topbuttons,.actions{margin-top:15px}.stats{grid-template-columns:repeat(2,1fr)}.notice{font-size:12px}.caption{display:none}.log{line-height:2}}\n\u003c/style>\u003c/head>\u003cbody>\u003cdiv class=\"shell\">\u003caside class=\"side\">\u003cdiv class=\"brand\">\u003cspan class=\"logo\">▦\u003c/span>商家实训台\u003c/div>\u003cdiv class=\"smallcap\">WORKSPACE\u003c/div>\u003cdiv class=\"nav\">▤　商品管理\u003c/div>\u003cdiv class=\"nav active\">▦　SKU 属性填写\u003c/div>\u003cdiv class=\"smallcap\">TRAINING LAB\u003c/div>\u003cdiv class=\"nav\">◷　懒加载演示\u003c/div>\u003cdiv class=\"side-note\">\u003cb>练习，让操作更熟练\u003c/b>模拟商品数据，可放心填写。\u003cbr>所有练习仅保存在本机浏览器。\u003c/div>\u003c/aside>\u003cmain>\u003cheader>\u003cspan>培训工作台　 /　 商品管理　 /　 \u003cb style=\"color:#3b4e6d\">SKU 属性填写\u003c/b>\u003c/span>\u003cspan>练习环境 \u003cspan class=\"avatar\">练\u003c/span>\u003c/span>\u003c/header>\u003cdiv class=\"content\">\u003cdiv class=\"heading\">\u003cdiv>\u003ch1>SKU 属性填写\u003cspan class=\"badge\">懒加载实训\u003c/span>\u003c/h1>\u003cp>向下滚动，加载更多规格，完成商品销售属性填写。\u003c/p>\u003c/div>\u003cdiv class=\"topbuttons\">\u003cbutton id=\"guide\">ⓘ 操作指引\u003c/button>\u003cbutton id=\"reset\">↻ 重置练习\u003c/button>\u003c/div>\u003c/div>\u003cdiv class=\"notice\">\u003cspan>◉\u003c/span>\u003cdiv>\u003cb>当前开启懒加载\u003c/b>　每次加载 20 条 SKU，滚动到表格底部触发下一批。已加载与已完成是两个不同的进度。\u003c/div>\u003c/div>\u003cdiv class=\"stats\">\u003cdiv class=\"stat\">\u003clabel>SKU 总数\u003c/label>\u003cstrong>120\u003csmall>条规格\u003c/small>\u003c/strong>\u003c/div>\u003cdiv class=\"stat\">\u003clabel>已加载\u003c/label>\u003cstrong class=\"blue\" id=\"loaded\">0\u003csmall>/ 120\u003c/small>\u003c/strong>\u003c/div>\u003cdiv class=\"stat\">\u003clabel>已完成填写\u003c/label>\u003cstrong class=\"green\" id=\"completed\">0\u003csmall>条 SKU\u003c/small>\u003c/strong>\u003c/div>\u003cdiv class=\"stat\">\u003clabel>待完成\u003c/label>\u003cstrong id=\"remaining\">120\u003csmall>条 SKU\u003c/small>\u003c/strong>\u003c/div>\u003c/div>\u003csection class=\"panel\">\u003cdiv class=\"panel-title\">\u003cstrong>销售规格 \u003cspan class=\"badge\" style=\"font-weight:400\">日用餐具 · 双支装\u003c/span>\u003c/strong>\u003cspan class=\"caption\">\u003cspan class=\"pulse\">\u003c/span>\u003cspan id=\"loadState\">按需加载中\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"toolbar\">\u003cspan id=\"selectedText\">已选 0 项\u003c/span>\u003cspan class=\"divider\">\u003c/span>\u003cselect id=\"batchField\" aria-label=\"批量填写字段\">\u003coption value=\"price\">售价（元）\u003c/option>\u003coption value=\"stock\">库存（件）\u003c/option>\u003coption value=\"weight\">重量（kg）\u003c/option>\u003coption value=\"material\">材质\u003c/option>\u003c/select>\u003cinput id=\"batchValue\" placeholder=\"输入批量值\" aria-label=\"批量值\">\u003cbutton id=\"apply\">应用到选中项\u003c/button>\u003cspan class=\"hint\">＊ 为必填项　｜　支持 Tab 切换单元格\u003c/span>\u003c/div>\u003cdiv class=\"scroll\" id=\"viewport\">\u003ctable>\u003cthead>\u003ctr>\u003cth>\u003cinput class=\"check\" type=\"checkbox\" id=\"selectAll\" aria-label=\"全选已加载行\">\u003c/th>\u003cth>#\u003c/th>\u003cth>颜色 / 组合规格\u003c/th>\u003cth>适用规格\u003c/th>\u003cth>材质 \u003cspan class=\"required\">*\u003c/span>\u003c/th>\u003cth>售价 / 元 \u003cspan class=\"required\">*\u003c/span>\u003c/th>\u003cth>商家 SKU 编码\u003c/th>\u003cth>库存 / 件 \u003cspan class=\"required\">*\u003c/span>\u003c/th>\u003cth>重量 / kg \u003cspan class=\"required\">*\u003c/span>\u003c/th>\u003cth>填写状态\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody id=\"rows\">\u003c/tbody>\u003c/table>\u003cdiv id=\"sentinel\" aria-live=\"polite\">\u003c/div>\u003c/div>\u003cdiv class=\"panel-foot\">\u003cspan>\u003cspan class=\"track\">\u003cspan class=\"fill\" id=\"progress\" style=\"display:block\">\u003c/span>\u003c/span>\u003cspan id=\"progressText\">已加载 0 / 120 条\u003c/span>\u003c/span>\u003cspan id=\"batchCount\">第 0 / 6 批\u003c/span>\u003c/div>\u003c/section>\u003cdiv class=\"bottom\">\u003cdiv class=\"lesson\">\u003cb>练习提示\u003c/b>　滚动表格 → 加载新规格 → 填写必填项 → 校验并提交\u003cbr>批量填写仅影响选中行；表头复选框仅选择已加载的规格。\u003c/div>\u003cdiv class=\"actions\">\u003cbutton id=\"save\">保存练习\u003c/button>\u003cbutton class=\"primary\" id=\"submit\">校验并提交　→\u003c/button>\u003c/div>\u003c/div>\u003cdiv class=\"log\">\u003cb>加载记录\u003c/b>\u003cspan id=\"log\" aria-live=\"polite\">准备加载首批 SKU…\u003c/span>\u003c/div>\u003c/div>\u003c/main>\u003c/div>\u003cdiv class=\"modal\" id=\"guideModal\" hidden>\u003cdiv class=\"dialog\">\u003ch2>懒加载，边滚动边填写\u003c/h2>\u003cp>这是一套包含 120 条模拟 SKU 的实训。\u003c/p>\u003col>\u003cli>首次只渲染 20 条，观察上方加载计数。\u003c/li>\u003cli>在表格内部向下滚动，等待约 0.8 秒加载下一批。\u003c/li>\u003cli>填写材质、售价、库存和重量，可勾选后批量填写。\u003c/li>\u003cli>滚回顶部，检查已填写内容是否保留。\u003c/li>\u003cli>加载并填写全部 120 条，再校验提交。\u003c/li>\u003c/ol>\u003cp style=\"margin-bottom:20px\">保存练习后，刷新页面可恢复数据与加载进度。\u003c/p>\u003cbutton class=\"primary\" id=\"closeGuide\">开始练习\u003c/button>\u003cdiv style=\"clear:both\">\u003c/div>\u003c/div>\u003c/div>\u003cscript>const $=s=>document.querySelector(s),TOTAL=120,KEY='sku-lazy-training-v1';\nconst colors=['曜石黑','云雾白','奶油白','森林绿','雾霾蓝','樱花粉'],sizes=['日常款｜适合 65–125 斤','宽版款｜适合 115–155 斤'];\nlet data=Array.from({length:TOTAL},(_,i)=>({id:i+1,color:colors[Math.floor(i/2)%6],size:sizes[i%2],material:'',price:'',code:`FX-2049-${String(i+1).padStart(4,'0')}`,stock:'',weight:''})),loaded=0,loading=false,selected=new Set(),batches=0,dirty=false;\ntry{const s=JSON.parse(localStorage.getItem(KEY));if(s&&Array.isArray(s.data)&&s.data.length===TOTAL){data=s.data;loaded=Math.min(TOTAL,Math.max(20,Number(s.loaded)||20));}}catch{}\nconst valid=(k,v)=>k==='material'?String(v).trim().length>0:v!==''&&Number.isFinite(Number(v))&&(k==='price'?Number(v)>0:k==='stock'?Number.isInteger(Number(v))&&Number(v)>=0:Number(v)>0);\nconst complete=r=>['material','price','stock','weight'].every(k=>valid(k,r[k]));\nfunction toast(t){$('.toast')?.remove();const e=document.createElement('div');e.className='toast';e.role='status';e.textContent=t;document.body.append(e);setTimeout(()=>e.remove(),3500)}\nfunction makeRow(r){const tr=document.createElement('tr');tr.dataset.id=r.id;tr.innerHTML=`\u003ctd>\u003cinput type=\"checkbox\" class=\"check rowcheck\" aria-label=\"选择第 ${r.id} 条\">\u003c/td>\u003ctd class=\"num\">${String(r.id).padStart(3,'0')}\u003c/td>\u003ctd>\u003cdiv class=\"product\">\u003cspan class=\"thumb\">🥢\u003c/span>\u003cdiv>【双支装】${r.color}\u003cdiv class=\"sub\">组合规格 ${String(Math.ceil(r.id/12)).padStart(2,'0')}\u003c/div>\u003c/div>\u003c/div>\u003c/td>\u003ctd>${r.size}\u003c/td>\u003ctd>\u003cinput data-key=\"material\" placeholder=\"如：304 不锈钢\" aria-label=\"第 ${r.id} 条材质\">\u003c/td>\u003ctd>\u003cinput data-key=\"price\" type=\"number\" min=\"0.01\" step=\"0.01\" placeholder=\"待填写\" aria-label=\"第 ${r.id} 条售价\">\u003c/td>\u003ctd>\u003cinput data-key=\"code\" aria-label=\"第 ${r.id} 条编码\">\u003c/td>\u003ctd>\u003cinput data-key=\"stock\" type=\"number\" min=\"0\" step=\"1\" placeholder=\"待填写\" aria-label=\"第 ${r.id} 条库存\">\u003c/td>\u003ctd>\u003cinput data-key=\"weight\" type=\"number\" min=\"0.001\" step=\"0.001\" placeholder=\"待填写\" aria-label=\"第 ${r.id} 条重量\">\u003c/td>\u003ctd>\u003cspan class=\"status\">待填写\u003c/span>\u003c/td>`;tr.querySelectorAll('[data-key]').forEach(e=>e.value=r[e.dataset.key]);updateRow(tr,r);return tr}\nfunction updateRow(tr,r){const e=tr.querySelector('.status');e.textContent=complete(r)?'已完成':'待填写';e.classList.toggle('done',complete(r))}\nfunction stats(){const done=data.filter(complete).length;$('#loaded').innerHTML=`${loaded}\u003csmall>/ 120\u003c/small>`;$('#completed').innerHTML=`${done}\u003csmall>条 SKU\u003c/small>`;$('#remaining').innerHTML=`${TOTAL-done}\u003csmall>条 SKU\u003c/small>`;$('#progress').style.width=loaded/TOTAL*100+'%';$('#progressText').textContent=`已加载 ${loaded} / 120 条`;$('#batchCount').textContent=`第 ${Math.ceil(loaded/20)} / 6 批`;$('#selectedText').textContent=`已选 ${selected.size} 项`;$('#selectAll').checked=loaded>0&&selected.size===loaded;$('#selectAll').indeterminate=selected.size>0&&selected.size\u003cloaded;$('#loadState').textContent=loaded===TOTAL?'全部规格已加载':'按需加载中'}\nfunction sentinel(){const s=$('#sentinel');s.replaceChildren();s.append(document.createTextNode(loaded===TOTAL?'✓ 已加载全部 120 条规格，继续填写并提交':'向下滚动加载更多规格'));if(loaded\u003cTOTAL){const b=document.createElement('button');b.textContent='加载下一批 ↓';b.onclick=loadMore;s.append(b)}}\nasync function loadMore(){if(loading||loaded>=TOTAL)return;loading=true;$('#sentinel').textContent='◌ 正在加载下一批 SKU…';$('#log').textContent=`正在请求第 ${Math.floor(loaded/20)+1} 批数据…`;await new Promise(r=>setTimeout(r,800));const start=loaded;loaded=Math.min(TOTAL,loaded+20);const frag=document.createDocumentFragment();data.slice(start,loaded).forEach(r=>frag.append(makeRow(r)));$('#rows').append(frag);batches++;stats();sentinel();loading=false;$('#log').textContent=`${new Date().toLocaleTimeString('zh-CN')}　已加载第 ${start+1}–${loaded} 条 · 本次新增 ${loaded-start} 条 · 模拟网络耗时 800 ms`;}\n$('#rows').addEventListener('input',e=>{const k=e.target.dataset.key;if(!k)return;const tr=e.target.closest('tr'),r=data[Number(tr.dataset.id)-1];r[k]=e.target.value;dirty=true;e.target.classList.toggle('invalid',k!=='code'&&!valid(k,r[k]));updateRow(tr,r);stats()});\n$('#rows').addEventListener('change',e=>{if(!e.target.classList.contains('rowcheck'))return;const id=Number(e.target.closest('tr').dataset.id);e.target.checked?selected.add(id):selected.delete(id);stats()});\n$('#selectAll').onchange=e=>{selected.clear();$('#rows').querySelectorAll('tr').forEach(tr=>{tr.querySelector('.rowcheck').checked=e.target.checked;if(e.target.checked)selected.add(Number(tr.dataset.id))});stats()};\n$('#apply').onclick=()=>{const k=$('#batchField').value,v=$('#batchValue').value;if(!selected.size)return toast('请先勾选需要填写的 SKU');if(!valid(k,v))return toast(k==='material'?'请输入材质':k==='stock'?'库存需为大于等于 0 的整数':'请输入大于 0 的数值');selected.forEach(id=>{const r=data[id-1];r[k]=v;const tr=$(`#rows tr[data-id=\"${id}\"]`);const input=tr.querySelector(`[data-key=\"${k}\"]`);input.value=v;input.classList.remove('invalid');updateRow(tr,r)});dirty=true;stats();toast(`已更新 ${selected.size} 条 SKU`)};\n$('#save').onclick=()=>{try{localStorage.setItem(KEY,JSON.stringify({data,loaded}));dirty=false;toast('练习已保存，刷新后可继续填写')}catch{toast('浏览器存储不可用，请导出或保留当前页面')}};\n$('#reset').onclick=()=>{if(!confirm('确定重置全部填写内容和加载进度？'))return;localStorage.removeItem(KEY);window.__singleReload()};\n$('#guide').onclick=()=>{$('#guideModal').hidden=false;$('#closeGuide').focus()};$('#closeGuide').onclick=()=>{$('#guideModal').hidden=true;$('#guide').focus()};document.addEventListener('keydown',e=>{if(e.key==='Escape')$('#guideModal').hidden=true});\n$('#submit').onclick=()=>{const incomplete=data.find(r=>!complete(r));if(incomplete){const tr=$(`#rows tr[data-id=\"${incomplete.id}\"]`);if(tr){tr.scrollIntoView({block:'center',behavior:'smooth'});const k=['material','price','stock','weight'].find(k=>!valid(k,incomplete[k]));tr.querySelector(`[data-key=\"${k}\"]`).focus();tr.querySelectorAll('[data-key]').forEach(e=>e.classList.toggle('invalid',e.dataset.key!=='code'&&!valid(e.dataset.key,incomplete[e.dataset.key])))}return toast(`还有 ${data.filter(r=>!complete(r)).length} 条未完成${incomplete.id>loaded?'，请继续向下滚动加载':'，请补全标记字段'}`)}toast('✓ 120 条 SKU 全部校验通过，培训任务完成！')};\nconst observer=new IntersectionObserver(entries=>{if(entries[0].isIntersecting)loadMore()},{root:$('#viewport'),rootMargin:'0px 0px 80px 0px'});\nif(loaded){data.slice(0,loaded).forEach(r=>$('#rows').append(makeRow(r)));stats();sentinel();$('#log').textContent='已恢复上次保存的练习与加载进度'}\nobserver.observe($('#sentinel'));window.addEventListener('beforeunload',e=>{if(dirty){e.preventDefault();e.returnValue=''}});\n\u003c/script>\u003c/body>\u003c/html>\n","SKU属性填写实战练习/00-练习入口.html":"\u003c!doctype html>\u003chtml lang=\"zh-CN\">\u003cmeta charset=\"utf-8\">\u003cmeta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\u003ctitle>SKU 属性填写实战练习\u003c/title>\u003cstyle>*{box-sizing:border-box}body{margin:0;font:14px/1.7 \"Microsoft YaHei\",sans-serif;background:#f3f6fa;color:#25364b}header{background:#172e48;color:white;padding:18px 5%;display:flex;justify-content:space-between}a{color:inherit;text-decoration:none}main{max-width:1250px;margin:30px auto;padding:0 24px}h1{font-size:28px;margin:0 0 8px}h2{font-size:18px}p{color:#758499}.intro{margin-bottom:25px}.task{background:#eaf4ff;border:1px solid #cde2fa;padding:16px 20px;border-radius:10px;color:#3a638c;margin:20px 0}.card{background:white;border:1px solid #e0e6ee;border-radius:12px;margin-bottom:18px;overflow:hidden}.bar{display:flex;justify-content:space-between;align-items:center;padding:18px 22px;border-bottom:1px solid #e9edf3;gap:12px;flex-wrap:wrap}.muted{color:#8593a6;font-size:12px}.body{padding:22px}.scroll{overflow:auto}table{width:100%;border-collapse:collapse;min-width:850px}th{text-align:left;background:#f7f9fc;color:#738398;font-weight:500}td,th{padding:13px 18px;border-bottom:1px solid #e9edf3}input,select,button{font:inherit;border:1px solid #d9e1eb;border-radius:6px;padding:9px 12px;background:white;color:#314860}input:focus,select:focus{outline:2px solid #bad4ff;border-color:#6396ee}input[type=number]{width:115px}button{cursor:pointer}button:hover{background:#eff5ff;border-color:#88adf0}button:disabled{opacity:.4;cursor:default}.primary{background:#2563eb;color:white;border-color:#2563eb}.primary:hover{background:#1c50c0;color:white}.badge{background:#e8f5ef;color:#23835f;padding:3px 8px;border-radius:4px;font-size:12px}.pending{background:#fff3de;color:#b97f29}.footer{display:flex;justify-content:space-between;gap:12px;align-items:center;margin:20px 0;flex-wrap:wrap}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}label{display:block;color:#62758d}label input,label select{display:block;width:100%;margin-top:7px}.error{border-color:#dd6a6a!important;background:#fff6f6}.toast{position:fixed;bottom:25px;left:50%;transform:translateX(-50%);background:#1d3654;color:white;padding:12px 24px;border-radius:8px;z-index:10}.steps{display:flex;gap:8px;margin:22px 0}.step{flex:1;background:#e8edf5;border-radius:8px;padding:14px;color:#7b8da6}.step.active{background:#e5eeff;color:#2563eb}.group{padding:18px 22px;display:flex;justify-content:space-between;align-items:center;cursor:pointer}.group:hover{background:#f5f9ff}.log{font:12px/1.8 monospace;color:#7890a8;white-space:pre-wrap}.metric{font-size:24px;color:#2563eb}.tiles{display:grid;grid-template-columns:1fr 1fr;gap:20px}.tile{padding:26px;display:block;transition:.2s}.tile:hover{border-color:#91b8fa;transform:translateY(-3px)}.tile strong{font-size:20px;display:block;margin:12px 0}.tile p{min-height:44px}.index{color:#3b7be5;font-size:12px;letter-spacing:2px}@media(max-width:700px){.grid,.tiles{grid-template-columns:1fr}main{padding:0 15px}.steps{font-size:12px}.step{padding:8px}}\u003c/style>\u003cheader>\u003cb>▦　SKU 实战训练室\u003c/b>\u003cspan>本地离线版 / 1 个综合后台 + 8 个专项场景\u003c/span>\u003c/header>\u003cmain>\u003cdiv class=\"intro\">\u003cspan class=\"index\">HANDS-ON PRACTICE\u003c/span>\u003ch1 style=\"margin-top:12px\">把属性填写，练到熟练。\u003c/h1>\u003cp>八种常见商品后台交互，在模拟环境中完成整套填写流程。\u003c/p>\u003c/div>\u003cdiv class=\"task\">从下方选择练习。所有页面均可离线打开，无需安装或启动服务；填写完成后点击“保存练习”。\u003c/div>\u003ca class=\"card tile\" style=\"display:block;border:1px solid #a7c6f5;background:#edf4ff;margin-bottom:22px\" href=\"09-商品上架综合实战.html\">\u003cspan class=\"index\">完整流程 · 推荐先练\u003c/span>\u003cstrong>商品上架综合实战后台 →\u003c/strong>\u003cp>基本信息 → 类目联动 → 生成规格 → 编辑 SKU → 预览发布。将 9 个交互知识点放进一次完整上架练习。\u003c/p>\u003c/a>\u003cdiv class=\"tiles\">\u003ca class=\"card tile\" href=\"01-滚动懒加载.html\">\u003cspan class=\"index\">PRACTICE 01\u003c/span>\u003cstrong>滚动懒加载\u003c/strong>\u003cp>120 条 SKU，每次加载 20 条。练习滚动加载、批量填写和表格内定位。\u003c/p>\u003cspan style=\"color:#2563eb\">进入练习 →\u003c/span>\u003c/a>\u003ca class=\"card tile\" href=\"02-分页填写.html\">\u003cspan class=\"index\">PRACTICE 02\u003c/span>\u003cstrong>分页表格填写\u003c/strong>\u003cp>练习翻页、跨页保留与整表校验\u003c/p>\u003cspan style=\"color:#2563eb\">进入练习 →\u003c/span>\u003c/a>\u003ca class=\"card tile\" href=\"03-展开分组填写.html\">\u003cspan class=\"index\">PRACTICE 03\u003c/span>\u003cstrong>展开分组填写\u003c/strong>\u003cp>先展开，再加载，按颜色逐组完成\u003c/p>\u003cspan style=\"color:#2563eb\">进入练习 →\u003c/span>\u003c/a>\u003ca class=\"card tile\" href=\"04-分步填写.html\">\u003cspan class=\"index\">PRACTICE 04\u003c/span>\u003cstrong>分步属性填写\u003c/strong>\u003cp>逐条 SKU、逐步校验，完成后进入下一条\u003c/p>\u003cspan style=\"color:#2563eb\">进入练习 →\u003c/span>\u003c/a>\u003ca class=\"card tile\" href=\"05-抽屉编辑属性.html\">\u003cspan class=\"index\">PRACTICE 05\u003c/span>\u003cstrong>抽屉编辑属性\u003c/strong>\u003cp>列表搜索 → 打开抽屉 → 修改字段 → 应用回列表\u003c/p>\u003cspan style=\"color:#2563eb\">进入练习 →\u003c/span>\u003c/a>\u003ca class=\"card tile\" href=\"06-类目联动属性.html\">\u003cspan class=\"index\">PRACTICE 06\u003c/span>\u003cstrong>类目联动属性\u003c/strong>\u003cp>选择类目后，异步出现不同的必填属性\u003c/p>\u003cspan style=\"color:#2563eb\">进入练习 →\u003c/span>\u003c/a>\u003ca class=\"card tile\" href=\"07-表格粘贴导入.html\">\u003cspan class=\"index\">PRACTICE 07\u003c/span>\u003cstrong>Excel 多行粘贴导入\u003c/strong>\u003cp>粘贴多行 → 解析预览 → 修正错误 → 确认导入\u003c/p>\u003cspan style=\"color:#2563eb\">进入练习 →\u003c/span>\u003c/a>\u003ca class=\"card tile\" href=\"08-生成规格组合.html\">\u003cspan class=\"index\">PRACTICE 08\u003c/span>\u003cstrong>颜色尺码组合生成\u003c/strong>\u003cp>多选规格 → 生成组合 → 批量与单行填写\u003c/p>\u003cspan style=\"color:#2563eb\">进入练习 →\u003c/span>\u003c/a>\u003c/div>\u003cdiv class=\"card body\">\u003ch2>建议培训顺序\u003c/h2>\u003cp>先演示滚动加载与批量填写，再练习翻页保留、展开分组，最后通过分步校验完成独立实战。\u003c/p>\u003cp>页面内均为模拟商品，不会提交到真实商家后台。练习数据按页面分别保存，换浏览器或电脑不会同步。\u003c/p>\u003c/div>\u003c/main>\u003c/html>","SKU属性填写实战练习/01-滚动懒加载.html":"\u003c!doctype html>\n\u003chtml lang=\"zh-CN\">\u003chead>\u003cmeta charset=\"utf-8\">\u003cmeta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\u003ctitle>SKU 属性填写 · 懒加载实训\u003c/title>\u003cstyle>\n:root{--blue:#2563eb;--ink:#17243c;--muted:#7d899e;--line:#e5eaf2}*{box-sizing:border-box}body{margin:0;background:#f5f7fb;color:var(--ink);font:14px/1.6 'Segoe UI','Microsoft YaHei',sans-serif}button,input,select{font:inherit}button{cursor:pointer;border:1px solid var(--line);background:white;border-radius:7px;padding:8px 15px;color:var(--ink)}button:hover{border-color:#8bacf4;background:#f5f8ff}button:disabled{opacity:.45;cursor:default}.primary{background:var(--blue);color:white;border-color:var(--blue)}.primary:hover{background:#1c52d0;color:white}.shell{display:flex;min-height:100vh}.side{width:208p center;color:#8d99ac;font-size:12px;padding:20px;min-width:1100px}#sentinel button{font-size:12px;margin-left:12px}.panel-foot{display:flex;justify-content:space-between;align-items:center;padding:13px 20px;border-top:1px solid var(--line);color:#8b97aa;font-size:12px}.track{height:5px;background:#edf1f8;border-radius:5px;width:130px;display:inline-block;vertical-align:middle;margin-right:12px;overflow:hidden}.fill{height:100%;background:#377cf5;width:0;transition:width .3s}.bottom{display:flex;justify-content:space-between;align-items:center;margin-top:20px;gap:20px}.lesson{font-size:12px;color:#8794a7}.lesson b{color:#53647e}.actions{display:flex;gap:10px}.log{margin-top:22px;border:1px dashed #d6deea;border-radius:8px;padding:12px 18px;color:#8391a7;font-size:12px;background:#f9fbff}.log b{color:#53647e;margin-right:18px}.toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%);background:#152643;color:white;padding:12px 24px;border-radius:8px;z-index:10;box-shadow:0 5px 30px #162c4425}.modal{position:fixed;inset:0;background:#101d3670;display:grid;place-items:center;z-index:20}.modal[hidden]{display:none}.dialog{background:white;border-radius:14px;padding:30px;width:min(520px,90vw);box-shadow:0 20px 80px #0003}.dialog h2{margin-top:0}.dialog ol{padding-left:22px;color:#62718b;line-height:2}.dialog button{float:right}button:focus-visible{outline:3px solid #9dbfff}@media(max-width:1000px){.side{display:none}.content{padding:20px}header{padding:0 20px}.heading{align-items:flex-start}h1{font-size:22px}.stats{gap:8px}.stat{padding:12px}.toolbar .hint{display:none}}@media(max-width:650px){.heading,.bottom{display:block}.topbuttons,.actions{margin-top:15px}.stats{grid-template-columns:repeat(2,1fr)}.notice{font-size:12px}.caption{display:none}.log{line-height:2}}\n\u003c/style>\u003c/head>\u003cbody>\u003cdiv class=\"shell\">\u003caside class=\"side\">\u003cdiv class=\"brand\">\u003cspan class=\"logo\">▦\u003c/span>商家实训台\u003c/div>\u003cdiv class=\"smallcap\">WORKSPACE\u003c/div>\u003cdiv class=\"nav\">▤　商品管理\u003c/div>\u003cdiv class=\"nav active\">▦　SKU 属性填写\u003c/div>\u003cdiv class=\"smallcap\">TRAINING LAB\u003c/div>\u003cdiv class=\"nav\">◷　懒加载演示\u003c/div>\u003cdiv class=\"side-note\">\u003cb>练习，让操作更熟练\u003c/b>模拟商品数据，可放心填写。\u003cbr>所有练习仅保存在本机浏览器。\u003c/div>\u003c/aside>\u003cmain>\u003cheader>\u003cspan>培训工作台　 /　 商品管理　 /　 \u003cb style=\"color:#3b4e6d\">SKU 属性填写\u003c/b>\u003c/span>\u003cspan>练习环境 \u003cspan class=\"avatar\">练\u003c/span>\u003c/span>\u003c/header>\u003cdiv class=\"content\">\u003cdiv class=\"heading\">\u003cdiv>\u003ch1>SKU 属性填写\u003cspan class=\"badge\">懒加载实训\u003c/span>\u003c/h1>\u003cp>向下滚动，加载更多规格，完成商品销售属性填写。\u003c/p>\u003c/div>\u003cdiv class=\"topbuttons\">\u003cbutton id=\"guide\">ⓘ 操作指引\u003c/button>\u003cbutton id=\"reset\">↻ 重置练习\u003c/button>\u003c/div>\u003c/div>\u003cdiv class=\"notice\">\u003cspan>◉\u003c/span>\u003cdiv>\u003cb>当前开启懒加载\u003c/b>　每次加载 20 条 SKU，滚动到表格底部触发下一批。已加载与已完成是两个不同的进度。\u003c/div>\u003c/div>\u003cdiv class=\"stats\">\u003cdiv class=\"stat\">\u003clabel>SKU 总数\u003c/label>\u003cstrong>120\u003csmall>条规格\u003c/small>\u003c/strong>\u003c/div>\u003cdiv class=\"stat\">\u003clabel>已加载\u003c/label>\u003cstrong class=\"blue\" id=\"loaded\">0\u003csmall>/ 120\u003c/small>\u003c/strong>\u003c/div>\u003cdiv class=\"stat\">\u003clabel>已完成填写\u003c/label>\u003cstrong class=\"green\" id=\"completed\">0\u003csmall>条 SKU\u003c/small>\u003c/strong>\u003c/div>\u003cdiv class=\"stat\">\u003clabel>待完成\u003c/label>\u003cstrong id=\"remaining\">120\u003csmall>条 SKU\u003c/small>\u003c/strong>\u003c/div>\u003c/div>\u003csection class=\"panel\">\u003cdiv class=\"panel-title\">\u003cstrong>销售规格 \u003cspan class=\"badge\" style=\"font-weight:400\">日用餐具 · 双支装\u003c/span>\u003c/strong>\u003cspan class=\"caption\">\u003cspan class=\"pulse\">\u003c/span>\u003cspan id=\"loadState\">按需加载中\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"toolbar\">\u003cspan id=\"selectedText\">已选 0 项\u003c/span>\u003cspan class=\"divider\">\u003c/span>\u003cselect id=\"batchField\" aria-label=\"批量填写字段\">\u003coption value=\"price\">售价（元）\u003c/option>\u003coption value=\"stock\">库存（件）\u003c/option>\u003coption value=\"weight\">重量（kg）\u003c/option>\u003coption value=\"material\">材质\u003c/option>\u003c/select>\u003cinput id=\"batchValue\" placeholder=\"输入批量值\" aria-label=\"批量值\">\u003cbutton id=\"apply\">应用到选中项\u003c/button>\u003cspan class=\"hint\">＊ 为必填项　｜　支持 Tab 切换单元格\u003c/span>\u003c/div>\u003cdiv class=\"scroll\" id=\"viewport\">\u003ctable>\u003cthead>\u003ctr>\u003cth>\u003cinput class=\"check\" type=\"checkbox\" id=\"selectAll\" aria-label=\"全选已加载行\">\u003c/th>\u003cth>#\u003c/th>\u003cth>颜色 / 组合规格\u003c/th>\u003cth>适用规格\u003c/th>\u003cth>材质 \u003cspan class=\"required\">*\u003c/span>\u003c/th>\u003cth>售价 / 元 \u003cspan class=\"required\">*\u003c/span>\u003c/th>\u003cth>商家 SKU 编码\u003c/th>\u003cth>库存 / 件 \u003cspan class=\"required\">*\u003c/span>\u003c/th>\u003cth>重量 / kg \u003cspan class=\"required\">*\u003c/span>\u003c/th>\u003cth>填写状态\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody id=\"rows\">\u003c/tbody>\u003c/table>\u003cdiv id=\"sentinel\" aria-live=\"polite\">\u003c/div>\u003c/div>\u003cdiv class=\"panel-foot\">\u003cspan>\u003cspan class=\"track\">\u003cspan class=\"fill\" id=\"progress\" style=\"display:block\">\u003c/span>\u003c/span>\u003cspan id=\"progressText\">已加载 0 / 120 条\u003c/span>\u003c/span>\u003cspan id=\"batchCount\">第 0 / 6 批\u003c/span>\u003c/div>\u003c/section>\u003cdiv class=\"bottom\">\u003cdiv class=\"lesson\">\u003cb>练习提示\u003c/b>　滚动表格 → 加载新规格 → 填写必填项 → 校验并提交\u003cbr>批量填写仅影响选中行；表头复选框仅选择已加载的规格。\u003c/div>\u003cdiv class=\"actions\">\u003cbutton id=\"save\">保存练习\u003c/button>\u003cbutton class=\"primary\" id=\"submit\">校验并提交　→\u003c/button>\u003c/div>\u003c/div>\u003cdiv class=\"log\">\u003cb>加载记录\u003c/b>\u003cspan id=\"log\" aria-live=\"polite\">准备加载首批 SKU…\u003c/span>\u003c/div>\u003c/div>\u003c/main>\u003c/div>\u003cdiv class=\"modal\" id=\"guideModal\" hidden>\u003cdiv class=\"dialog\">\u003ch2>懒加载，边滚动边填写\u003c/h2>\u003cp>这是一套包含 120 条模拟 SKU 的实训。\u003c/p>\u003col>\u003cli>首次只渲染 20 条，观察上方加载计数。\u003c/li>\u003cli>在表格内部向下滚动，等待约 0.8 秒加载下一批。\u003c/li>\u003cli>填写材质、售价、库存和重量，可勾选后批量填写。\u003c/li>\u003cli>滚回顶部，检查已填写内容是否保留。\u003c/li>\u003cli>加载并填写全部 120 条，再校验提交。\u003c/li>\u003c/ol>\u003cp style=\"margin-bottom:20px\">保存练习后，刷新页面可恢复数据与加载进度。\u003c/p>\u003cbutton class=\"primary\" id=\"closeGuide\">开始练习\u003c/button>\u003cdiv style=\"clear:both\">\u003c/div>\u003c/div>\u003c/div>\u003cscript>const $=s=>document.querySelector(s),TOTAL=120,KEY='sku-lazy-training-v1';\nconst colors=['曜石黑','云雾白','奶油白','森林绿','雾霾蓝','樱花粉'],sizes=['日常款｜适合 65–125 斤','宽版款｜适合 115–155 斤'];\nlet data=Array.from({length:TOTAL},(_,i)=>({id:i+1,color:colors[Math.floor(i/2)%6],size:sizes[i%2],material:'',price:'',code:`FX-2049-${String(i+1).padStart(4,'0')}`,stock:'',weight:''})),loaded=0,loading=false,selected=new Set(),batches=0,dirty=false;\ntry{const s=JSON.parse(localStorage.getItem(KEY));if(s&&Array.isArray(s.data)&&s.data.length===TOTAL){data=s.data;loaded=Math.min(TOTAL,Math.max(20,Number(s.loaded)||20));}}catch{}\nconst valid=(k,v)=>k==='material'?String(v).trim().length>0:v!==''&&Number.isFinite(Number(v))&&(k==='price'?Number(v)>0:k==='stock'?Number.isInteger(Number(v))&&Number(v)>=0:Number(v)>0);\nconst complete=r=>['material','price','stock','weight'].every(k=>valid(k,r[k]));\nfunction toast(t){$('.toast')?.remove();const e=document.createElement('div');e.className='toast';e.role='status';e.textContent=t;document.body.append(e);setTimeout(()=>e.remove(),3500)}\nfunction makeRow(r){const tr=document.createElement('tr');tr.dataset.id=r.id;tr.innerHTML=`\u003ctd>\u003cinput type=\"checkbox\" class=\"check rowcheck\" aria-label=\"选择第 ${r.id} 条\">\u003c/td>\u003ctd class=\"num\">${String(r.id).padStart(3,'0')}\u003c/td>\u003ctd>\u003cdiv class=\"product\">\u003cspan class=\"thumb\">🥢\u003c/span>\u003cdiv>【双支装】${r.color}\u003cdiv class=\"sub\">组合规格 ${String(Math.ceil(r.id/12)).padStart(2,'0')}\u003c/div>\u003c/div>\u003c/div>\u003c/td>\u003ctd>${r.size}\u003c/td>\u003ctd>\u003cinput data-key=\"material\" placeholder=\"如：304 不锈钢\" aria-label=\"第 ${r.id} 条材质\">\u003c/td>\u003ctd>\u003cinput data-key=\"price\" type=\"number\" min=\"0.01\" step=\"0.01\" placeholder=\"待填写\" aria-label=\"第 ${r.id} 条售价\">\u003c/td>\u003ctd>\u003cinput data-key=\"code\" aria-label=\"第 ${r.id} 条编码\">\u003c/td>\u003ctd>\u003cinput data-key=\"stock\" type=\"number\" min=\"0\" step=\"1\" placeholder=\"待填写\" aria-label=\"第 ${r.id} 条库存\">\u003c/td>\u003ctd>\u003cinput data-key=\"weight\" type=\"number\" min=\"0.001\" step=\"0.001\" placeholder=\"待填写\" aria-label=\"第 ${r.id} 条重量\">\u003c/td>\u003ctd>\u003cspan class=\"status\">待填写\u003c/span>\u003c/td>`;tr.querySelectorAll('[data-key]').forEach(e=>e.value=r[e.dataset.key]);updateRow(tr,r);return tr}\nfunction updateRow(tr,r){const e=tr.querySelector('.status');e.textContent=complete(r)?'已完成':'待填写';e.classList.toggle('done',complete(r))}\nfunction stats(){const done=data.filter(complete).length;$('#loaded').innerHTML=`${loaded}\u003csmall>/ 120\u003c/small>`;$('#completed').innerHTML=`${done}\u003csmall>条 SKU\u003c/small>`;$('#remaining').innerHTML=`${TOTAL-done}\u003csmall>条 SKU\u003c/small>`;$('#progress').style.width=loaded/TOTAL*100+'%';$('#progressText').textContent=`已加载 ${loaded} / 120 条`;$('#batchCount').textContent=`第 ${Math.ceil(loaded/20)} / 6 批`;$('#selectedText').textContent=`已选 ${selected.size} 项`;$('#selectAll').checked=loaded>0&&selected.size===loaded;$('#selectAll').indeterminate=selected.size>0&&selected.size\u003cloaded;$('#loadState').textContent=loaded===TOTAL?'全部规格已加载':'按需加载中'}\nfunction sentinel(){const s=$('#sentinel');s.replaceChildren();s.append(document.createTextNode(loaded===TOTAL?'✓ 已加载全部 120 条规格，继续填写并提交':'向下滚动加载更多规格'));if(loaded\u003cTOTAL){const b=document.createElement('button');b.textContent='加载下一批 ↓';b.onclick=loadMore;s.append(b)}}\nasync function loadMore(){if(loading||loaded>=TOTAL)return;loading=true;$('#sentinel').textContent='◌ 正在加载下一批 SKU…';$('#log').textContent=`正在请求第 ${Math.floor(loaded/20)+1} 批数据…`;await new Promise(r=>setTimeout(r,800));const start=loaded;loaded=Math.min(TOTAL,loaded+20);const frag=document.createDocumentFragment();data.slice(start,loaded).forEach(r=>frag.append(makeRow(r)));$('#rows').append(frag);batches++;stats();sentinel();loading=false;$('#log').textContent=`${new Date().toLocaleTimeString('zh-CN')}　已加载第 ${start+1}–${loaded} 条 · 本次新增 ${loaded-start} 条 · 模拟网络耗时 800 ms`;}\n$('#rows').addEventListener('input',e=>{const k=e.target.dataset.key;if(!k)return;const tr=e.target.closest('tr'),r=data[Number(tr.dataset.id)-1];r[k]=e.target.value;dirty=true;e.target.classList.toggle('invalid',k!=='code'&&!valid(k,r[k]));updateRow(tr,r);stats()});\n$('#rows').addEventListener('change',e=>{if(!e.target.classList.contains('rowcheck'))return;const id=Number(e.target.closest('tr').dataset.id);e.target.checked?selected.add(id):selected.delete(id);stats()});\n$('#selectAll').onchange=e=>{selected.clear();$('#rows').querySelectorAll('tr').forEach(tr=>{tr.querySelector('.rowcheck').checked=e.target.checked;if(e.target.checked)selected.add(Number(tr.dataset.id))});stats()};\n$('#apply').onclick=()=>{const k=$('#batchField').value,v=$('#batchValue').value;if(!selected.size)return toast('请先勾选需要填写的 SKU');if(!valid(k,v))return toast(k==='material'?'请输入材质':k==='stock'?'库存需为大于等于 0 的整数':'请输入大于 0 的数值');selected.forEach(id=>{const r=data[id-1];r[k]=v;const tr=$(`#rows tr[data-id=\"${id}\"]`);const input=tr.querySelector(`[data-key=\"${k}\"]`);input.value=v;input.classList.remove('invalid');updateRow(tr,r)});dirty=true;stats();toast(`已更新 ${selected.size} 条 SKU`)};\n$('#save').onclick=()=>{try{localStorage.setItem(KEY,JSON.stringify({data,loaded}));dirty=false;toast('练习已保存，刷新后可继续填写')}catch{toast('浏览器存储不可用，请导出或保留当前页面')}};\n$('#reset').onclick=()=>{if(!confirm('确定重置全部填写内容和加载进度？'))return;localStorage.removeItem(KEY);window.__singleReload()};\n$('#guide').onclick=()=>{$('#guideModal').hidden=false;$('#closeGuide').focus()};$('#closeGuide').onclick=()=>{$('#guideModal').hidden=true;$('#guide').focus()};document.addEventListener('keydown',e=>{if(e.key==='Escape')$('#guideModal').hidden=true});\n$('#submit').onclick=()=>{const incomplete=data.find(r=>!complete(r));if(incomplete){const tr=$(`#rows tr[data-id=\"${incomplete.id}\"]`);if(tr){tr.scrollIntoView({block:'center',behavior:'smooth'});const k=['material','price','stock','weight'].find(k=>!valid(k,incomplete[k]));tr.querySelector(`[data-key=\"${k}\"]`).focus();tr.querySelectorAll('[data-key]').forEach(e=>e.classList.toggle('invalid',e.dataset.key!=='code'&&!valid(e.dataset.key,incomplete[e.dataset.key])))}return toast(`还有 ${data.filter(r=>!complete(r)).length} 条未完成${incomplete.id>loaded?'，请继续向下滚动加载':'，请补全标记字段'}`)}toast('✓ 120 条 SKU 全部校验通过，培训任务完成！')};\nconst observer=new IntersectionObserver(entries=>{if(entries[0].isIntersecting)loadMore()},{root:$('#viewport'),rootMargin:'0px 0px 80px 0px'});\nif(loaded){data.slice(0,loaded).forEach(r=>$('#rows').append(makeRow(r)));stats();sentinel();$('#log').textContent='已恢复上次保存的练习与加载进度'}\nobserver.observe($('#sentinel'));window.addEventListener('beforeunload',e=>{if(dirty){e.preventDefault();e.returnValue=''}});\n\u003c/script>\u003ca href=\"00-练习入口.html\" style=\"position:fixed;bottom:12px;right:20px;background:white;padding:8px 15px;border:1px solid #ddd;border-radius:8px;color:#2563eb;z-index:5\">返回练习入口\u003c/a>\u003c/body>\u003c/html>\n","SKU属性填写实战练习/02-分页填写.html":"\u003c!doctype html>\u003chtml lang=\"zh-CN\">\u003cmeta charset=\"utf-8\">\u003cmeta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\u003ctitle>分页表格填写 · 实战练习\u003c/title>\u003cstyle>*{box-sizing:border-box}body{margin:0;font:14px/1.7 \"Microsoft YaHei\",sans-serif;background:#f3f6fa;color:#25364b}header{background:#172e48;color:white;padding:18px 5%;display:flex;justify-content:space-between}a{color:inherit;text-decoration:none}main{max-width:1250px;margin:30px auto;padding:0 24px}h1{font-size:28px;margin:0 0 8px}h2{font-size:18px}p{color:#758499}.intro{margin-bottom:25px}.task{background:#eaf4ff;border:1px solid #cde2fa;padding:16px 20px;border-radius:10px;color:#3a638c;margin:20px 0}.card{background:white;border:1px solid #e0e6ee;border-radius:12px;margin-bottom:18px;overflow:hidden}.bar{display:flex;justify-content:space-between;align-items:center;padding:18px 22px;border-bottom:1px solid #e9edf3;gap:12px;flex-wrap:wrap}.muted{color:#8593a6;font-size:12px}.body{padding:22px}.scroll{overflow:auto}table{width:100%;border-collapse:collapse;min-width:850px}th{text-align:left;background:#f7f9fc;color:#738398;font-weight:500}td,th{padding:13px 18px;border-bottom:1px solid #e9edf3}input,select,button{font:inherit;border:1px solid #d9e1eb;border-radius:6px;padding:9px 12px;background:white;color:#314860}input:focus,select:focus{outline:2px solid #bad4ff;border-color:#6396ee}input[type=number]{width:115px}button{cursor:pointer}button:hover{background:#eff5ff;border-color:#88adf0}button:disabled{opacity:.4;cursor:default}.primary{background:#2563eb;color:white;border-color:#2563eb}.primary:hover{background:#1c50c0;color:white}.badge{background:#e8f5ef;color:#23835f;padding:3px 8px;border-radius:4px;font-size:12px}.pending{background:#fff3de;color:#b97f29}.footer{display:flex;justify-content:space-between;gap:12px;align-items:center;margin:20px 0;flex-wrap:wrap}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}label{display:block;color:#62758d}label input,label select{display:block;width:100%;margin-top:7px}.error{border-color:#dd6a6a!important;background:#fff6f6}.toast{position:fixed;bottom:25px;left:50%;transform:translateX(-50%);background:#1d3654;color:white;padding:12px 24px;border-radius:8px;z-index:10}.steps{display:flex;gap:8px;margin:22px 0}.step{flex:1;background:#e8edf5;border-radius:8px;padding:14px;color:#7b8da6}.step.active{background:#e5eeff;color:#2563eb}.group{padding:18px 22px;display:flex;justify-content:space-between;align-items:center;cursor:pointer}.group:hover{background:#f5f9ff}.log{font:12px/1.8 monospace;color:#7890a8;white-space:pre-wrap}.metric{font-size:24px;color:#2563eb}.tiles{display:grid;grid-template-columns:1fr 1fr;gap:20px}.tile{padding:26px;display:block;transition:.2s}.tile:hover{border-color:#91b8fa;transform:translateY(-3px)}.tile strong{font-size:20px;display:block;margin:12px 0}.tile p{min-height:44px}.index{color:#3b7be5;font-size:12px;letter-spacing:2px}@media(max-width:700px){.grid,.tiles{grid-template-columns:1fr}main{padding:0 15px}.steps{font-size:12px}.step{padding:8px}}\u003c/style>\u003cheader>\u003cb>▦　SKU 实战训练室\u003c/b>\u003ca href=\"00-练习入口.html\">← 返回练习入口\u003c/a>\u003c/header>\u003cmain>\u003cdiv class=\"intro\">\u003ch1>分页表格填写\u003c/h1>\u003cp>练习翻页、跨页保留与整表校验\u003c/p>\u003c/div>\u003cdiv class=\"task\">练习任务　共 36 条 SKU，分为 6 页。填写第 1 页后翻至下一页，再返回检查内容，最终完成全部规格。\u003c/div>\u003cdiv class=\"card\">\u003cdiv class=\"bar\">\u003cspan>完成进度　\u003cstrong class=\"metric\" id=\"count\">\u003c/strong>\u003c/span>\u003cspan class=\"muted\">本地模拟练习 · * 为必填项\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"card\" id=\"work\">\u003c/div>\u003cdiv class=\"footer\">\u003cbutton id=\"reset\">重置本练习\u003c/button>\u003cdiv>\u003cbutton id=\"save\">保存练习\u003c/button> \u003cbutton class=\"primary\" id=\"submit\">校验全部 SKU\u003c/button>\u003c/div>\u003c/div>\u003cdiv class=\"card body\">\u003cb>操作记录\u003c/b>\u003cdiv id=\"log\" class=\"log\" aria-live=\"polite\">\u003c/div>\u003c/div>\u003c/main>\u003cscript>const mode=\"page\";\nconst $=s=>document.querySelector(s),N=mode==='page'?36:mode==='group'?24:8,KEY='sku-practice-'+mode;\nlet records=Array.from({length:N},(_,i)=>({id:i+1,name:['曜石黑','奶油白','森林绿','雾霾蓝'][Math.floor(i/6)%4],size:['S','M','L','XL','2XL','3XL'][i%6],price:'',stock:'',material:'',detail:''})),page=1,step=0,current=0,opened=new Set(),busy=new Set(),timers=[],generation=0;\ntry{let s=JSON.parse(localStorage.getItem(KEY));if(s?.records?.length===N){records=s.records;page=s.page||1;current=s.current||0;step=s.step||0}}catch{}\nfunction ok(r){return r.price!==''&&+r.price>0&&r.stock!==''&&Number.isInteger(+r.stock)&&+r.stock>=0&&r.material&&r.detail.trim()}\nfunction note(t){$('.toast')?.remove();let d=document.createElement('div');d.className='toast';d.role='status';d.textContent=t;document.body.append(d);setTimeout(()=>d.remove(),3500)}\nfunction esc(s){return String(s).replace(/[&\u003c>\"']/g,c=>({'&':'&amp;','\u003c':'&lt;','>':'&gt;','\"':'&quot;',\"'\":'&#39;'}[c]))}\nfunction save(){try{localStorage.setItem(KEY,JSON.stringify({records,page,current,step}));note('练习已保存')}catch{note('浏览器不支持保存，请保留当前页面')}}\nfunction log(s){$('#log').textContent=new Date().toLocaleTimeString()+'  '+s+'\\n'+$('#log').textContent}\nfunction meter(){$('#count').textContent=records.filter(ok).length+' / '+N;document.querySelectorAll('[data-status]').forEach(e=>{let r=records[+e.dataset.status];e.className='badge '+(ok(r)?'':'pending');e.textContent=ok(r)?'已完成':'待填写'})}\nfunction fields(r){let i=r.id-1;return `\u003cdiv class=\"grid\">\u003clabel>售价（元） *\u003cinput aria-label=\"SKU ${r.id} 售价\" data-i=\"${i}\" data-k=\"price\" type=\"number\" min=\"0.01\" step=\"0.01\" value=\"${esc(r.price)}\" placeholder=\"大于 0\">\u003c/label>\u003clabel>库存（件） *\u003cinput aria-label=\"SKU ${r.id} 库存\" data-i=\"${i}\" data-k=\"stock\" type=\"number\" min=\"0\" step=\"1\" value=\"${esc(r.stock)}\" placeholder=\"非负整数\">\u003c/label>\u003clabel>材质 *\u003cselect aria-label=\"SKU ${r.id} 材质\" data-i=\"${i}\" data-k=\"material\">\u003coption value=\"\">请选择材质\u003c/option>${['棉','聚酯纤维','混纺'].map(v=>`\u003coption ${r.material===v?'selected':''}>${v}\u003c/option>`).join('')}\u003c/select>\u003c/label>\u003clabel>成分说明 *\u003cinput aria-label=\"SKU ${r.id} 成分说明\" data-i=\"${i}\" data-k=\"detail\" value=\"${esc(r.detail)}\" placeholder=\"如：100% 棉\">\u003c/label>\u003c/div>`}\nfunction render(){if(mode==='page'){let start=(page-1)*6;$('#work').innerHTML=`\u003cdiv class=\"bar\">\u003cb>服饰 SKU 列表\u003c/b>\u003cspan>第 ${page} / 6 页 · 每页 6 条\u003c/span>\u003c/div>\u003cdiv class=\"scroll\">\u003ctable>\u003cthead>\u003ctr>\u003cth>SKU\u003c/th>\u003cth>颜色 / 尺码\u003c/th>\u003cth>售价 *\u003c/th>\u003cth>库存 *\u003c/th>\u003cth>材质 *\u003c/th>\u003cth>成分说明 *\u003c/th>\u003cth>状态\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>${records.slice(start,start+6).map(r=>`\u003ctr>\u003ctd>SK-${String(r.id).padStart(3,'0')}\u003c/td>\u003ctd>${r.name} / ${r.size}\u003c/td>\u003ctd>\u003cinput aria-label=\"SKU ${r.id} 售价\" data-i=\"${r.id-1}\" data-k=\"price\" type=\"number\" min=\"0.01\" step=\"0.01\" value=\"${esc(r.price)}\">\u003c/td>\u003ctd>\u003cinput aria-label=\"SKU ${r.id} 库存\" data-i=\"${r.id-1}\" data-k=\"stock\" type=\"number\" min=\"0\" step=\"1\" value=\"${esc(r.stock)}\">\u003c/td>\u003ctd>\u003cselect aria-label=\"SKU ${r.id} 材质\" data-i=\"${r.id-1}\" data-k=\"material\">\u003coption value=\"\">请选择\u003c/option>${['棉','聚酯纤维','混纺'].map(v=>`\u003coption ${r.material===v?'selected':''}>${v}\u003c/option>`).join('')}\u003c/select>\u003c/td>\u003ctd>\u003cinput aria-label=\"SKU ${r.id} 成分说明\" data-i=\"${r.id-1}\" data-k=\"detail\" value=\"${esc(r.detail)}\" style=\"width:130px\">\u003c/td>\u003ctd>\u003cspan data-status=\"${r.id-1}\">\u003c/span>\u003c/td>\u003c/tr>`).join('')}\u003c/tbody>\u003c/table>\u003c/div>\u003cdiv class=\"bar\">\u003cspan class=\"muted\">切页保留填写内容；保存后刷新可恢复。\u003c/span>\u003cdiv>\u003cbutton id=\"prev\" ${page===1?'disabled':''}>上一页\u003c/button> \u003cbutton id=\"next\" ${page===6?'disabled':''}>下一页\u003c/button>\u003c/div>\u003c/div>`;$('#prev').onclick=()=>turn(-1);$('#next').onclick=()=>turn(1)}\nelse if(mode==='group'){$('#work').innerHTML=[0,1,2,3].map(g=>`\u003csection>\u003cdiv class=\"group\" role=\"button\" tabindex=\"0\" aria-expanded=\"${opened.has(g)}\" data-group=\"${g}\">\u003cb>${opened.has(g)?'▾':'▸'} ${records[g*6].name} \u003cspan class=\"muted\">6 条尺码规格\u003c/span>\u003c/b>\u003cspan>${busy.has(g)?'正在加载…':opened.has(g)?'点击收起':'点击展开并加载'}\u003c/span>\u003c/div>\u003cdiv class=\"body\" ${opened.has(g)?'':'hidden'}>${opened.has(g)?records.slice(g*6,g*6+6).map(r=>`\u003cdiv class=\"card\">\u003cdiv class=\"bar\">\u003cb>SKU ${r.id} · ${r.name} / ${r.size}\u003c/b>\u003cspan data-status=\"${r.id-1}\">\u003c/span>\u003c/div>\u003cdiv class=\"body\">${fields(r)}\u003c/div>\u003c/div>`).join(''):''}\u003c/div>\u003c/section>`).join('');document.querySelectorAll('[data-group]').forEach(e=>{e.onclick=()=>toggle(+e.dataset.group);e.onkeydown=k=>{if(k.key==='Enter'||k.key===' '){k.preventDefault();e.click()}}})}\nelse{let r=records[current];$('#work').innerHTML=`\u003cdiv class=\"bar\">\u003cb>SKU ${r.id} / ${N} · ${r.name} / ${r.size}\u003c/b>\u003cspan data-status=\"${current}\">\u003c/span>\u003c/div>\u003cdiv class=\"body\">\u003cdiv class=\"steps\">${['销售属性','材质属性','确认规格'].map((s,i)=>`\u003cspan class=\"step ${step===i?'active':''}\">${i+1}　${s}\u003c/span>`).join('')}\u003c/div>${step\u003c2?fields(r):`\u003ch2>请核对当前 SKU\u003c/h2>\u003cp>售价 ${esc(r.price)} 元　｜　库存 ${esc(r.stock)} 件\u003c/p>\u003cp>材质 ${esc(r.material)}　｜　成分 ${esc(r.detail)}\u003c/p>`}\u003cdiv class=\"footer\">\u003cbutton id=\"back\" ${step===0?'disabled':''}>上一步\u003c/button>\u003cbutton class=\"primary\" id=\"forward\">${step===2?(current===N-1?'完成全部练习':'确认并填写下一个 SKU'):'下一步'}\u003c/button>\u003c/div>\u003c/div>`;if(step\u003c2){document.querySelectorAll('[data-k]').forEach(e=>e.closest('label').hidden=step===0?['material','detail'].includes(e.dataset.k):['price','stock'].includes(e.dataset.k))}$('#back').onclick=()=>{step--;render()};$('#forward').onclick=()=>{if(!validateStep())return;if(step\u003c2)step++;else if(current\u003cN-1){current++;step=0}else{note('全部 8 条 SKU 填写完成！');save()}render()}}\nmeter()}\nfunction validateStep(){let r=records[current],keys=step===0?['price','stock']:step===1?['material','detail']:[];let valid=true;keys.forEach(k=>{let good=k==='price'?r[k]!==''&&+r[k]>0:k==='stock'?r[k]!==''&&Number.isInteger(+r[k])&&+r[k]>=0:!!r[k].trim();let e=document.querySelector(`[data-k=\"${k}\"]`);e?.classList.toggle('error',!good);if(!good)valid=false});if(!valid)note('请补全当前步骤，价格须大于 0，库存须为非负整数');return valid}\nfunction turn(n){$('#work').style.opacity='.5';$('#prev').disabled=$('#next').disabled=true;let token=generation;timers.push(setTimeout(()=>{if(token!==generation)return;page+=n;render();$('#work').style.opacity='1';log('翻页加载第 '+page+' 页，之前填写的内容已保留')},650))}\nfunction toggle(g){if(busy.has(g))return;if(opened.has(g)){opened.delete(g);render();return}busy.add(g);render();let token=generation;timers.push(setTimeout(()=>{if(token!==generation)return;busy.delete(g);opened.add(g);render();log('已加载 '+records[g*6].name+' 分组，共 6 条规格')},750))}\n$('#work').addEventListener('input',e=>{let k=e.target.dataset.k;if(!k)return;let r=records[+e.target.dataset.i];r[k]=e.target.value;e.target.classList.remove('error');meter()});\n$('#save').onclick=save;$('#reset').onclick=()=>{if(confirm('重置本练习全部内容？')){try{localStorage.removeItem(KEY)}catch{}window.__singleReload()}};\n$('#submit').onclick=()=>{let i=records.findIndex(r=>!ok(r));if(i\u003c0)return note('校验通过，全部 SKU 已完成！');if(mode==='page'){page=Math.floor(i/6)+1;render()}else if(mode==='group'){opened.add(Math.floor(i/6));render()}else{current=i;step=0;render()}note('第 '+(i+1)+' 条 SKU 尚未完成，请检查必填属性');document.querySelector(`[data-i=\"${i}\"]`)?.focus()};render();log('练习已就绪 · 数据只在本浏览器保存');\n\u003c/script>\u003c/html>","SKU属性填写实战练习/03-展开分组填写.html":"\u003c!doctype html>\u003chtml lang=\"zh-CN\">\u003cmeta charset=\"utf-8\">\u003cmeta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\u003ctitle>展开分组填写 · 实战练习\u003c/title>\u003cstyle>*{box-sizing:border-box}body{margin:0;font:14px/1.7 \"Microsoft YaHei\",sans-serif;background:#f3f6fa;color:#25364b}header{background:#172e48;color:white;padding:18px 5%; }\" placeholder=\"如：100% 棉\">\u003c/label>\u003c/div>`}\nfunction render(){if(mode==='page'){let start=(page-1)*6;$('#work').innerHTML=`\u003cdiv class=\"bar\">\u003cb>服饰 SKU 列表\u003c/b>\u003cspan>第 ${page} / 6 页 · 每页 6 条\u003c/span>\u003c/div>\u003cdiv class=\"scroll\">\u003ctable>\u003cthead>\u003ctr>\u003cth>SKU\u003c/th>\u003cth>颜色 / 尺码\u003c/th>\u003cth>售价 *\u003c/th>\u003cth>库存 *\u003c/th>\u003cth>材质 *\u003c/th>\u003cth>成分说明 *\u003c/th>\u003cth>状态\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>${records.slice(start,start+6).map(r=>`\u003ctr>\u003ctd>SK-${String(r.id).padStart(3,'0')}\u003c/td>\u003ctd>${r.name} / ${r.size}\u003c/td>\u003ctd>\u003cinput aria-label=\"SKU ${r.id} 售价\" data-i=\"${r.id-1}\" data-k=\"price\" type=\"number\" min=\"0.01\" step=\"0.01\" value=\"${esc(r.price)}\">\u003c/td>\u003ctd>\u003cinput aria-label=\"SKU ${r.id} 库存\" data-i=\"${r.id-1}\" data-k=\"stock\" type=\"number\" min=\"0\" step=\"1\" value=\"${esc(r.stock)}\">\u003c/td>\u003ctd>\u003cselect aria-label=\"SKU ${r.id} 材质\" data-i=\"${r.id-1}\" data-k=\"material\">\u003coption value=\"\">请选择\u003c/option>${['棉','聚酯纤维','混纺'].map(v=>`\u003coption ${r.material===v?'selected':''}>${v}\u003c/option>`).join('')}\u003c/select>\u003c/td>\u003ctd>\u003cinput aria-label=\"SKU ${r.id} 成分说明\" data-i=\"${r.id-1}\" data-k=\"detail\" value=\"${esc(r.detail)}\" style=\"width:130px\">\u003c/td>\u003ctd>\u003cspan data-status=\"${r.id-1}\">\u003c/span>\u003c/td>\u003c/tr>`).join('')}\u003c/tbody>\u003c/table>\u003c/div>\u003cdiv class=\"bar\">\u003cspan class=\"muted\">切页保留填写内容；保存后刷新可恢复。\u003c/span>\u003cdiv>\u003cbutton id=\"prev\" ${page===1?'disabled':''}>上一页\u003c/button> \u003cbutton id=\"next\" ${page===6?'disabled':''}>下一页\u003c/button>\u003c/div>\u003c/div>`;$('#prev').onclick=()=>turn(-1);$('#next').onclick=()=>turn(1)}\nelse if(mode==='group'){$('#work').innerHTML=[0,1,2,3].map(g=>`\u003csection>\u003cdiv class=\"group\" role=\"button\" tabindex=\"0\" aria-expanded=\"${opened.has(g)}\" da rent],keys=step===0?['price','stock']:step===1?['material','detail']:[];let valid=true;keys.forEach(k=>{let good=k==='price'?r[k]!==''&&+r[k]>0:k==='stock'?r[k]!==''&&Number.isInteger(+r[k])&&+r[k]>=0:!!r[k].trim();let e=document.querySelector(`[data-k=\"${k}\"]`);e?.classList.toggle('error',!good);if(!good)valid=false});if(!valid)note('请补全当前步骤，价格须大于 0，库存须为非负整数');return valid}\nfunction turn(n){$('#work').style.opacity='.5';$('#prev').disabled=$('#next').disabled=true;let token=generation;timers.push(setTimeout(()=>{if(token!==generation)return;page+=n;render();$('#work').style.opacity='1';log('翻页加载第 '+page+' 页，之前填写的内容已保留')},650))}\nfunction toggle(g){if(busy.has(g))return;if(opened.has(g)){opened.delete(g);render();return}busy.add(g);render();let token=generation;timers.push(setTimeout(()=>{if(token!==generation)return;busy.delete(g);opened.add(g);render();log('已加载 '+records[g*6].name+' 分组，共 6 条规格')},750))}\n$('#work').addEventListener('input',e=>{let k=e.target.dataset.k;if(!k)return;let r=records[+e.target.dataset.i];r[k]=e.target.value;e.target.classList.remove('error');meter()});\n$('#save').onclick=save;$('#reset').onclick=()=>{if(confirm('重置本练习全部内容？')){try{localStorage.removeItem(KEY)}catch{}window.__singleReload()}};\n$('#submit').onclick=()=>{let i=records.findIndex(r=>!ok(r));if(i\u003c0)return note('校验通过，全部 SKU 已完成！');if(mode==='page'){page=Math.floor(i/6)+1;render()}else if(mode==='group'){opened.add(Math.floor(i/6));render()}else{current=i;step=0;render()}note('第 '+(i+1)+' 条 SKU 尚未完成，请检查必填属性');document.querySelector(`[data-i=\"${i}\"]`)?.focus()};render();log('练习已就绪 · 数据只在本浏览器保存');\n\u003c/script>\u003c/html>","SKU属性填写实战练习/04-分步填写.html":"\u003c!doctype html>\u003chtml lang=\"zh-CN\">\u003cmeta charset=\"utf-8\">\u003cmeta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\u003ctitle>分步属性填写 · 实战练习\u003c/title>\u003cstyle>*{box-sizing:border-box}body{margin:0;font:14px/1.7 \"Microsoft YaHei\",sans-serif;background:#f3f6fa;color:#25364b}head :'',stock:'',material:'',detail:''})),page=1,step=0,current=0,opened=new Set(),busy=new Set(),timers=[],generation=0;\ntry{let s=JSON.parse(localStorage.getItem(KEY));if(s?.records?.length===N){records=s.records;page=s.page||1;current=s.current||0;step=s.step||0}}catch{}\nfunction ok(r){return r.price!==''&&+r.price>0&&r.stock!==''&&Number.isInteger(+r.stock)&&+r.stock>=0&&r.material&&r.detail.trim()}\nfunction note(t){$('.toast')?.remove();let d=document.createElement('div');d.className='toast';d.role='status';d.textContent=t;document.body.append(d);setTimeout(()=>d.remove(),3500)}\nfunction esc(s){return String(s).replace(/[&\u003c>\"']/g,c=>({'&':'&amp;','\u003c':'&lt;','>':'&gt;','\"':'&quot;',\"'\":'&#39;'}[c]))}\nfunction save(){try{localStorage.setItem(KEY,JSON.stringify({records,page,current,step}));note('练习已保存')}catch{note('浏览器不支持保存，请保留当前页面')}}\nfunction log(s){$('#log').textContent=new Date().toLocaleTimeString()+'  '+s+'\\n'+$('#log').textContent}\nfunction meter(){$('#count').textContent=records.filter(ok).length+' / '+N;document.querySelectorAll('[data-status]').forEach(e=>{let r=records[+e.dataset.status];e.className='badge '+(ok(r)?'':'pending');e.textContent=ok(r)?'已完成':'待填写'})}\nfunction fields(r){let i=r.id-1;return `\u003cdiv class=\"grid\">\u003clabel>售价（元） *\u003cinput aria-label=\"SKU ${r.id} 售价\" data-i=\"${i}\" data-k=\"price\" type=\"number\" min=\"0.01\" step=\"0.01\" value=\"${esc(r.price)}\" placeholder=\"大于 0\">\u003c/label>\u003clabel>库存（件） *\u003cinput aria-label=\"SKU ${r.id} 库存\" data-i=\"${i}\" data-k=\"stock\" type=\"number\" min=\"0\" step=\"1\" value=\"${esc(r.stock)}\" placeholder=\"非负整数\">\u003c/label>\u003clabel>材质 *\u003cselect aria-label=\"SKU ${r.id} 材质\" data-i=\"${i}\" data-k=\"material\">\u003coption value=\"\">请选择材质\u003c/option>${['棉','聚酯纤维','混纺'].map(v=>`\u003coption ${r.material===v?'selected':''}>${v}\u003c/option>`).join('')}\u003c/select>\u003c/label>\u003clabel>成分说明 *\u003cinput aria-label=\"SKU ${r.id} 成分说明\" data-i=\"${i}\" data-k=\"detail\" value=\"${esc(r.detail)}\" placeholder=\"如：100% 棉\">\u003c/label>\u003c/div>`}\nfunction render(){if(mode==='page'){let start=(page-1)*6;$('#work').innerHTML=`\u003cdiv class=\"bar\">\u003cb>服饰 SKU 列表\u003c/b>\u003cspan>第 ${page} / 6 页 · 每页 6 条\u003c/span>\u003c/div>\u003cdiv class=\"scroll\">\u003ctable>\u003cthead>\u003ctr>\u003cth>SKU\u003c/th>\u003cth>颜色 / 尺码\u003c/th>\u003cth>售价 *\u003c/th>\u003cth>库存 *\u003c/th>\u003cth>材质 *\u003c/th>\u003cth>成分说明 *\u003c/th>\u003cth>状态\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>${records.slice(start,start+6).map(r=>`\u003ctr>\u003ctd>SK-${String(r.id).padStart(3,'0')}\u003c/td>\u003ctd>${r.name} / ${r.size}\u003c/td>\u003ctd>\u003cinput aria-label=\"SKU ${r.id} 售价\" data-i=\"${r.id-1}\" data-k=\"price\" type=\"number\" min=\"0.01\" step=\"0.01\" value=\"${esc(r.price)}\">\u003c/td>\u003ctd>\u003cinput aria-label=\"SKU ${r.id} 库存\" data-i=\"${r.id-1}\" data-k=\"stock\" type=\"number\" min=\"0\" step=\"1\" value=\"${esc(r.stock)}\">\u003c/td>\u003ctd>\u003cselect aria-label=\"SKU ${r.id} 材质\" data-i=\"${r.id-1}\" data-k=\"material\">\u003coption value=\"\">请选择\u003c/option>${['棉','聚酯纤维','混纺'].map(v=>`\u003coption ${r.material===v?'selected':''}>${v}\u003c/option>`).join('')}\u003c/select>\u003c/td>\u003ctd>\u003cinput aria-label=\"SKU ${r.id} 成分说明\" data-i=\"${r.id-1}\" data-k=\"detail\" value=\"${esc(r.detail)}\" style=\"width:130px\">\u003c/td>\u003ctd>\u003cspan data-status=\"${r.id-1}\">\u003c/span>\u003c/td>\u003c/tr>`).join('')}\u003c/tbody>\u003c/table>\u003c/div>\u003cdiv class=\"bar\">\u003cspan class=\"muted\">切页保留填写内容；保存后刷新可恢复。\u003c/span>\u003cdiv>\u003cbutton id=\"prev\" ${page===1?'disabled':''}>上一页\u003c/button> \u003cbutton id=\"next\" ${page===6?'disabled':''}>下一页\u003c/button>\u003c/div>\u003c/div>`;$('#prev').onclick=()=>turn(-1);$('#next').onclick=()=>turn(1)}\nelse if(mode==='group'){$('#work').innerHTML=[0,1,2,3].map(g=>`\u003csection>\u003cdiv class=\"group\" role=\"button\" tabindex=\"0\" aria-expanded=\"${opened.has(g)}\" data-group=\"${g}\">\u003cb>${opened.has(g)?'▾':'▸'} ${records[g*6].name} \u003cspan class=\"muted\">6 条尺码规格\u003c/span>\u003c/b>\u003cspan>${busy.has(g)?'正在加载…':opened.has(g)?'点击收起':'点击展开并加载'}\u003c/span>\u003c/div>\u003cdiv class=\"body\" ${opened.has(g)?'':'hidden'}>${opened.has(g)?records.slice(g*6,g*6+6).map(r=>`\u003cdiv class=\"card\">\u003cdiv class=\"bar\">\u003cb>SKU ${r.id} · ${r.name} / ${r.size}\u003c/b>\u003cspan data-status=\"${r.id-1}\">\u003c/span>\u003c/div>\u003cdiv class=\"body\">${fields(r)}\u003c/div>\u003c/div>`).join(''):''}\u003c/div>\u003c/section>`).join('');document.querySelectorAll('[data-group]').forEach(e=>{e.onclick=()=>toggle(+e.dataset.group);e.onkeydown=k=>{if(k.key==='Enter'||k.key===' '){k.preventDefault();e.click()}}})}\nelse{let r=records[current];$('#work').innerHTML=`\u003cdiv class=\"bar\">\u003cb>SKU ${r.id} / ${N} · ${r.name} / ${r.size}\u003c/b>\u003cspan data-status=\"${current}\">\u003c/span>\u003c/div>\u003cdiv class=\"body\">\u003cdiv class=\"steps\">${['销售属性','材质属性','确认规格'].map((s,i)=>`\u003cspan class=\"step ${step===i?'active':''}\">${i+1}　${s}\u003c/span>`).join('')}\u003c/div>${step\u003c2?fields(r):`\u003ch2>请核对当前 SKU\u003c/h2>\u003cp>售价 ${esc(r.price)} 元　｜　库存 ${esc(r.stock)} 件\u003c/p>\u003cp>材质 ${esc(r.material)}　｜　成分 ${esc(r.detail)}\u003c/p>`}\u003cdiv class=\"footer\">\u003cbutton id=\"back\" ${step===0?'disabled':''}>上一步\u003c/button>\u003cbutton class=\"primary\" id=\"forward\">${step===2?(current===N-1?'完成全部练习':'确认并填写下一个 SKU'):'下一步'}\u003c/button>\u003c/div>\u003c/div>`;if(step\u003c2){document.querySelectorAll('[data-k]').forEach(e=>e.closest('label').hidden=step===0?['material','detail'].includes(e.dataset.k):['price','stock'].includes(e.dataset.k))}$('#back').onclick=()=>{step--;render()};$('#forward').onclick=()=>{if(!validateStep())return;if(step\u003c2)step++;else if(current\u003cN-1){current++;step=0}else{note('全部 8 条 SKU 填写完成！');save()}render()}}\nmeter()}\nfunction validateStep(){let r=records[current],keys=step===0?['price','stock']:step===1?['material','detail']:[];let valid=true;keys.forEach(k=>{let good=k==='price'?r[k]!==''&&+r[k]>0:k==='stock'?r[k]!==''&&Number.isInteger(+r[k])&&+r[k]>=0:!!r[k].trim();let e=document.querySelector(`[data-k=\"${k}\"]`);e?.classList.toggle('error',!good);if(!good)valid=false});if(!valid)note('请补全当前步骤，价格须大于 0，库存须为非负整数');return valid}\nfunction turn(n){$('#work').style.opacity='.5';$('#prev').disabled=$('#next').disabled=true;let token=generation;timers.push(setTimeout(()=>{if(token!==generation)return;page+=n;render();$('#work').style.opacity='1';log('翻页加载第 '+page+' 页，之前填写的内容已保留')},650))}\nfunction toggle(g){if(busy.has(g))return;if(opened.has(g)){opened.delete(g);render();return}busy.add(g);render();let token=generation;timers.push(setTimeout(()=>{if(token!==generation)return;busy.delete(g);opened.add(g);render();log('已加载 '+records[g*6].name+' 分组，共 6 条规格')},750))}\n$('#work').addEventListener('input',e=>{let k=e.target.dataset.k;if(!k)return;let r=records[+e.target.dataset.i];r[k]=e.target.value;e.target.classList.remove('error');meter()});\n$('#save').onclick=save;$('#reset').onclick=()=>{if(confirm('重置本练习全部内容？')){try{localStorage.removeItem(KEY)}catch{}window.__singleReload()}};\n$('#submit').onclick=()=>{let i=records.findIndex(r=>!ok(r));if(i\u003c0)return note('校验通过，全部 SKU 已完成！');if(mode==='page'){page=Math.floor(i/6)+1;render()}else if(mode==='group'){opened.add(Math.floor(i/6));render()}else{current=i;step=0;render()}note('第 '+(i+1)+' 条 SKU 尚未完成，请检查必填属性');document.querySelector(`[data-i=\"${i}\"]`)?.focus()};render();log('练习已就绪 · 数据只在本浏览器保存');\n\u003c/script>\u003c/html>","SKU属性填写实战练习/05-抽屉编辑属性.html":"\u003c!doctype html>\u003chtml lang=\"zh-CN\">\u003cmeta charset=\"utf-8\">\u003cmeta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\u003ctitle>抽屉编辑属性 · 实战练习\u003c/title>\u003cstyle>*{box-sizing:border-box}body{margin:0;font:14px/1.7 \"Microsoft YaHei\",sans-serif;background:#f3f6fa;color:#25364b}header{background:#172e48;color:white;padding:18px 5%;display:flex;justify-content:space-between}a{color:inherit;text-decoration:none}main{max-width:1250px;margin:30px auto;padding:0 24px}h1{font-size:28px;margin:0 0 8px}h2{font-size:18px}p{color:#758499}.intro{margin-bottom:25px}.task{background:#eaf4ff;border:1px solid #cde2fa;padding:16px 20px;border-radius:10px;color:#3a638c;margin:20px 0}.card{background:white;border:1px solid #e0e6ee;border-radius:12px;margin-bottom:18px;overflow:hidden}.bar{display:flex;justify-content:space-between;align-items:center;padding:18px 22px;border-bottom:1px solid #e9edf3;gap:12px;flex-wrap:wrap}.muted{color:#8593a6;font-size:12px}.body{padding:22px}.scroll{overflow:auto}table{width:100%;border-collapse:collapse;min-width:850px}th{text-align:left;background:#f7f9fc;color:#738398;font-weight:500}td,th{padding:13px 18px;border-bottom:1px solid #e9edf3}input,select,button{font:inherit;border:1px solid #d9e1eb;border-radius:6px;padding:9px 12px;background:white;color:#314860}input:focus,select:focus{outline:2px solid #bad4ff;border-color:#6396ee}input[type=number]{width:115px}button{cursor:pointer}button:hover{background:#eff5ff;border-color:#88adf0}button:disabled{opacity:.4;cursor:default}.primary{background:#2563eb;color:white;border-color:#2563eb}.primary:hover{background:#1c50c0;color:white}.badge{background:#e8f5ef;color:#23835f;padding:3px 8px;border-radius:4px;font-size:12px}.pending{background:#fff3de;color:#b97f29}.footer{display:flex;justify-content:space-between;gap:12px;align-items:center;margin:20px 0;flex-wrap:wrap}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}label{display:block;color:#62758d}label input,label select{display:block;width:100%;margin-top:7px}.error{border-color:#dd6a6a!important;background:#fff6f6}.toast{position:fixed;bottom:25px;left:50%;transform:translateX(-50%);background:#1d3654;color:white;padding:12px 24px;border-radius:8px;z-index:10}.steps{display:flex;gap:8px;margin:22px 0}.step{flex:1;background:#e8edf5;border-radius:8px;padding:14px;color:#7b8da6}.step.active{background:#e5eeff;color:#2563eb}.group{padding:18px 22px;display:flex;justify-content:space-between;align-items:center;cursor:pointer}.group:hover{background:#f5f9ff}.log{font:12px/1.8 monospace;color:#7890a8;white-space:pre-wrap}.metric{font-size:24px;color:#2563eb}.tiles{display:grid;grid-template-columns:1fr 1fr;gap:20px}.tile{padding:26px;display:block;transition:.2s}.tile:hover{border-color:#91b8fa;transform:translateY(-3px)}.tile strong{font-size:20px;display:block;margin:12px 0}.tile p{min-height:44px}.index{color:#3b7be5;font-size:12px;letter-spacing:2px}@media(max-width:700px){.grid,.tiles{grid-template-columns:1fr}main{padding:0 15px}.steps{font-size:12px}.step{padding:8px}}textarea{width:100%;min-height:180px;padding:15px;border:1px solid #d9e1eb;border-radius:8px;font:14px/1.8 monospace}.overlay{position:fixed;inset:0;background:#10223780;z-index:10;display:flex;justify-content:flex-end}.overlay[hidden]{display:none}.drawer{width:min(480px,95vw);background:white;height:100%;overflow:auto;padding:26px;box-shadow:-10px 0 50px #0002}.drawer label{margin:16px 0}.chips{display:flex;gap:12px;flex-wrap:wrap;margin:12px 0 24px}.chips label{padding:8px 18px;border:1px solid #dae3ef;border-radius:6px;cursor:pointer}.chips input{display:inline;width:auto;margin-right:8px}.warn{color:#bf6b20;background:#fff4e5;padding:12px;border-radius:6px}.info{padding:10px 0;color:#6481a0}.req{color:#d75b5b}.empty{padding:40px;text-align:center;color:#8393a7}.success{background:#e8f5ef;padding:15px;color:#26815d;border-radius:6px}\u003c/style>\u003cheader>\u003cb>▦　SKU 实战训练室\u003c/b>\u003ca href=\"00-练习入口.html\">← 返回练习入口\u003c/a>\u003c/header>\u003cmain>\u003ch1>抽屉编辑属性\u003c/h1>\u003cp>列表搜索 → 打开抽屉 → 修改字段 → 应用回列表\u003c/p>\u003cdiv class=\"task\">练习任务　共 12 条 SKU。练习抽屉中的草稿与列表数据的区别，以及取消修改、搜索定位和条码校验。\u003c/div>\u003cdiv class=\"card\">\u003cdiv class=\"bar\">\u003cb>服饰规格管理\u003c/b>\u003cinput id=\"search\" placeholder=\"搜索 SKU 编码、颜色或尺码\" aria-label=\"搜索 SKU\">\u003cspan>已完成 \u003cb id=\"count\">\u003c/b>\u003c/span>\u003c/div>\u003cdiv class=\"scroll\">\u003ctable>\u003cthead>\u003ctr>\u003cth>SKU 编码\u003c/th>\u003cth>规格\u003c/th>\u003cth>售价\u003c/th>\u003cth>库存\u003c/th>\u003cth>状态\u003c/th>\u003cth>操作\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody id=\"rows\">\u003c/tbody>\u003c/table>\u003c/div>\u003cdiv class=\"overlay\" id=\"overlay\" hidden>\u003csection class=\"drawer\" role=\"dialog\" aria-modal=\"true\" aria-labelledby=\"drawerTitle\">\u003cp>编辑销售属性\u003c/p>\u003ch2 id=\"drawerTitle\">\u003c/h2>\u003clabel>售价 *\u003cinput id=\"d-price\" type=\"number\" min=\"0.01\" step=\"0.01\">\u003c/label>\u003clabel>库存 *\u003cinput id=\"d-stock\" type=\"number\" min=\"0\" step=\"1\">\u003c/label>\u003clabel>条形码 *\u003cinput id=\"d-barcode\" inputmode=\"numeric\" placeholder=\"13 位数字\">\u003c/label>\u003cdiv class=\"footer\">\u003cbutton id=\"cancel\">取消修改\u003c/button>\u003cbutton class=\"primary\" id=\"apply\">应用到表格\u003c/button>\u003c/div>\u003cp>抽屉中的修改只有应用后才进入列表。\u003c/p>\u003c/section>\u003c/div>\u003c/div>\u003cdiv class=\"footer\">\u003cbutton id=\"reset\">重置本练习\u003c/button>\u003cdiv>\u003cbutton id=\"save\">保存练习\u003c/button> \u003cbutton class=\"primary\" id=\"submit\">校验并完成\u003c/button>\u003c/div>\u003c/div>\u003cdiv id=\"result\" role=\"status\">\u003c/div>\u003cp style=\"margin-top:20px\">通用交互模拟，不对应特定平台当前版本。数据仅保存在本机浏览器。\u003c/p>\u003c/main>\u003cscript>\nconst $=s=>document.querySelector(s);function esc(s){return String(s??'').replace(/[&\u003c>\"']/g,c=>({'&':'&amp;','\u003c':'&lt;','>':'&gt;','\"':'&quot;',\"'\":'&#39;'}[c]))}function note(t){$('.toast')?.remove();let e=document.createElement('div');e.className='toast';e.role='status';e.textContent=t;document.body.append(e);setTimeout(()=>e.remove(),4000)}function read(k,def){try{return JSON.parse(localStorage.getItem(k))??def}catch{return def}}function persist(k,s){try{localStorage.setItem(k,JSON.stringify(s));note('练习已保存')}catch{note('本浏览器无法保存，请保留当前页面')}}function price(v){return String(v).trim()!==''&&Number.isFinite(+v)&&+v>0}function stock(v){return String(v).trim()!==''&&Number.isInteger(+v)&&+v>=0}function reset(k){if(confirm('确定清空本练习的填写内容？')){try{localStorage.removeItem(k)}catch{}window.__singleReload()}}function result(t){$('#result').textContent=t;$('#result').className='success';note(t)}\n\nconst KEY='sku-extra-drawer';let rows=read(KEY,Array.from({length:12},(_,i)=>({code:'SKU-'+String(i+1).padStart(3,'0'),color:['黑色','白色','蓝色'][Math.floor(i/4)],size:['S','M','L','XL'][i%4],price:'',stock:'',barcode:''}))),active=-1,opener=null;\nfunction good(r){return price(r.price)&&stock(r.stock)&&/^\\d{13}$/.test(r.barcode)}\nfunction render(){let q=$('#search').value.trim().toLowerCase();$('#rows').innerHTML=rows.map((r,i)=>({r,i})).filter(({r})=>(r.code+r.color+r.size).toLowerCase().includes(q)).map(({r,i})=>`\u003ctr>\u003ctd>${r.code}\u003c/td>\u003ctd>${r.color} / ${r.size}\u003c/td>\u003ctd>${esc(r.price)||'—'}\u003c/td>\u003ctd>${esc(r.stock)||'—'}\u003c/td>\u003ctd>\u003cspan class=\"badge ${good(r)?'':'pending'}\">${good(r)?'已完成':'待填写'}\u003c/span>\u003c/td>\u003ctd>\u003cbutton data-edit=\"${i}\">编辑属性\u003c/button>\u003c/td>\u003c/tr>`).join('')||'\u003ctr>\u003ctd colspan=\"6\" class=\"empty\">没有匹配的 SKU，请调整搜索词。\u003c/td>\u003c/tr>';$('#count').textContent=rows.filter(good).length+' / 12';document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>open(+b.dataset.edit,b))}\nfunction open(i,b){active=i;opener=b;let r=rows[i];$('#drawerTitle').textContent=r.code+' · '+r.color+' / '+r.size;['price','stock','barcode'].forEach(k=>{$('#d-'+k).value=r[k];$('#d-'+k).classList.remove('error')});$('#overlay').hidden=false;$('#d-price').focus()}\nfunction close(){let r=rows[active];if(r&&['price','stock','barcode'].some(k=>$('#d-'+k).value!==String(r[k]))&&!confirm('放弃抽屉中尚未应用的修改？'))return;$('#overlay').hidden=true;opener?.focus()}\n$('#apply').onclick=()=>{let d=Object.fromEntries(['price','stock','barcode'].map(k=>[k,$('#d-'+k).value.trim()]));let checks={price:price(d.price),stock:stock(d.stock),barcode:/^\\d{13}$/.test(d.barcode)};Object.entries(checks).forEach(([k,v])=>$('#d-'+k).classList.toggle('error',!v));if(Object.values(checks).some(v=>!v))return note('请检查售价、整数库存及 13 位数字条形码');Object.assign(rows[active],d);$('#overlay').hidden=true;render();note('属性已应用到表格；点击保存可持久保留')};$('#cancel').onclick=close;document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#overlay').hidden)close()});$('#search').oninput=render;$('#save').onclick=()=>persist(KEY,rows);$('#reset').onclick=()=>reset(KEY);$('#submit').onclick=()=>{let i=rows.findIndex(r=>!good(r));if(i>=0){$('#search').value='';render();open(i,null);note('请补全 '+rows[i].code)}else result('全部 12 条 SKU 校验通过')};render();\n\u003c/script>\u003c/html>","SKU属性填写实战练习/06-类目联动属性.html":"\u003c!doctype html>\u003chtml lang=\"zh-CN\">\u003cmeta charset=\"utf-8\">\u003cmeta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\u003ctitle>类目联动属性 · 实战练习\u003c/title>\u003cstyle>*{box-sizing:border-box}body{margin:0;font:14px/1.7 \"Microsoft YaHei\",sans-serif;background:#f3f6fa;color:#25364b}header{background:#172e48;color:white;padding:18px 5%;display:flex;justify-content:space-between}a{color:inherit;text-decoration:none}main{max-width:1250px;margin:30px auto;padding:0 24px}h1{font-size:28px;margin:0 0 8px}h2{font-size:18px}p{color:#758499}.intro{margin-bottom:25px}.task{background:#eaf4ff;border:1px solid #cde2fa;padding:16px 20px;border-radius:10px;color:#3a638c;margin:20px 0}.card{background:white;border:1px solid #e0e6ee;border-radius:12px;margin-bottom:18px;overflow:hidden}.bar{display:flex;justify-content:space-between;align-items:center;padding:18px 22px;border-bottom:1px solid #e9edf3;gap:12px;flex-wrap:wrap}.muted{color:#8593a6;font-size:12px}.body{padding:22px}.scroll{overflow:auto}table{width t.entries(fields).map(([k,vs])=>`\u003clabel>${k} \u003cspan class=\"req\">*\u003c/span>\u003cselect data-attr=\"${k}\">\u003coption value=\"\">请选择\u003c/option>${vs.map(v=>`\u003coption ${state.attrs[k]===v?'selected':''}>${v}\u003c/option>`).join('')}\u003c/select>\u003c/label>`).join('')+'\u003c/div>';document.querySelectorAll('[data-attr]').forEach(e=>e.onchange=()=>{state.attrs[e.dataset.attr]=e.value;$('#result').textContent=''})}\nfunction change(e,k){if(Object.values(state.attrs).some(Boolean)&&!confirm('切换类目将清空已填写的类目属性，是否继续？')){e.target.value=state[k];return}state[k]=e.target.value;if(k==='top')state.leaf='';state.attrs={};$('#result').textContent='';leaves();attrs()}\n$('#top').onchange=e=>change(e,'top');$('#leaf').onchange=e=>change(e,'leaf');$('#save').onclick=()=>persist(KEY,state);$('#reset').onclick=()=>reset(KEY);$('#submit').onclick=()=>{let fields=schema[state.top]?.[state.leaf];if(!fields||Object.entries(fields).some(([k,vs])=>!vs.includes(state.attrs[k])))return note('请选择完整类目并填完全部类目属性');result('类目与必填属性校验通过，可进入下一环节')};leaves();attrs();\n\u003c/script>\u003c/html>","SKU属性填写实战练习/07-表格粘贴导入.html":"\u003c!doctype html>\u003chtml lang=\"zh-CN\">\u003cmeta charset=\"utf-8\">\u003cmeta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\u003ctitle>Excel 多行粘贴导入 · 实战练习\u003c/title>\u003cstyle>*{box-sizing:border-box}body{margin:0;font:14px/1.7 \"Microsoft YaHei\",sans-serif;background:#f3f6fa;color:#25364b}header{background:#172e48;color:white;padding:18px 5%;display:flex;justify-content:space-between}a{color:inherit;text-decoration:none}main{max-width:1250px;margin:30px auto;padding:0 24px}h1{font-size:28px;margin:0 0 8px}h2{font-size:18px}p{color:#758499}.intro{margin-bottom:25px}.task{background:#eaf4ff;border:1px solid #cde2fa;padding:16px 20px;border-radius:10px;color:#3a638c;margin:20px 0}.card{background:white;border:1px solid #e0e6ee;border-radius:12px;margin-bottom:18px;overflow:hidden}.bar{display:flex;justify-content:space-between; font-size:20px;display:block;margin:12px 0}.tile p{min-height:44px}.index{color:#3b7be5;font-size:12px;letter-spacing:2px}@media(max-width:700px){.grid,.tiles{grid-template-columns:1fr}main{padding:0 15px}.steps{font-size:12px}.step{padding:8px}}textarea{width:100%;min-height:180px;padding:15px;border:1px solid #d9e1eb;border-radius:8px;font:14px/1.8 monospace}.overlay{position:fixed;inset:0;background:#10223780;z-index:10;display:flex;justify-content:flex-end}.overlay[hidden]{display:none}.drawer{width:min(480px,95vw);background:white;height:100%;overflow:auto;padding:26px;box-shadow:-10px 0 50px #0002}.drawer label{margin:16px 0}.chips{display:flex;gap:12px;flex-wrap:wrap;margin:12px 0 24px}.chips label{padding:8px 18px;border:1px solid #dae3ef;border-radius:6px;cursor:pointer}.chips input{display:inline;width:auto;margin-right:8px}.warn{color:#bf6b20;background:#fff4e5;padding:12px;border-radius:6px}.info{padding:10px 0;color:#6481a0}.req{color:#d75b5b}.empty{padding:40px;text-align:center;color:#8393a7}.success{background:#e8f5ef;padding:15px;color:#26815d;border-radius:6px}\u003c/style>\u003cheader>\u003cb>▦　SKU 实战训练室\u003c/b>\u003ca href=\"00-练习入口.html\">← 返回练习入口\u003c/a>\u003c/header>\u003cmain>\u003ch1>Excel 多行粘贴导入\u003c/h1>\u003cp>粘贴多行 → 解析预览 → 修正错误 → 确认导入\u003c/p>\u003cdiv class=\"task\">练习任务　点击含错误的样例，修复价格、库存及缺失材质，再完成导入。也可从 Excel 复制四列数据练习。\u003c/div>\u003cdiv class=\"card\">\u003cdiv class=\"body\">\u003ch2>从表格粘贴多行属性\u003c/h2>\u003cp>列顺序为 SKU 编码、售价、库存、材质。直接从 Excel 复制 4 列数据，不带表头，以 Tab 分列。\u003c/p>\u003ctextarea id=\"paste\" aria-label=\"粘贴 SKU 数据\" placeholder=\"SKU-001&#9;29.90&#9;100&#9;棉\">\u003c/textarea>\u003cdiv class=\"footer\">\u003cdiv>\u003cbutton id=\"sample\">填入含错误的练习样例\u003c/button> \u003cbutton id=\"parse\" class=\"primary\">解析与预览\u003c/button>\u003c/div>\u003cspan id=\"parseInfo\" class=\"muted\">\u003c/span>\u003c/div>\u003cdiv class=\"warn\">样例最后一行有价格、库存和材质错误，请修改文本后重新解析。\u003c/div>\u003c/div>\u003cdiv id=\"preview\">\u003c/div>\u003cdiv class=\"bar\">\u003cspan id=\"imported\">\u003c/span>\u003cbutton id=\"commit\" class=\"primary\" disabled>确认导入\u003c/button>\u003c/div>\u003c/div>\u003cdiv class=\"footer\">\u003cbutton id=\"reset\">重置本练习\u003c/button>\u003cdiv>\u003cbutton id=\"save\">保存练习\u003c/button> \u003cbutton class=\"primary\" id=\"submit\">校验并完成\u003c/button>\u003c/div>\u003c/div>\u003cdiv id=\"result\" role=\"status\">\u003c/div>\u003cp style=\"margin-top:20px\">通用交互模拟，不对应特定平台当前版本。数据仅保存在本机浏览器。\u003c/p>\u003c/main>\u003cscript>\nconst $=s=>document.querySelector(s);function esc(s){return String(s??'').replace(/[&\u003c>\"']/g,c=>({'&':'&amp;','\u003c':'&lt;','>':'&gt;','\"':'&quot;',\"'\":'&#39;'}[c]))}function note(t){$('.toast')?.remove();let e=document.createElement('div');e.className='toast';e.role='status';e.textContent=t;document.body.append(e);setTimeout(()=>e.remove(),4000)}function read(k,def){try{return JSON.parse(localStorage.getItem(k))??def}catch{return def}}function persist(k,s){try{localStorage.setItem(k,JSON.stringify(s));note('练习已保存')}catch{note('本浏览器无法保存，请保留当前页面')}}function price(v){return String(v).trim()!==''&&Number.isFinite(+v)&&+v>0}function stock(v){return String(v).trim()!==''&&Number.isInteger(+v)&&+v>=0}function reset(k){if(confirm('确定清空本练习的填写内容？')){try{localStorage.removeItem(k)}catch{}window.__singleReload()}}function result(t){$('#result').textContent=t;$('#result').className='success';note(t)}\n\nconst KEY='sku-extra-paste';let state=read(KEY,{text:'',rows:[]});$('#paste').value=state.text;let parsed=[];\nfunction parse(){state.text=$('#paste').value;let lines=state.text.replace(/\\r/g,'').split('\\n').filter(s=>s.trim());let seen=new Set();parsed=lines.map((s,i)=>{let a=s.split('\\t').map(s=>s.trim()),err=[];if(a.length!==4)err.push('必须有 4 列');if(!/^[A-Za-z0-9_-]+$/.test(a[0]||''))err.push('编码格式有误');if(seen.has(a[0]))err.push('编码重复');seen.add(a[0]);if(!price(a[1]))err.push('售价须大于 0');if(!stock(a[2]))err.push('库存须为非负整数');if(!a[3])err.push('材质未填');return {a,err,line:i+1}});$('#preview').innerHTML=parsed.length?'\u003cdiv class=\"scroll\">\u003ctable>\u003cthead>\u003ctr>\u003cth>行号\u003c/th>\u003cth>编码\u003c/th>\u003cth>售价\u003c/th>\u003cth>库存\u003c/th>\u003cth>材质\u003c/th>\u003cth>校验\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>'+parsed.map(r=>`\u003ctr>\u003ctd>${r.line}\u003c/td>${Array.from({length:4},(_,i)=>`\u003ctd>${esc(r.a[i])}\u003c/td>`).join('')}\u003ctd>\u003cspan class=\"badge ${r.err.length?'pending':''}\">${esc(r.err.join('；')||'通过')}\u003c/span>\u003c/td>\u003c/tr>`).join('')+'\u003c/tbody>\u003c/table>\u003c/div>':'\u003cdiv class=\"empty\">暂无内容，请先粘贴数据再解析。\u003c/div>';$('#commit').disabled=!parsed.length||parsed.some(r=>r.err.length);$('#parseInfo').textContent=`共 ${parsed.length} 行，${parsed.filter(r=>r.err.length).length} 行有误`;}\n$('#parse').onclick=parse;$('#paste').oninput=()=>{state.text=$('#paste').value;parsed=[];$('#commit').disabled=true;$('#parseInfo').textContent='内容已修改，请重新解析';$('#preview').innerHTML='';$('#result').textContent=''};$('#sample').onclick=()=>{$('#paste').value='SKU-001\\t29.90\\t100\\t棉\\nSKU-002\\t39.90\\t80\\t混纺\\nSKU-003\\t0\\t-2\\t';$('#paste').dispatchEvent(new Event('input'));parse()};$('#commit').onclick=()=>{if(!parsed.length||parsed.some(r=>r.err.length))return;state.rows=parsed.map(r=>r.a);$('#imported').textContent='本次已导入 '+state.rows.length+' 条模拟 SKU';result('导入成功，已将全部行写入本页模拟列表')};$('#save').onclick=()=>{state.text=$('#paste').value;persist(KEY,state)};$('#reset').onclick=()=>reset(KEY);$('#submit').onclick=()=>{parse();if(!parsed.length||parsed.some(r=>r.err.length))return note('请先修复预览中的错误');if(JSON.stringify(state.rows)!==JSON.stringify(parsed.map(r=>r.a)))return note('校验通过，请点击“确认导入”完成实战');result('导入数据与当前粘贴内容一致，练习完成')};$('#imported').textContent=state.rows.length?'已恢复上次导入的 '+state.rows.length+' 条数据':'尚未导入';if(state.text)parse();\n\u003c/script>\u003c/html>","SKU属性填写实战练习/08-生成规格组合.html":"\u003c!doctype html>\u003chtml lang=\"zh-CN\">\u003cmeta charset=\"utf-8\">\u003cme
