  .搜索框 input{

  .搜索框 input::placeholder{color:var(--文字次)}

  .搜索框 .清除{

    cursor:pointer;font-size:18px;color:var(--文字次);
    width:24px;height:24px;display:none;align-items:center;justify-content:center;
    border-radius:50%;
  }
  .搜索框 .清除:hover{background:var(--描边);color:var(--文字)}

  .筛选条{display:flex;gap:8px;flex-wrap:wrap}
  .筛选{
    padding:6px 14px;font-size:13px;cursor:pointer;user-select:none;
    background:var(--卡片底);border:1px solid var(--描边);border-radius:999px;

  .卡片{

      <div class="名称">${项.名称} <span class="标签 离线">下载</span></div>
      <div class="描述">${项.描述}</div>
      <div class="按钮组"><a class="btn 主" href="${网盘地址}" target="_blank" rel="noopener">百度网盘下载</a></div>
      <div class="提取码">百度网盘APP · 提取码 <b>${网盘提取码}</b></div>
    </div>`;
  }
  if(项.类型 === "知识库"){
    return `<div class="卡片 知识库">${角标}
      <div class="图标">${项.图标}</div>
      <div class="名称">${项.名称} <span class="标签 库">${项.平台}</span></div>
      <div class="描述">${项.描述}</div>
      <div class="按钮组"><a class="btn 强调" href="${项.链接}" target="_blank" rel="noopener">进入知识库</a></div>
    </div>`;
  }
  // 分享
  return `<div class="卡片 分享">${角标}
    <div class="图标">${项.图标}</div>
    <div class="名称">${项.名称} <span class="标签 单">清单</span></div>
    <div class="描述">${项.描述}</div>
    <div class="按钮组"><a class="btn 绿" href="${项.链接}" target="_blank" rel="noopener">查看清单</a></div>
  </div>`;
}

const 内容区 = document.getElementById("内容区");
const 空状态 = document.getElementById("空状态");
const 搜索输入 = document.getElementById("搜索输入");
const 清除按钮 = document.getElementById("清除按钮");
const 筛选条 = document.getElementById("筛选条");

let 当前分类 = "全部";
let 当前关键词 = "";

// —— 渲染筛选标签 ——（全部 + 各分类，带数量）
function 渲染筛选(){
  const 标签 = [{键:"全部", 数:全部工具.length}];
  分组顺序.forEach(分类 => {
    const 数 = 全部工具.filter(x => x.分类 === 分类).length;
    if(数 > 0) 标签.push({键:分类, 数});
  });
  筛选条.innerHTML = 标签.map(t =>
    `<span class="筛选${t.键===当前分类?' 激活':''}" data-分类="${t.键}">${t.键}<span class="数">${t.数}</span></span>`
  ).join("");
  筛选条.querySelectorAll(".筛选").forEach(el => {
    el.onclick = () => { 当前分类 = el.dataset.分类; 渲染筛选(); 渲染内容(); };
  });
}

// —— 渲染内容区（按分组，应用搜索 + 分类过滤）——
function 渲染内容(){
  const 词 = 当前关键词.trim().toLowerCase();
  let 命中总数 = 0;
  let html = "";
  分组顺序.forEach(分类 => {
    if(当前分类 !== "全部" && 当前分类 !== 分类) return;
    const 组项 = 全部工具.filter(x =>
      x.分类 === 分类 &&
      (词 === "" || (x.名称+x.描述).toLowerCase().includes(词))
    );
    if(组项.length === 0) return;
    命中总数 += 组项.length;
    html += `<div class="组">
      <div class="组标题">${分类}</div>
      <div class="网格">${组项.map(卡片HTML).join("")}</div>
    </div>`;
  });
  内容区.innerHTML = html;
  空状态.style.display = 命中总数 === 0 ? "block" : "none";
}

// —— 搜索交互 ——
搜索输入.addEventListener("input", () => {
  当前关键词 = 搜索输入.value;
  清除按钮.style.display = 当前关键词 ? "flex" : "none";
  渲染内容();
});
清除按钮.onclick = () => {
  搜索输入.value = ""; 当前关键词 = ""; 清除按钮.style.display = "none";
  渲染内容(); 搜索输入.focus();
};

// —— 回到顶部 ——
const 回顶按钮 = document.getElementById("回顶按钮");
window.addEventListener("scroll", () => {
  回顶按钮.style.display = window.scrollY > 400 ? "flex" : "none";
});
回顶按钮.onclick = () => window.scrollTo({top:0, behavior:"smooth"});

// —— 初始化 ——
渲染筛选();
渲染内容();
</script>
</body>
</html>
