in>\u003ch1>颜色尺码组合生成\u003c/h1>\u003cp>多选规格 → 生成组合 → 批量与单行填写\u003c/p>\u003cdiv class=\"task\">练习任务　选择 2 种颜色与 3 种尺码生成 6 个组合。填写后增加一个尺码，观察旧内容保留；再取消颜色练习组合移除。\u003c/div>\u003cdiv class=\"card\">\u003cdiv class=\"body\">\u003ch2>第一步 · 选择销售规格\u003c/h2>\u003cb>颜色\u003c/b>\u003cdiv class=\"chips\" id=\"colors\">\u003c/div>\u003cb>尺码\u003c/b>\u003cdiv class=\"chips\" id=\"sizes\">\u003c/div>\u003cdiv class=\"footer\">\u003cspan id=\"summary\">\u003c/span>\u003cbutton id=\"generate\" class=\"primary\">生成 / 更新规格组合\u003c/button>\u003c/div>\u003cdiv id=\"stale\" class=\"req\" aria-live=\"polite\">\u003c/div>\u003c/div>\u003cdiv class=\"bar\">\u003cb>第二步 · 填写组合属性\u003c/b>\u003cdiv>\u003cinput id=\"batchPrice\" type=\"number\" placeholder=\"统一售价\" aria-label=\"统一售价\"> \u003cbutton id=\"batch\">应用到全部组合\u003c/button>\u003c/div>\u003c/div>\u003cdiv id=\"matrix\">\u003c/div>\u003c/div>\u003cdiv class=\"footer\">\u003cbutton id=\"reset\">重置本练习\u003c/button>\u003cdiv>\u003cbutton id=\"save\">保存练习\u003c/button> \u003cbutton class=\"primary\" id=\"submit\">校验并完成\u003c/button>\u003c/div>\u003c/div>\u003cdiv id=\"result\" role=\"status\">\u003c/div>\u003cp style=\"margin-top:20px\">通用交互模拟，不对应特定平台当前版本。数据仅保存在本机浏览器。\u003c/p>\u003c/main>\u003cscript>\nconst $=s=>document.querySelector(s);function esc(s){return String(s??'').replace(/[&\u003c>\"']/g,c=>({'&':'&amp;','\u003c':'&lt;','>':'&gt;','\"':'&quot;',\"'\":'&#39;'}[c]))}function note(t){$('.toast')?.remove();let e=document.createElement('div');e.className='toast';e.role='status';e.textContent=t;document.body.append(e);setTimeout(()=>e.remove(),4000)}function read(k,def){try{return JSON.parse(localStorage.getItem(k))??def}catch{return def}}function persist(k,s){try{localStorage.setItem(k,JSON.stringify(s));note('练习已保存')}catch{note('本浏览器无法保存，请保留当前页面')}}function price(v){return String(v).trim()!==''&&Number.isFinite(+v)&&+v>0}function stock(v){return String(v).trim()!==''&&Number.isInteger(+v)&&+v>=0}function reset(k){if(confirm('确定清空本练习的填写内容？')){try{localStorage.removeItem(k)}catch{}window.__singleReload()}}function result(t){$('#result').textContent=t;$('#result').className='success';note(t)}\n\nconst KEY='sku-extra-matrix';let state=read(KEY,{colors:[],sizes:[],rows:[]});const colors=['黑色','白色','蓝色'],sizes=['S','M','L','XL'];\nfunction choices(list,key){return list.map(v=>`\u003clabel>\u003cinput type=\"checkbox\" data-kind=\"${key}\" value=\"${v}\" ${state[key].includes(v)?'checked':''}>${v}\u003c/label>`).join('')}\n$('#colors').innerHTML=choices(colors,'colors');$('#sizes').innerHTML=choices(sizes,'sizes');\nfunction matches(){return state.rows.length===state.colors.length*state.sizes.length&&state.rows.length>0&&state.rows.every(r=>state.colors.includes(r.color)&&state.sizes.includes(r.size))}\nfunction render(){ $('#matrix').innerHTML=state.rows.length?'\u003cdiv class=\"scroll\">\u003ctable>\u003cthead>\u003ctr>\u003cth>颜色\u003c/th>\u003cth>尺码\u003c/th>\u003cth>售价 *\u003c/th>\u003cth>库存 *\u003c/th>\u003cth>商家编码 *\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>'+state.rows.map((r,i)=>`\u003ctr>\u003ctd>${r.color}\u003c/td>\u003ctd>${r.size}\u003c/td>${['price','stock','code'].map(k=>`\u003ctd>\u003cinput aria-label=\"${r.color} ${r.size} ${k}\" data-i=\"${i}\" data-k=\"${k}\" value=\"${esc(r[k])}\" ${k!=='code'?'type=\"number\"':''}>\u003c/td>`).join('')}\u003c/tr>`).join('')+'\u003c/tbody>\u003c/table>\u003c/div>':'\u003cp class=\"empty\">选择颜色与尺码后，点击生成规格组合。\u003c/p>';$('#summary').textContent=`已选择 ${state.colors.length} 种颜色 × ${state.sizes.length} 种尺码 = ${state.colors.length*state.sizes.length} 个组合；已生成 ${state.rows.length} 条`;$('#stale').textContent=state.rows.length&&!matches()?'选择已变化，请重新生成组合后再提交。':'';$('#result').textContent=''}\ndocument.querySelectorAll('[data-kind]').forEach(e=>e.onchange=()=>{let k=e.dataset.kind;state[k]=Array.from(document.querySelectorAll(`[data-kind=\"${k}\"]:checked`),e=>e.value);render()});\n$('#generate').onclick=()=>{if(!state.colors.length||!state.sizes.length)return note('至少选择一种颜色和一种尺码');const lost=state.rows.filter(r=>!state.colors.includes(r.color)||!state.sizes.includes(r.size));if(lost.length&&!confirm('重新生成会移除 '+lost.length+' 个已取消选择的组合，是否继续？'))return;let old=new Map(state.rows.map(r=>[r.color+'|'+r.size,r]));state.rows=state.colors.flatMap(color=>state.sizes.map(size=>old.get(color+'|'+size)||{color,size,price:'',stock:'',code:''}));render();note('组合已生成，相同组合保留已填内容')};\n$('#matrix').oninput=e=>{if(e.target.dataset.k){state.rows[+e.target.dataset.i][e.target.dataset.k]=e.target.value;$('#result').textContent=''}};$('#batch').onclick=()=>{if(!state.rows.length)return note('请先生成组合');let p=$('#batchPrice').value;if(!price(p))return note('请输入大于 0 的价格');state.rows.forEach(r=>r.price=p);render();note('已设置全部已生成组合的售价')};$('#save').onclick=()=>persist(KEY,state);$('#reset').onclick=()=>reset(KEY);$('#submit').onclick=()=>{if(!matches())return note('请按当前颜色尺码重新生成组合');let seen=new Set();let bad=state.rows.find(r=>{let invalid=!price(r.price)||!stock(r.stock)||!r.code.trim()||seen.has(r.code.trim());seen.add(r.code.trim());return invalid});if(bad)return note(bad.color+' / '+bad.size+' 的属性未完成或编码重复');result('全部 '+state.rows.length+' 个规格组合校验通过')};render();\n\u003c/script>\u003c/html>","SKU属性填写实战练习/09-商品上架综合实战.html":"\u003c!doctype html>\u003chtml lang=\"zh-CN\">\u003chead>\u003cmeta charset=\"utf-8\">\u003cmeta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\u003ctitle>商品发布 · 综合实战后台\u003c/title>\u003cstyle>\n*{box-sizing:border-box}body{margin:0;font:14px/1.6 'Segoe UI','Microsoft YaHei',sans-serif;color:#263449;background:#f4f6fa}button,input,select,textarea{font:inherit}button,a{cursor:pointer}button{background:white;border:1px solid #dce3ed;border-radius:6px;padding:8px 15px;color:#4b5c74}button:hover{background:#f0f5ff;border-color:#9fbbef}button:disabled{opacity:.4;cursor:default}.primary{background:#2563eb;color:white;border-color:#2563eb}.primary:hover{background:#1d53cb;color:white}a{color:#5283d6;text-decoration:n template-columns:1fr 1fr;gap:20px}label.field{display:block;color:#60728b;margin-bottom:18px}label.field input,label.field select{display:block;width:100%;margin-top:7px}label.field em{color:#df6969;font-style:normal}.hint{font-size:12px;color:#93a0b2}.banner{background:#eff5ff;border:1px solid #dbe7fe;border-radius:7px;color:#5777a7;padding:11px 15px;margin-bottom:18px;font-size:12px}.chips{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0 18px}.chips label{border:1px solid #e1e7f1;border-radius:5px;padding:7px 12px;color:#63778e;cursor:pointer}.chips label:has(input:checked){border-color:#8caef0;background:#f1f6ff;color:#2563eb}.chips input{margin-right:6px}.toolbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:12px 18px;border-bottom:1px solid #e8edf5;background:#fcfdff}.toolbar input{width:100px}.toolbar select{padding:7px}.toolbar button{font-size:12px}.scroll{height:375px;overflow:auto}table{width:100%;min-width:640px;border-collapse:separate;border-spacing:0;font-size:12px}th{position:sticky;top:0;z-index:1;background:#f3f6fa;color:#7e8da1;text-align:left;font-weight:500}td,th{padding:10px 12px;border-bottom:1px solid #edf0f6;white-space:nowrap}td input{width:92px;padding:6px 8px;font-size:12px}td input.code{width:130px}tr:nth-child(even){background:#fcfdff}.pill{padding:3px 7px;border-radius:4px;background:#fff3e3;color:#b88941;font-size:11px}.pill.ok{background:#eaf8f0;color:#318b68}.tablefoot{padding:12px 18px;border-top:1px solid #e8edf5;display:flex;justify-content:space-between;font-size:12px;color:#8799b0;align-items:center;gap:10px;flex-wrap:wrap}.empty{text-align:center;color:#91a0b4;padding:35px}.bottom{display:flex;justify-content:space-between;align-items:center;background:white;border:1px solid #e2e8f1;padding:16px 20px;border-radius:9px;gap:10px}.bottom button{margin-left:8px}.checks{padding:16px}.checkitem{font-size:12px;display:flex;gap:9px;padding:9px 0;color:#8595ab}.checkitem.done{color:#28855e}.checkitem span:first-child{min-width:18px}.sidecaption{padding:15px 16px;font-size:12px;color:#8b9bb0;border-top:1px solid #edf0f6}.overlay{position:fixed;inset:0;background:#14233c75;display:flex;justify-content:flex-end;z-index:10}.overlay[hidden]{display:none}.drawer{background:white;width:min(450px,96vw);height:100%;overflow:auto;padding:28px}.modal{align-self:center;margin:auto;background:white;border-radius:12px;padding:26px;width:min(750px,94vw);max-height:90vh;overflow:auto}textarea{width:100%;height:160px;font:12px/1.8 monospace;margin:16px 0}.toast{position:fixed;bottom:25px;left:50%;transform:translateX(-50%);background:#17304f;color:white;border-radius:8px;padding:12px 24px;z-index:30}.error{border-color:#e27676!important;background:#fff8f8!important}.grouphead td{background:#eef4ff;color:#4b6f9d;cursor:pointer;font-weight:600}.preview{display:grid;grid-template-columns:120px 1fr;gap:24px;align-items:center}.productpic{background:#edf2fa;border-radius:10px;font-size:60px;display:grid;place-items:center;height:120px}.metric{font-size:24px;color:#2869e1}.success{padding:32px;text-align:center;background:#f2fbf6;color:#29835c;border:1px solid #cdebdc;border-radius:10px}.success h2{font-size:24px}.success p{color:#5f8a74}.bullet{font-size:12px;line-height:2.2;color:#8a99ad}#sentinel{text-align:center;padding:15px;color:#8c9db5;font-size:12px}.controls{display:flex;gap:8px;align-items:center}.mode.active{color:#2563eb;background:#eef4ff;border-color:#a5c1f1}.imgbutton{width:110px;height:110px;background:#f7f9fc;border:1px dashed #b9cbe2;display:grid;place-items:center;cursor:pointer;border-radius:8px;overflow:hidden}.imgbutton img{width:100%;height:100%;object-fit:cover}@media(max-width:1150px){.layout{grid-template-columns:1fr}.training{display:none}}@media(max-width:800px){aside{display:none}main{margin:0}.content{padding:18px 12px}header{padding:0 15px}.grid{grid-template-columns:1fr}.steps{font-size:12px}.step{padding:10px}.title{align-items:flex-start}h1{font-size:21px}.bottom{flex-wrap:wrap}}\n\u003c/style>\u003c/head>\u003cbody>\u003caside>\u003cdiv class=\"brand\">\u003cspan>▦\u003c/span> 商家工作台\u003c/div>\u003cdiv class=\"navsmall\">商品中心\u003c/div>\u003cdiv class=\"nav active\">▤　发布商品\u003c/div>\u003cdiv class=\"nav\">▦　SKU 属性管理\u003c/div>\u003cdiv class=\"navsmall\">培训工具\u003c/div>\u003ca class=\"nav\" style=\"display:block\" href=\"00-练习入口.html\">←　返回专项练习\u003c/a>\u003cdiv class=\"sidenote\">本地实战环境\u003cbr>模拟完整商品发布流程\u003cbr>草稿保存在本机浏览器\u003c/div>\u003c/aside>\u003cmain>\u003cheader>\u003cspan>商品中心　/　发布商品\u003c/span>\u003cspan class=\"tag\">练习店铺 · 本地模拟\u003c/span>\u003c/header>\u003cdiv class=\"content\">\u003cdiv class=\"title\">\u003cdiv>\u003ch1>发布商品\u003c/h1>\u003cp>完成商品信息与销售规格，体验一次完整上架。\u003c/p>\u003c/div>\u003cdiv class=\"controls\">\u003cbutton id=\"reset\">重置练习\u003c/button>\u003cbutton id=\"save\">保存草稿\u003c/button>\u003c/div>\u003c/div>\u003cdiv class=\"steps\">\u003cdiv class=\"step active\">\u003cb>1\u003c/b>基本信息\u003c/div>\u003cdiv class=\"step\">\u003cb>2\u003c/b>销售规格\u003c/div>\u003cdiv class=\"step\">\u003cb>3\u003c/b>预览与发布\u003c/div>\u003c/div>\u003cdiv class=\"layout\">\u003cdiv>\u003csection data-panel=\"0\">\u003cdiv class=\"card\">\u003cdiv class=\"bar\">\u003ch2>基本信息\u003c/h2>\u003cspan class=\"hint\">只保留发布所需的核心字段\u003c/span>\u003c/div>\u003cdiv class=\"body\">\u003clabel class=\"field\">商品标题 \u003cem>*\u003c/em>\u003cinput id=\"title\" maxlength=\"60\" placeholder=\"例如：春夏纯棉圆领短袖 T恤\">\u003c/label>\u003cdiv class=\"grid\">\u003clabel class=\"field\">一级类目 \u003cem>*\u003c/em>\u003cselect id=\"top\">\u003coption value=\"\">选择一级类目\u003c/option>\u003coption>服饰\u003c/option>\u003coption>家居\u003c/option>\u003c/select>\u003c/label>\u003clabel class=\"field\">二级类目 \u003cem>*\u003c/em>\u003cselect id=\"leaf\">\u003c/select>\u003c/label>\u003c/div>\u003clabel class=\"field\">商品主图 \u003cspan class=\"hint\">选填 · 仅当前会话预览\u003c/span>\u003c/label>\u003clabel class=\"imgbutton\" id=\"photoPreview\" for=\"photo\">＋ 添加图片\u003c/label>\u003cinput type=\"file\" id=\"photo\" accept=\"image/*\" hidden>\u003c/div>\u003c/div>\u003cdiv class=\"card\">\u003cdiv class=\"bar\">\u003ch2>类目属性\u003c/h2>\u003cspan class=\"hint\">选择类目后按需加载\u003c/span>\u003c/div>\u003cdiv class=\"body\" id=\"attrs\">\u003c/div>\u003c/div>\u003c/section>\u003csection data-panel=\"1\" hidden>\u003cdiv class=\"banner\">建议选 6 种颜色 × 6 种尺码，生成 36 个 SKU，便于练习懒加载和分页。每条只需填写售价、库存、商家编码。\u003c/div>\u003cdiv class=\"card\">\u003cdiv class=\"bar\">\u003ch2>销售规格组合\u003c/h2>\u003cspan class=\"hint\">更新组合时保留相同规格的数据\u003c/span>\u003c/div>\u003cdiv class=\"body\">\u003cspan>颜色\u003c/span>\u003cdiv class=\"chips\" id=\"colors\">\u003c/div>\u003cspan>尺码 / 规格\u003c/span>\u003cdiv class=\"chips\" id=\"sizes\">\u003c/div>\u003cdiv class=\"title\">\u003cspan class=\"hint\" id=\"combos\">\u003c/span>\u003cbutton id=\"generate\" class=\"primary\">生成 / 更新 SKU\u003c/button>\u003c/div>\u003cdiv id=\"stale\" style=\"color:#cc8040;margin-top:8px;font-size:12px\">\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"card\">\u003cdiv class=\"bar\">\u003ch2>SKU 销售属性\u003c/h2>\u003cdiv class=\"controls\">\u003cbutton class=\"mode active\" data-mode=\"lazy\">滚动加载\u003c/button>\u003cbutton class=\"mode\" data-mode=\"page\">分页\u003c/button>\u003cbutton class=\"mode\" data-mode=\"group\">颜色分组\u003c/button>\u003c/div>\u003c/div>\u003cdiv class=\"toolbar\">\u003cspan id=\"selectedCount\" class=\"hint\">\u003c/span>\u003cselect id=\"batchKey\" aria-label=\"批量字段\">\u003coption value=\"price\">售价\u003c/option>\u003coption value=\"stock\">库存\u003c/option>\u003c/select>\u003cinput id=\"batchValue\" aria-label=\"批量值\" placeholder=\"批量值\">\u003cbutton id=\"batch\">应用到选中\u003c/button>\u003cbutton id=\"pasteOpen\">从表格粘贴\u003c/button>\u003c/div>\u003cdiv class=\"scroll\" id=\"viewport\">\u003ctable>\u003cthead>\u003ctr>\u003cth>\u003cinput type=\"checkbox\" id=\"all\" aria-label=\"全选当前已显示规格\">\u003c/th>\u003cth>颜色 / 尺码\u003c/th>\u003cth>售价 / 元 *\u003c/th>\u003cth>库存 / 件 *\u003c/th>\u003cth>商家编码 *\u003c/th>\u003cth>填写状态\u003c/th>\u003cth>操作\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody id=\"tableRows\">\u003c/tbody>\u003c/table>\u003cdiv class=\"empty\" id=\"tableEmpty\">先选择颜色和尺码，生成 SKU。\u003c/div>\u003cdiv id=\"sentinel\">\u003c/div>\u003c/div>\u003cdiv class=\"tablefoot\">\u003cspan id=\"loadText\">\u003c/span>\u003cspan id=\"filled\">\u003c/span>\u003cdiv id=\"pageControls\" hidden>\u003cbutton id=\"prevPage\">上一页\u003c/button> \u003cspan id=\"pageText\">\u003c/span> \u003cbutton id=\"nextPage\">下一页\u003c/button>\u003c/div>\u003c/div>\u003c/div>\u003cp class=\"hint\" style=\"margin-bottom:16px\">表头勾选仅针对当前已显示规格。切换视图保留填写内容与选中项，批量应用范围以“已选”计数为准。\u003c/p>\u003c/section>\u003csection data-panel=\"2\" hidden>\u003cdiv class=\"success\" id=\"published\" hidden style=\"margin-bottom:18px\">\u003ch2>✓ 模拟上架成功\u003c/h2>\u003cp>商品与所有 SKU 已通过校验。本次练习没有向真实平台发布。\u003c/p>\u003c/div>\u003cdiv class=\"card\">\u003cdiv class=\"bar\">\u003ch2>商品发布预览\u003c/h2>\u003cspan class=\"tag\">最后核对\u003c/span>\u003c/div>\u003cdiv class=\"body\" id=\"review\">\u003c/div>\u003c/div>\u003c/section>\u003cdiv class=\"bottom\">\u003cspan class=\"hint\" id=\"stepHint\">\u003c/span>\u003cdiv>\u003cbutton id=\"back\">上一步\u003c/button>\u003cbutton class=\"primary\" id=\"forward\">下一步 →\u003c/button>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"training\">\u003cdiv class=\"card\">\u003cdiv class=\"bar\">\u003ch2>实战知识点\u003c/h2>\u003cspan class=\"tag\" id=\"learnCount\">0 / 9\u003c/span>\u003c/div>\u003cdiv class=\"checks\" id=\"checks\">\u003c/div>\u003cdiv class=\"sidecaption\">完成对应操作后自动打勾。可在同一份 SKU 数据上切换不同交互模式；知识点打勾不作为发布门槛。\u003c/div>\u003c/div>\u003cdiv class=\"card body\">\u003ch3>本次练习目标\u003c/h3>\u003cdiv class=\"bullet\">① 填好商品基本信息\u003cbr>② 生成并补全规格\u003cbr>③ 试用不同编辑方式\u003cbr>④ 校验并模拟发布\u003c/div>\u003cp class=\"hint\" style=\"margin-top:15px\">这是通用上架流程模拟，字段已精简。商品图片为选填，销售规格也可用于杯型、容量等组合练习。\u003c/p>\u003c/div>\u003c/div>\u003c/div>\u003c/div>\u003c/main>\u003cdiv class=\"overlay\" id=\"drawer\" hidden>\u003cdiv class=\"drawer\" role=\"dialog\" aria-modal=\"true\" aria-labelledby=\"drawerTitle\">\u003cp>编辑销售属性\u003c/p>\u003ch2 id=\"drawerTitle\" style=\"font-size:22px;margin:12px 0 25px\">\u003c/h2>\u003clabel class=\"field\">售价（元） *\u003cinput id=\"d-price\" type=\"number\" step=\"0.01\">\u003c/label>\u003clabel class=\"field\">库存（件） *\u003cinput id=\"d-stock\" type=\"number\" step=\"1\">\u003c/label>\u003clabel class=\"field\">商家编码 *\u003cinput id=\"d-code\">\u003c/label>\u003cp class=\"hint\">抽屉里是临时修改，应用后写回表格。\u003c/p>\u003cdiv class=\"controls\" style=\"margin-top:25px\">\u003cbutton id=\"cancelDrawer\">取消\u003c/button>\u003cbutton class=\"primary\" id=\"applyDrawer\">应用修改\u003c/button>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"overlay\" id=\"pasteModal\" hidden>\u003cdiv class=\"modal\" role=\"dialog\" aria-modal=\"true\" aria-labelledby=\"pasteTitle\">\u003cdiv class=\"title\">\u003ch2 id=\"pasteTitle\">从 Excel 粘贴销售属性\u003c/h2>\u003cbutton id=\"pasteClose\">关闭\u003c/button>\u003c/div>\u003cp class=\"hint\" style=\"margin-top:15px\">复制 5 列，不带表头，以 Tab 分列：颜色、尺码、售价、库存、商家编码。规格须已生成；导入只更新匹配行。\u003c/p>\u003ctextarea id=\"paste\" aria-label=\"粘贴五列 SKU 数据\" placeholder=\"黑色&#9;S&#9;29.90&#9;100&#9;TRAIN-001\">\u003c/textarea>\u003cdiv class=\"controls\">\u003cbutton id=\"pasteSample\">填入前 5 条样例\u003c/button>\u003cbutton id=\"pasteParse\">预览并校验\u003c/button>\u003cbutton class=\"primary\" id=\"pasteCommit\" disabled>确认导入\u003c/button>\u003c/div>\u003cpre id=\"pasteInfo\" style=\"font-size:12px;white-space:pre-wrap;color:#6e83a0;max-height:200px;overflow:auto\">\u003c/pre>\u003c/div>\u003c/div>\u003cscript>\nconst $=s=>document.querySelector(s),KEY='listing-lab-v1',colors=['黑色','白色','蓝色','绿色','灰色','粉色'],sizes=['S','M','L','XL','2XL','3XL'];\nconst schemas={'服饰':{'T恤':{'面料':['棉','聚酯纤维','混纺'],'领型':['圆领','V领']},'外套':{'面料':['羊毛','涤纶','混纺'],'闭合方式':['拉链','纽扣']}},'家居':{'保温杯':{'材质':['304 不锈钢','316 不锈钢'],'容量':['350ml','500ml','750ml']},'收纳盒':{'材质':['PP','布艺'],'适用场景':['桌面','衣柜']}}};\nconst blank=()=>({title:'',top:'',leaf:'',attrs:{},colors:[],sizes:[],rows:[],learn:{},published:false});let s=blank(),step=0,mode='lazy',loaded=10,page=1,selected=new Set(),folded=new Set(),loading=false,epoch=0,active=-1,photo='',attrToken=0,pasteRows=[];\ntry{let saved=JSON.parse(localStorage.getItem(KEY));if(saved&&Array.isArray(saved.rows)&&saved.attrs&&saved.learn)s=saved}catch{}\nfunction esc(v){return String(v??'').replace(/[&\u003c>\"']/g,c=>({'&':'&amp;','\u003c':'&lt;','>':'&gt;','\"':'&quot;',\"'\":'&#39;'}[c]))}function note(t){$('.toast')?.remove();let e=document.createElement('div');e.className='toast';e.role='status';e.textContent=t;document.body.append(e);setTimeout(()=>e.remove(),4000)}\nfunction done(k){s.learn[k]=true;training()}function training(){let map={category:'类目联动与异步字段',steps:'分步填写与必填校验',matrix:'颜色尺码组合生成',lazy:'滚动触发懒加载',page:'分页与跨页保留',group:'展开 / 收起分组',drawer:'抽屉草稿与应用',batch:'勾选批量填写',paste:'粘贴、预览与导入'};$('#checks').innerHTML=Object.entries(map).map(([k,t])=>`\u003cdiv class=\"checkitem ${s.learn[k]?'done':''}\">\u003cspan>${s.learn[k]?'✓':'○'}\u003c/span>\u003cspan>${t}\u003c/span>\u003c/div>`).join('');$('#learnCount').textContent=Object.keys(map).filter(k=>s.learn[k]).length+' / 9'}\nfunction validPrice(v){return String(v).trim()!==''&&Number.isFinite(+v)&&+v>0}function validStock(v){return String(v).trim()!==''&&Number.isInteger(+v)&&+v>=0}function rowOk(r){return validPrice(r.price)&&validStock(r.stock)&&r.code.trim()!==''}function matches(){return s.rows.length>0&&s.rows.length===s.colors.length*s.sizes.length&&s.rows.every(r=>s.colors.includes(r.color)&&s.sizes.includes(r.size))}\nfunction save(){try{localStorage.setItem(KEY,JSON.stringify(s));note('草稿已保存到本浏览器')}catch{note('当前浏览器无法保存草稿，请保留页面')}}\nfunction leafOptions(){$('#leaf').innerHTML='\u003coption value=\"\">选择二级类目\u003c/option>'+Object.keys(schemas[s.top]||{}).map(v=>`\u003coption ${s.leaf===v?'selected':''}>${v}\u003c/option>`).join('');$('#leaf').disabled=!s.top}\nasync function attrs(){let token=++attrToken;$('#attrs').innerHTML='\u003cp class=\"hint\">正在加载类目字段…\u003c/p>';await new Promise(r=>setTimeout(r,500));if(token!==attrToken)return;let fields=schemas[s.top]?.[s.leaf];$('#attrs').innerHTML=fields?'\u003cdiv class=\"grid\">'+Object.entries(fields).map(([k,vs])=>`\u003clabel class=\"field\">${k} \u003cem>*\u003c/em>\u003cselect data-attr=\"${k}\">\u003coption value=\"\">请选择\u003c/option>${vs.map(v=>`\u003coption ${s.attrs[k]===v?'selected':''}>${v}\u003c/option>`).join('')}\u003c/select>\u003c/label>`).join('')+'\u003c/div>':'\u003cp class=\"hint\">选择完整类目后，展示 2 个类目属性。\u003c/p>';document.querySelectorAll('[data-attr]').forEach(e=>e.onchange=()=>{s.attrs[e.dataset.attr]=e.value;s.published=false});if(fields)done('category')}\nfunction categoryChange(e,k){if(Object.values(s.attrs).some(Boolean)&&!confirm('切换类目会清空类目属性，继续吗？')){e.target.value=s[k];return}s[k]=e.target.value;if(k==='top')s.leaf='';s.attrs={};s.published=false;leafOptions();attrs()}\nfunction basicOk(){let fields=schemas[s.top]?.[s.leaf];if(s.title.trim().length\u003c2){$('#title').classList.add('error');$('#title').focus();note('商品标题至少填写 2 个字');return false}if(!fields||Object.entries(fields).some(([k,vs])=>!vs.includes(s.attrs[k]))){note('请选择完整类目并填写 2 个类目属性');return false}return true}\nfunction choices(){['colors','sizes'].forEach(k=>{$('#'+k).innerHTML=(k==='colors'?colors:sizes).map(v=>`\u003clabel>\u003cinput type=\"checkbox\" data-kind=\"${k}\" value=\"${v}\" ${s[k].includes(v)?'checked':''}>${v}\u003c/label>`).join('')});document.querySelectorAll('[data-kind]').forEach(e=>e.onchange=()=>{let k=e.dataset.kind;s[k]=Array.from(document.querySelectorAll(`[data-kind=\"${k}\"]:checked`),e=>e.value);s.published=false;summary()})}\nfunction summary(){$('#combos').textContent=`${s.colors.length} 种颜色 × ${s.sizes.length} 种尺码 = ${s.colors.length*s.sizes.length} 个组合`;$('#stale').textContent=s.rows.length&&!matches()?'规格选择已变化，请重新生成组合。':''}\nfunction generate(){if(!s.colors.length||!s.sizes.length)return note('请至少选择一种颜色和一种尺码');let lost=s.rows.filter(r=>!s.colors.includes(r.color)||!s.sizes.includes(r.size));if(lost.length&&!confirm('将移除 '+lost.length+' 个已取消的组合，继续吗？'))return;let old=new Map(s.rows.map(r=>[r.id,r]));s.rows=s.colors.flatMap(c=>s.sizes.map(z=>old.get(c+'|'+z)||{id:c+'|'+z,color:c,size:z,price:'',stock:'',code:''}));s.published=false;selected.clear();loaded=10;page=1;epoch++;loading=false;done('matrix');summary();renderTable();note('已生成组合，相同组合的内容已保留')}\nfunction visibleRows(){if(mode==='page')return s.rows.slice((page-1)*10,page*10);if(mode==='lazy')return s.rows.slice(0,loaded);return s.rows.filter(r=>!folded.has(r.color))}\nfunction cellRow(r){let i=s.rows.indexOf(r);return `\u003ctr data-row=\"${i}\">\u003ctd>\u003cinput type=\"checkbox\" data-select=\"${i}\" aria-label=\"选择 ${r.color} ${r.size}\" ${selected.has(r.id)?'checked':''}>\u003c/td>\u003ctd>${r.color} / ${r.size}\u003c/td>${['price','stock','code'].map(k=>`\u003ctd>\u003cinput data-i=\"${i}\" data-k=\"${k}\" aria-label=\"${r.color} ${r.size} ${k}\" class=\"${k==='code'?'code':''}\" ${k!=='code'?'type=\"number\"':''} value=\"${esc(r[k])}\">\u003c/td>`).join('')}\u003ctd>\u003cspan data-status=\"${i}\" class=\"pill ${rowOk(r)?'ok':''}\">${rowOk(r)?'已完成':'待填写'}\u003c/span>\u003c/td>\u003ctd>\u003cbutton data-edit=\"${i}\" style=\"padding:4px 9px\">编辑\u003c/button>\u003c/td>\u003c/tr>`}\nfunction counts(){$('#selectedCount').textContent='已选 '+selected.size+' 项';$('#filled').textContent=s.rows.filter(rowOk).length+' / '+s.rows.length+' 已完成';let vs=visibleRows();$('#all').checked=vs.length>0&&vs.every(r=>selected.has(r.id));$('#all').indeterminate=vs.some(r=>selected.has(r.id))&&!$('#all').checked;document.querySelectorAll('[data-status]').forEach(e=>{let good=rowOk(s.rows[+e.dataset.status]);e.textContent=good?'已完成':'待填写';e.className='pill '+(good?'ok':'')})}\nfunction renderTable(){let scroll=$('#viewport').scrollTop;$('#tableRows').innerHTML=mode==='group'?s.colors.map(c=>`\u003ctr class=\"grouphead\">\u003ctd colspan=\"7\">\u003cbutton data-fold=\"${c}\" aria-expanded=\"${!folded.has(c)}\">${folded.has(c)?'▸':'▾'} ${c} · ${s.rows.filter(r=>r.color===c).length} 条规格\u003c/button>\u003c/td>\u003c/tr>`+(folded.has(c)?'':s.rows.filter(r=>r.color===c).map(cellRow).join(''))).join(''):visibleRows().map(cellRow).join('');$('#sentinel').hidden=mode!=='lazy'||!s.rows.length;$('#sentinel').textContent=loaded\u003cs.rows.length?'向下滚动，继续加载下一批 SKU':'✓ 所有 SKU 已加载';$('#pageControls').hidden=mode!=='page';$('#pageText').textContent=page+' / '+Math.max(1,Math.ceil(s.rows.length/10));$('#prevPage').disabled=page===1;$('#nextPage').disabled=page>=Math.ceil(s.rows.length/10);$('#loadText').textContent=mode==='lazy'?`已加载 ${Math.min(loaded,s.rows.length)} / ${s.rows.length} 条`:mode==='page'?'每页 10 条':'按颜色展开规格';$('#tableEmpty').hidden=s.rows.length>0;document.querySelectorAll('[data-edit]').forEach(e=>e.onclick=()=>openDrawer(+e.dataset.edit));document.querySelectorAll('[data-fold]').forEach(e=>e.onclick=()=>{folded.has(e.dataset.fold)?folded.delete(e.dataset.fold):folded.add(e.dataset.fold);done('group');renderTable()});document.querySelectorAll('.mode').forEach(e=>e.classList.toggle('active',e.dataset.mode===mode));counts();$('#viewport').scrollTop=scroll}\nasync function loadMore(){if(loading||mode!=='lazy'||step!==1||loaded>=s.rows.length)return;loading=true;let token=epoch;$('#sentinel').textContent='正在加载下一批…';await new Promise(r=>setTimeout(r,700));if(token!==epoch){loading=false;return}loaded=Math.min(s.rows.length,loaded+10);done('lazy');loading=false;renderTable()}\nnew IntersectionObserver(es=>{if(es[0].isIntersecting)loadMore()},{root:$('#viewport'),rootMargin:'0px 0px 30px 0px'}).observe($('#sentinel'));\n$('#viewport').addEventListener('scroll',()=>{let e=$('#viewport');if(e.scrollTop+e.clientHeight>=e.scrollHeight-50)loadMore()});\n$('#tableRows').oninput=e=>{if(e.target.dataset.k){let r=s.rows[+e.target.dataset.i];r[e.target.dataset.k]=e.target.value;s.published=false;counts()}};$('#tableRows').onchange=e=>{if(e.target.dataset.select!==undefined){let r=s.rows[+e.target.dataset.select];e.target.checked?selected.add(r.id):selected.delete(r.id);counts()}};$('#all').onchange=e=>{visibleRows().forEach(r=>e.target.checked?selected.add(r.id):selected.delete(r.id));renderTable()};\ndocument.querySelectorAll('.mode').forEach(e=>e.onclick=()=>{epoch++;loading=false;mode=e.dataset.mode;$('#viewport').scrollTop=0;renderTable()});\nfunction turn(n){if(loading)return;loading=true;let token=epoch;$('#prevPage').disabled=$('#nextPage').disabled=true;$('#pageText').textContent='加载中…';setTimeout(()=>{if(token!==epoch){loading=false;return}page+=n;loading=false;done('page');$('#viewport').scrollTop=0;renderTable()},500)}$('#prevPage').onclick=()=>turn(-1);$('#nextPage').onclick=()=>turn(1);\n$('#batch').onclick=()=>{let k=$('#batchKey').value,v=$('#batchValue').value;if(!selected.size)return note('先勾选需要批量填写的规格');if(!(k==='price'?validPrice(v):validStock(v)))return note('售价须大于 0，库存须为非负整数');s.rows.filter(r=>selected.has(r.id)).forEach(r=>r[k]=v);s.published=false;done('batch');renderTable();note('已填写 '+selected.size+' 条选中规格')};\nfunction openDrawer(i){active=i;let r=s.rows[i];$('#drawerTitle').textContent=r.color+' / '+r.size;['price','stock','code'].forEach(k=>{$('#d-'+k).value=r[k];$('#d-'+k).classList.remove('error')});$('#drawer').hidden=false;$('#d-price').focus()}\nfunction closeDrawer(){let r=s.rows[active];if(['price','stock','code'].some(k=>String(r[k])!==$('#d-'+k).value)&&!confirm('放弃尚未应用的修改？'))return;$('#drawer').hidden=true}\n$('#cancelDrawer').onclick=closeDrawer;$('#applyDrawer').onclick=()=>{let v=Object.fromEntries(['price','stock','code'].map(k=>[k,$('#d-'+k).value.trim()]));let checks={price:validPrice(v.price),stock:validStock(v.stock),code:!!v.code};Object.entries(checks).forEach(([k,ok])=>$('#d-'+k).classList.toggle('error',!ok));if(Object.values(checks).some(v=>!v))return note('请补全售价、库存和商家编码');Object.assign(s.rows[active],v);s.published=false;done('drawer');$('#drawer').hidden=true;renderTable()};\n$('#pasteOpen').onclick=()=>{$('#pasteModal').hidden=false;$('#paste').focus()};$('#pasteClose').onclick=()=>{$('#pasteModal').hidden=true};$('#pasteSample').onclick=()=>{ $('#paste').value=s.rows.slice(0,Math.min(5,s.rows.length)).map((r,i)=>`${r.color}\\t${r.size}\\t29.90\\t100\\tTRAIN-${String(s.rows.indexOf(r)+1).padStart(3,'0')}`).join('\\n');pasteRows=[];$('#pasteCommit').disabled=true;$('#pasteInfo').textContent='样例已填入，请预览校验'};\n$('#paste').oninput=()=>{pasteRows=[];$('#pasteCommit').disabled=true;$('#pasteInfo').textContent='内容已改变，请重新预览'};\n$('#pasteParse').onclick=()=>{let seen=new Set();pasteRows=$('#paste').value.replace(/\\r/g,'').split('\\n').filter(l=>l.trim()).map((l,i)=>{let a=l.split('\\t').map(v=>v.trim()),id=a[0]+'|'+a[1],err=[];if(a.length!==5)err.push('需要 5 列');if(!s.rows.some(r=>r.id===id))err.push('规格不存在');if(seen.has(id))err.push('规格重复');seen.add(id);if(!validPrice(a[2]??''))err.push('售价错误');if(!validStock(a[3]??''))err.push('库存错误');if(!a[4])err.push('缺少编码');return {id,price:a[2],stock:a[3],code:a[4],err,line:i+1}});let proposed=s.rows.map(r=>({...r,...(pasteRows.find(p=>p.id===r.id)||{})})),codes=new Map();proposed.forEach(r=>{if(r.code){codes.set(r.code,(codes.get(r.code)||0)+1)}});pasteRows.forEach(r=>{if(codes.get(r.code)>1)r.err.push('商家编码重复')});$('#pasteInfo').textContent=pasteRows.length?pasteRows.map(r=>'第 '+r.line+' 行 '+(r.err.join('、')||'✓ 通过')).join('\\n'):'请先输入数据';$('#pasteCommit').disabled=!pasteRows.length||pasteRows.some(r=>r.err.length)};\n$('#pasteCommit').onclick=()=>{if(!pasteRows.length||pasteRows.some(r=>r.err.length))return;pasteRows.forEach(p=>{let r=s.rows.find(r=>r.id===p.id);Object.assign(r,{price:p.price,stock:p.stock,code:p.code})});s.published=false;done('paste');$('#pasteModal').hidden=true;renderTable();note('已导入 '+pasteRows.length+' 条规格属性')};\nfunction skuOk(){if(!matches()){note('请选择颜色和尺码并生成一致的规格组合');return false}let bad=s.rows.find(r=>!rowOk(r));if(bad){note(bad.color+' / '+bad.size+' 的售价、库存或编码未完成');return false}let codes=s.rows.map(r=>r.code.trim());if(new Set(codes).size!==codes.length){note('商家编码不能重复');return false}return true}\nfunction showStep(){document.querySelectorAll('[data-panel]').forEach(e=>e.hidden=+e.dataset.panel!==step);document.querySelectorAll('.step').forEach((e,i)=>e.classList.toggle('active',i===step));$('#back').disabled=step===0;$('#forward').textContent=step===2?'模拟发布商品':'下一步　→';$('#stepHint').textContent=['先完成基本信息与类目属性','填写每个规格的售价、库存、商家编码','核对后完成模拟上架'][step];if(step===1){renderTable();setTimeout(()=>{let e=$('#viewport');if(e.scrollHeight\u003c=e.clientHeight+40)loadMore()},0)}if(step===2)review()}\nfunction review(){let prices=s.rows.map(r=>+r.price);$('#review').innerHTML=`\u003cdiv class=\"preview\">\u003cdiv class=\"productpic\">${photo?'\u003cimg alt=\"商品预览\" src=\"'+photo+'\" style=\"width:100%;height:100%;object-fit:cover;border-radius:10px\">':'▧'}\u003c/div>\u003cdiv>\u003ch2>${esc(s.title)}\u003c/h2>\u003cp>${esc(s.top)} / ${esc(s.leaf)}\u003c/p>\u003cp>${Object.entries(s.attrs).map(([k,v])=>esc(k)+'：'+esc(v)).join('　')}\u003c/p>\u003cstrong class=\"metric\">¥ ${Math.min(...prices).toFixed(2)}${Math.min(...prices)!==Math.max(...prices)?' – '+Math.max(...prices).toFixed(2):''}\u003c/strong>\u003c/div>\u003c/div>\u003cdiv class=\"banner\" style=\"margin-top:24px\">${s.rows.length} 个 SKU　｜　总库存 ${s.rows.reduce((n,r)=>n+(+r.stock),0)} 件　｜　商家编码均已填写且无重复\u003c/div>\u003cdiv class=\"scroll\" style=\"height:260px\">\u003ctable>\u003cthead>\u003ctr>\u003cth>规格\u003c/th>\u003cth>售价\u003c/th>\u003cth>库存\u003c/th>\u003cth>编码\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>${s.rows.map(r=>`\u003ctr>\u003ctd>${r.color} / ${r.size}\u003c/td>\u003ctd>${esc(r.price)}\u003c/td>\u003ctd>${esc(r.stock)}\u003c/td>\u003ctd>${esc(r.code)}\u003c/td>\u003c/tr>`).join('')}\u003c/tbody>\u003c/table>\u003c/div>`;$('#published').hidden=!s.published}\n$('#forward').onclick=()=>{if(step===0){if(!basicOk())return;done('steps');step=1}else if(step===1){if(!skuOk())return;step=2}else{if(!basicOk()||!skuOk())return;s.published=true;save();review();note('模拟上架成功，实战任务完成');return}showStep()};$('#back').onclick=()=>{if(step>0){step--;showStep()}};\n$('#title').value=s.title;$('#title').oninput=e=>{s.title=e.target.value;e.target.classList.remove('error');s.published=false};$('#top').value=s.top;$('#top').onchange=e=>categoryChange(e,'top');$('#leaf').onchange=e=>categoryChange(e,'leaf');$('#generate').onclick=generate;$('#save').onclick=save;$('#reset').onclick=()=>{if(confirm('重置本综合练习的商品和所有规格？')){try{localStorage.removeItem(KEY)}catch{}window.__singleReload()}};\n$('#photo').onchange=e=>{let f=e.target.files[0];if(!f)return;if(!f.type.startsWith('image/'))return note('请选择图片');if(photo)URL.revokeObjectURL(photo);photo=URL.createObjectURL(f);$('#photoPreview').innerHTML='\u003cimg alt=\"商品主图\" src=\"'+photo+'\">';note('图片仅用于本次预览，刷新后需重新选择')};document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(!$('#drawer').hidden)closeDrawer();else $('#pasteModal').hidden=true}});leafOptions();attrs();choices();summary();training();showStep();\n\u003c/script>\u003c/body>\u003c/html>","子流程练习/ERP登录子流程练习.html":"\u003c!doctype html>\n\u003chtml lang=\"zh-CN\">\n\u003chead>\u003cmeta charset=\"utf-8\">\u003cmeta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\u003ctitle>多账号登录练习\u003c/title>\u003cstyle>*{box-sizing:border-box}html,body{margin:0;min-height:100%}body{background:#f3f6f9;color:#20394c;font:14px/1.6 system-ui,-apple-system,\"Microsoft YaHei\",sans-serif;background-image:radial-gradient(ellipse at 50% 0,#e4f0ed 0,transparent 65%)}[hidden]{display:none!important}button,input{font:inherit}button{cursor:pointer}button:focus-visible,summary:focus-visible,a:focus-visible{outline:3px solid #71b7aa;outline-offset:3px}.login-shell{width:min(440px,100%);margin:0 auto;padding:36px 16px 24px}.brand{dis
