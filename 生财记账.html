// ─── NetWorthChart ───────────────────────────────────
function NetWorthChart({snapshots}){
  const ref=useRef(null);const chart=useRef(null);
  const sorted=useMemo(()=>[...snapshots].sort((a,b)=>a.date.localeCompare(b.date)),[snapshots]);
  useEffect(()=>{
    if(!ref.current)return;
    if(chart.current){chart.current.destroy();chart.current=null}
    if(sorted.length<1)return;
    const labels=sorted.map(s=>s.date.slice(0,7));
    const netData=sorted.map(s=>s.totalA-s.totalL);
    const aData=sorted.map(s=>s.totalA);
    const lData=sorted.map(s=>s.totalL);
    chart.current=new Chart(ref.current,{
      type:'line',
      data:{labels,datasets:[
        {label:'净资产',data:netData,borderColor:'#10b981',backgroundColor:'rgba(16,185,129,.08)',fill:true,tension:.4,pointRadius:5,pointBackgroundColor:'#10b981',borderWidth:2.5},
        {label:'总资产',data:aData,borderColor:'#3b82f6',borderDash:[5,4],tension:.4,pointRadius:3,borderWidth:1.5},
        {label:'总负债',data:lData,borderColor:'#ef4444',borderDash:[5,4],tension:.4,pointRadius:3,borderWidth:1.5},
      ]},
      options:{responsive:true,maintainAspectRatio:false,plugins:{
        legend:{position:'top',labels:{boxWidth:12,font:{size:12}}},
        tooltip:{callbacks:{label:ctx=>`${ctx.dataset.label}: ${fmtSigned(ctx.raw)}`}},
      },scales:{
        x:{grid:{display:false}},
        y:{grid:{color:'#f1f5f9'},ticks:{callback:v=>v>=10000?`¥${(v/10000).toFixed(1)}w`:v>=1000?`¥${(v/1000).toFixed(0)}k`:`¥${v}`}}
      }}
    });
    return()=>{if(chart.current){chart.current.destroy();chart.current=null}};
  },[sorted]);
  if(sorted.length===0)return(
    <div style={{display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',height:'100%',color:'#94a3b8',gap:10}}>
      <div style={{fontSize:36}}>📈</div>
      <div style={{fontSize:14,fontWeight:600}}>暂无资产快照数据</div>
      <div style={{fontSize:12}}>在「资产负债」页点击「📸 记录快照」开始追踪</div>
    </div>
  );
  return<canvas ref={ref}/>;
}

// ─── SnapshotModal ───────────────────────────────────
function SnapshotModal({snap,defTotalA,defTotalL,curAssets,onClose,onSave}){
  const[date,setDate]=useState(snap?.date||today());
  const[note,setNote]=useState(snap?.note||'');
  // 明细行：{name,cat,amount}。编辑已有快照优先用其 breakdown；新建留空让用户载入
  const[items,setItems]=useState(()=>{
    if(snap?.breakdown&&snap.breakdown.length)return snap.breakdown.map(b=>({...b,amount:b.amount.toString()}));
    return [];
  });
  // 是否使用明细模式（有明细行就自动算总额）
  const useDetail=items.length>0;
  const isLiab=cat=>String(cat||'').includes('负债')||String(cat||'').includes('贷款')||String(cat||'').includes('欠');
  const totalA=useDetail?items.filter(i=>!isLiab(i.cat)).reduce((s,i)=>s+(+i.amount||0),0):(snap?.totalA??defTotalA);
  const totalL=useDetail?items.filter(i=>isLiab(i.cat)).reduce((s,i)=>s+(+i.amount||0),0):(snap?.totalL??defTotalL);
  // 简单模式总额（无明细时手填）
  const[simpleA,setSimpleA]=useState(snap?.totalA!=null?snap.totalA.toString():defTotalA.toString());
  const[simpleL,setSimpleL]=useState(snap?.totalL!=null?snap.totalL.toString():defTotalL.toString());
  const finalA=useDetail?totalA:(+simpleA||0);
  const finalL=useDetail?totalL:(+simpleL||0);
  const net=finalA-finalL;
  const loadCurrent=()=>{setItems((curAssets||[]).filter(a=>(+a.amount||0)!==0).map(a=>({name:a.name,cat:a.cat,amount:String(a.amount)})))};
  const addItem=()=>setItems([...items,{name:'',cat:'存款',amount:''}]);
  const updItem=(i,k,v)=>setItems(items.map((it,idx)=>idx===i?{...it,[k]:v}:it));
  const delItem=i=>setItems(items.filter((_,idx)=>idx!==i));
  const save=()=>{
    if(!date){alert('请填日期');return}
    const breakdown=useDetail?items.filter(i=>i.name.trim()).map(i=>({name:i.name.trim(),cat:i.cat||'其他',amount:+i.amount||0})):(snap?.breakdown||null);
    onSave({...(snap||{}),id:snap?.id||nextSnapId(),date,totalA:finalA,totalL:finalL,note,breakdown});
  };
  return(
    <div className="modal-bg" onClick={e=>e.currentTarget===e.target&&onClose()}>
      <div className="modal modal-w">
        <div className="mhdr"><span className="mtitle">{snap?'编辑快照':'记录资产快照'}</span><button className="mx" onClick={onClose}>×</button></div>
        <div style={{background:'linear-gradient(135deg,#0f172a,#1e293b)',borderRadius:12,padding:'14px 18px',marginBottom:18,color:'#fff'}}>
          <div style={{fontSize:12,color:'#64748b',marginBottom:4}}>净资产预览</div>
          <div style={{fontSize:28,fontWeight:900,color:net<0?'#fca5a5':'#10b981'}}>{fmtSigned(net)}</div>
          <div style={{fontSize:12,color:'#94a3b8',marginTop:4}}>总资产 ¥{fmtM(finalA)} · 总负债 ¥{fmtM(finalL)}</div>
        </div>
        <div className="frow"><label className="flbl">日期</label><input type="date" className="finp" value={date} onChange={e=>setDate(e.target.value)}/></div>
        {/* 明细录入区 */}
        <div className="frow">
          <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:8}}>
            <label className="flbl" style={{margin:0}}>资产明细（记录构成，方便回看占比）</label>
            <button className="chip" style={{whiteSpace:'nowrap'}} onClick={loadCurrent}>📥 载入当前资产</button>
          </div>
          {items.length>0?(
            <div style={{border:'1px solid #eef2f6',borderRadius:10,overflow:'hidden'}}>
              {items.map((it,i)=>(
                <div key={i} style={{display:'flex',gap:6,padding:'8px 10px',borderBottom:i<items.length-1?'1px solid #f8fafc':'none',alignItems:'center'}}>
                  <input className="finp" style={{flex:2,padding:'7px 9px',fontSize:13}} value={it.name} onChange={e=>updItem(i,'name',e.target.value)} placeholder="名称"/>
                  <select className="finp" style={{flex:1.3,padding:'7px 6px',fontSize:13}} value={it.cat} onChange={e=>updItem(i,'cat',e.target.value)}>{ASSET_CATS.map(c=><option key={c}>{c}</option>)}</select>
                  <input type="number" className="finp" style={{flex:1.4,padding:'7px 9px',fontSize:13}} value={it.amount} onChange={e=>updItem(i,'amount',e.target.value)} placeholder="金额"/>
                  <button className="btni" onClick={()=>delItem(i)}>🗑</button>
                </div>
              ))}
              <button onClick={addItem} style={{width:'100%',padding:'9px',border:'none',background:'#f8fafc',color:'#10b981',fontWeight:600,cursor:'pointer',fontSize:13,fontFamily:'inherit'}}>＋ 添加一项</button>
            </div>
          ):(
            <div style={{textAlign:'center',padding:'16px',background:'#f8fafc',borderRadius:10,fontSize:13,color:'#94a3b8'}}>
              <div style={{marginBottom:8}}>暂无明细 · 可手填下方总额，或录入明细以记录资金占比</div>
              <button className="chip on" onClick={addItem}>＋ 手动添加明细</button>
            </div>
          )}
        </div>
        {/* 无明细时显示总额手填 */}
        {!useDetail&&<div className="finp-2col frow">
          <div><label className="flbl">总资产（元）</label><input type="number" className="finp" value={simpleA} onChange={e=>setSimpleA(e.target.value)} placeholder="0"/></div>
          <div><label className="flbl">总负债（元）</label><input type="number" className="finp" value={simpleL} onChange={e=>setSimpleL(e.target.value)} placeholder="0"/></div>
        </div>}
        <div className="frow"><label className="flbl">备注（可选）</label><input className="finp" value={note} onChange={e=>setNote(e.target.value)} placeholder="如：年终统计、换工作后"/></div>
        <div className="mfoot">
          <button className="btn btns" onClick={onClose}>取消</button>
          <button className="btn btnp" onClick={save}>💾 保存快照</button>
        </div>
      </div>
    </div>
  );
}

// ─── QuickLinkModal ──────────────────────────────────
function QuickLinkModal({excludeId,allTxs,initIds,onClose,onConfirm}){
  const[sel,setSel]=useState(()=>new Set(initIds||[]));
  const[q,setQ]=useState('');
  const toggle=id=>{const n=new Set(sel);n.has(id)?n.delete(id):n.add(id);setSel(n)};
  const selTxs=allTxs.filter(t=>sel.has(t.id));
  const opts=useMemo(()=>{
    const lq=q.toLowerCase();
    return allTxs.filter(t=>t.id!==excludeId).filter(t=>{
      if(!lq)return true;
      return sid(t.id).toLowerCase().includes(lq)||(t.date||'').includes(lq)||(t.notes||'').toLowerCase().includes(lq)||(t.cat||'').toLowerCase().includes(lq)||String(t.amount).includes(lq);
    }).slice(0,40);
  },[allTxs,q,excludeId]);

  return(
    <div className="modal-bg" onClick={e=>e.currentTarget===e.target&&onClose()}>
      <div className="modal" style={{maxWidth:540}}>
        <div className="mhdr">
          <span className="mtitle">📎 关联账单 <span style={{fontSize:13,color:'#94a3b8',fontWeight:400}}>（多选）</span></span>
          <button className="mx" onClick={onClose}>×</button>
        </div>

        {/* 已选区域 */}
        <div style={{fontSize:11,fontWeight:700,color:'#64748b',marginBottom:6,textTransform:'uppercase',letterSpacing:.5}}>已选择 {sel.size} 条</div>
        <div className="ql-sel-area">
          {sel.size===0?<span className="ql-sel-empty">未选择任何账单，在下方列表点击勾选</span>:
          selTxs.map(t=>(
            <div key={t.id} className={`ql-chip${t.type==='支出'?' exp':''}`}>
              <span style={{fontFamily:'monospace'}}>{sid(t.id)}</span>
              <span>{t.cat}</span>
              <span style={{fontWeight:800}}>{t.type==='收入'?'+':'-'}¥{fmtM(t.amount)}</span>
              <button className="ql-chip-x" onClick={()=>toggle(t.id)}>×</button>
            </div>
          ))}
        </div>

        {/* 搜索框 */}
        <input className="finp" placeholder="搜索账单（编号、日期、备注、分类、金额）" value={q} onChange={e=>setQ(e.target.value)} autoFocus style={{marginBottom:10}}/>

        {/* 列表 */}
        <div style={{maxHeight:320,overflowY:'auto',border:'1px solid #f1f5f9',borderRadius:12,overflow:'hidden'}}>
          {opts.length===0&&<div style={{padding:'24px',textAlign:'center',color:'#94a3b8',fontSize:13}}>没有匹配的账单</div>}
          {opts.map(t=>{
            const checked=sel.has(t.id);
            return(
              <div key={t.id} className={`lnk-opt${checked?' on':''}`} onClick={()=>toggle(t.id)} style={{userSelect:'none'}}>
                <div className={`ql-cb${checked?' on':''}`}>{checked&&'✓'}</div>
                <span className={`lnk-sid${t.type==='支出'?' exp':''}`}>{sid(t.id)}</span>
                <div className="lnk-info">
                  <div className="lnk-info-top">{t.cat}{t.notes?` · ${t.notes.slice(0,22)}`:''}</div>
                  <div className="lnk-info-sub">{t.date} · {t.pay||'—'}{t.isOthers?(t.status==='settled'?' · ✓已结算':' · ⏳待结算'):''}</div>
                </div>
                <span className={`lnk-amt${t.type==='支出'?' exp':' inc'}`}>{t.type==='收入'?'+':'-'}¥{fmtM(t.amount)}</span>
              </div>
            );
          })}
        </div>

        {/* 底部操作 */}
        <div className="ql-foot">
          <button className="btn btns" style={{flex:1}} onClick={()=>{onConfirm([]);onClose()}}>🗑 清除全部关联</button>
          <button className="btn btnp" style={{flex:2}} onClick={()=>{onConfirm([...sel]);onClose()}}>
            ✓ 确认关联{sel.size>0?` (${sel.size} 条)`:''}
          </button>
        </div>
      </div>
    </div>
  );
}

// ─── TxPage ──────────────────────────────────────────
function TxPage({txs,saveTxs,cats,addCat,mergeCats,books,pays,saveAssets,saveBudgets,saveSnapshots,savePolicies,saveNavLinks,focusTxId,clearFocus}){
  const[showAdd,setShowAdd]=useState(false);const[editTx,setEditTx]=useState(null);const[showImport,setShowImport]=useState(false);const[qlinkTx,setQlinkTx]=useState(null);
  const[month,setMonth]=useState(curM());const[filterType,setFilterType]=useState('全部');const[filterCat,setFilterCat]=useState('全部');const[filterOthers,setFilterOthers]=useState('全部');const[search,setSearch]=useState('');
  const[highlightId,setHighlightId]=useState(null);
  const rowRefs=useRef({});
  // 从看板跳转：切到对应账单的月份、清空筛选、高亮并滚动到该行
  useEffect(()=>{
    if(!focusTxId)return;
    const tx=txs.find(t=>String(t.id)===String(focusTxId));
    if(tx){
      setMonth(tx.date.slice(0,7));setFilterType('全部');setFilterCat('全部');setFilterOthers('全部');setSearch('');
      setHighlightId(tx.id);
      setTimeout(()=>{const el=rowRefs.current[tx.id];if(el)el.scrollIntoView({behavior:'smooth',block:'center'})},200);
      setTimeout(()=>setHighlightId(null),3000);
    }
    clearFocus&&clearFocus();
  },[focusTxId]);
  const allCats=useMemo(()=>['全部',...new Set(txs.map(t=>t.cat).filter(Boolean))],[txs]);
  const filtered=useMemo(()=>{
    // 有搜索词时跨全部月份，否则只看当前月
    let r=search.trim()?[...txs]:txs.filter(t=>t.date?.startsWith(month));
    if(filterType!=='全部')r=r.filter(t=>t.type===filterType);
    if(filterCat!=='全部')r=r.filter(t=>t.cat===filterCat);
    if(filterOthers==='待结算')r=r.filter(t=>t.isOthers&&t.status!=='settled');
    else if(filterOthers==='别人的钱')r=r.filter(t=>t.isOthers);
    if(search.trim())r=r.filter(t=>[t.date,t.cat,t.notes,t.orderId,...(t.tags||[])].join(' ').toLowerCase().includes(search.trim().toLowerCase()));
    return r.sort((a,b)=>b.date.localeCompare(a.date));
  },[txs,month,filterType,filterCat,filterOthers,search]);
  const inc=filtered.filter(t=>t.type==='收入').reduce((s,t)=>s+t.amount,0);
  const exp=filtered.filter(t=>t.type==='支出').reduce((s,t)=>s+t.amount,0);
  const addTx=tx=>{const next=[tx,...txs];saveTxs(next)};
  const upTx=tx=>{saveTxs(txs.map(t=>t.id===tx.id?tx:t))};
  const delTx=id=>{if(confirm('确认删除这条记录？'))saveTxs(txs.filter(t=>t.id!==id))};
  const settleTx=id=>saveTxs(txs.map(t=>t.id===id?{...t,status:t.status==='settled'?'active':'settled'}:t));
  const importTxs=rows=>{
    // 以 ID 去重：已存在的记录用导入数据覆盖，新记录追加
    const existingMap=Object.fromEntries(txs.map(t=>[t.id,t]));
    rows.forEach(r=>{existingMap[r.id]=r});
    const next=Object.values(existingMap).sort((a,b)=>(b.date||'').localeCompare(a.date||''));
    saveTxs(next);
    syncIdCounter(next); // 导入后立即同步计数器，防止新建记录 ID 与已导入 ID 冲突
    mergeCats(next.map(t=>t.cat));
    setShowImport(false);
    alert(`✅ 导入完成：${rows.length} 条（含关联关系 & 分类同步）`);
  };
  return(
    <div className="page">
      <div className="phdr">
        <div>
          <div className="ptitle">生财流水</div>
          <div style={{display:'flex',gap:16,marginTop:6,fontSize:13,flexWrap:'wrap'}}>
            <span className="inc">↑ 收入 ¥{fmtM(inc)}</span>
            <span className="exp">↓ 支出 ¥{fmtM(exp)}</span>
            <span style={{color:'#64748b'}}>结余 ¥{fmtM(inc-exp)}</span>
            <span style={{color:'#64748b'}}>{filtered.length} 笔</span>
            {search.trim()&&<span style={{background:'#fef3c7',color:'#92400e',padding:'1px 8px',borderRadius:6,fontSize:12,fontWeight:600}}>🔍 跨全部月份搜索</span>}
          </div>
        </div>
        <div className="pactions">
          <button className="btn btns" onClick={()=>setShowImport(true)}>📥 导入Excel</button>
          <button className="btn btnp" onClick={()=>{setEditTx(null);setShowAdd(true)}}>＋ 新增记录</button>
        </div>
      </div>
      <div className="fbar">
        <div style={{display:'flex',alignItems:'center',gap:4}}>
          <button onClick={()=>setMonth(prevM(month))} style={{background:'none',border:'none',cursor:'pointer',fontSize:18,color:'#10b981',padding:'0 4px'}}>‹</button>
          <span style={{fontSize:14,fontWeight:700,minWidth:80,textAlign:'center'}}>{fmtYM(month)}</span>
          <button onClick={()=>setMonth(nextM(month))} style={{background:'none',border:'none',cursor:'pointer',fontSize:18,color:'#10b981',padding:'0 4px'}}>›</button>
        </div>
        <select className="fsel" value={filterType} onChange={e=>setFilterType(e.target.value)}><option>全部</option><option>收入</option><option>支出</option></select>
        <select className="fsel" value={filterCat} onChange={e=>setFilterCat(e.target.value)}>{allCats.map(c=><option key={c}>{c}</option>)}</select>
        <select className="fsel" value={filterOthers} onChange={e=>setFilterOthers(e.target.value)}><option>全部</option><option>别人的钱</option><option>待结算</option></select>
        <input className="sinp" placeholder="搜索备注/标签/项目…" value={search} onChange={e=>setSearch(e.target.value)}/>
      </div>
      <div className="card" style={{padding:0,overflow:'hidden'}}>
        {filtered.length===0?<div className="empty"><div className="empty-ico">📋</div><div>本月暂无记录</div></div>:
        <div style={{overflowX:'auto'}}>
          <table>
            <thead><tr>
              <th>编号</th><th>日期</th><th>分类</th><th>金额</th><th>账户</th><th>备注</th><th>标签</th><th>关联账单</th><th>状态</th><th style={{textAlign:'right'}}>操作</th>
            </tr></thead>
            <tbody>{filtered.map(tx=>{
              const lids=getLinkedIds(tx,txs);
              const lnkTxs=lids.map(id=>txs.find(t=>t.id===id)).filter(Boolean);
              return(
              <tr key={tx.id} ref={el=>rowRefs.current[tx.id]=el} style={highlightId===tx.id?{background:'#fef9c3',transition:'background .5s',animation:'flashRow 1s ease'}:undefined}>
                <td><span style={{fontFamily:'monospace',fontSize:11,fontWeight:700,color:'#94a3b8',background:'#f1f5f9',padding:'2px 7px',borderRadius:5}}>{sid(tx.id)}</span></td>
                <td style={{whiteSpace:'nowrap',color:'#94a3b8',fontSize:13}}>{tx.date}</td>
                <td><span style={{background:tx.type==='收入'?'#ecfdf5':'#fef2f2',color:tx.type==='收入'?'#10b981':'#ef4444',padding:'3px 8px',borderRadius:6,fontSize:12,fontWeight:700}}>{CAT_EMOJI[tx.cat]||'📌'} {tx.cat}</span></td>
                <td className={tx.type==='收入'?'inc':'exp'}>{tx.type==='收入'?'+':'-'}¥{fmtM(tx.amount)}</td>
                <td style={{fontSize:13,color:'#64748b'}}>{tx.pay||'—'}</td>
                <td style={{maxWidth:140,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap',fontSize:13}}>{tx.notes||'—'}</td>
                <td>{(tx.tags||[]).map(t=><span key={t} className="badge bb" style={{marginRight:4}}>{t}</span>)}</td>
                <td style={{maxWidth:220,cursor:'pointer'}} onClick={()=>setQlinkTx(tx)} title="点击管理关联账单">
                  {lnkTxs.length===0
                    ?<span className="link-empty">📎 点击关联</span>
                    :<div className="link-pills">
                      {lnkTxs.slice(0,2).map(t=>(
                        <span key={t.id} className={`link-pill${t.type==='支出'?' exp':''}`}>
                          <span style={{fontFamily:'monospace'}}>{sid(t.id)}</span>
                          <span style={{maxWidth:60,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{t.cat}</span>
                        </span>
                      ))}
                      {lnkTxs.length>2&&<span className="link-more">+{lnkTxs.length-2}</span>}
                    </div>
                  }
                </td>
                <td>{tx.isOthers?<span className={`badge${tx.status==='settled'?' bg':' ba'}`}>{tx.status==='settled'?'✓ 已结算':'⏳ 待结算'}</span>:'—'}</td>
                <td style={{textAlign:'right',whiteSpace:'nowrap'}}>
                  {tx.isOthers&&(tx.status==='settled'
                    ?<button className="btn" style={{padding:'4px 10px',fontSize:11,marginRight:4,background:'#f1f5f9',color:'#94a3b8'}} onClick={()=>settleTx(tx.id)}>↩ 撤销</button>
                    :<button className="btn" style={{padding:'4px 10px',fontSize:11,marginRight:4,background:'#d1fae5',color:'#065f46'}} onClick={()=>settleTx(tx.id)}>✓ 结算</button>
                  )}
                  <button className="btni" title="编辑" onClick={()=>{setEditTx(tx);setShowAdd(true)}}>✏️</button>
                  <button className="btni" title="删除" onClick={()=>delTx(tx.id)}>🗑</button>
                </td>
              </tr>);
            })}</tbody>
          </table>
        </div>}
      </div>
      {showAdd&&<TxModal tx={editTx} cats={cats} books={books} pays={pays} allTxs={txs} onAddCat={addCat} onClose={()=>{setShowAdd(false);setEditTx(null)}} onSave={tx=>{if(editTx)upTx(tx);else addTx(tx);setShowAdd(false);setEditTx(null)}}/>}
      {showImport&&<ImportModal onClose={()=>setShowImport(false)} onImportTxs={importTxs} onImportAssets={saveAssets} onImportBudgets={saveBudgets} onImportSnapshots={saveSnapshots} onImportPolicies={savePolicies} onImportNavLinks={saveNavLinks}/>}
      {qlinkTx&&<QuickLinkModal excludeId={qlinkTx.id} allTxs={txs} initIds={getLinkedIds(qlinkTx,txs)} onClose={()=>setQlinkTx(null)} onConfirm={ids=>upTx({...qlinkTx,linkedIds:ids,orderId:ids[0]||qlinkTx.orderId})}/>}
    </div>
  );
}

// ─── AssetModal / AssetsPage ─────────────────────────
function AssetModal({item,onClose,onSave}){
  const[name,setName]=useState(item?.name||'');const[cat,setCat]=useState(item?.cat||'存款');const[amount,setAmount]=useState(item?.amount?.toString()||'');const[note,setNote]=useState(item?.note||'');const[custom,setCustom]=useState('');
  const finalCat=custom||cat;
  return(
    <div className="modal-bg" onClick={e=>e.currentTarget===e.target&&onClose()}>
      <div className="modal" style={{maxWidth:480}}>
        <div className="mhdr"><span className="mtitle">{item?'编辑资产项':'添加资产项'}</span><button className="mx" onClick={onClose}>×</button></div>
        <div className="frow"><label className="flbl">名称</label><input className="finp" value={name} onChange={e=>setName(e.target.value)} placeholder="如：招商银行、花呗"/></div>
        <div className="frow">
          <label className="flbl">类别（点选或自定义）</label>
          <div className="chips" style={{marginBottom:8}}>{ASSET_CATS.map(c=><button key={c} className={`chip${finalCat===c?' on':''}`} onClick={()=>{setCat(c);setCustom('')}}>{c}</button>)}</div>
          <input className="finp" value={custom} onChange={e=>setCustom(e.target.value)} placeholder="自定义类别（会覆盖上方选择）"/>
        </div>
        <div className="frow"><label className="flbl">金额（元）</label><input type="number" className="finp" value={amount} onChange={e=>setAmount(e.target.value)} placeholder="0"/></div>
        <div className="frow"><label className="flbl">备注（如额度、利率）</label><input className="finp" value={note} onChange={e=>setNote(e.target.value)} placeholder="选填"/></div>
        <div className="mfoot"><button className="btn btns" onClick={onClose}>取消</button><button className="btn btnp" onClick={()=>{if(!name.trim()){alert('请输入名称');return}onSave({...(item||{}),name:name.trim(),cat:finalCat,amount:+amount||0,note})}}>保存</button></div>
      </div>
    </div>
  );
}

function AssetsPage({assets,setAssets,snapshots,saveSnapshots}){
  const[showModal,setShowModal]=useState(false);const[editItem,setEditItem]=useState(null);
  const[showSnapModal,setShowSnapModal]=useState(false);const[editSnap,setEditSnap]=useState(null);
  const[viewSnapId,setViewSnapId]=useState(null);
  const isLiab=cat=>cat.includes('负债')||cat.includes('贷款');
  const totalA=useMemo(()=>assets.filter(a=>!isLiab(a.cat)).reduce((s,a)=>s+(+a.amount||0),0),[assets]);
  const totalL=useMemo(()=>assets.filter(a=>isLiab(a.cat)).reduce((s,a)=>s+(+a.amount||0),0),[assets]);
  const grouped=useMemo(()=>{const m={};assets.forEach(a=>{if(!m[a.cat])m[a.cat]=[];m[a.cat].push(a)});return Object.entries(m)},[assets]);
  const catE={'存款':'💰','投资':'📈','保险':'🛡️','公积金':'🏢','贵金属':'🥇','信用卡负债':'💳','消费贷负债':'📦','贷款负债':'🏦'};
  const save=item=>{const next=item.id&&assets.find(a=>a.id===item.id)?assets.map(a=>a.id===item.id?item:a):[...assets,{...item,id:nextAssetId()}];setAssets(next);setShowModal(false);setEditItem(null)};
  const del=id=>{if(confirm('确认删除？'))setAssets(assets.filter(a=>a.id!==id))};
  // 快照时捕获完整资产明细（含负债，方便回看构成）
  const captureBreakdown=()=>assets.filter(a=>(+a.amount||0)!==0).map(a=>({name:a.name,cat:a.cat,amount:+a.amount||0}));
  const saveSnap=snap=>{
    const next=snap.id&&snapshots.find(s=>s.id===snap.id)?snapshots.map(s=>s.id===snap.id?snap:s):[...snapshots,snap];
    const sorted=[...next].sort((a,b)=>b.date.localeCompare(a.date));
    saveSnapshots(sorted);setShowSnapModal(false);setEditSnap(null);
  };
  const delSnap=id=>{if(confirm('确认删除这条快照？'))saveSnapshots(snapshots.filter(s=>s.id!==id))};
  const quickSnap=()=>{
    const todayStr=today();
    if(snapshots.find(s=>s.date===todayStr)&&!confirm(`今天 ${todayStr} 已有快照，确认覆盖？`))return;
    saveSnap({id:snapshots.find(s=>s.date===todayStr)?.id||nextSnapId(),date:todayStr,totalA,totalL,note:'自动快照',breakdown:captureBreakdown()});
  };
  const viewSnap=viewSnapId?snapshots.find(s=>s.id===viewSnapId):null;
  return(
    <div className="page">
      <div className="phdr">
        <div className="ptitle">资产负债表</div>
        <div className="pactions">
          <button className="btn btns" onClick={quickSnap}>📸 记录快照</button>
          <button className="btn btnp" onClick={()=>{setEditItem(null);setShowModal(true)}}>＋ 添加项目</button>
        </div>
      </div>
      <div className="nw-banner">
        <div className="nw-lbl">净资产</div>
        <div className="nw-amt" style={{color:totalA-totalL<0?'#fca5a5':'#fff'}}>{fmtSigned(totalA-totalL)}</div>
        <div className="nw-row">
          <div><div className="nw-lbl">总资产</div><div className="nw-val">¥{fmtM(totalA)}</div></div>
          <div><div className="nw-lbl">总负债</div><div className="nw-val">¥{fmtM(totalL)}</div></div>
        </div>
      </div>

      {/* 净资产趋势图 */}
      <div className="card" style={{marginBottom:18}}>
        <div className="ct">📈 净资产趋势
          <button className="btnt" style={{fontSize:12}} onClick={()=>{setEditSnap(null);setShowSnapModal(true)}}>＋ 补录历史</button>
        </div>
        <div style={{height:220}}><NetWorthChart snapshots={snapshots}/></div>
        {/* 快照记录列表 */}
        {snapshots.length>0&&<div style={{marginTop:16,borderTop:'1px solid #f1f5f9',paddingTop:14}}>
          <div style={{fontSize:12,fontWeight:700,color:'#94a3b8',marginBottom:8,textTransform:'uppercase',letterSpacing:.5}}>快照记录</div>
          <div style={{maxHeight:200,overflowY:'auto'}}>
            {snapshots.map(s=>{
              const hasDetail=s.breakdown&&s.breakdown.length>0;
              return(
              <div key={s.id} className="snap-row" style={{display:'flex',alignItems:'center',padding:'10px 8px',borderBottom:'1px solid #f8fafc',gap:12,borderRadius:8,cursor:hasDetail?'pointer':'default',transition:'background .15s'}}
                onClick={()=>hasDetail&&setViewSnapId(s.id)}
                onMouseEnter={e=>{if(hasDetail)e.currentTarget.style.background='#f8fafc'}}
                onMouseLeave={e=>e.currentTarget.style.background='transparent'}>
                <div style={{fontSize:12,color:'#94a3b8',whiteSpace:'nowrap',minWidth:80}}>{s.date}</div>
                <div style={{flex:1,minWidth:0}}>
                  <div style={{display:'flex',gap:12,fontSize:13,flexWrap:'wrap'}}>
                    <span style={{fontWeight:700,color:s.totalA-s.totalL<0?'#ef4444':'#10b981'}}>{fmtSigned(s.totalA-s.totalL)}</span>
                    <span style={{color:'#64748b'}}>资产¥{fmtM(s.totalA)}</span>
                    <span style={{color:'#94a3b8'}}>负债¥{fmtM(s.totalL)}</span>
                  </div>
                  <div style={{fontSize:11,marginTop:2}}>
                    {s.note&&<span style={{color:'#94a3b8'}}>{s.note}</span>}
                    {hasDetail?<span style={{color:'#10b981',marginLeft:s.note?8:0}}>📊 {s.breakdown.length}项明细 · 点击查看占比图</span>:<span style={{color:'#cbd5e1'}}>（无明细 · 编辑可补录构成）</span>}
                  </div>
                </div>
                {hasDetail&&<span style={{color:'#cbd5e1',fontSize:16}}>›</span>}
                <button className="btni" style={{fontSize:13}} onClick={e=>{e.stopPropagation();setEditSnap(s);setShowSnapModal(true)}}>✏️</button>
                <button className="btni" style={{fontSize:13}} onClick={e=>{e.stopPropagation();delSnap(s.id)}}>🗑</button>
              </div>
              );
            })}
          </div>
        </div>}
      </div>

      <div className="asset-grid" style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:18}}>
        {grouped.map(([cat,items])=>(

// 计算下次缴费日：基于起始缴费日 + 缴费频率推算到未来最近一次
function calcNextPay(startDate,freq){
  if(!startDate||freq==='趸交'||!FREQ_MONTHS[freq])return null;
  const step=FREQ_MONTHS[freq];
  const d=new Date(startDate);if(isNaN(d))return null;
  const now=new Date();now.setHours(0,0,0,0);
  while(d<now)d.setMonth(d.getMonth()+step);
  return d.toISOString().split('T')[0];
}
function daysUntil(dateStr){
  if(!dateStr)return null;
  const d=new Date(dateStr);if(isNaN(d))return null;
  const now=new Date();now.setHours(0,0,0,0);d.setHours(0,0,0,0);
  return Math.round((d-now)/86400000);
}

  const annualize=p=>{if(p.paidOff||p.freq==='趸交')return 0;const m=FREQ_MONTHS[p.freq]||12;return p.amount*(12/m)};
  const totalAnnual=useMemo(()=>policies.reduce((s,p)=>s+annualize(p),0),[policies]);
  const totalCoverage=useMemo(()=>policies.reduce((s,p)=>s+(+p.coverage||0),0),[policies]);
  // 缴费提醒：未结清且有下次缴费日的，按紧急程度排序
  const reminders=useMemo(()=>{
    return policies.filter(p=>!p.paidOff&&p.freq!=='趸交').map(p=>{
      const next=calcNextPay(p.payStart,p.freq);const days=daysUntil(next);
      return{...p,nextPay:next,days};

  const save=p=>{const next=p.id&&policies.find(x=>x.id===p.id)?policies.map(x=>x.id===p.id?p:x):[...policies,p];savePolicies(next);setShowModal(false);setEditP(null)};

function NavLinkModal({link,cats,onClose,onSave}){
  const[title,setTitle]=useState(link?.title||'');

  const[desc,setDesc]=useState(link?.desc||'');
  const[cat,setCat]=useState(link?.cat||cats[0]||'常用理财工具');
  const[emoji,setEmoji]=useState(link?.emoji||'🔗');
  const[newCat,setNewCat]=useState('');const[useNewCat,setUseNewCat]=useState(false);
  const EMOJIS=['🔗','🧮','📈','📊','💱','💰','📋','🏦','💳','📉','🪙','💹','📁','⭐','🔖'];
  const save=()=>{
    if(!title.trim()){alert('请填写名称');return}
    let u=url.trim();if(u&&!/^https?:\/\//.test(u))u='https://'+u;
    if(!u){alert('请填写网址');return}
    const finalCat=useNewCat&&newCat.trim()?newCat.trim():cat;
    onSave({...(link||{}),id:link?.id||nextNavId(),title:title.trim(),url:u,desc:desc.trim(),cat:finalCat,emoji});

  return(
    <div className="modal-bg" onClick={e=>e.currentTarget===e.target&&onClose()}>

        </div>
        <div className="frow"><label className="flbl">网站名称 <span style={{color:'#ef4444'}}>*</span></label><input className="finp" value={title} onChange={e=>setTitle(e.target.value)} placeholder="如：利息计算器"/></div>
        <div className="frow"><label className="flbl">网址 <span style={{color:'#ef4444'}}>*</span></label><input className="finp" value={url} onChange={e=>setUrl(e.target.value)} placeholder="https://..."/></div>

              <button className="chip" style={{whiteSpace:'nowrap'}} onClick={()=>setUseNewCat(false)}>取消</button>

function App(){
  const[tab,setTab]=useState('dash');
  const[txs,setTxs]=useState([]);
  const[assets,setAssets]=useState(null);
  const[budgets,setBudgets]=useState(null);
  const[snapshots,setSnapshots]=useState([]);
  const[policies,setPolicies]=useState([]);
  const[navLinks,setNavLinks]=useState(null);
  const[income,setIncome]=useState(5000);
  const[cats,setCats]=useState(DEF_CATS);
  const[focusTxId,setFocusTxId]=useState(null);
  const[ready,setReady]=useState(false);
  const jumpToTx=id=>{setFocusTxId(id);setTab('tx')};
  useEffect(()=>{
    const t=S.get('txs');if(t)setTxs(t);
    const inc=S.get('income');if(inc!=null)setIncome(+inc);
    // 分类：默认 ∪ 已保存 ∪ 历史 tx 中用过的分类
    const savedCats=S.get('cats')||[];
    const txCats=(t||[]).map(tx=>tx.cat).filter(Boolean);
    const merged=[...new Set([...DEF_CATS,...savedCats,...txCats])];
    setCats(merged);S.set('cats',merged);
    // 同步流水 ID 计数器
    const maxNumId=Math.max(0,...(t||[]).map(tx=>parseInt(tx.id)).filter(n=>Number.isFinite(n)&&n>0));
    const storedCnt=parseInt(localStorage.getItem('_txIdCnt')||'0')||0;
    if(maxNumId>=storedCnt)localStorage.setItem('_txIdCnt',String(maxNumId));

    // 迁移函数：把字符串 ID 替换为自增数字 ID，返回迁移后的列表
    const migrateIds=(list,cntKey)=>{
      if(!list||!list.length)return list||[];
      let cnt=parseInt(localStorage.getItem(cntKey)||'0')||0;
      let changed=false;
      const migrated=list.map(item=>{
        if(/^\d+$/.test(String(item.id??'')))return item; // 已是数字，跳过
        cnt++;changed=true;
        return{...item,id:cnt};
      });
      if(changed)localStorage.setItem(cntKey,String(cnt));
      return migrated;
    };

    // 加载并迁移资产/计划/快照
    const rawA=S.get('assets');
    const rawB=S.get('budgets');
    const rawSnap=S.get('snapshots');
    const rawPol=S.get('policies');
    const migratedA=migrateIds(rawA||DEF_ASSETS,'_assetIdCnt');
    const migratedB=migrateIds(rawB||DEF_BUDGETS,'_budgetIdCnt');
    const migratedSnap=migrateIds(rawSnap||[],'_snapIdCnt');
    const migratedPol=migrateIds(rawPol||[],'_insIdCnt');
    // 如果有迁移，写回 localStorage
    if(rawA)S.set('assets',migratedA);
    if(rawB)S.set('budgets',migratedB);
    if(rawSnap)S.set('snapshots',migratedSnap);
    if(rawPol)S.set('policies',migratedPol);
    setAssets(migratedA);setBudgets(migratedB);setSnapshots(migratedSnap);setPolicies(migratedPol);
    // 导航链接
    const rawNav=S.get('navLinks');
    setNavLinks(rawNav||DEF_NAV_LINKS);

    setReady(true);
  },[]);
  const saveTxs=d=>{setTxs(d);S.set('txs',d)};
  const saveAssets=d=>{setAssets(d);S.set('assets',d)};
  const saveBudgets=d=>{setBudgets(d);S.set('budgets',d)};
  const saveSnapshots=d=>{setSnapshots(d);S.set('snapshots',d)};
  const savePolicies=d=>{setPolicies(d);S.set('policies',d)};
  const saveNavLinks=d=>{setNavLinks(d);S.set('navLinks',d)};
  const saveIncome=v=>{setIncome(v);S.set('income',v)};
  // 单次批量合并分类（解决 addCat 循环调用时 React 只保留最后一个的 batching 问题）
  const mergeCats=useCallback(catList=>{
    setCats(prev=>{
      const merged=[...new Set([...prev,...catList.filter(Boolean)])];
      S.set('cats',merged);
      return merged;
    });
  },[]);
  const addCat=c=>mergeCats([c]);
  const importTxsGlobal=rows=>{
    const existingMap=Object.fromEntries(txs.map(t=>[t.id,t]));
    rows.forEach(r=>{existingMap[r.id]=r});
    const next=Object.values(existingMap).sort((a,b)=>(b.date||'').localeCompare(a.date||''));
    saveTxs(next);
    syncIdCounter(next); // 同步计数器
    mergeCats(next.map(t=>t.cat));
  };
  if(!ready||!assets||!budgets||!navLinks)return<div style={{display:'flex',alignItems:'center',justifyContent:'center',height:'100vh',fontSize:16,color:'#94a3b8'}}>加载中…</div>;
  return(
    <div className="layout">
      <Sidebar tab={tab} setTab={setTab} txs={txs} assets={assets} budgets={budgets} income={income} snapshots={snapshots} policies={policies} navLinks={navLinks}/>
      <MobileHeader tab={tab}/>
      <div className="main">
        {tab==='dash'&&<Dashboard txs={txs} assets={assets} budgets={budgets} income={income} snapshots={snapshots} policies={policies} onJumpToTx={jumpToTx}/>}
        {tab==='tx'&&<TxPage txs={txs} saveTxs={saveTxs} cats={cats} addCat={addCat} mergeCats={mergeCats} books={DEF_BOOKS} pays={DEF_PAYS} saveAssets={saveAssets} saveBudgets={saveBudgets} saveSnapshots={saveSnapshots} savePolicies={savePolicies} saveNavLinks={saveNavLinks} focusTxId={focusTxId} clearFocus={()=>setFocusTxId(null)}/>}
        {tab==='asset'&&<AssetsPage assets={assets} setAssets={saveAssets} snapshots={snapshots} saveSnapshots={saveSnapshots}/>}
        {tab==='budget'&&<BudgetPage budgets={budgets} setBudgets={saveBudgets} income={income} setIncome={saveIncome} txs={txs}/>}
        {tab==='insurance'&&<InsurancePage policies={policies} savePolicies={savePolicies}/>}
        {tab==='nav'&&<NavPage navLinks={navLinks} saveNavLinks={saveNavLinks}/>}
        {tab==='more'&&<MorePage txs={txs} assets={assets} budgets={budgets} income={income} snapshots={snapshots} policies={policies} navLinks={navLinks} setTab={setTab} onImport={importTxsGlobal} saveAssets={saveAssets} saveBudgets={saveBudgets} saveSnapshots={saveSnapshots} savePolicies={savePolicies} saveNavLinks={saveNavLinks} mergeCats={mergeCats}/>}
      </div>
      <MobileNav tab={tab} setTab={setTab}/>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
