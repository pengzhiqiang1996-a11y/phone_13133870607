    display:flex;gap:16px;margin-top:16px;flex-wrap:wrap;

  .hero .meta b{color:var(--ink);font-weight:700}

  /* ===== 工具条 ===== */
  .toolbar{
    position:sticky;top:0;z-index:20;
    background:rgba(255,255,255,.82);backdrop-filter:saturate(180%) blur(14px);

  .controls{display:flex;gap:9px;align-items:center}

    flex:1;position:relative;

  .search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);opacity:.4}
  .search input{
    width:100%;padding:9px 12px 9px 34px;border:1.5px solid var(--line);

  .sortbtn{
    flex:0 0 auto;padding:9px 13px;border:1.5px solid var(--line);border-radius:11px;
    background:#fff;font-size:13px;color:var(--ink-soft);cursor:pointer;font-weight:600;

  /* ===== 列表 ===== */
  .list{padding:8px 14px 0}
  .card{
    display:grid;

    background:#fff;border:1px solid var(--line);border-radius:16px;

    box-shadow:var(--card-shadow);

    position:relative;overflow:hidden;

  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes slideup{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .card:active{transform:scale(.992)}
  /* 左侧热度条 */
  .card::before{
    content:"";position:absolute;left:0;top:0;bottom:0;width:4px;
    background:var(--heat,transparent);

  .rank{
    display:flex;align-items:center;justify-content:center;

  .rank.r3{background:linear-gradient(135deg,#f0c9a8,#cd8a52);color:#6b3e1d}

  .info{min-width:0}
  .name{font-size:15.5px;font-weight:700;letter-spacing:-.01em;line-height:1.3;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .row2{display:flex;align-items:center;gap:8px;margin-top:5px}
  .code{
    font-size:12px;color:var(--ink-soft);font-weight:600;
    font-family:"SF Mono",ui-monospace,Menlo,Consolas,monospace;
    background:var(--code-bg);padding:2px 8px;border-radius:6px;cursor:pointer;
    display:inline-flex;align-items:center;gap:5px;transition:.15s;user-select:none;
  }
  .code:hover{background:#e6e8eb;color:var(--ink)}
  .code:active{transform:scale(.95)}
  .code .copyico{opacity:.5}
  .code.copied{background:#e7f7ed;color:#1a9e54}
  .badge{
    font-size:11px;font-weight:600;padding:2px 8px;border-radius:6px;white-space:nowrap;
  }
  .badge.ok{background:#fff4f2;color:var(--hot)}
  .badge.normal{background:#eef6ff;color:#3b82f6}
  .badge.suspend{background:#f3f4f6;color:var(--ink-faint)}

  .metric{text-align:right;flex:0 0 auto;min-width:96px}
  .rate{font-size:21px;font-weight:800;letter-spacing:-.02em;line-height:1;
    font-variant-numeric:tabular-nums;color:var(--heat,var(--hot))}
  .rate .pct{font-size:13px;font-weight:700;margin-left:1px}
  .heatbar{
    height:4px;border-radius:3px;margin-top:7px;background:var(--line-soft);overflow:hidden;
  }
  .heatbar span{display:block;height:100%;border-radius:3px;background:var(--heat,var(--hot));
    transition:width .5s cubic-bezier(.2,.7,.3,1)}
  .arb{font-size:11px;color:var(--ink-faint);margin-top:5px;font-weight:500}

  .empty{text-align:center;padding:70px 20px;color:var(--ink-faint)}
  .empty .big{font-size:34px;margin-bottom:10px}
  .empty .txt{font-size:14px}

  /* ===== 复制提示 ===== */
  .toast{
    position:fixed;left:50%;bottom:34px;transform:translateX(-50%) translateY(20px);
    background:var(--ink);color:#fff;font-size:13px;font-weight:600;
    padding:11px 20px;border-radius:24px;opacity:0;pointer-events:none;
    transition:.25s;z-index:99;box-shadow:0 8px 24px rgba(0,0,0,.2);
    display:flex;align-items:center;gap:7px;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

  /* ===== 底部引流 ===== */
  .footer{
    margin:30px 22px 0;padding:22px;border-radius:18px;
    background:linear-gradient(135deg,#fff5f3,#fff);
    border:1px solid #ffe3de;text-align:center;
  }
  .footer .brand{font-size:15px;font-weight:800;color:var(--ink);margin-bottom:6px}
  .footer .wx{font-size:13px;color:var(--ink-soft);margin-bottom:14px}
  .footer .wx b{color:var(--hot);font-weight:800;font-size:14px;letter-spacing:.02em}
  .footer .cta{
    display:inline-block;padding:11px 26px;border-radius:24px;
    background:var(--hot);color:#fff;font-size:13.5px;font-weight:700;
    text-decoration:none;box-shadow:0 6px 16px rgba(255,59,48,.3);transition:.18s;
  }
  .footer .cta:hover{transform:translateY(-1px);box-shadow:0 8px 20px rgba(255,59,48,.38)}
  .disclaimer{font-size:11px;color:var(--ink-faint);text-align:center;
    margin:16px 22px 0;line-height:1.6}

  @media (max-width:420px){
    .hero h1{font-size:23px}
    .metric{min-width:84px}
    .rate{font-size:19px}
    .name{font-size:14.5px}
  }
  @media (prefers-reduced-motion:reduce){
    *{animation:none!important;transition:none!important}
  }
</style>

<body>
<div class="wrap">

  <div class="hero">
    <span class="eyebrow"><span class="dot"></span>每日更新 · 场内套利机会</span>
    <h1>LOF <em>溢价</em>套利榜</h1>
    <div class="sub">实时追踪场内 LOF 溢价率,溢价越高、套利空间越大。点代码即可复制,直接去券商下单。</div>

      <span>数据日期 <b id="m-date">—</b></span>

    </div>
    <div class="controls">
      <div class="search">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
        <input id="q" type="text" placeholder="搜索基金名称或代码…">

        <span id="sortLabel">溢价率</span><span class="arrow" id="sortArrow">↓</span>
      </button>
    </div>
  </div>

  <div class="list" id="list"></div>

    <div class="brand">小可耐教你学 RPA</div>

    <a class="cta" href="https://pengzhiqiang1996-a11y.github.io/phone_13133870607/index.html" target="_blank">进入工具箱主页 →</a>
  </div>
  <div class="disclaimer">
    数据来源于公开行情,仅供参考,不构成投资建议。溢价率随行情实时变动,套利有风险,下单前请自行核实。
  </div>

<div class="toast" id="toast"></div>

<script>
/* ====== 代理 & 接口配置(对不上就改这里) ====== */
// 你的 Cloudflare Worker 代理地址
var PROXY = "https://lof.13133870607.cn";
// 目标接口(talicai 真实接口);limit 设大点一次抓全
var TARGET = "https://www.talicai.com/lof/api/v1/funds?start=0&limit=50&hasMore=true&premium_rate=1&type=";

// 代理调用方式:根据你 worker 的实现选一种
//   "query"   -> PROXY/?url=<完整target>      (URL拼接式,最常见)
//   "path"    -> PROXY/lof/api/v1/funds?...    (路径透传式,worker写死了talicai域名)
//   "append"  -> PROXY/<完整target>            (直接拼在后面)
var PROXY_MODE = "query";

function buildUrl(type){
  var target = TARGET + type;
  if(PROXY_MODE === "query")  return PROXY + "/?url=" + encodeURIComponent(target);
  if(PROXY_MODE === "append") return PROXY + "/" + target;
  if(PROXY_MODE === "path")   return PROXY + "/lof/api/v1/funds?start=0&limit=50&hasMore=true&premium_rate=1&type=" + type;
  return target;
}

/* ====== 字段翻译规则(显示不对就改这里) ====== */
var STATUS_SUSPEND = 2;                 // 哪个 status 算"暂停申购"
var STATUS_TEXT = {1:"可申购", 2:"暂停申购"};
var ARB_TEXT = {1:"场内申购", 2:"场内申购"};
var LIMIT_UNIT = "万";                  // purchase_up_limit 的单位

/* ====== 状态 ====== */
var DATA=null, currentType="1", keyword="", sortKey="rate", sortDesc=true;
var SORT_CYCLE=[
  {key:"rate", label:"溢价率"},
  {key:"limit",label:"限额"}
];
var sortIdx=0;

/* ====== 热度色:溢价率映射到红橙渐变 ====== */
function heatColor(rate, maxRate){
  var t = maxRate>0 ? Math.min(rate/maxRate,1) : 0;
  if(t>0.66){return "#e02418";}
  if(t>0.33){return "#ff3b30";}
  return "#ff7a45";
}

function fmtStatus(f){
  if(f.status===STATUS_SUSPEND) return {text:"暂停申购", cls:"suspend"};
  if(!f.purchase_up_limit || f.purchase_up_limit===0) return {text:"不限购", cls:"ok"};
  return {text:"限购 "+f.purchase_up_limit+" "+LIMIT_UNIT, cls:"normal"};
}
function fmtArb(types){
  if(!types||!types.length) return "—";
  var s={};types.forEach(function(t){s[ARB_TEXT[t]||"场内申购"]=1;});
  return Object.keys(s).join(" / ");
}

function currentList(){
  var arr = (currentType==="1" ? (DATA&&DATA.a) : (DATA&&DATA.overseas)) || [];
  arr = arr.slice();
  if(keyword){
    var k=keyword.toLowerCase();
    arr=arr.filter(function(f){
      return (f.name||"").toLowerCase().indexOf(k)>=0 || (f.code||"").indexOf(k)>=0;
    });
  }
  arr.sort(function(a,b){
    var va,vb;
    if(sortKey==="limit"){
      va=a.purchase_up_limit===0?Infinity:a.purchase_up_limit;
      vb=b.purchase_up_limit===0?Infinity:b.purchase_up_limit;
    }else{
      va=a.premium_rate; vb=b.premium_rate;
    }
    return sortDesc ? vb-va : va-vb;
  });
  return arr;
}

function render(){
  var list=document.getElementById("list");
  var arr=currentList();
  if(!arr.length){
    list.innerHTML='<div class="empty"><div class="big">🔍</div><div class="txt">'+
      (keyword?"没找到匹配的基金,换个词试试":"暂无数据")+'</div></div>';
    return;
  }
  var maxRate=Math.max.apply(null,arr.map(function(f){return f.premium_rate;}));
  list.innerHTML=arr.map(function(f,i){
    var st=fmtStatus(f);
    var heat=heatColor(f.premium_rate,maxRate);
    var barW=maxRate>0?Math.max(8,(f.premium_rate/maxRate*100)).toFixed(0):0;
    var rankCls = i===0?"r1":i===1?"r2":i===2?"r3":"";
    var rankTxt = (i+1);
    var delay=Math.min(i*0.03,0.3);
    return '<div class="card" style="--heat:'+heat+';animation-delay:'+delay+'s">'+
      '<div class="rank '+rankCls+'">'+rankTxt+'</div>'+
      '<div class="info">'+
        '<div class="name">'+f.name+'</div>'+
        '<div class="row2">'+
          '<span class="code" data-code="'+f.code+'" onclick="copyCode(this)">'+
            f.code+
            '<svg class="copyico" width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>'+
          '</span>'+
          '<span class="badge '+st.cls+'">'+st.text+'</span>'+
        '</div>'+
      '</div>'+
      '<div class="metric">'+
        '<div class="rate">'+f.premium_rate.toFixed(2)+'<span class="pct">%</span></div>'+
        '<div class="heatbar"><span style="width:'+barW+'%"></span></div>'+
        '<div class="arb">'+fmtArb(f.arbitrage_types)+'</div>'+
      '</div>'+
    '</div>';
  }).join("");
}

/* ====== 复制代码 ====== */
function copyCode(el){
  var code=el.getAttribute("data-code");
  var done=function(){
    el.classList.add("copied");
    showToast("已复制基金代码 "+code+",去券商粘贴下单");
    setTimeout(function(){el.classList.remove("copied");},1200);
  };
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(code).then(done).catch(function(){fallbackCopy(code,done);});
  }else{fallbackCopy(code,done);}
}
function fallbackCopy(text,cb){
  var ta=document.createElement("textarea");ta.value=text;
  ta.style.position="fixed";ta.style.opacity="0";document.body.appendChild(ta);
  ta.select();try{document.execCommand("copy");cb();}catch(e){}document.body.removeChild(ta);
}
var toastTimer;
function showToast(msg){
  var t=document.getElementById("toast");
  t.innerHTML='<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6"><path d="M20 6L9 17l-5-5"/></svg>'+msg;
  t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer=setTimeout(function(){t.classList.remove("show");},1800);
}

/* ====== 交互绑定 ====== */
document.querySelectorAll(".tab").forEach(function(t){
  t.addEventListener("click",function(){
    document.querySelectorAll(".tab").forEach(function(x){x.classList.remove("active");});
    t.classList.add("active");currentType=t.getAttribute("data-type");render();
  });
});
document.getElementById("q").addEventListener("input",function(e){
  keyword=e.target.value.trim();render();
});
document.getElementById("sortBtn").addEventListener("click",function(){
  if(sortDesc){sortDesc=false;}
  else{ sortIdx=(sortIdx+1)%SORT_CYCLE.length; sortKey=SORT_CYCLE[sortIdx].key; sortDesc=true; }
  document.getElementById("sortLabel").textContent=SORT_CYCLE[sortIdx].label;
  document.getElementById("sortArrow").textContent=sortDesc?"↓":"↑";
  render();
});

/* ====== 实时拉取数据 ====== */
function setLoading(){
  document.getElementById("list").innerHTML=
    '<div class="empty"><div class="big" style="animation:spin 1s linear infinite;display:inline-block">⏳</div>'+
    '<div class="txt">正在通过代理拉取实时数据…</div></div>';
}
function setError(msg){
  document.getElementById("list").innerHTML=
    '<div class="empty"><div class="big">⚠️</div><div class="txt">'+msg+
    '<br><span style="font-size:12px;color:#9aa1ab">点击下方按钮重试</span></div>'+
    '<button class="sortbtn" style="margin:16px auto 0" onclick="loadAll()">重新加载</button></div>';
}

function fetchType(type){
  return fetch(buildUrl(type), {cache:"no-store"})
    .then(function(r){
      if(!r.ok) throw new Error("HTTP "+r.status);
      return r.json();
    })
    .then(function(j){
      // 兼容代理可能包了一层的情况
      var payload = j;
      if(j && j.success===undefined && j.body) { try{payload=JSON.parse(j.body);}catch(e){} }
      if(!payload || !payload.success){
        throw new Error((payload&&payload.message)||"接口返回异常");
      }
      return payload.data || {};
    });
}

function loadAll(){
  setLoading();
  Promise.all([fetchType("1"), fetchType("2")])
    .then(function(res){
      var aData=res[0], oData=res[1];
      DATA={
        date: aData.date || oData.date || "",
        a: (aData.funds||[]),
        overseas: (oData.funds||[])
      };
      document.getElementById("m-date").textContent=DATA.date||"—";
      document.getElementById("m-time").textContent=new Date().toTimeString().slice(0,5);
      document.getElementById("m-count").textContent=DATA.a.length+DATA.overseas.length;
      render();
    })
    .catch(function(e){
      setError("数据加载失败:"+e.message+"。请确认代理地址和 cookie 有效。");
    });
}

loadAll();
</script>
</body>
</html>
